  { cle: 'donnees', icone: '💾', titre: 'Sauvegarde & données',
    resume: function () { return D.recettes.length + ' recettes · ' + D.ingredients.length + ' ingrédients'; } },
];

/** Ouvre l'onglet « Plus » directement sur une de ses sous-vues. */
function allerAuxReglages(sousVue) {
  etat.sousVuePlus = sousVue || null;
  allerA('plus');
}

function vuePlus() {
  const v = $('#vue-plus');
  const scroll = window.scrollY;
  v.innerHTML = '';
  const sous = SOUS_VUES_PLUS.find(function (s) { return s.cle === etat.sousVuePlus; });
  $('#titre-page').textContent = sous ? sous.titre : 'Plus';

  if (!sous) {
    const grille = el('div', { class: 'grille-hub' });
    SOUS_VUES_PLUS.forEach(function (s) {
      const b = el('button', { type: 'button', class: 'tuile-hub' }, [
        el('span', { class: 'ic', 'aria-hidden': 'true', text: s.icone }),
        el('span', { class: 'txt' }, [
          el('span', { class: 'titre', text: s.titre }),
          el('span', { class: 'resume', text: s.resume() }),
        ]),
        el('span', { class: 'chev', 'aria-hidden': 'true', text: '›' }),
      ]);
      b.addEventListener('click', function () { etat.sousVuePlus = s.cle; vuePlus(); window.scrollTo(0, 0); });
      grille.appendChild(b);
    });
    v.appendChild(grille);
    window.scrollTo(0, scroll);
    return;
  }

  v.appendChild(el('button', {
    type: 'button', class: 'btn retour-hub', text: '‹ Plus',
    onclick: function () { etat.sousVuePlus = null; vuePlus(); window.scrollTo(0, 0); },
  }));

  if (sous.cle === 'reglages') {
    v.appendChild(sectionAffichage());
    sectionReferentiel(v);
    v.appendChild(sectionOrdreRayons());
  } else if (sous.cle === 'sync') {
    v.appendChild(carteSynchronisation());
  } else if (sous.cle === 'historique') {
    v.appendChild(sectionHistorique());
  } else if (sous.cle === 'donnees') {
    v.appendChild(sectionSauvegarde());
    v.appendChild(sectionDanger());
  }
  window.scrollTo(0, scroll);
}

/** Référentiel des ingrédients. Ajoute lui-même sa section à « v ». */
function sectionReferentiel(v) {
  const carteRef = el('details', { class: 'section', open: etat.refOuvert });
  carteRef.addEventListener('toggle', function () { etat.refOuvert = carteRef.open; });
  carteRef.appendChild(el('summary', {}, [
    el('span', { text: 'Référentiel des ingrédients' }),
    el('span', { class: 'compte', text: D.ingredients.length + ' ingrédients' }),
  ]));
  const contenuRef = el('div', { class: 'contenu' });
  carteRef.appendChild(contenuRef);
  const champRech = el('input', { type: 'search', placeholder: 'Rechercher un ingrédient…', value: etat.rechercheIngredients, enterkeyhint: 'search', 'aria-label': 'Rechercher un ingrédient' });
  champRech.addEventListener('input', function () { etat.rechercheIngredients = champRech.value; remplirTable(); });
  const barreRef = el('div', { class: 'recherche' }, [
    champRech,
    el('button', { type: 'button', class: 'btn', text: '＋ Nouvel ingrédient', onclick: function () { formulaireIngredient('', null); } }),
  ]);
  const inutilises = ingredientsInutilises(D);
  if (inutilises.length) {
    barreRef.appendChild(el('button', {
      type: 'button', class: 'btn',
      text: '🧹 Supprimer les ' + inutilises.length + ' inutilisés',
      title: 'Ingrédients qu\'aucune recette n\'utilise',
      onclick: purgerIngredientsInutilises,
    }));
  }
  contenuRef.appendChild(barreRef);
  const wrap = el('div', { class: 'table-wrap' });
  contenuRef.appendChild(wrap);
  const infoRef = el('p', { class: 'tpt doux' });
  contenuRef.appendChild(infoRef);
  v.appendChild(carteRef);

  function remplirTable() {
    wrap.innerHTML = '';
    const q = normaliserNom(etat.rechercheIngredients);
    let liste = D.ingredients.filter(function (i) {
      if (!q) return true;
      return normaliserNom(i.nom).indexOf(q) >= 0 || i.aliases.some(function (a) { return normaliserNom(a).indexOf(q) >= 0; });
    });
    const tri = etat.triRef;
    liste = liste.slice().sort(function (a, b) {
      let x, y;
      if (tri.colonne === 'rayon') { x = RAYON_LIBELLE[a.rayon]; y = RAYON_LIBELLE[b.rayon]; }
      else if (tri.colonne === 'famille') { x = a.famille; y = b.famille; }
      else if (tri.colonne === 'prix') {
        x = (a.prix && typeof a.prix.valeur === 'number') ? a.prix.valeur : -1;
        y = (b.prix && typeof b.prix.valeur === 'number') ? b.prix.valeur : -1;
        return (x - y) * tri.sens;
      } else if (tri.colonne === 'placard') { return ((a.placard ? 1 : 0) - (b.placard ? 1 : 0)) * tri.sens; }
      else { x = a.nom; y = b.nom; }
      return String(x).localeCompare(String(y), 'fr') * tri.sens;
    });

    const table = el('table', { class: 'ref' });
    const thead = el('thead');
    const trh = el('tr');
    [['nom', 'Nom'], ['rayon', 'Rayon'], ['famille', 'Famille'], ['unite', 'Unité pièce'], ['prix', 'Prix'], ['placard', 'Placard'], ['aliases', 'Aliases'], ['actions', '']]
      .forEach(function (c) {
        const th = el('th', { text: c[1] + (etat.triRef.colonne === c[0] ? (etat.triRef.sens > 0 ? ' ▲' : ' ▼') : '') });
        if (['nom', 'rayon', 'famille', 'prix', 'placard'].indexOf(c[0]) >= 0) {
          th.addEventListener('click', function () {
            if (etat.triRef.colonne === c[0]) etat.triRef.sens *= -1;
            else etat.triRef = { colonne: c[0], sens: 1 };
            remplirTable();
          });
        } else { th.style.cursor = 'default'; }
        trh.appendChild(th);
      });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = el('tbody');
    const utilisation = compterUtilisation();
    liste.forEach(function (i) {
      const tr = el('tr');

      const cNom = el('input', { type: 'text', value: i.nom });
      cNom.addEventListener('change', async function () {
        const n = cNom.value.trim(); if (!n) { cNom.value = i.nom; return; }
        i.nom = n; await sauvegarder(); rendre();
      });
      tr.appendChild(el('td', {}, [cNom]));

      const cRayon = el('select');
      RAYONS.forEach(function (rr) { cRayon.appendChild(el('option', { value: rr[0], text: rr[1], selected: i.rayon === rr[0] })); });
      cRayon.addEventListener('change', async function () { i.rayon = cRayon.value; await sauvegarder(); });
      tr.appendChild(el('td', {}, [cRayon]));

      const cFam = el('select');
      FAMILLES.forEach(function (f) { cFam.appendChild(el('option', { value: f[0], text: FAMILLE_COURT[f[0]], selected: i.famille === f[0] })); });
      cFam.addEventListener('change', async function () {
        i.famille = cFam.value;
        i.unitePiece = i.famille === 'piece' ? (i.unitePiece || 'pièce') : null;
        i.prix = { valeur: i.prix ? i.prix.valeur : null, par: PAR_PRIX_PAR_FAMILLE[i.famille] };
        corrigerUnitesRecettes(i);
        await sauvegarder(); remplirTable();
      });
      tr.appendChild(el('td', {}, [cFam]));

      const cUnite = el('input', { type: 'text', value: i.unitePiece || '', list: 'dl-unites-piece', disabled: i.famille !== 'piece' });
      cUnite.addEventListener('change', async function () {
        i.unitePiece = cUnite.value.trim() || 'pièce';
        corrigerUnitesRecettes(i);
        await sauvegarder(); rendre();
      });
      tr.appendChild(el('td', {}, [cUnite]));

      const cPrix = el('input', { type: 'text', inputmode: 'decimal', value: (i.prix && typeof i.prix.valeur === 'number') ? formatNombre(i.prix.valeur, 2) : '', placeholder: '—' });
      cPrix.addEventListener('change', async function () {
        i.prix = { valeur: parseNombre(cPrix.value), par: PAR_PRIX_PAR_FAMILLE[i.famille] };
        await sauvegarder();
      });
      tr.appendChild(el('td', {}, [
        el('div', { class: 'cellule-prix' }, [cPrix, el('span', { class: 'doux', text: PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[i.famille]] })]),
      ]));

      const cPlacard = el('input', { type: 'checkbox', checked: !!i.placard, 'aria-label': 'Fond de placard' });
      cPlacard.addEventListener('change', async function () { i.placard = cPlacard.checked; await sauvegarder(); });
      tr.appendChild(el('td', {}, [cPlacard]));

      const cAlias = el('input', { type: 'text', value: i.aliases.join(', '), placeholder: 'autres noms, séparés par des virgules' });
      cAlias.addEventListener('change', async function () {
        i.aliases = cAlias.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        await sauvegarder();
      });
      tr.appendChild(el('td', {}, [cAlias]));

      const n = utilisation.get(i.id) || 0;
      tr.appendChild(el('td', { style: 'white-space:nowrap' }, [
        el('span', { class: 'tpt doux', text: n ? n + ' rec.' : 'inutilisé' }),
        ' ',
        el('button', { type: 'button', class: 'btn mini', text: 'Fusionner', onclick: function () { modaleFusion(i); } }),
        ' ',
        el('button', { type: 'button', class: 'btn mini danger', text: '✕', 'aria-label': 'Supprimer ' + i.nom, onclick: function () { supprimerIngredient(i, n); } }),
      ]));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    infoRef.textContent = liste.length + ' ingrédient' + (liste.length > 1 ? 's' : '') + ' sur ' + D.ingredients.length;
  }
  remplirTable();
}

    el('h2', { text: 'Repartir de zéro' }),
    el('p', { class: 'pt doux', text: 'Efface tout : ingrédients, recettes, semaine, historique. Pensez à exporter avant.' }),
    el('button', { type: 'button', class: 'btn danger', text: 'Effacer toutes les données', onclick: effacerTout }),
  ]);
}

/** Supprime en une fois les ingrédients qu'aucune recette n'utilise. */
async function purgerIngredientsInutilises() {
  const cibles = ingredientsInutilises(D);
  if (!cibles.length) { toast('Aucun ingrédient inutilisé.'); return; }
  const liste = el('ul', { class: 'pt', style: 'max-height:220px;overflow:auto;margin:.3rem 0 0;padding-left:1.1rem' });
  cibles.forEach(function (i) { liste.appendChild(el('li', { text: i.nom + ' — ' + RAYON_LIBELLE[i.rayon] })); });
  const ok = await confirmer({
    titre: 'Supprimer les ingrédients inutilisés',
    labelOk: 'Supprimer les ' + cibles.length, danger: true,
    corps: [
      el('p', { class: 'pt', text: 'Ces ' + cibles.length + ' ingrédients ne sont utilisés par aucune recette. Leur suppression ne touche à aucune recette existante.' }),
      liste,
    ],
  });
  if (!ok) return;
  const avant = D.ingredients.slice();
  const cles = new Set(cibles.map(function (i) { return i.id; }));
  D.ingredients = D.ingredients.filter(function (i) { return !cles.has(i.id); });
  await sauvegarder();
  rendre();
  toast(cibles.length + ' ingrédient' + (cibles.length > 1 ? 's supprimés' : ' supprimé'), {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () { D.ingredients = avant; await sauvegarder(); rendre(); },
  });
}

function compterUtilisation() {
  const m = new Map();
  D.recettes.forEach(function (r) {
    const vus = new Set();
    r.lignes.forEach(function (l) {
      if (vus.has(l.ingredientId)) return;
      vus.add(l.ingredientId);
      m.set(l.ingredientId, (m.get(l.ingredientId) || 0) + 1);
    });
  });
  return m;
}

async function supprimerIngredient(ingredient, nbRecettes) {
  const ok = await confirmer({
    titre: 'Supprimer l\'ingrédient',
    message: nbRecettes
      ? '« ' + ingredient.nom + ' » est utilisé dans ' + nbRecettes + ' recette' + (nbRecettes > 1 ? 's' : '') + '. Il en sera retiré.'
      : 'Supprimer « ' + ingredient.nom + ' » du référentiel ?',
    labelOk: 'Supprimer', danger: true,
  });
  if (!ok) return;
  const index = D.ingredients.indexOf(ingredient);
  const lignesAvant = D.recettes.map(function (r) { return { id: r.id, lignes: r.lignes.slice() }; });
  D.ingredients.splice(index, 1);
  D.recettes.forEach(function (r) { r.lignes = r.lignes.filter(function (l) { return l.ingredientId !== ingredient.id; }); });
  delete D.semaine.coches[ingredient.id];
  await sauvegarder();
  rendre();
  supprimerAvecAnnulation('Ingrédient « ' + ingredient.nom + ' »', async function () {
    D.ingredients.splice(index, 0, ingredient);
    lignesAvant.forEach(function (x) { const r = recetteParId(x.id); if (r) r.lignes = x.lignes; });
    await sauvegarder(); rendre();
  });
}

function modaleFusion(source) {
  const candidats = D.ingredients.filter(function (i) { return i.id !== source.id; });
  if (!candidats.length) { toast('Aucun autre ingrédient.'); return; }
  const select = el('select');
  select.appendChild(el('option', { value: '', text: '— choisir —' }));
  candidats.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); })
    .forEach(function (i) { select.appendChild(el('option', { value: i.id, text: i.nom + ' (' + FAMILLE_COURT[i.famille] + ')' })); });
  const avert = el('div', { class: 'avert', hidden: true });
  select.addEventListener('change', function () {
    const cible = ingredientParId(select.value);
    if (!cible) { avert.hidden = true; return; }
    if (cible.famille !== source.famille) {
      avert.hidden = false;
      avert.textContent = 'Familles différentes (' + FAMILLE_COURT[source.famille] + ' / ' + FAMILLE_COURT[cible.famille] + ') : la fusion est impossible, on ne convertit jamais entre familles.';
    } else if (source.famille === 'piece' && cible.unitePiece !== source.unitePiece) {
      avert.hidden = false;
      avert.textContent = 'Unités de pièce différentes (« ' + source.unitePiece + ' » et « ' + cible.unitePiece + ' ») : les quantités garderont leur valeur et prendront l\'unité « ' + cible.unitePiece + ' ». Vérifiez les recettes après la fusion.';
    } else { avert.hidden = true; }
  });
  ouvrirModale({
    titre: 'Fusionner « ' + source.nom + ' »',
    corps: [
      el('p', { class: 'pt', text: '« ' + source.nom + ' » deviendra un alias de l\'ingrédient choisi. Toutes les recettes seront mises à jour.' }),
      el('label', { class: 'champ' }, [el('span', { text: 'Conserver l\'ingrédient' }), select]),
      avert,
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Fusionner', variant: 'principal',
        onClick: async function (f) {
          const cible = ingredientParId(select.value);
          if (!cible) { toast('Choisissez un ingrédient.'); return; }
          if (cible.famille !== source.famille) { toast('Fusion impossible entre familles différentes.'); return; }
          f();
          await fusionnerIngredients(source.id, cible.id);
        },
      },
    ],
  });
}

function construireOrdreRayons() {
  const ul = el('ul', { class: 'liste-ordre' });
  let indexDrag = null;

  function redessiner() {
    ul.innerHTML = '';
    D.reglages.ordreRayons.forEach(function (r, i) {
      const li = el('li', { draggable: 'true', 'data-i': i }, [
        el('span', { class: 'poignee', 'aria-hidden': 'true', text: '⠿' }),
        el('span', { class: 'nom', text: RAYON_LIBELLE[r] }),
        el('button', { type: 'button', class: 'btn mini fantome', text: '↑', 'aria-label': 'Monter ' + RAYON_LIBELLE[r], disabled: i === 0, onclick: function () { deplacer(i, i - 1); } }),
        el('button', { type: 'button', class: 'btn mini fantome', text: '↓', 'aria-label': 'Descendre ' + RAYON_LIBELLE[r], disabled: i === D.reglages.ordreRayons.length - 1, onclick: function () { deplacer(i, i + 1); } }),
      ]);
      li.addEventListener('dragstart', function (ev) {
        indexDrag = i; li.classList.add('drag');
        try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(i)); } catch (e) {}
      });
      li.addEventListener('dragend', function () { indexDrag = null; redessiner(); });
      li.addEventListener('dragover', function (ev) { ev.preventDefault(); li.classList.add('survol'); });
      li.addEventListener('dragleave', function () { li.classList.remove('survol'); });
      li.addEventListener('drop', function (ev) {
        ev.preventDefault(); li.classList.remove('survol');
        let src = indexDrag;
        if (src === null) { const t = parseNombre(ev.dataTransfer.getData('text/plain')); src = (t === null) ? null : t; }
        if (src === null || src === i) return;
        deplacer(src, i);
      });
      ul.appendChild(li);
    });
  }
  async function deplacer(de, vers) {
    const arr = D.reglages.ordreRayons;
    if (vers < 0 || vers >= arr.length) return;
    const [x] = arr.splice(de, 1);
    arr.splice(vers, 0, x);
    await sauvegarder();
    redessiner();
  }
  redessiner();
  return ul;
}

/* --- Export / import --- */
async function exporterDonnees() {
  await Store.flush();
  const json = await Store.export();
  const nom = 'liste-courses-' + aujourdHuiISO() + '.json';
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: nom });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('Export « ' + nom + ' » téléchargé.');
  } catch (e) {
    const zone = el('textarea', { rows: '12' });
    zone.value = json;
    ouvrirModale({
      titre: 'Exporter',
      corps: [el('p', { class: 'pt doux', text: 'Le téléchargement a échoué. Copiez le contenu ci-dessous dans un fichier .json.' }), zone],
      actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
    });
  }
}

function importerDonnees() {
  const input = el('input', { type: 'file', accept: '.json,application/json', style: 'position:fixed;left:-9999px' });
  document.body.appendChild(input);
  input.addEventListener('change', function () {
    const f = input.files && input.files[0];
    if (!f) { input.remove(); return; }
    const lecteur = new FileReader();
    lecteur.onload = function () {
      input.remove();
      ecranConfirmationImport(String(lecteur.result), f.name);
    };
    lecteur.onerror = function () { input.remove(); toast('Lecture du fichier impossible.'); };
    lecteur.readAsText(f);
  });
  input.click();
}

function ecranConfirmationImport(texte, nomFichier) {
  let candidat;
  try { candidat = JSON.parse(texte); }
  catch (e) { toast('Fichier illisible : ce n\'est pas du JSON valide.'); return; }
  let apercu;
  try { apercu = normaliserRacine(candidat); }
  catch (e) { toast('Fichier inattendu : ' + e.message); return; }

  const tableau = el('div', { class: 'lignes-ing' });
  [
    ['Ingrédients', D.ingredients.length, apercu.ingredients.length],
    ['Recettes', D.recettes.length, apercu.recettes.length],
    ['Recettes dans la semaine', D.semaine.selection.length, apercu.semaine.selection.length],
    ['Articles ajoutés à la main', D.semaine.ajoutsManuels.length, apercu.semaine.ajoutsManuels.length],
    ['Semaines types', D.semainesTypes.length, apercu.semainesTypes.length],
    ['Semaines dans l\'historique', D.historique.length, apercu.historique.length],
  ].forEach(function (l) {
    tableau.appendChild(el('div', { class: 'ligne-ing', style: 'grid-template-columns:1fr auto' }, [
      el('span', { text: l[0] }),
      el('span', { class: 'gras', text: l[1] + ' → ' + l[2] }),
    ]));
  });

  ouvrirModale({
    titre: 'Importer « ' + nomFichier + ' »',
    corps: [
      el('div', { class: 'avert', text: 'Tout le contenu actuel sera remplacé par celui du fichier. Cette action n\'est pas annulable.' }),
      el('p', { class: 'pt doux', text: 'Ce qui sera remplacé (actuel → importé) :' }),
      tableau,
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      { label: 'Exporter d\'abord', onClick: function () { exporterDonnees(); } },
      {
        label: 'Remplacer', variant: 'danger',
        onClick: async function (f) {
          try {
            D = await Store.import(texte);
          } catch (e) { toast(e.message || 'Import impossible.'); return; }
          f();
          etat.editionRecette = null; etat.editeurDom = null;
          appliquerTheme();
          allerA('semaine');
          toast('Données importées.');
        },
      },
    ],
  });
}

async function effacerTout() {

    labelOk: 'Tout effacer', danger: true,

/* ——— CALENDRIER ET PLANIFICATION ————————————————————————————————————————
   Planifier et acheter sont deux horizons différents. On peut prévoir des
   repas aussi loin qu'on veut : ça ne périme rien. Ce qui périme, c'est ce
   qu'on achète — donc c'est la période d'achat, et elle seule, qui décide de
   ce qui entre dans la liste de courses.
   ------------------------------------------------------------------------- */

let moisAffiche = null;      // premier jour du mois montré dans le calendrier
let jourOuvert = null;       // jour dont on édite les repas

function ouvrirCalendrier(surJour) {
  const p = D.semaine.periode;
  moisAffiche = lundiDe(dateDepuisISO(p.debut) || new Date());
  moisAffiche = new Date(moisAffiche.getFullYear(), moisAffiche.getMonth(), 1);
  jourOuvert = surJour || null;

  const corps = el('div', { class: 'calendrier' });
  const boite = ouvrirModale({
    titre: 'Planifier',
    corps: [corps],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); rendre(); } }],
  });
  dessinerCalendrier(corps);
  return boite;
}

function dessinerCalendrier(corps) {
  corps.innerHTML = '';
  const periode = D.semaine.periode;

  /* --- Période d'achat --- */
  const bandeau = el('div', { class: 'periode-achat' });
  bandeau.appendChild(el('div', { class: 'tpt doux', text: 'Liste de courses pour' }));
  const ligne = el('div', { class: 'periode-ligne' }, [
    el('button', {
      type: 'button', class: 'btn mini', text: '‹', 'aria-label': 'Période précédente',
      onclick: async function () { await decalerPeriode(-1); dessinerCalendrier(corps); },
    }),
    el('span', { class: 'periode-nom', text: libelleDePeriode(periode) }),
    el('button', {
      type: 'button', class: 'btn mini', text: '›', 'aria-label': 'Période suivante',
      onclick: async function () { await decalerPeriode(1); dessinerCalendrier(corps); },
    }),
  ]);
  bandeau.appendChild(ligne);

  const duree = el('div', { class: 'filtres', style: 'margin:.4rem 0 0' });
  [1, 2, 3, 4].forEach(function (n) {
    const jours = n * 7;
    const actif = nbJoursPeriode(periode) === jours;
    const b = el('button', {
      type: 'button', class: 'puce-filtre', 'aria-pressed': String(actif),
      text: n === 1 ? '1 semaine' : n + ' semaines',
    });
    b.addEventListener('click', async function () {
      const d = dateDepuisISO(periode.debut);
      await definirPeriode({ debut: periode.debut, fin: isoDuJour(ajouterJours(d, jours - 1)) });
      dessinerCalendrier(corps);
    });
    duree.appendChild(b);
  });
  bandeau.appendChild(duree);

  // L'avertissement de fraîcheur porte sur l'achat, pas sur le planning.
  if (nbJoursPeriode(periode) > 7) {
    const frais = rayonsFraisDeLaListe(D);
    if (frais.length) {
      bandeau.appendChild(el('p', { class: 'tpt', style: 'margin:.4rem 0 0;color:var(--danger)', text:
        'Plus d\'une semaine d\'achats : ' + frais.map(function (r) { return RAYON_LIBELLE[r].toLowerCase(); }).join(', ') +
        ' ne se gardent pas si longtemps. Planifiez loin si vous voulez, mais achetez le frais au fur et à mesure.' }));
    }
  }
  corps.appendChild(bandeau);

  /* --- Grille du mois --- */
  const enteteMois = el('div', { class: 'periode-ligne', style: 'margin:.7rem 0 .3rem' }, [
    el('button', { type: 'button', class: 'btn mini', text: '‹', 'aria-label': 'Mois précédent',
      onclick: function () { moisAffiche = new Date(moisAffiche.getFullYear(), moisAffiche.getMonth() - 1, 1); dessinerCalendrier(corps); } }),
    el('span', { class: 'periode-nom', text: MOIS[moisAffiche.getMonth()] + ' ' + moisAffiche.getFullYear() }),
    el('button', { type: 'button', class: 'btn mini', text: '›', 'aria-label': 'Mois suivant',
      onclick: function () { moisAffiche = new Date(moisAffiche.getFullYear(), moisAffiche.getMonth() + 1, 1); dessinerCalendrier(corps); } }),
  ]);
  corps.appendChild(enteteMois);

  const grille = el('div', { class: 'grille-mois' });
  JOURS_COURTS.forEach(function (j) { grille.appendChild(el('div', { class: 'entete-jour', text: j })); });

  const premier = lundiDe(moisAffiche);
  const auj = aujourdHuiISO();
  for (let i = 0; i < 42; i++) {
    const jour = ajouterJours(premier, i);
    const iso = isoDuJour(jour);
    const horsMois = jour.getMonth() !== moisAffiche.getMonth();
    const repas = selectionDuJour(D, iso);
    const classes = ['case-jour'];
    if (horsMois) classes.push('hors-mois');
    if (dansLaPeriode(iso, periode)) classes.push('dans-periode');
    if (iso === auj) classes.push('aujourdhui');
    if (iso === jourOuvert) classes.push('ouvert');

    const c = el('button', { type: 'button', class: classes.join(' '),
      'aria-label': jour.getDate() + ' ' + MOIS[jour.getMonth()] + (repas.length ? ', ' + repas.length + ' repas' : '') }, [
      el('span', { class: 'num', text: String(jour.getDate()) }),
      repas.length ? el('span', { class: 'points', text: repas.length > 3 ? '•••' : '•'.repeat(repas.length) }) : null,
    ]);
    c.addEventListener('click', function () { jourOuvert = (jourOuvert === iso) ? null : iso; dessinerCalendrier(corps); });
    grille.appendChild(c);
    if (i >= 34 && ajouterJours(premier, i + 1).getMonth() !== moisAffiche.getMonth()) break;
  }
  corps.appendChild(grille);

  corps.appendChild(el('div', { class: 'barre-actions', style: 'margin-top:.4rem' }, [
    el('button', { type: 'button', class: 'btn mini', text: 'Cette semaine', onclick: async function () {
      await definirPeriode(periodeSemaineCourante()); moisAffiche = new Date(); jourOuvert = null; dessinerCalendrier(corps);
    } }),
  ]));

  /* --- Repas du jour ouvert --- */
  if (jourOuvert) corps.appendChild(panneauDuJour(corps, jourOuvert));
}

function panneauDuJour(corps, iso) {
  const jour = dateDepuisISO(iso);
  const bloc = el('div', { class: 'carte plate jour-ouvert' });
  bloc.appendChild(el('h3', { style: 'margin:0 0 .3rem', text:
    JOURS_LONGS[(jour.getDay() + 6) % 7] + ' ' + jour.getDate() + ' ' + MOIS[jour.getMonth()] }));

  if (!dansLaPeriode(iso, D.semaine.periode)) {
    bloc.appendChild(el('p', { class: 'tpt doux', style: 'margin:0 0 .4rem', text:
      'Hors de la période d\'achat : ces repas sont planifiés, mais leurs ingrédients ne sont pas dans la liste.' }));
  }

  const repas = selectionDuJour(D, iso);
  if (!repas.length) {
    bloc.appendChild(el('p', { class: 'pt doux', style: 'margin:.2rem 0', text: 'Aucun repas prévu ce jour-là.' }));
  } else {
    repas.forEach(function (e) {
      const r = recetteParId(e.recetteId);
      bloc.appendChild(el('div', { class: 'ligne-espace' }, [
        el('div', { class: 'nom', text: r ? r.nom : '(recette supprimée)' }),
        el('div', { class: 'stepper compact' }, [
          el('button', { type: 'button', text: '−', 'aria-label': 'Moins de portions',
            onclick: async function () { await changerPortionsEntree(e.id, -1); dessinerCalendrier(corps); } }),
          el('span', { class: 'valeur', text: String(e.portions) }),
          el('button', { type: 'button', text: '+', 'aria-label': 'Plus de portions',
            onclick: async function () { await changerPortionsEntree(e.id, 1); dessinerCalendrier(corps); } }),
        ]),
        el('button', { type: 'button', class: 'btn mini fantome retirer', text: '✕', 'aria-label': 'Retirer ce repas',
          onclick: async function () { await retirerEntree(e.id); dessinerCalendrier(corps); } }),
      ]));
    });
  }

  // Repas déjà retenus mais sans jour : un appui les place ici. Ils se
  // déplacent, ils ne se dupliquent pas. Hors période d'achat, la question ne
  // se pose pas : ces repas-là appartiennent à la période en cours.
  const dansPeriode = dansLaPeriode(iso, D.semaine.periode);
  const sansJour = dansPeriode
    ? selectionActive(D).filter(function (e) { return !e.date; })
    : [];
  if (sansJour.length) {
    const aPlacer = el('div', { class: 'filtres', style: 'margin:.35rem 0 0' });
    sansJour.forEach(function (e) {
      const r = recetteParId(e.recetteId);
      if (!r) return;
      const b = el('button', { type: 'button', class: 'puce-filtre', text: '↦ ' + r.nom,
        'aria-label': 'Placer ' + r.nom + ' ce jour-là' });
      b.addEventListener('click', async function () { await daterEntree(e.id, iso); dessinerCalendrier(corps); });
      aPlacer.appendChild(b);
    });
    bloc.appendChild(el('div', { class: 'tpt doux', style: 'margin:.5rem 0 0', text: 'À placer' }));
    bloc.appendChild(aPlacer);
  }

  // Choix d'une recette à placer ce jour-là, par autocomplétion.
  const champ = el('input', { type: 'text', placeholder: 'Ajouter un plat…', enterkeyhint: 'done',
    'aria-label': 'Ajouter un plat à ce jour' });
  const boite = el('div', { style: 'position:relative;margin-top:.4rem' }, [champ]);
  attacherAutocompletion(champ, {
    items: function () {
      return D.recettes.map(function (r) {
        return { cle: r.id, libelle: r.nom, secondaire: r.tempsPreparationMin ? r.tempsPreparationMin + ' min' : '' };
      });
    },
    surChoix: async function (it) {
      const r = recetteParId(it.cle);
      if (!r) return;
      champ.value = '';
      // Recette déjà retenue sans jour : on la date au lieu d'en ajouter une
      // seconde, sinon la liste de courses compte le plat deux fois.
      const orphelin = dansPeriode
        ? selectionActive(D).find(function (e) { return e.recetteId === r.id && !e.date; })
        : null;
      if (orphelin) {
        const idOrphelin = orphelin.id;
        await daterEntree(idOrphelin, iso);
        toast('« ' + r.nom + ' » déplacé ici.', { duree: 5000, actionLabel: 'Annuler',
          onAction: async function () { await daterEntree(idOrphelin, null); dessinerCalendrier(corps); } });
      } else {
        await ajouterASemaine(r, iso);
      }
      dessinerCalendrier(corps);
    },
  });
  bloc.appendChild(boite);
  return bloc;
}

async function decalerPeriode(sens) {
  const p = D.semaine.periode;
  const n = nbJoursPeriode(p);
  const d = ajouterJours(dateDepuisISO(p.debut), sens * n);
  await definirPeriode({ debut: isoDuJour(d), fin: isoDuJour(ajouterJours(d, n - 1)) });
}

/* ——— PARTAGE ET SYNCHRONISATION —————————————————————————————————————————
   L'application ne connaît du réseau que ce que Store lui en dit : un état,
   un nom d'espace, et une racine qui change parfois toute seule.
   ------------------------------------------------------------------------- */

const ETAT_LIBELLE = {
  local: 'Cet appareil',
  synchronise: 'Synchronisé',
  envoi: 'Envoi…',
  horsligne: 'Hors ligne',
  erreur: 'Synchro en échec',
};

let infosEspaces = { courant: null, espaces: [], etat: 'local', enAttente: 0 };
let serveurDetecte = null;   // serveur de synchronisation servant cette page

/**
 * Quand l'application est servie par le serveur de synchronisation lui-même,
 * il n'y a rien à saisir : on interroge « /api/sante » sur la même adresse et
 * on se configure tout seul. C'est le cas de loin le plus courant, et celui
 * où une adresse tapée à la main serait une source d'erreur inutile.
 */
async function detecterServeur() {
  if (typeof location === 'undefined') return null;
  if (location.protocol !== 'https:' && location.protocol !== 'http:') return null;
  try {
    const stop = new AbortController();
    const minuteur = setTimeout(function () { stop.abort(); }, 3000);
    const rep = await fetch(location.origin + '/api/sante', { signal: stop.signal });
    clearTimeout(minuteur);
    if (!rep.ok) return null;
    const r = await rep.json();
    if (r && r.etat === 'ok') { serveurDetecte = location.origin; return serveurDetecte; }
  } catch (e) { /* pas de serveur à cette adresse : rien à signaler */ }
  return null;
}

async function rafraichirEtatEspaces() {
  infosEspaces = await Store.espaces();
  // L'état de synchronisation peut changer avant que les données soient
  // chargées : rien à peindre tant qu'il n'y a pas de document.
  if (!D) return;
  const bouton = $('#bouton-espace');
  const pastille = $('#pastille-sync');
  const nom = $('#nom-espace');
  if (!bouton) return;

  const courant = infosEspaces.espaces.find(function (e) { return e.id === infosEspaces.courant; });
  // Sans espace ni serveur configuré, le bouton ne sert à rien : on le cache.
  bouton.hidden = !courant && !infosEspaces.espaces.length && !D.reglages.serveurSync;
  pastille.className = 'pastille ' + infosEspaces.etat;
  nom.textContent = courant ? courant.nom : 'Cet appareil';
  bouton.classList.toggle('sans-espace', !courant);
  bouton.title = courant
    ? (ETAT_LIBELLE[infosEspaces.etat] || '') + (infosEspaces.enAttente ? ' · ' + infosEspaces.enAttente + ' en attente' : '')
    : 'Données de cet appareil seulement';
}

function ouvrirSelecteurEspaces() {
  const corps = [];
  const liste = el('div');

  const ligne = function (titre, sousTitre, actuel, surChoix, surQuitter) {
    const l = el('div', { class: 'ligne-espace' }, [
      el('div', { class: 'nom' }, [
        el('div', { class: actuel ? 'actuel' : '', text: titre }),
        el('div', { class: 'tpt doux', text: sousTitre }),
      ]),
    ]);
    if (!actuel) l.appendChild(el('button', { type: 'button', class: 'btn mini principal', text: 'Ouvrir', onclick: surChoix }));
    if (surQuitter) l.appendChild(el('button', { type: 'button', class: 'btn mini fantome', text: '✕', 'aria-label': 'Retirer de cet appareil', onclick: surQuitter }));
    return l;
  };

  liste.appendChild(ligne('Cet appareil', 'Données locales, non partagées', !infosEspaces.courant,
    async function () { fermerModale(); await basculerEspace(null); }, null));

  infosEspaces.espaces.forEach(function (e) {
    liste.appendChild(ligne(e.nom, e.serveur.replace(/^https?:\/\//, ''), e.id === infosEspaces.courant,
      async function () { fermerModale(); await basculerEspace(e.id); },
      async function () {
        fermerModale();
        const ok = await confirmer({
          titre: 'Retirer « ' + e.nom +' » de cet appareil',
          message: 'L\'espace et son contenu restent sur le serveur, et sur les autres appareils. Vous pourrez y revenir avec le lien de partage.',
          labelOk: 'Retirer', danger: true,
        });
        if (!ok) return;
        D = await Store.quitterEspace(e.id) || donneesExemple();
        await rafraichirEtatEspaces();
        rendre();
        toast('« ' + e.nom + ' » retiré de cet appareil.');
      }));
  });
  corps.push(liste);

  const actions = [{ label: 'Fermer', onClick: function (f) { f(); } }];
  if (infosEspaces.courant) {
    actions.push({ label: 'Lien de partage', onClick: function (f) { f(); montrerLienPartage(); } });
  }
  actions.push({ label: 'Gérer', variant: 'principal', onClick: function (f) { f(); allerAuxReglages('sync'); } });
  ouvrirModale({ titre: 'Espaces', corps: corps, actions: actions });
}

async function basculerEspace(id) {
  const nouvelle = await Store.changerEspace(id);
  D = nouvelle || donneesExemple();
  if (!nouvelle) await Store.save(D);
  etat.editionRecette = null; etat.editeurDom = null;
  await rafraichirEtatEspaces();
  appliquerTheme();
  allerA('semaine');
}

function montrerLienPartage() {
  const lien = Store.lienPartage();
  if (!lien) { toast('Aucun espace partagé ouvert.'); return; }
  const zone = el('textarea', { rows: '4', readonly: true, style: 'font-size:.85rem' });
  zone.value = lien;
  ouvrirModale({
    titre: 'Lien de partage',
    corps: [
      el('div', { class: 'avert', text: 'Ce lien contient la clé de l\'espace : qui l\'a peut tout voir et tout modifier. Ne le diffusez qu\'aux personnes concernées.' }),
      zone,
    ],
    actions: [
      { label: 'Fermer', onClick: function (f) { f(); } },
      navigator.share ? { label: 'Partager', onClick: async function () {
        const fait = await partagerTexte('Rejoindre mon espace de courses', lien);
        if (!fait) toast('Partage indisponible : copiez le lien.');
      } } : null,
      { label: 'Copier', variant: 'principal', onClick: async function () {
        let ok = false;
        try { if (navigator.clipboard) { await navigator.clipboard.writeText(lien); ok = true; } } catch (e) { ok = false; }
        if (!ok) { zone.focus(); zone.select(); toast('Copiez le lien sélectionné.'); }
        else toast('Lien copié.');
      } },
    ],
  });
  setTimeout(function () { zone.focus(); zone.select(); }, 60);
}

/** Un lien de partage dans l'adresse : on propose de rejoindre l'espace. */
async function traiterLienEntrant() {
  if (typeof location === 'undefined' || !location.hash) return false;
  const colis = lireLienRecette(location.hash);
  if (colis) {
    history.replaceState(null, '', location.pathname + location.search);
    return await proposerImportRecette(colis);
  }
  const infos = Store.lireLienPartage(location.hash);
  if (!infos) return false;
  history.replaceState(null, '', location.pathname + location.search);

  if (infosEspaces.espaces.some(function (e) { return e.id === infos.id; })) {
    await basculerEspace(infos.id);
    toast('Espace déjà connu : ouvert.');
    return true;
  }
  const ok = await confirmer({
    titre: 'Rejoindre un espace partagé',
    message: 'Ce lien ouvre un espace hébergé sur ' + infos.serveur.replace(/^https?:\/\//, '') +
      '. Vos données locales actuelles ne sont pas touchées : elles restent accessibles sous « Cet appareil ».',
    labelOk: 'Rejoindre',
  });
  if (!ok) return false;
  try {
    D = await Store.rejoindreEspace(location.hash || infos);
  } catch (e) {
    try { D = await Store.rejoindreEspace(infos); }
    catch (e2) { toast(e2.message || 'Impossible de rejoindre cet espace.'); return false; }
  }
  await rafraichirEtatEspaces();
  appliquerTheme();
  allerA('semaine');
  toast('Espace rejoint.');
  return true;
}

/* --- Écran de réglages : la carte « Partage » --- */

function carteSynchronisation() {
  const carte = el('div', { class: 'carte' });
  carte.appendChild(el('h2', { text: 'Partage et synchronisation' }));

  const courant = infosEspaces.espaces.find(function (e) { return e.id === infosEspaces.courant; });
  carte.appendChild(el('p', { class: 'pt' }, [
    el('span', { class: 'pastille ' + infosEspaces.etat, style: 'display:inline-block;margin-right:.4rem' }),
    el('span', { text: courant
      ? 'Espace « ' + courant.nom + ' » — ' + (ETAT_LIBELLE[infosEspaces.etat] || '').toLowerCase() +
        (infosEspaces.enAttente ? ' (' + infosEspaces.enAttente + ' modification' + (infosEspaces.enAttente > 1 ? 's' : '') + ' en attente)' : '')
      : 'Les données restent sur cet appareil. Rien n\'est envoyé nulle part.' }),
  ]));

  const champServeur = el('input', {
    type: 'url', placeholder: 'https://mon-serveur.exemple', value: D.reglages.serveurSync || '',
    'aria-label': 'Adresse du serveur de synchronisation',
  });
  champServeur.addEventListener('change', async function () {
    D.reglages.serveurSync = champServeur.value.trim().replace(/\/+$/, '') || '';
    await sauvegarder();
    await rafraichirEtatEspaces();
  });
  const bloc = el('label', { class: 'champ' }, [
    el('span', { text: 'Serveur de synchronisation' }), champServeur,
  ]);
  carte.appendChild(bloc);
  if (serveurDetecte && D.reglages.serveurSync !== serveurDetecte) {
    carte.appendChild(el('button', {
      type: 'button', class: 'btn mini', style: 'margin-bottom:.6rem',
      text: 'Utiliser ce serveur (' + serveurDetecte.replace(/^https?:\/\//, '') + ')',
      onclick: async function () {
        D.reglages.serveurSync = serveurDetecte;
        await sauvegarder();
        rendre();
        toast('Serveur enregistré.');
      },
    }));
  }

  const actions = el('div', { class: 'barre-actions' });
  actions.appendChild(el('button', {
    type: 'button', class: 'btn principal', text: '＋ Créer un espace partagé',
    onclick: creerEspacePartage,
  }));
  actions.appendChild(el('button', {
    type: 'button', class: 'btn', text: '⇥ Rejoindre avec un lien', onclick: rejoindreParLien,
  }));
  if (courant) {
    actions.appendChild(el('button', { type: 'button', class: 'btn', text: '🔗 Lien de partage', onclick: montrerLienPartage }));
    actions.appendChild(el('button', { type: 'button', class: 'btn', text: '↻ Synchroniser', onclick: async function () {
      await Store.synchroniser(); await rafraichirEtatEspaces(); rendre(); toast('Synchronisation demandée.');
    } }));
  }
  if (infosEspaces.espaces.length) {
    actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Changer d\'espace', onclick: ouvrirSelecteurEspaces }));
  }
  carte.appendChild(actions);

  return carte;
}

function creerEspacePartage() {
  const serveur = (D.reglages.serveurSync || '').trim();
  if (!serveur) { toast('Renseignez d\'abord l\'adresse du serveur.'); return; }
  const champ = el('input', { type: 'text', placeholder: 'Coloc, Famille, Perso…', value: '' });
  ouvrirModale({
    titre: 'Créer un espace partagé',
    corps: [
      el('label', { class: 'champ' }, [el('span', { text: 'Nom de l\'espace' }), champ]),
      el('p', { class: 'pt doux', text: 'Les données affichées en ce moment y seront déposées. Vous obtiendrez un lien à transmettre.' }),
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Créer', variant: 'principal',
        onClick: async function (f) {
          const nom = champ.value.trim() || 'Mon espace';
          f();
          try {
            await Store.creerEspace(nom, serveur, D);
          } catch (e) { toast(e.message || 'Création impossible.'); return; }
          await rafraichirEtatEspaces();
          rendre();
          montrerLienPartage();
        },
      },
    ],
  });
}

function rejoindreParLien() {
  const champ = el('textarea', { rows: '3', placeholder: 'Collez ici le lien reçu' });
  ouvrirModale({
    titre: 'Rejoindre un espace',
    corps: [
      el('label', { class: 'champ' }, [el('span', { text: 'Lien de partage' }), champ]),
      el('p', { class: 'pt doux', text: 'Vos données locales ne sont pas touchées : elles restent sous « Cet appareil ».' }),
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Rejoindre', variant: 'principal',
        onClick: async function (f) {
          const lien = champ.value.trim();
          if (!lien) { champ.focus(); return; }
          f();
          try { D = await Store.rejoindreEspace(lien); }
          catch (e) { toast(e.message || 'Impossible de rejoindre cet espace.'); return; }
          await rafraichirEtatEspaces();
          appliquerTheme();
          allerA('semaine');
          toast('Espace rejoint.');
        },
      },
    ],
  });
}

/* ——— DÉMARRAGE ——————————————————————————————————————————————————————————— */

/**
 * Rend l'application disponible hors ligne quand elle est servie en ligne.
 * Ouverte en double-clic (file://), il n'y a pas de service worker : on ne
 * tente rien et l'application fonctionne comme avant.
 *
 * Une nouvelle version n'est jamais imposée au milieu d'une session : le
 * nouveau worker attend, et l'utilisateur choisit quand recharger.
 */
function enregistrerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

  // On ne recharge que si l'utilisateur a demandé la bascule. Sans ce garde-fou,
  // la première prise de contrôle du worker rechargerait la page en pleine
  // saisie, sans que personne ait rien demandé.
  let basculeDemandee = false;
  let rechargeEnCours = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!basculeDemandee || rechargeEnCours) return;
    rechargeEnCours = true;
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    const proposer = function (worker) {
      if (!worker) return;
      toast('Nouvelle version disponible', {
        duree: 60000, actionLabel: 'Recharger',
        onAction: function () { basculeDemandee = true; worker.postMessage({ type: 'ACTIVER' }); },
      });
    };
    // Une version déjà téléchargée attend peut-être depuis la visite précédente.
    if (reg.waiting && navigator.serviceWorker.controller) proposer(reg.waiting);
    reg.addEventListener('updatefound', function () {
      const arrivant = reg.installing;
      if (!arrivant) return;
      arrivant.addEventListener('statechange', function () {
        // Sans contrôleur, c'est la toute première installation : rien à proposer.
        if (arrivant.state === 'installed' && navigator.serviceWorker.controller) proposer(arrivant);
      });
    });
  }).catch(function () {
    // Hors ligne au premier chargement, ou service worker refusé : sans effet.
  });
}

function signalerModeDegrade() {
  const b = $('#bandeau-degrade');
  if (!b.hidden) return;
  b.hidden = false;
  b.textContent = '';
  b.appendChild(document.createTextNode('Sauvegarde impossible dans ce navigateur — pense à exporter tes données avant de fermer. '));
  b.appendChild(el('button', {
    type: 'button', class: 'btn mini', style: 'margin-left:.4rem', text: 'Exporter maintenant',
    onclick: exporterDonnees,
  }));
}

async function demarrer() {
  // Le service worker ne dépend ni des données ni du réseau : l'enregistrer en
  // premier fait démarrer la mise en cache hors ligne sans attendre, et garantit
  // que l'arrivée d'une nouvelle version sera vue quoi qu'il arrive ensuite.
  enregistrerServiceWorker();

  Store.surPanne(function () { signalerModeDegrade(); });

  // Une modification venue d'un autre appareil remplace la racine : on adopte
  // la nouvelle et on redessine, sans rien perdre de ce qui est en cours.
  Store.surChangement(function (nouvelle) {
    D = nouvelle;
    rafraichirEtatEspaces();
    rendre();
  });
  Store.surEtat(function () { rafraichirEtatEspaces(); });

  let chargees = null;
  try { chargees = await Store.load(); }
  catch (e) { chargees = null; }

  if (chargees) {
    D = chargees;
  } else {
    // Premier lancement (ou stockage illisible) : jeu de données de démarrage.
    D = donneesExemple();
    await Store.save(D);
    await Store.flush();
  }
  if (Store.modeMemoire()) signalerModeDegrade();

  appliquerTheme();
  $$('#tabbar button').forEach(function (b) {
    b.addEventListener('click', function () { allerA(b.dataset.tab); });
  });
  $('#bouton-espace').addEventListener('click', ouvrirSelecteurEspaces);
  $('#bouton-calendrier').addEventListener('click', function () { ouvrirCalendrier(); });
  // Se déplacer de période en période sans ouvrir le calendrier.
  $('#periode-avant').addEventListener('click', function () { decalerPeriode(-1); });
  $('#periode-apres').addEventListener('click', function () { decalerPeriode(1); });
  await rafraichirEtatEspaces();

  // Hauteur réelle de la barre de titre, pour que l'en-tête de la liste se cale
  // juste dessous au lieu de disparaître derrière.
  const mesurerEntete = function () {
    const h = $('.topbar').offsetHeight;
    document.documentElement.style.setProperty('--h-topbar', h + 'px');
  };
  mesurerEntete();
  window.addEventListener('resize', function () { mesurerEntete(); majLibellePeriode(); });
  window.addEventListener('orientationchange', mesurerEntete);

  // La liste de suggestions d'unités est utilisée par plusieurs formulaires.
  const dl = el('datalist', { id: 'dl-unites-piece' });
  UNITES_PIECE_SUGGEREES.forEach(function (u) { dl.appendChild(el('option', { value: u })); });
  document.body.appendChild(dl);

  allerA('semaine');

  // Un lien de partage dans l'adresse : on propose de rejoindre l'espace.
  await traiterLienEntrant();

  // Servie par son propre serveur : on se relie sans rien demander. Après le
  // premier affichage — une sonde réseau ne doit jamais retarder l'écran.
  detecterServeur().then(async function () {
    if (serveurDetecte && !D.reglages.serveurSync) {
      D.reglages.serveurSync = serveurDetecte;
      await sauvegarder();
    }
    await rafraichirEtatEspaces();
    if (etat.onglet === 'plus') rendre();
  });

  // De retour sur l'onglet, on rattrape ce qui s'est passé pendant l'absence.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') Store.synchroniser();
  });
  window.addEventListener('online', function () { Store.synchroniser(); });

  // On force l'écriture en attente avant que l'onglet ne disparaisse.
  const vider = function () { Store.flush(); };
  window.addEventListener('pagehide', vider);
  window.addEventListener('beforeunload', vider);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') vider();
  });

  // À l'impression, on déplie les rayons repliés puis on rétablit l'affichage.
  let repliesAvantImpression = [];
  window.addEventListener('beforeprint', function () {
    repliesAvantImpression = $$('details.rayon').filter(function (d) { return !d.open; });
    repliesAvantImpression.forEach(function (d) { d.open = true; });
  });
  window.addEventListener('afterprint', function () {
    repliesAvantImpression.forEach(function (d) { d.open = false; });
    repliesAvantImpression = [];
  });

  // Le thème « auto » suit le système en direct.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const surChangement = function () { if (D && D.reglages.theme === 'auto') appliquerTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', surChangement);
    else if (mq.addListener) mq.addListener(surChangement);
  }
}

demarrer();
</script>
