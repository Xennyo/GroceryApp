<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Liste de courses</title>
<!-- Installation sur l'écran d'accueil. Ces fichiers ne sont lus que sur une
     version hébergée ; ouvert en double-clic, le fichier reste autonome. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png" type="image/png">
<meta name="theme-color" content="#0a6b4c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* =========================================================================
   ——— THÈME ———  Palette : un accent unique + des gris. Clair et sombre
   sont définis explicitement. Par défaut on suit prefers-color-scheme ;
   l'attribut data-theme sur <html> force l'un ou l'autre.
   ========================================================================= */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --bg-alt:#f2f4f6;
  --surface:#ffffff;
  --surface-2:#f7f8fa;
  --border:#d6dae0;
  --border-fort:#aab2bd;
  --texte:#15181d;
  --texte-doux:#565d6b;
  --accent:#0a6b4c;
  --accent-doux:#e2f1ea;
  --accent-texte:#ffffff;
  --danger:#a4231c;
  --danger-doux:#fbeceb;
  --ombre:0 1px 2px rgba(16,20,26,.08), 0 2px 10px rgba(16,20,26,.05);
  --r:10px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="clair"]){
    color-scheme: dark;
    --bg:#101317;
    --bg-alt:#171b21;
    --surface:#1a1f26;
    --surface-2:#20262e;
    --border:#333b45;
    --border-fort:#59636f;
    --texte:#eef1f5;
    --texte-doux:#a9b2bf;
    --accent:#5cd6a0;
    --accent-doux:#12302a;
    --accent-texte:#07160f;
    --danger:#ff9a91;
    --danger-doux:#3a1c19;
    --ombre:0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="sombre"]{
  color-scheme: dark;
  --bg:#101317;
  --bg-alt:#171b21;
  --surface:#1a1f26;
  --surface-2:#20262e;
  --border:#333b45;
  --border-fort:#59636f;
  --texte:#eef1f5;
  --texte-doux:#a9b2bf;
  --accent:#5cd6a0;
  --accent-doux:#12302a;
  --accent-texte:#07160f;
  --danger:#ff9a91;
  --danger-doux:#3a1c19;
  --ombre:0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
}

/* ——— BASE ——— */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg-alt);
  color:var(--texte);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3{ line-height:1.25; margin:0 0 .5rem; }
h1{ font-size:1.25rem; }
h2{ font-size:1.05rem; }
h3{ font-size:.95rem; }
p{ margin:.35rem 0; }
a{ color:var(--accent); }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ——— STRUCTURE ——— */
#app{ min-height:100dvh; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:.5rem .75rem; padding-top:calc(.5rem + env(safe-area-inset-top));
  display:flex; align-items:center; gap:.5rem; min-height:44px;
}
.topbar .titre{ font-weight:650; font-size:1.05rem; margin:0; flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* Sur mobile, la barre du bas nomme déjà l'onglet actif : le titre y ferait
   double emploi et écrase les deux boutons. On le retire de l'affichage sans
   le retirer du document, pour les lecteurs d'écran. */

.bouton-espace{
  flex:0 1 auto; min-width:0; display:inline-flex; align-items:center; gap:.35rem;
  background:var(--bg-alt); border:1px solid var(--border); border-radius:999px;
  padding:.2rem .6rem; min-height:36px; cursor:pointer; font:inherit; font-size:.82rem;
  font-weight:600; color:var(--texte); max-width:52%;
}
.bouton-espace:hover{ border-color:var(--border-fort); }
.bouton-espace .nom-espace{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pastille{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--texte-doux); }
.pastille.synchronise{ background:var(--accent); }
.pastille.envoi{ background:#c98a00; }
.pastille.horsligne,.pastille.erreur{ background:var(--danger); }
/* Sections repliables des réglages : le référentiel et l'ordre des rayons
   prennent beaucoup de place pour un usage rare. */
details.section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  margin-bottom:.6rem; box-shadow:var(--ombre); overflow:hidden; }
details.section > summary{
  cursor:pointer; list-style:none; padding:.7rem .75rem; min-height:48px;
  display:flex; align-items:center; gap:.5rem; font-weight:650; font-size:1.05rem;
}
details.section > summary::-webkit-details-marker{ display:none; }
details.section > summary::before{ content:"▸"; color:var(--texte-doux); transition:transform 120ms ease; }
details.section[open] > summary::before{ transform:rotate(90deg); }
details.section > summary .compte{ margin-left:auto; font-size:.8rem; font-weight:600; color:var(--texte-doux); }
details.section .contenu{ padding:0 .75rem .75rem; }
.calendrier .periode-achat{ background:var(--surface-2); border-radius:var(--r); padding:.5rem .6rem; }
.calendrier .periode-ligne{ display:flex; align-items:center; gap:.4rem; }
.calendrier .periode-nom{ flex:1 1 auto; text-align:center; font-weight:650; font-size:1rem; }
.grille-mois{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.grille-mois .entete-jour{ text-align:center; font-size:.7rem; font-weight:700; color:var(--texte-doux);
  text-transform:uppercase; letter-spacing:.03em; padding:.2rem 0; }
.case-jour{
  position:relative; min-height:46px; border:1px solid var(--border); border-radius:8px;
  background:var(--surface); color:var(--texte); font:inherit; cursor:pointer; padding:.2rem 0 .1rem;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:1px;
  transition:background-color 120ms ease, border-color 120ms ease;
}
.case-jour:hover{ border-color:var(--border-fort); }
.case-jour .num{ font-size:.85rem; font-weight:600; line-height:1.1; }
.case-jour .points{ font-size:.7rem; color:var(--accent); line-height:1; letter-spacing:1px; }
.case-jour.hors-mois{ opacity:.42; }
.case-jour.dans-periode{ background:var(--accent-doux); border-color:transparent; }
.case-jour.aujourdhui .num{ text-decoration:underline; text-underline-offset:2px; }
.case-jour.ouvert{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.jour-ouvert{ margin-top:.5rem; }
/* La navigation de période prend l'espace laissé libre, pour que le libellé
   s'affiche en entier plutôt que d'être tronqué à côté d'un vide. */
.nav-periode{ display:flex; align-items:center; gap:.15rem; min-width:0; flex:1 1 auto; }
/* La règle du navigateur pour [hidden] ne fait pas le poids face à un
   display:flex d'auteur : il faut la redire ici, sans quoi masquer la
   navigation de période depuis le script reste sans effet. */
.nav-periode[hidden]{ display:none; }
.nav-periode .fleche{
  flex:0 0 auto; width:32px; height:36px; padding:0; border:0; background:none;
  color:var(--texte-doux); font:inherit; font-size:1.2rem; line-height:1; cursor:pointer;
  border-radius:8px;
}
.nav-periode .fleche:hover{ background:var(--bg-alt); color:var(--texte); }
.bouton-calendrier{
  flex:1 1 auto; justify-content:center; display:inline-flex; align-items:center; gap:.3rem;
  background:var(--bg-alt); border:1px solid var(--border); border-radius:999px;
  padding:.2rem .6rem; min-height:36px; cursor:pointer; font:inherit; font-size:.82rem;
  font-weight:600; color:var(--texte); max-width:58%;
}
.bouton-calendrier:hover{ border-color:var(--border-fort); }
.bouton-calendrier .periode{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ligne-espace{ display:flex; align-items:center; gap:.5rem; padding:.4rem 0; border-top:1px solid var(--border); }
.ligne-espace:first-child{ border-top:0; }
.ligne-espace .nom{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.ligne-espace .actuel{ font-weight:700; color:var(--accent); }
main{
  flex:1; width:100%; max-width:960px; margin:0 auto;
  padding:.75rem .75rem calc(84px + env(safe-area-inset-bottom));
}
.vue{ display:none; }
.vue.actif{ display:block; }

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1; min-height:56px; border:0; background:none; color:var(--texte-doux);
  font:inherit; font-size:.78rem; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:.25rem; transition:color 120ms ease, background-color 120ms ease;
}
.tabbar button .ic{ font-size:1.15rem; line-height:1; }
.tabbar button[aria-current="page"]{ color:var(--accent); font-weight:650; background:var(--accent-doux); }

@media (min-width:900px){
  #app{ flex-direction:row; }
  .tabbar{
    position:sticky; top:0; bottom:auto; height:100dvh; width:210px; flex:0 0 210px;
    flex-direction:column; border-top:0; border-right:1px solid var(--border);
    padding:.75rem .5rem; gap:.25rem; align-items:stretch;
  }
  .tabbar button{ flex:0 0 auto; min-height:46px; flex-direction:row; justify-content:flex-start;
    gap:.6rem; font-size:.95rem; padding:0 .75rem; border-radius:var(--r); }
  .colonne-principale{ flex:1; min-width:0; display:flex; flex-direction:column; }
  main{ padding-bottom:2rem; }
  .topbar{ padding-top:.5rem; }
}

/* ——— COMPOSANTS ——— */
.carte{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:.75rem; margin-bottom:.6rem; box-shadow:var(--ombre);
}
.carte.plate{ box-shadow:none; }
.section-titre{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;
  color:var(--texte-doux); font-weight:700; margin:1rem 0 .4rem; }
.doux{ color:var(--texte-doux); }
.pt{ font-size:.85rem; }
.tpt{ font-size:.78rem; }
.gras{ font-weight:650; }
.rien{ color:var(--texte-doux); padding:1.25rem .5rem; text-align:center; }

.btn{
  font:inherit; font-size:.92rem; font-weight:600; cursor:pointer;
  background:var(--surface-2); color:var(--texte);
  border:1px solid var(--border-fort); border-radius:var(--r);
  padding:.5rem .75rem; min-height:var(--tap);
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  transition:background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
}
.btn:hover{ background:var(--bg-alt); }
.btn:active{ opacity:.75; }
.btn.principal{ background:var(--accent); color:var(--accent-texte); border-color:var(--accent); }
.btn.principal:hover{ filter:brightness(1.08); }
.btn.danger{ color:var(--danger); border-color:var(--danger); background:var(--danger-doux); }
.btn.mini{ min-height:34px; padding:.2rem .5rem; font-size:.82rem; border-radius:8px; }
.btn.fantome{ background:transparent; border-color:transparent; }
.btn.fantome:hover{ background:var(--bg-alt); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.barre-actions{ display:flex; flex-wrap:wrap; gap:.4rem; }

input,select,textarea{
  font:inherit; font-size:16px; color:var(--texte); background:var(--surface);
  border:1px solid var(--border-fort); border-radius:8px; padding:.45rem .55rem;
  min-height:var(--tap); width:100%; max-width:100%;
}
textarea{ min-height:80px; resize:vertical; line-height:1.4; }
label.champ{ display:block; margin-bottom:.6rem; }
label.champ > span{ display:block; font-size:.82rem; font-weight:600; color:var(--texte-doux); margin-bottom:.2rem; }
.ligne-champs{ display:flex; gap:.5rem; flex-wrap:wrap; }
.ligne-champs > *{ flex:1 1 140px; min-width:0; }
.inline-case{ display:inline-flex; align-items:center; gap:.4rem; min-height:var(--tap); cursor:pointer; }
.inline-case input[type="checkbox"]{ width:22px; height:22px; min-height:0; flex:0 0 auto; accent-color:var(--accent); }

.puce{
  display:inline-flex; align-items:center; gap:.25rem;
  background:var(--bg-alt); border:1px solid var(--border); color:var(--texte-doux);
  border-radius:999px; padding:.1rem .5rem; font-size:.75rem; font-weight:600; white-space:nowrap;
}
.puce.accent{ background:var(--accent-doux); border-color:transparent; color:var(--accent); }
.puce.alerte{ background:var(--danger-doux); border-color:transparent; color:var(--danger); }
.puce-bouton{ cursor:pointer; }
.puce-bouton:hover{ border-color:var(--border-fort); }

.recherche{ display:flex; gap:.4rem; align-items:center; margin-bottom:.6rem; flex-wrap:wrap; }
.recherche input[type="search"]{ flex:1 1 180px; }

/* ——— SEMAINE ——— */
.grille-recettes{ display:grid; gap:.6rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:640px){ .grille-recettes{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.carte-recette{ display:block; }
.carte-recette .entete-carte{ display:flex; align-items:center; gap:.5rem; }
.carte-recette .infos{ flex:1 1 auto; min-width:0; }
.carte-recette.selectionnee{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--border-fort); border-radius:999px; overflow:hidden; background:var(--surface); }
.stepper button{ border:0; background:none; color:var(--texte); font:inherit; font-size:1.15rem; font-weight:700;
  width:var(--tap); height:var(--tap); cursor:pointer; line-height:1; }
.stepper button:hover{ background:var(--bg-alt); }
.stepper .valeur{ min-width:62px; text-align:center; font-size:.85rem; font-weight:650; padding:0 .2rem; }
.recap{ position:sticky; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:20; padding:.5rem .6rem; }
.recap .ligne-resume{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
.recap .bascule{ flex:1 1 180px; min-width:0; display:flex; align-items:center; gap:.4rem;
  background:none; border:0; padding:.2rem 0; min-height:40px; cursor:pointer;
  font:inherit; font-weight:650; font-size:.95rem; color:var(--texte); text-align:left; }
.recap .resume{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.recap .resume .cout{ color:var(--accent); }
.recap .chevron{ flex:0 0 auto; color:var(--texte-doux); transition:transform 120ms ease; }
.recap .bascule[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
.recap .actions-recap{ flex:0 0 auto; min-height:40px; }
.recap .detail[hidden]{ display:none; }
.recap .detail{ border-top:1px solid var(--border); margin-top:.4rem; padding-top:.4rem; }
.recap .detail ul{ margin:.1rem 0 .4rem; padding-left:1.1rem; font-size:.9rem; }
.recap .actions-recap{ margin-top:.45rem; }
/* Une recette déjà retenue doit se faire discrète, pas prendre plus de place. */
.carte-recette{ padding:.55rem .6rem; }
.carte-recette .meta{ font-size:.8rem; color:var(--texte-doux); display:flex; flex-wrap:wrap;
  gap:.3rem; align-items:center; margin-top:.1rem; }
.carte-recette .faits{ overflow-wrap:anywhere; }
.carte-recette .actions-carte{ display:flex; align-items:center; gap:.15rem; flex:0 0 auto; }
.carte-recette .retirer{ width:32px; height:32px; min-height:0; padding:0; border-radius:8px;
  font-size:1rem; line-height:1; color:var(--texte-doux); }
.carte-recette .retirer:hover{ color:var(--danger); }
.carte-recette .ajouter{ min-height:36px; width:46px; padding:0; }
/* Choisir le jour d'un repas sans ouvrir le calendrier. Au-delà de sept jours
   la rangée défile plutôt que de rétrécir les cibles tactiles. */
.rangee-jours{ display:flex; gap:.2rem; margin-top:.3rem; min-width:0; overflow-x:auto; padding-bottom:2px; }
.puce-jour{
  flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; font:inherit; line-height:1.05; padding:.1rem .25rem;
  background:var(--surface); border:1px solid var(--border-fort); color:var(--texte-doux);
  border-radius:8px; min-width:34px; min-height:32px;
  transition:background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.puce-jour .l{ font-size:.78rem; font-weight:700; }
.puce-jour .n{ font-size:.62rem; }
.puce-jour:hover{ background:var(--bg-alt); color:var(--texte); }
.puce-jour[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-texte); }
.stepper.compact button{ width:36px; height:36px; font-size:1.05rem; }
.stepper.compact .valeur{ min-width:28px; font-size:.9rem; }
.barre-portions{
  display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:.4rem .6rem; margin-bottom:.6rem;
}
.barre-portions .libelle{ font-weight:650; font-size:.95rem; flex:1 1 120px; min-width:0; }
.filtres{ display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; margin-bottom:.6rem; }
.puce-filtre{
  display:inline-flex; align-items:center; gap:.25rem; cursor:pointer; font:inherit;
  background:var(--surface); border:1px solid var(--border-fort); color:var(--texte);
  border-radius:999px; padding:.3rem .7rem; font-size:.82rem; font-weight:600;
  min-height:40px; white-space:nowrap;
  transition:background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.puce-filtre:hover{ background:var(--bg-alt); }
.puce-filtre[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-texte); }
.filtres .separateur{ width:1px; align-self:stretch; background:var(--border); margin:.2rem .15rem; }
/* Le nom d'une recette ouvre sa fiche : il faut que ça se voie, et au clavier aussi. */
.carte-recette .nom{
  font-weight:650; overflow-wrap:anywhere; text-align:left; font:inherit; font-weight:650;
  background:none; border:0; padding:0; color:var(--texte); cursor:pointer;
  display:inline-flex; align-items:baseline; gap:.35rem;
}
.carte-recette .nom:hover{ color:var(--accent); text-decoration:underline; }
.carte-recette .nom .loupe{ font-size:.8em; color:var(--texte-doux); }
.apercu-fiche ul{ margin:.3rem 0 .6rem; padding-left:1.15rem; }
.apercu-fiche .notes{ white-space:pre-wrap; background:var(--surface-2); border-radius:8px; padding:.5rem .6rem; font-size:.92rem; }
@media (min-width:900px){ .recap{ bottom:.75rem; } }

/* ——— RELECTURE D'UN COLLAGE ——— */
.relecture{ display:flex; flex-direction:column; gap:.4rem; }
.rang-relecture{ display:flex; align-items:flex-start; gap:.5rem;
  border-top:1px solid var(--border); padding-top:.4rem; }
.rang-relecture:first-of-type{ border-top:0; padding-top:0; }
.rang-relecture.ecarte{ opacity:.45; }
.rang-relecture .champs{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.25rem; }
.rang-relecture .haut{ display:flex; align-items:center; gap:.35rem; min-width:0; }
.rang-relecture .haut input{ flex:1 1 auto; min-width:0; }
.rang-relecture .haut .puce{ flex:0 0 auto; }
.rang-relecture .bas{ display:flex; gap:.35rem; }

/* ——— PLUS (tableau de bord) ——— */
.grille-hub{ display:grid; gap:.5rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:640px){ .grille-hub{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.tuile-hub{
  display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; cursor:pointer;
  font:inherit; color:var(--texte); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); padding:.85rem .8rem; min-height:66px;
  transition:border-color 120ms ease, background-color 120ms ease;
}
.tuile-hub:hover{ border-color:var(--accent); background:var(--bg-alt); }
.tuile-hub .ic{ font-size:1.5rem; line-height:1; flex:0 0 auto; }
.tuile-hub .txt{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.1rem; }
.tuile-hub .titre{ font-weight:650; }
.tuile-hub .resume{ font-size:.82rem; color:var(--texte-doux); overflow-wrap:anywhere; }
.tuile-hub .chev{ flex:0 0 auto; color:var(--texte-doux); font-size:1.2rem; }
.retour-hub{ margin-bottom:.6rem; }

/* ——— LISTE ——— */
.entete-liste{
  position:sticky; z-index:25; top:var(--h-topbar, 0px);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:.5rem .7rem; margin:-.1rem 0 .6rem; box-shadow:var(--ombre);
  font-size:1.02rem; font-weight:650; display:flex; flex-wrap:wrap; gap:.15rem .5rem; align-items:baseline;
}
@media (min-width:900px){ .entete-liste{ top:calc(var(--h-topbar, 0px) + .25rem); } }
.entete-liste .reste{ color:var(--accent); }
.rayon{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:.6rem; overflow:hidden; }
.rayon > summary{
  cursor:pointer; list-style:none; padding:.6rem .7rem; font-weight:700; font-size:.9rem;
  text-transform:uppercase; letter-spacing:.04em; color:var(--texte-doux);
  background:var(--surface-2); display:flex; align-items:center; gap:.5rem; min-height:44px;
}
.rayon > summary::-webkit-details-marker{ display:none; }
.rayon > summary .compte{ margin-left:auto; font-weight:600; letter-spacing:0; text-transform:none; font-size:.82rem; }
.rayon > summary::before{ content:"▸"; transition:transform 120ms ease; display:inline-block; }
.rayon[open] > summary::before{ transform:rotate(90deg); }
.article{
  display:flex; align-items:flex-start; gap:.1rem; border-top:1px solid var(--border);
  font-size:17px;
}
.article .case{
  flex:0 0 auto; width:52px; min-height:52px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:none; border:0; padding:0;
}
.article .case input[type="checkbox"]{ width:26px; height:26px; min-height:0; accent-color:var(--accent); cursor:pointer; }
.article .corps{
  flex:1; min-width:0; text-align:left; background:none; border:0; color:inherit; font:inherit; font-size:17px;
  padding:.55rem .5rem .55rem 0; cursor:pointer;
  display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap;
}
.article .nom{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.article .qte{ font-weight:650; white-space:nowrap; }
.article .prix{ color:var(--texte-doux); font-size:.85rem; white-space:nowrap; }
.article.coche{ background:var(--surface-2); }
.article.coche .nom,.article.coche .qte{ text-decoration:line-through; color:var(--texte-doux); font-weight:400; }
.detail-provenance{ padding:0 .6rem .6rem 52px; font-size:.85rem; color:var(--texte-doux); border-top:0; background:var(--surface-2); }
.detail-provenance ul{ margin:.2rem 0 0; padding-left:1.1rem; }
.ajout-manuel{ display:flex; gap:.4rem; flex-wrap:wrap; }
.ajout-manuel input{ flex:1 1 160px; }

/* ——— RECETTES ——— */
.lignes-ing{ display:flex; flex-direction:column; gap:.4rem; }
.ligne-ing{ display:grid; gap:.35rem; grid-template-columns:1fr; align-items:start;
  border:1px solid var(--border); border-radius:8px; padding:.45rem; background:var(--surface-2); }
@media (min-width:560px){
  .ligne-ing{ grid-template-columns: minmax(0,1fr) 92px 110px auto auto; align-items:center; }
  .ligne-ing .zone-fixe .btn.mini{ padding:.2rem .3rem; }
}
.ligne-ing .zone-fixe{ display:flex; align-items:center; }
.editeur{ display:grid; gap:0 .6rem; grid-template-columns:1fr; align-items:start; }
@media (min-width:1000px){
  .editeur{ grid-template-columns:minmax(0,1fr) 290px; }
  .col-apercu{ position:sticky; top:calc(var(--h-topbar, 0px) + .5rem); }
}
.apercu{ background:var(--accent-doux); border-color:transparent; }
.apercu ul{ margin:.3rem 0 0; padding-left:1.15rem; }
.avert{ background:var(--danger-doux); color:var(--danger); border:1px solid transparent;
  border-radius:8px; padding:.5rem .65rem; font-size:.88rem; font-weight:600; }
.rappel{ background:var(--accent-doux); color:var(--accent); border-radius:8px;
  padding:.5rem .65rem; font-size:.9rem; font-weight:700; margin-bottom:.6rem; }

/* ——— AUTOCOMPLÉTION ——— */
.ac-boite{ position:relative; }
.ac-liste{
  position:absolute; z-index:60; left:0; right:0; top:calc(100% + 2px);
  background:var(--surface); border:1px solid var(--border-fort); border-radius:8px;
  box-shadow:var(--ombre); max-height:240px; overflow:auto; padding:.2rem;
}
.ac-liste[hidden]{ display:none; }
.ac-item{ padding:.5rem .55rem; border-radius:6px; cursor:pointer; font-size:.95rem; min-height:40px;
  display:flex; align-items:center; gap:.4rem; }
.ac-item .sec{ margin-left:auto; font-size:.75rem; color:var(--texte-doux); }
.ac-item.actif{ background:var(--accent-doux); color:var(--accent); }
.ac-item.creer{ font-weight:650; }

/* ——— TABLEAUX (référentiel) ——— */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); }
table.ref{ border-collapse:collapse; width:100%; min-width:1040px; table-layout:fixed; font-size:.9rem; }
table.ref th,table.ref td{ border-bottom:1px solid var(--border); padding:.3rem .4rem; text-align:left; vertical-align:middle; }
table.ref th{ background:var(--surface-2); position:sticky; top:0; z-index:1; font-size:.78rem;
  text-transform:uppercase; letter-spacing:.04em; color:var(--texte-doux); cursor:pointer; white-space:nowrap; }
table.ref input,table.ref select{ min-height:36px; padding:.2rem .35rem; font-size:.88rem; min-width:0; }
/* Largeurs explicites : sans elles, prix et famille se retrouvent tronqués. */
table.ref th:nth-child(1),table.ref td:nth-child(1){ width:180px; }
table.ref th:nth-child(2),table.ref td:nth-child(2){ width:152px; }
table.ref th:nth-child(3),table.ref td:nth-child(3){ width:104px; }
table.ref th:nth-child(4),table.ref td:nth-child(4){ width:106px; }
table.ref th:nth-child(5),table.ref td:nth-child(5){ width:126px; }
table.ref th:nth-child(6),table.ref td:nth-child(6){ width:72px; text-align:center; }
table.ref th:nth-child(7),table.ref td:nth-child(7){ width:180px; }
table.ref .cellule-prix{ display:flex; align-items:center; gap:.25rem; }
table.ref .cellule-prix input{ flex:1 1 auto; }
table.ref .cellule-prix span{ flex:0 0 auto; font-size:.7rem; }
table.ref input[type="checkbox"]{ width:22px; height:22px; min-height:0; accent-color:var(--accent); }

.liste-ordre{ list-style:none; margin:0; padding:0; }
.liste-ordre li{
  display:flex; align-items:center; gap:.5rem; background:var(--surface);
  border:1px solid var(--border); border-radius:8px; padding:.3rem .5rem; margin-bottom:.3rem;
  min-height:var(--tap);
}
.liste-ordre li.survol{ border-color:var(--accent); background:var(--accent-doux); }
.liste-ordre li.drag{ opacity:.5; }
.liste-ordre .poignee{ cursor:grab; color:var(--texte-doux); font-size:1.1rem; touch-action:none; user-select:none; }
.liste-ordre .nom{ flex:1; min-width:0; }

/* ——— MODALES, BANDEAUX, TOASTS ——— */
.fond-modal{
  position:fixed; inset:0; z-index:100; background:rgba(8,10,14,.5);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
}
@media (min-width:640px){ .fond-modal{ align-items:center; padding:1rem; } }
.modal{
  background:var(--surface); color:var(--texte); width:100%; max-width:540px;
  border-radius:14px 14px 0 0; padding:1rem; max-height:92dvh; overflow:auto;
  box-shadow:0 -4px 30px rgba(0,0,0,.3); border:1px solid var(--border);
  padding-bottom:calc(1rem + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .modal{ border-radius:14px; padding-bottom:1rem; } }
.modal h2{ margin-top:0; }
.modal .actions{ display:flex; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; margin-top:1rem; }
.modal .actions .btn{ flex:1 1 auto; }
@media (min-width:640px){ .modal .actions .btn{ flex:0 0 auto; } }

#zone-toasts{
  position:fixed; z-index:110; left:.5rem; right:.5rem; bottom:calc(72px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.4rem; align-items:center; pointer-events:none;
}
@media (min-width:900px){ #zone-toasts{ bottom:1rem; left:auto; right:1rem; align-items:flex-end; } }
.toast{
  pointer-events:auto; background:var(--texte); color:var(--bg);
  border-radius:var(--r); padding:.6rem .8rem; font-size:.92rem; font-weight:600;
  box-shadow:var(--ombre); display:flex; align-items:center; gap:.75rem; max-width:520px; width:100%;
}
.toast button{
  background:none; border:1px solid currentColor; color:inherit; font:inherit; font-weight:700;
  border-radius:8px; padding:.25rem .6rem; cursor:pointer; min-height:36px; white-space:nowrap;
}
#bandeau-degrade{
  background:var(--danger-doux); color:var(--danger); border-bottom:1px solid var(--danger);
  padding:.5rem .75rem; font-size:.88rem; font-weight:600;
}
#bandeau-degrade[hidden]{ display:none; }
.bandeau-exemple{
  background:var(--accent-doux); border:1px solid transparent; color:var(--accent);
  border-radius:var(--r); padding:.6rem .7rem; margin-bottom:.6rem;
  display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.9rem; font-weight:600;
}
.bandeau-exemple span{ flex:1 1 200px; }

/* ——— BARRE DE TITRE : AJUSTEMENTS RESPONSIVES ———
   Placés après les composants qu'ils ajustent : à spécificité égale, c'est
   la dernière règle qui l'emporte. */
@media (max-width:899px){
  /* La barre du bas nomme déjà l'onglet actif : le titre y ferait double
     emploi et écraserait les boutons. Retiré de l'affichage, pas du document. */
  .topbar .titre{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; flex:0 0 0;
  }
  .topbar{ justify-content:space-between; }
  .bouton-espace{ max-width:40%; }
  /* Sans espace partagé, « Cet appareil » est l'état par défaut : la pastille
     suffit, et la place revient au libellé de période. */
  .bouton-espace.sans-espace .nom-espace{
    position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);
  }
  .bouton-espace.sans-espace{ padding:.2rem .5rem; }
}
@media (min-width:900px){
  /* Le titre peut s'étirer, la période non : elle doit rester lisible. */
  .nav-periode{ flex:0 0 auto; }
  .bouton-calendrier{ flex:0 0 auto; max-width:none; }
}

/* ——— IMPRESSION ——— */
@media print{
  body{ background:#fff; color:#000; }
  .topbar,.tabbar,#zone-toasts,.ajout-manuel,.barre-actions,#bandeau-degrade{ display:none !important; }
  main{ padding:0; max-width:none; }
  .vue{ display:none !important; }
  .vue.actif{ display:block !important; }
  .rayon{ break-inside:avoid; border:1px solid #999; }
  .rayon > summary{ background:#eee; color:#000; }
  .article{ font-size:12pt; border-top:1px solid #ccc; }
  .article.coche .nom,.article.coche .qte{ color:#666; }
  .detail-provenance{ display:none; }
}
</style>
</head>
<body>
<div id="app">
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <button type="button" data-tab="semaine" aria-current="page"><span class="ic" aria-hidden="true">🗓️</span>Semaine</button>
    <button type="button" data-tab="liste"><span class="ic" aria-hidden="true">🛒</span>Liste</button>
    <button type="button" data-tab="recettes"><span class="ic" aria-hidden="true">📖</span>Recettes</button>
    <button type="button" data-tab="plus"><span class="ic" aria-hidden="true">⋯</span>Plus</button>
  </nav>
  <div class="colonne-principale">
    <div id="bandeau-degrade" hidden role="status"></div>
    <header class="topbar">
      <h1 class="titre" id="titre-page">Semaine</h1>
      <div class="nav-periode" id="nav-periode">
        <button type="button" class="fleche" id="periode-avant" aria-label="Période précédente">‹</button>
        <button type="button" class="bouton-calendrier" id="bouton-calendrier" title="Planifier les repas et choisir la période d'achat">
          <span aria-hidden="true">🗓</span>
          <span class="periode" id="libelle-periode">Semaine</span>
        </button>
        <button type="button" class="fleche" id="periode-apres" aria-label="Période suivante">›</button>
      </div>
      <button type="button" class="bouton-espace" id="bouton-espace" hidden>
        <span class="pastille" id="pastille-sync"></span>
        <span class="nom-espace" id="nom-espace">Cet appareil</span>
      </button>
    </header>
    <main>
      <section class="vue actif" id="vue-semaine" aria-label="Semaine"></section>
      <section class="vue" id="vue-liste" aria-label="Liste de courses"></section>
      <section class="vue" id="vue-recettes" aria-label="Recettes"></section>
      <section class="vue" id="vue-plus" aria-label="Plus"></section>
    </main>
  </div>
</div>
<div id="zone-toasts" aria-live="polite"></div>
<div id="racine-modale"></div>
<script>
"use strict";
/* =========================================================================
   Liste de courses — application autonome, un seul fichier, zéro dépendance.
   Sections : MODÈLE · STOCKAGE · CALCULS · OUTILS UI · VUES · DÉMARRAGE
   ========================================================================= */

/* ——— MODÈLE ——————————————————————————————————————————————————————————— */

const SCHEMA_VERSION = 2;

const RAYONS = [
  ['fruits_legumes', 'Fruits & légumes'],
  ['boucherie',      'Boucherie / Volaille'],
  ['poissonnerie',   'Poissonnerie'],
  ['cremerie',       'Crèmerie & œufs'],
  ['charcuterie',    'Charcuterie / Traiteur'],
  ['epicerie_salee', 'Épicerie salée'],
  ['epicerie_sucree','Épicerie sucrée'],
  ['pain',           'Pain & viennoiserie'],
  ['surgeles',       'Surgelés'],
  ['boissons',       'Boissons'],
  ['hygiene',        'Hygiène & entretien'],
  ['autre',          'Autre'],
];
const RAYON_LIBELLE = Object.fromEntries(RAYONS);
const RAYONS_IDS = RAYONS.map(function (r) { return r[0]; });
const ORDRE_RAYONS_DEFAUT = RAYONS_IDS.slice();

// Unités acceptées par famille, avec leur facteur vers l'unité de base.
// masse → base : le gramme. volume → base : le millilitre. piece → base : la pièce.
const UNITES = {
  masse:  [ { u: 'g',  f: 1 }, { u: 'kg', f: 1000 } ],
  volume: [ { u: 'ml', f: 1 }, { u: 'cl', f: 10 }, { u: 'dl', f: 100 }, { u: 'L', f: 1000 },
            { u: 'c. à soupe', f: 15 }, { u: 'c. à café', f: 5 } ],
  piece:  [],   // une seule unité, portée par l'ingrédient (unitePiece)
};
const FAMILLES = [
  ['masse',  'Masse (g, kg)'],
  ['volume', 'Volume (ml, cl, dl, L, cuillères)'],
  ['piece',  'Pièce (pièce, gousse, botte…)'],
];
const FAMILLE_COURT = { masse: 'masse', volume: 'volume', piece: 'pièce' };
// Saisons météorologiques : elles collent au calendrier des marchés mieux que
// les saisons astronomiques, et tombent sur des mois entiers.
const SAISONS = [['printemps', 'Printemps'], ['ete', 'Été'], ['automne', 'Automne'], ['hiver', 'Hiver']];
const SAISON_LIBELLE = Object.fromEntries(SAISONS);
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS_COURTS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const JOURS_LONGS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
// Rayons dont le contenu ne se garde pas : ils motivent l'avertissement quand
// la période d'achat dépasse la semaine.
const RAYONS_FRAIS = ['fruits_legumes', 'boucherie', 'poissonnerie', 'cremerie', 'charcuterie'];
// Un plat se sert chaud ou froid. Ça ne se déduit d'aucune autre donnée, et
// c'est la question qu'on se pose vraiment au moment de composer la semaine.
const TEMPERATURES = [['chaud', 'Chaud'], ['froid', 'Froid']];
const TEMPERATURE_LIBELLE = Object.fromEntries(TEMPERATURES);
const UNITES_PIECE_SUGGEREES = ['pièce', 'gousse', 'botte', 'tranche', 'pincée', 'brin', 'feuille', 'sachet', 'boîte', 'tige'];
const PAR_PRIX_PAR_FAMILLE = { masse: 'kg', volume: 'L', piece: 'piece' };
const PAR_PRIX_LIBELLE = { kg: '€/kg', L: '€/L', piece: '€/pièce' };

/** Saison d'une date. → 'printemps' | 'ete' | 'automne' | 'hiver' */
function saisonDe(date) {
  const m = (date || new Date()).getMonth();
  if (m >= 2 && m <= 4) return 'printemps';
  if (m >= 5 && m <= 7) return 'ete';
  if (m >= 8 && m <= 10) return 'automne';
  return 'hiver';
}

/* --- Dates : tout est manipulé en 'aaaa-mm-jj', jamais en horodatage. --- */
function isoDuJour(date) {
  const p = function (n) { return String(n).padStart(2, '0'); };
  return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
}
function dateDepuisISO(iso) {
  const d = new Date(String(iso) + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function ajouterJours(date, n) {
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + n);
  return d;
}
/** Lundi de la semaine contenant cette date. La semaine française commence lundi. */
function lundiDe(date) {
  const d = new Date(date.getTime());
  d.setHours(0, 0, 0, 0);
  return ajouterJours(d, -((d.getDay() + 6) % 7));
}
function periodeSemaineCourante() {
  const l = lundiDe(new Date());
  return { debut: isoDuJour(l), fin: isoDuJour(ajouterJours(l, 6)) };
}
/** Toutes les dates d'une période, bornes comprises. */
function joursDeLaPeriode(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f || f < d) return [];
  const sortie = [];
  for (let c = d; c <= f && sortie.length < 400; c = ajouterJours(c, 1)) sortie.push(isoDuJour(c));
  return sortie;
}
function nbJoursPeriode(periode) { return joursDeLaPeriode(periode).length; }
function dansLaPeriode(iso, periode) {
  return !!iso && iso >= periode.debut && iso <= periode.fin;
}
function libelleDePeriode(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f) return 'Période';
  const n = nbJoursPeriode(periode);
  if (n === 7 && d.getDay() === 1) return 'Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()];
  if (periode.debut === periode.fin) return d.getDate() + ' ' + MOIS[d.getMonth()];
  if (d.getMonth() === f.getMonth()) return 'Du ' + d.getDate() + ' au ' + f.getDate() + ' ' + MOIS[f.getMonth()];
  return 'Du ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' au ' + f.getDate() + ' ' + MOIS[f.getMonth()];
}

/** Version abrégée, pour la barre de titre d'un téléphone. */
function libelleDePeriodeCourt(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f) return 'Période';
  const n = nbJoursPeriode(periode);
  if (n === 7 && d.getDay() === 1) return 'Sem. du ' + d.getDate() + ' ' + MOIS_COURTS[d.getMonth()];
  if (periode.debut === periode.fin) return d.getDate() + ' ' + MOIS_COURTS[d.getMonth()];
  if (d.getMonth() === f.getMonth()) return d.getDate() + '–' + f.getDate() + ' ' + MOIS_COURTS[f.getMonth()];
  return d.getDate() + ' ' + MOIS_COURTS[d.getMonth()] + ' – ' + f.getDate() + ' ' + MOIS_COURTS[f.getMonth()];
}

function aujourdHuiISO() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function slug(txt) {
  return String(txt || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 32) || 'x';
}
function suffixeCourt() {
  return Math.random().toString(36).slice(2, 6);
}
// Identifiants stables et lisibles : préfixe + slug + suffixe aléatoire court.
function genererId(prefixe, nom) {
  return prefixe + '_' + slug(nom) + '_' + suffixeCourt();
}

function donneesVides() {
  return {
    schemaVersion: SCHEMA_VERSION,
    ingredients: [],
    recettes: [],
    semaine: {
      libelle: libelleSemaineCourante(),
      periode: periodeSemaineCourante(),
      selection: [],
      coches: {},
      ajoutsManuels: [],
      dateModification: new Date().toISOString(),
    },
    historique: [],
    semainesTypes: [],
    reglages: {
      ordreRayons: ORDRE_RAYONS_DEFAUT.slice(),
      afficherPrix: true,
      theme: 'auto',
      portionsBase: 4,
      serveurSync: '',
    },
  };
}

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function libelleSemaineCourante() {
  // Lundi de la semaine en cours.
  const d = new Date();
  const jour = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - jour);
  return 'Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()];
}

/* --- Jeu de données d'exemple (effaçable en un clic au premier lancement) --- */
const IDS_EXEMPLE_RECETTES = ['rec_chili', 'rec_ratatouille', 'rec_pates_pesto'];

function ing(id, nom, rayon, famille, opts) {
  opts = opts || {};
  return {
    id: id, nom: nom, aliases: opts.aliases || [], rayon: rayon, famille: famille,
    unitePiece: famille === 'piece' ? (opts.unitePiece || 'pièce') : null,
    prix: opts.prix === undefined ? { valeur: null, par: PAR_PRIX_PAR_FAMILLE[famille] } : opts.prix,
    placard: !!opts.placard,
  };
}
