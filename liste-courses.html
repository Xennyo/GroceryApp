    });
    const filtre = etat.filtreTempsMax || etat.filtreTemperature || etat.tagFiltre || etat.rechercheRecettes.trim();
    if (filtre) {
      zoneFiltres.appendChild(el('span', { class: 'tpt doux', style: 'margin-left:.2rem',
        text: nbTrouvees + ' recette' + (nbTrouvees > 1 ? 's' : '') + ' sur ' + D.recettes.length }));
      zoneFiltres.appendChild(el('button', {
        type: 'button', class: 'btn mini fantome', text: 'Tout afficher',
        onclick: function () {
          etat.filtreTempsMax = 0; etat.filtreTemperature = ''; etat.tagFiltre = ''; etat.rechercheRecettes = '';
          champRecherche.value = ''; selectTag.value = '';
          remplirCartes();
        },
      }));
    }
  }

  function remplirCartes() {
    grille.innerHTML = '';

    if (!D.recettes.length) {
      remplirFiltres(0);
      grille.appendChild(el('div', { class: 'rien' }, [
        el('p', { text: 'Aucune recette pour l\'instant.' }),
        el('button', { type: 'button', class: 'btn principal', text: 'Créer ma première recette', onclick: function () { allerA('recettes'); ouvrirEditeurRecette(null); } }),
      ]));
      return;
    }

    const criteres = {
      texte: etat.rechercheRecettes,
      tag: etat.tagFiltre,
      tempsMax: etat.filtreTempsMax,
      temperature: etat.filtreTemperature,
    };
    const trouvees = filtrerRecettes(D, criteres).sort(function (a, b) {
      const sa = selectionDe(a.recette.id) ? 0 : 1, sb = selectionDe(b.recette.id) ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return a.recette.nom.localeCompare(b.recette.nom, 'fr');
    });
    remplirFiltres(trouvees.length);

    const nonClassees = recettesNonClassees(D, criteres);
    if (nonClassees.length) {
      grille.appendChild(el('div', { class: 'carte plate tpt doux', style: 'margin-bottom:.2rem' }, [
        el('span', { text: nonClassees.length + ' recette' + (nonClassees.length > 1 ? 's ne sont pas classées' : ' n\'est pas classée') +
          ' chaud / froid et n\'apparaî' + (nonClassees.length > 1 ? 'ssent' : 't') + ' donc pas : ' +
          nonClassees.slice(0, 4).map(function (r) { return r.nom; }).join(', ') + (nonClassees.length > 4 ? '…' : '') + '.' }),
      ]));
    }
    if (!trouvees.length) {
      grille.appendChild(el('div', { class: 'rien', text: 'Aucune recette ne correspond à ces critères.' }));
      return;
    }

    trouvees.forEach(function (t) {
      const r = t.recette;
      const sel = selectionDe(r.id);
      const c = coutRecette(D, r, sel ? sel.portions : D.reglages.portionsBase);
      const fraicheur = texteFraicheur(r.derniereUtilisation);

      const meta = el('div', { class: 'meta' });
      if (r.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: r.tempsPreparationMin + ' min' }));
      if (r.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[r.temperature] }));
      r.tags.forEach(function (tag) { meta.appendChild(el('span', { class: 'puce', text: tag })); });
      if (afficherPrix() && c.total > 0) {
        meta.appendChild(el('span', { class: 'puce', text: formatEuroFixe(c.parPortion) + ' / portion' }));
      }
      if (fraicheur) meta.appendChild(el('span', { class: 'puce alerte', text: fraicheur }));
      // On dit pourquoi la recette ressort quand c'est un ingrédient qui a fait mouche.
      if (t.ingredientsTrouves.length) {
        meta.appendChild(el('span', { class: 'puce accent', text: 'contient : ' + t.ingredientsTrouves.join(', ') }));
      }

      const nom = el('button', { type: 'button', class: 'nom' }, [
        el('span', { text: r.nom }),
        el('span', { class: 'loupe', 'aria-hidden': 'true', text: '›' }),
      ]);
      nom.setAttribute('aria-label', 'Voir la fiche de ' + r.nom);
      nom.addEventListener('click', function () { apercuRecette(r); });

      const action = sel
        ? el('div', { style: 'display:flex;flex-direction:column;gap:.3rem;align-items:flex-end' }, [
            el('div', { class: 'stepper' }, [
              el('button', { type: 'button', text: '−', 'aria-label': 'Moins de portions', onclick: function () { changerPortions(r.id, -1); } }),
              el('span', { class: 'valeur', text: sel.portions + ' port.' }),
              el('button', { type: 'button', text: '+', 'aria-label': 'Plus de portions', onclick: function () { changerPortions(r.id, 1); } }),
            ]),
            el('button', { type: 'button', class: 'btn mini fantome', text: 'Retirer', onclick: function () { retirerDeSemaine(r.id); } }),
          ])
        : el('button', { type: 'button', class: 'btn principal', style: 'min-width:44px', text: '+', 'aria-label': 'Ajouter ' + r.nom + ' à la semaine', onclick: function () { ajouterASemaine(r); } });

      grille.appendChild(el('div', { class: 'carte carte-recette' + (sel ? ' selectionnee' : '') }, [
        el('div', { class: 'infos' }, [nom, meta]),
        action,
      ]));
    });
  }

  function remplirRecap() {
    recap.innerHTML = '';
    const sel = D.semaine.selection;
    const totalPortions = sel.reduce(function (a, s) { return a + s.portions; }, 0);
    const c = coutSelection(D, sel);
    recap.appendChild(el('h2', { text: 'Ma semaine' }));
    if (!sel.length) {
      recap.appendChild(el('p', { class: 'doux', text: 'Aucune recette retenue. Ajoutez-en avec le bouton « + ».' }));
      return;
    }
    const ul = el('ul', { class: 'pt', style: 'margin:.2rem 0 .5rem;padding-left:1.1rem' });
    sel.forEach(function (s) {
      const r = recetteParId(s.recetteId);
      if (r) ul.appendChild(el('li', { text: r.nom + ' — ' + s.portions + ' portions' }));
    });
    recap.appendChild(ul);
    recap.appendChild(el('div', { class: 'barre-actions', style: 'align-items:center;margin-bottom:.5rem' }, [
      el('span', { class: 'puce accent', text: sel.length + ' recette' + (sel.length > 1 ? 's' : '') }),
      el('span', { class: 'puce accent', text: totalPortions + ' portions' }),
      afficherPrix() ? el('span', { class: 'puce accent', text: texteTotal(c.total, c.sansPrix) }) : null,
    ]));
    if (afficherPrix()) {
      const evo = evolutionCout(c.total);
      if (evo) recap.appendChild(el('p', { class: 'tpt doux', text: evo }));
    }
    recap.appendChild(el('button', {
      type: 'button', class: 'btn principal', style: 'width:100%', text: 'Générer la liste',
      onclick: function () { allerA('liste'); },
    }));
  }

  remplirCartes();
  remplirRecap();
}

/**
 * Fiche de lecture rapide, sans quitter la composition de la semaine :
 * ce qu'il faut acheter pour le nombre de portions retenu, et les notes.
 */
function apercuRecette(recette) {
  const sel = selectionDe(recette.id);
  const portions = sel ? sel.portions : D.reglages.portionsBase;
  const corps = el('div', { class: 'apercu-fiche' });

  const meta = el('div', { class: 'barre-actions', style: 'margin-bottom:.5rem' });
  if (recette.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: recette.tempsPreparationMin + ' min' }));
  if (recette.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[recette.temperature] }));
  recette.tags.forEach(function (t) { meta.appendChild(el('span', { class: 'puce', text: t })); });
  const c = coutRecette(D, recette, portions);
  if (afficherPrix() && c.total > 0) {
    meta.appendChild(el('span', { class: 'puce accent', text: (c.sansPrix ? '≥ ' : '') + formatEuroFixe(c.parPortion) + ' / portion' }));
  }
  const fraicheur = texteFraicheur(recette.derniereUtilisation);
  if (fraicheur) meta.appendChild(el('span', { class: 'puce alerte', text: fraicheur }));
  else if (!recette.derniereUtilisation) meta.appendChild(el('span', { class: 'puce', text: 'jamais faite' }));
  corps.appendChild(meta);

  corps.appendChild(el('h3', { style: 'margin:.2rem 0 0', text: 'Pour ' + portions + ' portion' + (portions > 1 ? 's' : '') }));
  const agr = agregerSelection(D, [{ recetteId: recette.id, portions: portions }]);
  if (!agr.lignes.length) {
    corps.appendChild(el('p', { class: 'pt doux', text: 'Aucun ingrédient renseigné.' }));
  } else {
    const ordreSaisie = recette.lignes.map(function (l) { return l.ingredientId; });
    const ul = el('ul');
    agr.lignes.slice().sort(function (a, b) {
      return ordreSaisie.indexOf(a.ingredient.id) - ordreSaisie.indexOf(b.ingredient.id);
    }).forEach(function (l) {
      const fixe = recette.lignes.some(function (x) { return x.ingredientId === l.ingredient.id && x.fixe; });
      ul.appendChild(el('li', {
        text: formatQuantiteBase(l.base, l.ingredient) + ' ' + elision(minusculeInitiale(l.ingredient.nom)) + (fixe ? ' (fixe)' : ''),
      }));
    });
    corps.appendChild(ul);
  }
  if (recette.notes && recette.notes.trim()) {
    corps.appendChild(el('div', { class: 'notes', text: recette.notes }));
  }

  const actions = [
    { label: 'Fermer', onClick: function (f) { f(); } },
    { label: 'Modifier', onClick: function (f) { f(); allerA('recettes'); ouvrirEditeurRecette(recette); } },
  ];
  actions.push(sel
    ? { label: 'Retirer de la semaine', onClick: function (f) { f(); retirerDeSemaine(recette.id); } }
    : { label: 'Ajouter à la semaine', variant: 'principal', onClick: function (f) { f(); ajouterASemaine(recette); } });

  ouvrirModale({ titre: recette.nom, corps: [corps], actions: actions });
}

/**
 * Règle le nombre de portions de base. Il pré-remplit chaque ajout, et
 * s'applique aussi aux recettes déjà retenues — « ce soir on est six » ne doit
 * pas se ressaisir recette par recette. Annulable.
 */
async function changerPortionsBase(delta) {
  const avant = D.reglages.portionsBase;
  const apres = Math.max(1, Math.min(99, avant + delta));
  if (apres === avant) return;
  const selAvant = JSON.parse(JSON.stringify(D.semaine.selection));
  const defautsAvant = D.recettes.map(function (r) { return { id: r.id, p: r.portionsDefaut }; });

  D.reglages.portionsBase = apres;
  D.semaine.selection.forEach(function (s) {
    s.portions = apres;
    const r = recetteParId(s.recetteId);
    if (r) r.portionsDefaut = apres;
  });
  await sauvegarder();
  rendre();
  if (selAvant.length) {
    toast('Semaine passée à ' + apres + ' portions', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.reglages.portionsBase = avant;
        D.semaine.selection = selAvant;
        defautsAvant.forEach(function (x) { const r = recetteParId(x.id); if (r) r.portionsDefaut = x.p; });
        await sauvegarder();
        rendre();
      },
    });
  }
}

function evolutionCout(coutActuel) {
  const h = D.historique.filter(function (x) { return typeof x.coutEstime === 'number' && x.coutEstime > 0; });
  if (!h.length) return null;
  const precedent = h[0];
  const delta = coutActuel - precedent.coutEstime;
  const signe = delta >= 0 ? '+' : '−';
  return 'Semaine précédente (' + formatDateCourte(precedent.date) + ') : ' + formatEuroFixe(precedent.coutEstime) +
    ' · ' + signe + ' ' + formatEuroFixe(Math.abs(delta));
}

async function viderSemaine() {
  if (!D.semaine.selection.length && !D.semaine.ajoutsManuels.length) { toast('La semaine est déjà vide.'); return; }
  const ok = await confirmer({
    titre: 'Vider la semaine',
    message: 'La sélection en cours est archivée dans l\'historique, puis remise à zéro. Les recettes retenues sont marquées comme faites aujourd\'hui.',
    labelOk: 'Archiver et vider',
  });
  if (!ok) return;
  const ancienne = {
    selection: D.semaine.selection.slice(),
    coches: Object.assign({}, D.semaine.coches),
    ajoutsManuels: D.semaine.ajoutsManuels.slice(),
    libelle: D.semaine.libelle,
  };
  const ancienHistorique = D.historique.slice();
  const ancienneUtilisation = D.recettes.map(function (r) { return { id: r.id, d: r.derniereUtilisation }; });

  if (D.semaine.selection.length) {
    const c = coutSelection(D, D.semaine.selection);
    D.historique.unshift({
      date: aujourdHuiISO(), libelle: D.semaine.libelle,
      selection: D.semaine.selection.slice(), coutEstime: c.total,
    });
    D.historique = D.historique.slice(0, 60);
    const auj = aujourdHuiISO();
    D.semaine.selection.forEach(function (s) {
      const r = recetteParId(s.recetteId);
      if (r) r.derniereUtilisation = auj;
    });
  }
  D.semaine.selection = [];
  D.semaine.coches = {};
  D.semaine.ajoutsManuels = [];
  D.semaine.libelle = libelleSemaineCourante();
  await sauvegarder();
  rendre();
  toast('Semaine archivée et vidée', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = ancienne.selection;
      D.semaine.coches = ancienne.coches;
      D.semaine.ajoutsManuels = ancienne.ajoutsManuels;
      D.semaine.libelle = ancienne.libelle;
      D.historique = ancienHistorique;
      ancienneUtilisation.forEach(function (x) { const r = recetteParId(x.id); if (r) r.derniereUtilisation = x.d; });
      await sauvegarder();
      rendre();
    },
  });
}

/** Applique une semaine type : en complément de la sélection, ou à sa place. */
async function appliquerSemaineType(type, mode) {
  const idsConnus = new Set(D.recettes.map(function (r) { return r.id; }));
  const voulue = nettoyerSelection(type.selection, idsConnus);

  if (mode === 'remplacer') {
    const avant = D.semaine.selection.slice();
    const cochesAvant = Object.assign({}, D.semaine.coches);
    D.semaine.selection = voulue;
    D.semaine.coches = {};
    await sauvegarder();
    rendre();
    toast('« ' + type.nom +' » a remplacé la sélection', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.semaine.selection = avant; D.semaine.coches = cochesAvant;
        await sauvegarder(); rendre();
      },
    });
    return;
  }

  // Ajout : les recettes déjà retenues gardent le nombre de portions choisi.
  const ajoutees = [];
  let deja = 0;
  voulue.forEach(function (s) {
    if (selectionDe(s.recetteId)) { deja += 1; return; }
    D.semaine.selection.push(s);
    ajoutees.push(s.recetteId);
  });
  if (!ajoutees.length) {
    toast(deja ? 'Ces recettes sont déjà dans la semaine.' : 'Cette semaine type est vide.');
    return;
  }
  await sauvegarder();
  rendre();
  const message = ajoutees.length + (ajoutees.length > 1 ? ' recettes ajoutées' : ' recette ajoutée') +
    (deja ? ' · ' + deja + ' déjà présente' + (deja > 1 ? 's' : '') : '');
  toast(message, {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = D.semaine.selection.filter(function (s) { return ajoutees.indexOf(s.recetteId) < 0; });
      await sauvegarder(); rendre();
    },
  });
}

async function reprendreSemaineDerniere() {
  const derniere = D.historique[0];
  if (!derniere || !derniere.selection.length) { toast('Aucune semaine dans l\'historique.'); return; }
  const ok = await confirmer({
    titre: 'Reprendre la semaine dernière',
    message: 'Reprendre la sélection du ' + formatDateCourte(derniere.date) + ' ? La sélection actuelle sera remplacée.',
    labelOk: 'Reprendre',
  });
  if (!ok) return;
  D.semaine.selection = nettoyerSelection(derniere.selection, new Set(D.recettes.map(function (r) { return r.id; })));
  D.semaine.coches = {};
  await sauvegarder();
  rendre();
  toast('Sélection reprise.');
}

async function effacerDonneesExemple() {
  const ok = await confirmer({
    titre: 'Effacer les données d\'exemple',
    message: 'Les 3 recettes d\'exemple et les ingrédients qui ne servent qu\'à elles seront supprimés. Vos propres recettes et ingrédients sont conservés.',
    labelOk: 'Effacer', danger: true,
  });
  if (!ok) return;
  const avant = JSON.parse(JSON.stringify(D));
  const idsExemple = new Set(IDS_EXEMPLE_RECETTES);
  D.recettes = D.recettes.filter(function (r) { return !idsExemple.has(r.id); });
  D.semaine.selection = D.semaine.selection.filter(function (s) { return !idsExemple.has(s.recetteId); });
  D.semainesTypes.forEach(function (t) { t.selection = t.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  D.historique.forEach(function (h) { h.selection = h.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  // On ne supprime que les ingrédients d'exemple devenus inutilisés.
  const utilises = new Set();
  D.recettes.forEach(function (r) { r.lignes.forEach(function (l) { utilises.add(l.ingredientId); }); });
  const idsIngExemple = new Set(donneesExemple().ingredients.map(function (i) { return i.id; }));
  D.ingredients = D.ingredients.filter(function (i) { return !idsIngExemple.has(i.id) || utilises.has(i.id); });
  await sauvegarder();
  rendre();
  toast('Données d\'exemple effacées', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () { D = normaliserRacine(avant); await Store.save(D); rendre(); },
  });
}

async function basculerCoche(cle, valeur) {
  // Écriture ciblée : l'état des cases est sauvegardé immédiatement.
  if (valeur) await Store.patch('semaine.coches.' + cle, true);
  else await Store.patch('semaine.coches.' + cle, undefined);
  D.semaine.dateModification = new Date().toISOString();
  await Store.flush();
}

function vueListe() {
  const v = $('#vue-liste');
  const scroll = window.scrollY;
  v.innerHTML = '';
  const modele = construireListe(D);
  const t = modele.totaux;

  // En-tête collant
  const entete = el('div', { class: 'entete-liste' });
  entete.appendChild(el('span', { text: t.nbCoches + ' / ' + t.nbArticles + ' article' + (t.nbArticles > 1 ? 's' : '') }));
  if (afficherPrix()) {
    entete.appendChild(el('span', { class: 'doux', text: '·' }));
    entete.appendChild(el('span', { class: 'reste', text: texteTotal(t.totalRestant, t.sansPrixRestant) + ' restants' }));
  }
  v.appendChild(entete);

  if (!modele.articles.length && !modele.placard.length) {
    v.appendChild(el('div', { class: 'rien' }, [
      el('p', { text: 'La liste est vide.' }),
      el('p', { class: 'pt', text: 'Choisissez des recettes dans l\'onglet Semaine, ou ajoutez un article à la main ci-dessous.' }),
    ]));
  }

  // Rayons
  modele.groupes.forEach(function (g) {
    const cleOuvert = g.rayon;
    // Pliage automatique d'un rayon entièrement coché ; l'utilisateur peut rouvrir.
    if (etat.rayonsToutCoches[cleOuvert] !== g.tousCoches) {
      etat.rayonsToutCoches[cleOuvert] = g.tousCoches;
      delete etat.rayonsOuverts[cleOuvert];
    }
    const ouvert = (cleOuvert in etat.rayonsOuverts) ? etat.rayonsOuverts[cleOuvert] : !g.tousCoches;

    const bloc = el('details', { class: 'rayon', open: ouvert });
    bloc.addEventListener('toggle', function () { etat.rayonsOuverts[cleOuvert] = bloc.open; });
    const resume = el('summary', {}, [
      el('span', { text: g.libelle }),
      el('span', { class: 'compte', text: g.nbCoches + '/' + g.articles.length }),
    ]);
    bloc.appendChild(resume);

    g.articles.forEach(function (a) { bloc.appendChild(ligneArticle(a)); });
    v.appendChild(bloc);
  });

function ligneArticle(a) {
  const ligne = el('div', { class: 'article' + (a.coche ? ' coche' : '') });

  const caseCoche = el('input', { type: 'checkbox', checked: a.coche, 'aria-label': 'Cocher ' + a.nom });
  const zoneCase = el('label', { class: 'case' }, [caseCoche]);
  caseCoche.addEventListener('change', async function () {
    await basculerCoche(a.cle, caseCoche.checked);
    vueListe();
  });

  const corps = el('button', { type: 'button', class: 'corps', 'aria-expanded': String(etat.provenanceOuverte === a.cle) }, [
    el('span', { class: 'nom', text: a.nom }),
    a.texteQuantite ? el('span', { class: 'qte', text: a.texteQuantite }) : null,
  ]);
  if (afficherPrix() && a.type === 'ingredient' && !a.ingredient.placard) {
    corps.appendChild(el('span', { class: 'prix', text: a.cout === null ? '—' : formatEuroFixe(a.cout) }));
  }
  corps.addEventListener('click', function () {
    etat.provenanceOuverte = (etat.provenanceOuverte === a.cle) ? null : a.cle;
    vueListe();
  });

  ligne.appendChild(zoneCase);
  ligne.appendChild(corps);

  if (etat.provenanceOuverte === a.cle) {
    const detail = el('div', { class: 'detail-provenance' });
    if (a.type === 'manuel') {
      detail.appendChild(el('div', { text: 'Article ajouté à la main.' }));
      detail.appendChild(el('div', { class: 'barre-actions', style: 'margin-top:.4rem' }, [
        el('button', { type: 'button', class: 'btn mini danger', text: 'Supprimer', onclick: async function () {
          const idx = D.semaine.ajoutsManuels.findIndex(function (m) { return m.id === a.cle; });
          if (idx < 0) return;
          const copie = D.semaine.ajoutsManuels[idx];
          D.semaine.ajoutsManuels.splice(idx, 1);
          delete D.semaine.coches[a.cle];
          await sauvegarder(); vueListe();
          supprimerAvecAnnulation(copie.nom, async function () {
            D.semaine.ajoutsManuels.splice(idx, 0, copie); await sauvegarder(); vueListe();
          });
        } }),
      ]));
    } else {
      const entete = el('div', { class: 'gras', text: a.texteQuantite + ' — ' + a.provenance.map(function (p) {
        return p.nom + ' (' + formatQuantiteBase(p.base, a.ingredient) + ')';
      }).join(' + ') });
      detail.appendChild(entete);
      const ul = el('ul');
      a.provenance.forEach(function (p) {
        ul.appendChild(el('li', { text: p.nom + ' : ' + formatQuantiteBase(p.base, a.ingredient) }));
      });
      detail.appendChild(ul);
      const bas = el('div', { class: 'barre-actions', style: 'margin-top:.4rem;align-items:center' }, [
        el('span', { class: 'puce', text: RAYON_LIBELLE[a.rayon] }),
      ]);
      if (afficherPrix()) {
        const pu = a.ingredient.prix && typeof a.ingredient.prix.valeur === 'number'
          ? formatNombre(a.ingredient.prix.valeur, 2) + ' ' + PAR_PRIX_LIBELLE[a.ingredient.prix.par]
          : 'prix inconnu';
        bas.appendChild(el('button', {
          type: 'button', class: 'puce puce-bouton', text: '✎ ' + pu,
          onclick: function () { editionPrixRapide(a.ingredient, vueListe); },
        }));
      }
      bas.appendChild(el('button', {
        type: 'button', class: 'puce puce-bouton', text: '✎ Fiche ingrédient',
        onclick: function () { formulaireIngredient(null, function () { rendre(); }, a.ingredient); },
      }));
      detail.appendChild(bas);
    }
    const enveloppe = el('div');
    enveloppe.appendChild(ligne);
    enveloppe.appendChild(detail);
    enveloppe.className = '';
    return enveloppe;
  }
  return ligne;
}

/** Modification du prix en un clic, partout où il est affiché. */
function editionPrixRapide(ingredient, apres) {
  const champ = el('input', {
    type: 'text', inputmode: 'decimal',
    value: (ingredient.prix && typeof ingredient.prix.valeur === 'number') ? formatNombre(ingredient.prix.valeur, 2) : '',
    placeholder: 'ex. 2,40',
  });
  const unite = PAR_PRIX_LIBELLE[ingredient.prix.par || PAR_PRIX_PAR_FAMILLE[ingredient.famille]];
  const valider = async function (fermer) {
    ingredient.prix = { valeur: parseNombre(champ.value), par: PAR_PRIX_PAR_FAMILLE[ingredient.famille] };
    await sauvegarder();
    fermer();
    if (apres) apres();
  };
  champ.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); valider(fermerModale); } });
  ouvrirModale({
    titre: 'Prix de « ' + ingredient.nom + ' »',
    corps: [
      el('label', { class: 'champ' }, [
        el('span', { text: 'Prix de référence en ' + unite }),
        el('div', { class: 'ligne-champs' }, [champ, el('div', { class: 'zone-fixe' }, [el('span', { class: 'puce', text: unite })])]),
      ]),
      el('p', { class: 'tpt doux', text: 'Laisser vide si le prix est inconnu : la ligne affichera « — » et le total indiquera son incertitude.' }),
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      { label: 'Enregistrer', variant: 'principal', onClick: function (f) { valider(f); } },
    ],
  });
}

async function reinitialiserCases() {
  const n = Object.keys(D.semaine.coches).length;
  if (!n) { toast('Aucune case cochée.'); return; }
  const ancien = Object.assign({}, D.semaine.coches);
  D.semaine.coches = {};
  await sauvegarder();
  vueListe();
  toast(n + ' case' + (n > 1 ? 's décochées' : ' décochée'), {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () { D.semaine.coches = ancien; await sauvegarder(); vueListe(); },
  });

/** Liste au format texte, prête à coller. */
function listeEnTexte() {
  const modele = construireListe(D);
  const lignes = ['Liste de courses — ' + D.semaine.libelle, ''];
  modele.groupes.forEach(function (g) {
    lignes.push(g.libelle.toUpperCase());
    g.articles.forEach(function (a) {
      lignes.push((a.coche ? '[x] ' : '- ') + a.nom + (a.texteQuantite ? ' — ' + a.texteQuantite : ''));
    });
    lignes.push('');
  });
  if (modele.placard.length) {
    lignes.push('À VÉRIFIER AU PLACARD');
    modele.placard.forEach(function (a) { lignes.push('- ' + a.nom + (a.texteQuantite ? ' — ' + a.texteQuantite : '')); });
    lignes.push('');
  }
  if (afficherPrix()) {
    lignes.push('Total estimé : ' + texteTotal(modele.totaux.totalTous, modele.totaux.sansPrixTous));
  }
  return lignes.join('\n');
}

async function copierListe() {
  const texte = listeEnTexte();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(texte);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = texte;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }
  if (ok) { toast('Liste copiée.'); return; }
  const zone = el('textarea', { rows: '12', readonly: true });
  zone.value = texte;
  ouvrirModale({
    titre: 'Copier la liste',
    corps: [el('p', { class: 'pt doux', text: 'La copie automatique a échoué. Sélectionnez le texte ci-dessous et copiez-le.' }), zone],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { zone.focus(); zone.select(); }, 50);
}

/* --- Garder l'écran allumé (silencieusement ignoré si indisponible) --- */
let verrouEcran = null;
async function basculerWakeLock(actif) {
  etat.ecranAllume = actif;
  try {
    if (actif) {
      if (!('wakeLock' in navigator)) return;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', function () { verrouEcran = null; });
    } else if (verrouEcran) {
      await verrouEcran.release();
      verrouEcran = null;
    }
  } catch (e) {
    etat.ecranAllume = false;
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.ecranAllume && !verrouEcran) basculerWakeLock(true);
});

function vueRecettes() {
  const v = $('#vue-recettes');
  if (etat.editionRecette) {
    if (etat.editeurDom && etat.editeurDom.isConnected) { majApercuRecette(); return; }
    v.innerHTML = '';
    v.appendChild(construireEditeurRecette());
    return;
  }
  etat.editeurDom = null;
  v.innerHTML = '';

  const champRecherche = el('input', { type: 'search', placeholder: 'Rechercher une recette…', 'aria-label': 'Rechercher une recette' });
  const grille = el('div', { class: 'grille-recettes' });
  champRecherche.addEventListener('input', remplir);
  v.appendChild(el('div', { class: 'recherche' }, [
    champRecherche,
    el('button', { type: 'button', class: 'btn principal', text: '＋ Nouvelle recette', onclick: function () { ouvrirEditeurRecette(null); } }),
  ]));
  v.appendChild(grille);

  function remplir() {
    grille.innerHTML = '';
    const q = normaliserNom(champRecherche.value);
    const recettes = D.recettes.filter(function (r) {
      if (!q) return true;
      return normaliserNom(r.nom).indexOf(q) >= 0 || r.tags.some(function (t) { return normaliserNom(t).indexOf(q) >= 0; });
    }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

    if (!recettes.length) {
      grille.appendChild(el('div', { class: 'rien', text: D.recettes.length ? 'Aucune recette ne correspond.' : 'Aucune recette. Créez la première.' }));
      return;
    }
    recettes.forEach(function (r) {
      const c = coutRecette(D, r, r.portionsDefaut);
      const meta = el('div', { class: 'meta' });
      if (r.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: r.tempsPreparationMin + ' min' }));
      if (r.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[r.temperature] }));
      meta.appendChild(el('span', { class: 'puce', text: r.lignes.length + ' ingrédient' + (r.lignes.length > 1 ? 's' : '') }));
      r.tags.forEach(function (t) { meta.appendChild(el('span', { class: 'puce', text: t })); });
      if (afficherPrix()) {
        meta.appendChild(el('span', { class: 'puce accent', text: (c.total > 0 ? formatEuroFixe(c.parPortion) : '—') + ' / portion' + (c.sansPrix ? ' ≥' : '') }));
      }
      const carte = el('div', { class: 'carte carte-recette' }, [
        el('div', { class: 'infos' }, [el('div', { class: 'nom', text: r.nom }), meta]),
        el('div', { style: 'display:flex;flex-direction:column;gap:.25rem' }, [
          el('button', { type: 'button', class: 'btn mini', text: 'Modifier', onclick: function () { ouvrirEditeurRecette(r); } }),
          el('button', { type: 'button', class: 'btn mini', text: 'Dupliquer', onclick: function () { dupliquerRecette(r); } }),
          el('button', { type: 'button', class: 'btn mini danger', text: 'Supprimer', onclick: function () { supprimerRecette(r); } }),
        ]),
      ]);
      grille.appendChild(carte);
    });
  }
  remplir();
}

function ouvrirEditeurRecette(recette) {
  const copie = recette
    ? JSON.parse(JSON.stringify(recette))
    : { id: null, nom: '', tags: [], tempsPreparationMin: null, temperature: null, portionsDefaut: 4, derniereUtilisation: null, notes: '', lignes: [] };
  if (!copie.lignes.length) copie.lignes.push(ligneVide());
  etat.editionRecette = { travail: copie, idOriginal: recette ? recette.id : null };
  etat.editeurDom = null;
  allerA('recettes');
}
function ligneVide() { return { ingredientId: null, quantite: null, unite: '', fixe: false }; }

function fermerEditeurRecette() {
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
}

function construireChampTags(r) {
  const zone = el('div', { class: 'barre-actions', style: 'margin-bottom:.4rem' });
  const champ = el('input', { type: 'text', placeholder: 'Ajouter un tag (végétarien, rapide…)' });
  const boite = el('div', { style: 'position:relative;flex:1 1 200px' }, [champ]);

  function redessiner() {
    zone.innerHTML = '';
    r.tags.forEach(function (t, i) {
      zone.appendChild(el('span', { class: 'puce accent' }, [
        el('span', { text: t }),
        el('button', {
          type: 'button', style: 'background:none;border:0;color:inherit;cursor:pointer;font:inherit;padding:0 0 0 .2rem;min-height:0',
          text: '×', 'aria-label': 'Retirer le tag ' + t,
          onclick: function () { r.tags.splice(i, 1); redessiner(); },
        }),
      ]));
    });
    if (!r.tags.length) zone.appendChild(el('span', { class: 'tpt doux', text: 'Aucun tag' }));
  }
  function ajouterTag(txt) {
    const t = String(txt || '').trim();
    if (t && r.tags.indexOf(t) < 0) r.tags.push(t);
    champ.value = '';
    redessiner();
  }
  attacherAutocompletion(champ, {
    items: function () {
      return tousLesTags().filter(function (t) { return r.tags.indexOf(t) < 0; })
        .map(function (t) { return { cle: t, libelle: t }; });
    },
    surChoix: function (it) { ajouterTag(it.libelle); },
    surCreation: function (txt) { ajouterTag(txt); },
    libelleCreation: function (txt) { return '＋ Ajouter le tag « ' + txt + ' »'; },
    surEntreeVide: function (txt) { ajouterTag(txt); },
  });
  redessiner();
  return el('div', { class: 'champ' }, [
    el('span', { style: 'display:block;font-size:.82rem;font-weight:600;color:var(--texte-doux);margin-bottom:.2rem', text: 'Tags' }),
    zone, boite,
  ]);
}

function rendreLignes(focusCible) {
  const ed = etat.editionRecette;
  if (!ed || !etat.editeurDom) return;
  const r = ed.travail;
  const conteneur = etat.editeurDom._lignes;
  conteneur.innerHTML = '';

  r.lignes.forEach(function (ligne, index) {
    const ing = ligne.ingredientId ? ingredientParId(ligne.ingredientId) : null;

    const champIng = el('input', { type: 'text', value: ing ? ing.nom : '', placeholder: 'Ingrédient…', 'aria-label': 'Ingrédient' });
    const boiteIng = el('div', { style: 'position:relative;min-width:0' }, [champIng]);
    attacherAutocompletion(champIng, {
      items: function () {
        return D.ingredients.map(function (i) {
          return { cle: i.id, libelle: i.nom, alias: i.aliases, secondaire: RAYON_LIBELLE[i.rayon] };
        });
      },
      surChoix: function (it) { affecterIngredient(index, it.cle); },
      surCreation: function (txt) {
        creerIngredient(txt, function (nouvel) { affecterIngredient(index, nouvel.id); });
      },
      libelleCreation: function (txt) { return '＋ Créer l\'ingrédient « ' + txt + ' »'; },
    });
    champIng.addEventListener('blur', function () {
      // Un texte libre qui ne correspond à rien ne crée jamais d'ingrédient silencieusement.
      setTimeout(function () {
        const cour = ligne.ingredientId ? ingredientParId(ligne.ingredientId) : null;
        if (champIng.isConnected) champIng.value = cour ? cour.nom : champIng.value;
      }, 150);
    });

    const champQte = el('input', {
      type: 'text', inputmode: 'decimal', 'aria-label': 'Quantité pour 1 portion',
      value: (typeof ligne.quantite === 'number' && ligne.quantite !== null) ? formatNombre(ligne.quantite, 3) : '',
      placeholder: 'qté',
    });
    champQte.addEventListener('input', function () { ligne.quantite = parseNombre(champQte.value); majApercuRecette(); });
    champQte.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (index === r.lignes.length - 1) {
        r.lignes.push(ligneVide());
        rendreLignes({ index: r.lignes.length - 1, champ: 'ing' });
      } else {
        rendreLignes({ index: index + 1, champ: 'ing' });
      }
    });

    // L'unité est strictement limitée à la famille de l'ingrédient : les familles sont étanches.
    const champUnite = el('select', { 'aria-label': 'Unité' });
    const unites = unitesDe(ing);
    if (!unites.length) champUnite.appendChild(el('option', { value: '', text: '—' }));
    unites.forEach(function (u) { champUnite.appendChild(el('option', { value: u, text: u, selected: ligne.unite === u })); });
    if (unites.length && unites.indexOf(ligne.unite) < 0) { ligne.unite = unites[0]; champUnite.value = unites[0]; }
    champUnite.disabled = !ing;
    champUnite.addEventListener('change', function () { ligne.unite = champUnite.value; majApercuRecette(); });

    const caseFixe = el('input', { type: 'checkbox', checked: !!ligne.fixe, 'aria-label': 'Quantité fixe' });
    caseFixe.addEventListener('change', function () { ligne.fixe = caseFixe.checked; majApercuRecette(); });

    const bloc = el('div', { class: 'ligne-ing' }, [
      boiteIng,
      champQte,
      champUnite,
      el('label', { class: 'inline-case zone-fixe', title: 'Ne se multiplie pas avec les portions' }, [caseFixe, el('span', { class: 'tpt', text: 'fixe' })]),
      el('button', {
        type: 'button', class: 'btn mini fantome', text: '✕', 'aria-label': 'Supprimer la ligne',
        onclick: function () {
          r.lignes.splice(index, 1);
          if (!r.lignes.length) r.lignes.push(ligneVide());
          rendreLignes();
          majApercuRecette();
        },
      }),
    ]);
    conteneur.appendChild(bloc);
    bloc._champIng = champIng;
    bloc._champQte = champQte;
  });

  if (focusCible) {
    const bloc = conteneur.children[focusCible.index];
    if (bloc) {
      const cible = focusCible.champ === 'qte' ? bloc._champQte : bloc._champIng;
      if (cible) setTimeout(function () { cible.focus(); cible.select && cible.select(); }, 0);
    }
  }
  majApercuRecette();
}

function affecterIngredient(index, ingredientId) {
  const ed = etat.editionRecette;
  if (!ed) return;
  const ligne = ed.travail.lignes[index];
  if (!ligne) return;
  const ing = ingredientParId(ingredientId);
  ligne.ingredientId = ingredientId;
  const unites = unitesDe(ing);
  if (unites.indexOf(ligne.unite) < 0) ligne.unite = unites[0] || '';
  rendreLignes({ index: index, champ: 'qte' });
}

function majApercuRecette() {
  const ed = etat.editionRecette;
  if (!ed || !etat.editeurDom) return;
  const r = ed.travail;
  const apercu = etat.editeurDom._apercu;
  const portions = r.portionsDefaut || 4;
  apercu.innerHTML = '';
  apercu.appendChild(el('h3', { style: 'margin:0', text: 'Pour ' + portions + ' portions' }));

  const lignesValides = r.lignes.filter(function (l) { return l.ingredientId && l.quantite; });
  if (!lignesValides.length) {
    apercu.appendChild(el('p', { class: 'pt', text: 'Renseignez des ingrédients pour voir l\'aperçu.' }));
    etat.editeurDom._enteteCout.textContent = '';
    return;
  }
  const faux = { id: r.id || 'apercu', nom: r.nom, lignes: lignesValides, portionsDefaut: portions };
  const donneesApercu = { ingredients: D.ingredients, recettes: [faux], reglages: D.reglages };
  const agr = agregerSelection(donneesApercu, [{ recetteId: faux.id, portions: portions }]);
  // On garde l'ordre de saisie : l'aperçu se relit ligne à ligne face au formulaire.
  const ordreSaisie = [];
  lignesValides.forEach(function (x) { if (ordreSaisie.indexOf(x.ingredientId) < 0) ordreSaisie.push(x.ingredientId); });
  const ul = el('ul');
  agr.lignes.slice().sort(function (a, b) {
    return ordreSaisie.indexOf(a.ingredient.id) - ordreSaisie.indexOf(b.ingredient.id);
  }).forEach(function (l) {
    ul.appendChild(el('li', {
      text: formatQuantiteBase(l.base, l.ingredient) + ' ' + elision(minusculeInitiale(l.ingredient.nom)) +
        (lignesValides.find(function (x) { return x.ingredientId === l.ingredient.id && x.fixe; }) ? ' (fixe)' : ''),
    }));
  });
  apercu.appendChild(ul);

  if (afficherPrix()) {
    const c = coutRecette(donneesApercu, faux, portions);
    etat.editeurDom._enteteCout.textContent = (c.sansPrix ? '≥ ' : '') + formatEuroFixe(c.parPortion) + ' / portion';
    apercu.appendChild(el('p', { class: 'tpt', text:
      'Coût estimé : ' + texteTotal(c.total, c.sansPrix) + ' pour ' + portions + ' portions' +
      ' (produits de placard exclus).' }));
    // Les prix manquants sont modifiables ici même, sans quitter la recette.
    const sansPrix = agr.lignes.filter(function (l) {
      return !l.ingredient.placard && prixParUniteBase(l.ingredient) === null;
    });
    if (sansPrix.length) {
      const barre = el('div', { class: 'barre-actions', style: 'margin-top:.3rem' }, [
        el('span', { class: 'tpt', text: 'Sans prix :' }),
      ]);
      sansPrix.forEach(function (l) {
        barre.appendChild(el('button', {
          type: 'button', class: 'puce puce-bouton', text: '✎ ' + l.ingredient.nom,
          onclick: function () { editionPrixRapide(l.ingredient, majApercuRecette); },
        }));
      });
      apercu.appendChild(barre);
    }
  }
}

async function enregistrerRecette() {
  const ed = etat.editionRecette;
  const r = ed.travail;
  const nom = (r.nom || '').trim();
  if (!nom) { toast('Donnez un nom à la recette.'); return; }
  const lignes = r.lignes.filter(function (l) { return l.ingredientId && typeof l.quantite === 'number' && l.quantite > 0; });
  if (!lignes.length) {
    const ok = await confirmer({ titre: 'Recette sans ingrédient', message: 'Aucune ligne complète (ingrédient + quantité). Enregistrer quand même ?', labelOk: 'Enregistrer' });
    if (!ok) return;
  }
  const cible = ed.idOriginal ? recetteParId(ed.idOriginal) : null;
  const enregistree = {
    id: cible ? cible.id : genererId('rec', nom),
    nom: nom,
    tags: r.tags.slice(),
    tempsPreparationMin: r.tempsPreparationMin,
    temperature: r.temperature || null,
    portionsDefaut: r.portionsDefaut || 4,
    derniereUtilisation: cible ? cible.derniereUtilisation : null,
    notes: r.notes || '',
    lignes: lignes.map(function (l) { return { ingredientId: l.ingredientId, quantite: l.quantite, unite: l.unite, fixe: !!l.fixe }; }),
  };
  if (cible) Object.assign(cible, enregistree);
  else D.recettes.push(enregistree);
  await sauvegarder();
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
  toast('Recette « ' + nom + ' » enregistrée.');
}

async function dupliquerRecette(recette) {
  const copie = JSON.parse(JSON.stringify(recette));
  copie.id = genererId('rec', recette.nom + ' copie');
  copie.nom = recette.nom + ' (copie)';
  copie.derniereUtilisation = null;
  D.recettes.push(copie);
  await sauvegarder();
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
  toast('Recette dupliquée.');
}

async function supprimerRecette(recette, depuisEditeur) {
  const ok = await confirmer({
    titre: 'Supprimer la recette',
    message: 'Supprimer « ' + recette.nom + ' » ? Elle sera aussi retirée de la semaine en cours et des semaines types.',
    labelOk: 'Supprimer', danger: true,
  });
  if (!ok) return;
  const index = D.recettes.indexOf(recette);
  const selAvant = D.semaine.selection.slice();
  const typesAvant = JSON.parse(JSON.stringify(D.semainesTypes));
  D.recettes.splice(index, 1);
  D.semaine.selection = D.semaine.selection.filter(function (s) { return s.recetteId !== recette.id; });
  D.semainesTypes.forEach(function (t) { t.selection = t.selection.filter(function (s) { return s.recetteId !== recette.id; }); });
  await sauvegarder();
  if (depuisEditeur) { etat.editionRecette = null; etat.editeurDom = null; }
  rendre();
  supprimerAvecAnnulation('Recette « ' + recette.nom + ' »', async function () {
    D.recettes.splice(index, 0, recette);
    D.semaine.selection = selAvant;
    D.semainesTypes = typesAvant;
    await sauvegarder();
    rendre();
  });
}

/* --- 5.4 Réglages --- */

function vueReglages() {
  const v = $('#vue-reglages');
  const scroll = window.scrollY;
  v.innerHTML = '';

  /* Référentiel des ingrédients */
  const carteRef = el('div', { class: 'carte' });
  carteRef.appendChild(el('h2', { text: 'Référentiel des ingrédients' }));
  const champRech = el('input', { type: 'search', placeholder: 'Rechercher un ingrédient…', value: etat.rechercheIngredients, 'aria-label': 'Rechercher un ingrédient' });
  champRech.addEventListener('input', function () { etat.rechercheIngredients = champRech.value; remplirTable(); });
  carteRef.appendChild(el('div', { class: 'recherche' }, [
    champRech,
    el('button', { type: 'button', class: 'btn', text: '＋ Nouvel ingrédient', onclick: function () { formulaireIngredient('', null); } }),
  ]));
  const wrap = el('div', { class: 'table-wrap' });
  carteRef.appendChild(wrap);
  const infoRef = el('p', { class: 'tpt doux' });
  carteRef.appendChild(infoRef);
  v.appendChild(carteRef);

  function remplirTable() {
    wrap.innerHTML = '';
    const q = normaliserNom(etat.rechercheIngredients);
    let liste = D.ingredients.filter(function (i) {
      if (!q) return true;
      return normaliserNom(i.nom).indexOf(q) >= 0 || i.aliases.some(function (a) { return normaliserNom(a).indexOf(q) >= 0; });
    });
    const tri = etat.triRef;
    liste = liste.slice().sort(function (a, b) {
      let x, y;
      if (tri.colonne === 'rayon') { x = RAYON_LIBELLE[a.rayon]; y = RAYON_LIBELLE[b.rayon]; }
      else if (tri.colonne === 'famille') { x = a.famille; y = b.famille; }
      else if (tri.colonne === 'prix') {
        x = (a.prix && typeof a.prix.valeur === 'number') ? a.prix.valeur : -1;
        y = (b.prix && typeof b.prix.valeur === 'number') ? b.prix.valeur : -1;
        return (x - y) * tri.sens;
      } else if (tri.colonne === 'placard') { return ((a.placard ? 1 : 0) - (b.placard ? 1 : 0)) * tri.sens; }
      else { x = a.nom; y = b.nom; }
      return String(x).localeCompare(String(y), 'fr') * tri.sens;
    });

    const table = el('table', { class: 'ref' });
    const thead = el('thead');
    const trh = el('tr');
    [['nom', 'Nom'], ['rayon', 'Rayon'], ['famille', 'Famille'], ['unite', 'Unité pièce'], ['prix', 'Prix'], ['placard', 'Placard'], ['aliases', 'Aliases'], ['actions', '']]
      .forEach(function (c) {
        const th = el('th', { text: c[1] + (etat.triRef.colonne === c[0] ? (etat.triRef.sens > 0 ? ' ▲' : ' ▼') : '') });
        if (['nom', 'rayon', 'famille', 'prix', 'placard'].indexOf(c[0]) >= 0) {
          th.addEventListener('click', function () {
            if (etat.triRef.colonne === c[0]) etat.triRef.sens *= -1;
            else etat.triRef = { colonne: c[0], sens: 1 };
            remplirTable();
          });
        } else { th.style.cursor = 'default'; }
        trh.appendChild(th);
      });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = el('tbody');
    const utilisation = compterUtilisation();
    liste.forEach(function (i) {
      const tr = el('tr');

      const cNom = el('input', { type: 'text', value: i.nom });
      cNom.addEventListener('change', async function () {
        const n = cNom.value.trim(); if (!n) { cNom.value = i.nom; return; }
        i.nom = n; await sauvegarder(); rendre();
      });
      tr.appendChild(el('td', {}, [cNom]));

      const cRayon = el('select');
      RAYONS.forEach(function (rr) { cRayon.appendChild(el('option', { value: rr[0], text: rr[1], selected: i.rayon === rr[0] })); });
      cRayon.addEventListener('change', async function () { i.rayon = cRayon.value; await sauvegarder(); });
      tr.appendChild(el('td', {}, [cRayon]));

      const cFam = el('select');
      FAMILLES.forEach(function (f) { cFam.appendChild(el('option', { value: f[0], text: FAMILLE_COURT[f[0]], selected: i.famille === f[0] })); });
      cFam.addEventListener('change', async function () {
        i.famille = cFam.value;
        i.unitePiece = i.famille === 'piece' ? (i.unitePiece || 'pièce') : null;
        i.prix = { valeur: i.prix ? i.prix.valeur : null, par: PAR_PRIX_PAR_FAMILLE[i.famille] };
        corrigerUnitesRecettes(i);
        await sauvegarder(); remplirTable();
      });
      tr.appendChild(el('td', {}, [cFam]));

      const cUnite = el('input', { type: 'text', value: i.unitePiece || '', list: 'dl-unites-piece', disabled: i.famille !== 'piece' });
      cUnite.addEventListener('change', async function () {
        i.unitePiece = cUnite.value.trim() || 'pièce';
        corrigerUnitesRecettes(i);
        await sauvegarder(); rendre();
      });
      tr.appendChild(el('td', {}, [cUnite]));

      const cPrix = el('input', { type: 'text', inputmode: 'decimal', value: (i.prix && typeof i.prix.valeur === 'number') ? formatNombre(i.prix.valeur, 2) : '', placeholder: '—' });
      cPrix.addEventListener('change', async function () {
        i.prix = { valeur: parseNombre(cPrix.value), par: PAR_PRIX_PAR_FAMILLE[i.famille] };
        await sauvegarder();
      });
      tr.appendChild(el('td', {}, [
        el('div', { class: 'cellule-prix' }, [cPrix, el('span', { class: 'doux', text: PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[i.famille]] })]),
      ]));

      const cPlacard = el('input', { type: 'checkbox', checked: !!i.placard, 'aria-label': 'Fond de placard' });
      cPlacard.addEventListener('change', async function () { i.placard = cPlacard.checked; await sauvegarder(); });
      tr.appendChild(el('td', {}, [cPlacard]));

      const cAlias = el('input', { type: 'text', value: i.aliases.join(', '), placeholder: 'autres noms, séparés par des virgules' });
      cAlias.addEventListener('change', async function () {
        i.aliases = cAlias.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        await sauvegarder();
      });
      tr.appendChild(el('td', {}, [cAlias]));

      const n = utilisation.get(i.id) || 0;
      tr.appendChild(el('td', { style: 'white-space:nowrap' }, [
        el('span', { class: 'tpt doux', text: n ? n + ' rec.' : 'inutilisé' }),
        ' ',
        el('button', { type: 'button', class: 'btn mini', text: 'Fusionner', onclick: function () { modaleFusion(i); } }),
        ' ',
        el('button', { type: 'button', class: 'btn mini danger', text: '✕', 'aria-label': 'Supprimer ' + i.nom, onclick: function () { supprimerIngredient(i, n); } }),
      ]));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    infoRef.textContent = liste.length + ' ingrédient' + (liste.length > 1 ? 's' : '') + ' sur ' + D.ingredients.length +
      ' · la famille détermine les unités acceptées ; on ne convertit jamais entre familles.';
  }
  remplirTable();

  /* Ordre des rayons */
  const carteOrdre = el('div', { class: 'carte' });
  carteOrdre.appendChild(el('h2', { text: 'Ordre des rayons' }));
  carteOrdre.appendChild(el('p', { class: 'tpt doux', text: 'C\'est l\'ordre de parcours du magasin. Glissez les lignes, ou utilisez les flèches.' }));
  carteOrdre.appendChild(construireOrdreRayons());
  v.appendChild(carteOrdre);

  /* Affichage */
  const casePrix = el('input', { type: 'checkbox', checked: D.reglages.afficherPrix });
  casePrix.addEventListener('change', async function () { D.reglages.afficherPrix = casePrix.checked; await sauvegarder(); rendre(); });
  const selTheme = el('select', { style: 'max-width:200px' });
  [['auto', 'Auto (système)'], ['clair', 'Clair'], ['sombre', 'Sombre']].forEach(function (t) {
    selTheme.appendChild(el('option', { value: t[0], text: t[1], selected: D.reglages.theme === t[0] }));
  });
  selTheme.addEventListener('change', async function () { D.reglages.theme = selTheme.value; await sauvegarder(); appliquerTheme(); });
  v.appendChild(el('div', { class: 'carte' }, [
    el('h2', { text: 'Affichage' }),
    el('label', { class: 'inline-case' }, [casePrix, el('span', { text: 'Afficher les prix' })]),
    el('label', { class: 'champ', style: 'margin-top:.5rem' }, [el('span', { text: 'Thème' }), selTheme]),
  ]));

  /* Sauvegarde */
  v.appendChild(el('div', { class: 'carte' }, [
    el('h2', { text: 'Sauvegarde de vos données' }),
    el('p', { class: 'pt doux', text: 'Vos données ne quittent jamais cet appareil. L\'export est votre seule sauvegarde : faites-en un de temps en temps.' }),
    el('div', { class: 'barre-actions' }, [
      el('button', { type: 'button', class: 'btn principal', text: '⭳ Exporter les données', onclick: exporterDonnees }),
      el('button', { type: 'button', class: 'btn', text: '⭱ Importer un fichier', onclick: importerDonnees }),
    ]),
  ]));

  /* Historique */
  const carteHisto = el('div', { class: 'carte' });
  carteHisto.appendChild(el('h2', { text: 'Historique des semaines' }));
  if (!D.historique.length) {
    carteHisto.appendChild(el('p', { class: 'doux pt', text: 'Aucune semaine archivée. Une semaine est archivée quand vous la videz depuis l\'onglet Semaine.' }));
  } else {
    D.historique.forEach(function (h, idx) {
      const noms = h.selection.map(function (s) { const r = recetteParId(s.recetteId); return r ? r.nom + ' ×' + s.portions : null; }).filter(Boolean);
      carteHisto.appendChild(el('div', { class: 'carte plate', style: 'margin:.3rem 0' }, [
        el('div', { class: 'barre-actions', style: 'justify-content:space-between;align-items:baseline' }, [
          el('span', { class: 'gras', text: h.libelle || formatDateCourte(h.date) }),
          afficherPrix() ? el('span', { class: 'puce accent', text: formatEuroFixe(h.coutEstime) }) : null,
        ]),
        el('div', { class: 'tpt doux', text: formatDateCourte(h.date) + ' · ' + (noms.join(' · ') || 'aucune recette conservée') }),
        el('div', { class: 'barre-actions', style: 'margin-top:.3rem' }, [
          el('button', { type: 'button', class: 'btn mini', text: 'Reprendre cette semaine', onclick: async function () {
            D.semaine.selection = nettoyerSelection(h.selection, new Set(D.recettes.map(function (r) { return r.id; })));
            D.semaine.coches = {};
            await sauvegarder(); allerA('semaine'); toast('Sélection reprise.');
          } }),
          el('button', { type: 'button', class: 'btn mini danger', text: 'Retirer', onclick: async function () {
            const copie = D.historique[idx];
            D.historique.splice(idx, 1);
            await sauvegarder(); vueReglages();
            supprimerAvecAnnulation('Entrée d\'historique', async function () {
              D.historique.splice(idx, 0, copie); await sauvegarder(); vueReglages();
            });
          } }),
        ]),
      ]));
    });
  }
  v.appendChild(carteHisto);

  /* Zone dangereuse */
  v.appendChild(el('div', { class: 'carte' }, [
    el('h2', { text: 'Repartir de zéro' }),
    el('p', { class: 'pt doux', text: 'Efface tout : ingrédients, recettes, semaine, historique. Pensez à exporter avant.' }),
    el('button', { type: 'button', class: 'btn danger', text: 'Effacer toutes les données', onclick: effacerTout }),
  ]));

  v.appendChild(el('p', { class: 'tpt doux', style: 'text-align:center;margin-top:1rem' , text: 'Liste de courses — fichier autonome, aucune connexion réseau, aucune télémétrie.' }));

  window.scrollTo(0, scroll);
}

function compterUtilisation() {
  const m = new Map();
  D.recettes.forEach(function (r) {
    const vus = new Set();
    r.lignes.forEach(function (l) {
      if (vus.has(l.ingredientId)) return;
      vus.add(l.ingredientId);
      m.set(l.ingredientId, (m.get(l.ingredientId) || 0) + 1);
    });
  });
  return m;
}

async function supprimerIngredient(ingredient, nbRecettes) {
  const ok = await confirmer({
    titre: 'Supprimer l\'ingrédient',
    message: nbRecettes
      ? '« ' + ingredient.nom + ' » est utilisé dans ' + nbRecettes + ' recette' + (nbRecettes > 1 ? 's' : '') + '. Il en sera retiré.'
      : 'Supprimer « ' + ingredient.nom + ' » du référentiel ?',
    labelOk: 'Supprimer', danger: true,
  });
  if (!ok) return;
  const index = D.ingredients.indexOf(ingredient);
  const lignesAvant = D.recettes.map(function (r) { return { id: r.id, lignes: r.lignes.slice() }; });
  D.ingredients.splice(index, 1);
  D.recettes.forEach(function (r) { r.lignes = r.lignes.filter(function (l) { return l.ingredientId !== ingredient.id; }); });
  delete D.semaine.coches[ingredient.id];
  await sauvegarder();
  rendre();
  supprimerAvecAnnulation('Ingrédient « ' + ingredient.nom + ' »', async function () {
    D.ingredients.splice(index, 0, ingredient);
    lignesAvant.forEach(function (x) { const r = recetteParId(x.id); if (r) r.lignes = x.lignes; });
    await sauvegarder(); rendre();
  });
}

function modaleFusion(source) {
  const candidats = D.ingredients.filter(function (i) { return i.id !== source.id; });
  if (!candidats.length) { toast('Aucun autre ingrédient.'); return; }
  const select = el('select');
  select.appendChild(el('option', { value: '', text: '— choisir —' }));
  candidats.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); })
    .forEach(function (i) { select.appendChild(el('option', { value: i.id, text: i.nom + ' (' + FAMILLE_COURT[i.famille] + ')' })); });
  const avert = el('div', { class: 'avert', hidden: true });
  select.addEventListener('change', function () {
    const cible = ingredientParId(select.value);
    if (!cible) { avert.hidden = true; return; }
    if (cible.famille !== source.famille) {
      avert.hidden = false;
      avert.textContent = 'Familles différentes (' + FAMILLE_COURT[source.famille] + ' / ' + FAMILLE_COURT[cible.famille] + ') : la fusion est impossible, on ne convertit jamais entre familles.';
    } else if (source.famille === 'piece' && cible.unitePiece !== source.unitePiece) {
      avert.hidden = false;
      avert.textContent = 'Unités de pièce différentes (« ' + source.unitePiece + ' » et « ' + cible.unitePiece + ' ») : les quantités garderont leur valeur et prendront l\'unité « ' + cible.unitePiece + ' ». Vérifiez les recettes après la fusion.';
    } else { avert.hidden = true; }
  });
  ouvrirModale({
    titre: 'Fusionner « ' + source.nom + ' »',
    corps: [
      el('p', { class: 'pt', text: '« ' + source.nom + ' » deviendra un alias de l\'ingrédient choisi. Toutes les recettes seront mises à jour.' }),
      el('label', { class: 'champ' }, [el('span', { text: 'Conserver l\'ingrédient' }), select]),
      avert,
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Fusionner', variant: 'principal',
        onClick: async function (f) {
          const cible = ingredientParId(select.value);
          if (!cible) { toast('Choisissez un ingrédient.'); return; }
          if (cible.famille !== source.famille) { toast('Fusion impossible entre familles différentes.'); return; }
          f();
          await fusionnerIngredients(source.id, cible.id);
        },
      },
    ],
  });
}

function construireOrdreRayons() {
  const ul = el('ul', { class: 'liste-ordre' });
  let indexDrag = null;

  function redessiner() {
    ul.innerHTML = '';
    D.reglages.ordreRayons.forEach(function (r, i) {
      const li = el('li', { draggable: 'true', 'data-i': i }, [
        el('span', { class: 'poignee', 'aria-hidden': 'true', text: '⠿' }),
        el('span', { class: 'nom', text: RAYON_LIBELLE[r] }),
        el('button', { type: 'button', class: 'btn mini fantome', text: '↑', 'aria-label': 'Monter ' + RAYON_LIBELLE[r], disabled: i === 0, onclick: function () { deplacer(i, i - 1); } }),
        el('button', { type: 'button', class: 'btn mini fantome', text: '↓', 'aria-label': 'Descendre ' + RAYON_LIBELLE[r], disabled: i === D.reglages.ordreRayons.length - 1, onclick: function () { deplacer(i, i + 1); } }),
      ]);
      li.addEventListener('dragstart', function (ev) {
        indexDrag = i; li.classList.add('drag');
        try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(i)); } catch (e) {}
      });
      li.addEventListener('dragend', function () { indexDrag = null; redessiner(); });
      li.addEventListener('dragover', function (ev) { ev.preventDefault(); li.classList.add('survol'); });
      li.addEventListener('dragleave', function () { li.classList.remove('survol'); });
      li.addEventListener('drop', function (ev) {
        ev.preventDefault(); li.classList.remove('survol');
        let src = indexDrag;
        if (src === null) { const t = parseNombre(ev.dataTransfer.getData('text/plain')); src = (t === null) ? null : t; }
        if (src === null || src === i) return;
        deplacer(src, i);
      });
      ul.appendChild(li);
    });
  }
  async function deplacer(de, vers) {
    const arr = D.reglages.ordreRayons;
    if (vers < 0 || vers >= arr.length) return;
    const [x] = arr.splice(de, 1);
    arr.splice(vers, 0, x);
    await sauvegarder();
    redessiner();
  }
  redessiner();
  return ul;
}

/* --- Export / import --- */
async function exporterDonnees() {
  await Store.flush();
  const json = await Store.export();
  const nom = 'liste-courses-' + aujourdHuiISO() + '.json';
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: nom });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('Export « ' + nom + ' » téléchargé.');
  } catch (e) {
    const zone = el('textarea', { rows: '12' });
    zone.value = json;
    ouvrirModale({
      titre: 'Exporter',
      corps: [el('p', { class: 'pt doux', text: 'Le téléchargement a échoué. Copiez le contenu ci-dessous dans un fichier .json.' }), zone],
      actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
    });
  }
}

function importerDonnees() {
  const input = el('input', { type: 'file', accept: '.json,application/json', style: 'position:fixed;left:-9999px' });
  document.body.appendChild(input);
  input.addEventListener('change', function () {
    const f = input.files && input.files[0];
    if (!f) { input.remove(); return; }
    const lecteur = new FileReader();
    lecteur.onload = function () {
      input.remove();
      ecranConfirmationImport(String(lecteur.result), f.name);
    };
    lecteur.onerror = function () { input.remove(); toast('Lecture du fichier impossible.'); };
    lecteur.readAsText(f);
  });
  input.click();
}

function ecranConfirmationImport(texte, nomFichier) {
  let candidat;
  try { candidat = JSON.parse(texte); }
  catch (e) { toast('Fichier illisible : ce n\'est pas du JSON valide.'); return; }
  let apercu;
  try { apercu = normaliserRacine(candidat); }
  catch (e) { toast('Fichier inattendu : ' + e.message); return; }

  const tableau = el('div', { class: 'lignes-ing' });
  [
    ['Ingrédients', D.ingredients.length, apercu.ingredients.length],
    ['Recettes', D.recettes.length, apercu.recettes.length],
    ['Recettes dans la semaine', D.semaine.selection.length, apercu.semaine.selection.length],
    ['Articles ajoutés à la main', D.semaine.ajoutsManuels.length, apercu.semaine.ajoutsManuels.length],
    ['Semaines types', D.semainesTypes.length, apercu.semainesTypes.length],
    ['Semaines dans l\'historique', D.historique.length, apercu.historique.length],
  ].forEach(function (l) {
    tableau.appendChild(el('div', { class: 'ligne-ing', style: 'grid-template-columns:1fr auto' }, [
      el('span', { text: l[0] }),
      el('span', { class: 'gras', text: l[1] + ' → ' + l[2] }),
    ]));
  });

  ouvrirModale({
    titre: 'Importer « ' + nomFichier + ' »',
    corps: [
      el('div', { class: 'avert', text: 'Tout le contenu actuel sera remplacé par celui du fichier. Cette action n\'est pas annulable.' }),
      el('p', { class: 'pt doux', text: 'Ce qui sera remplacé (actuel → importé) :' }),
      tableau,
    ],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      { label: 'Exporter d\'abord', onClick: function () { exporterDonnees(); } },
      {
        label: 'Remplacer', variant: 'danger',
        onClick: async function (f) {
          try {
            D = await Store.import(texte);
          } catch (e) { toast(e.message || 'Import impossible.'); return; }
          f();
          etat.editionRecette = null; etat.editeurDom = null;
          appliquerTheme();
          allerA('semaine');
          toast('Données importées.');
        },
      },
    ],
  });
}

async function effacerTout() {
  const ok = await confirmer({
    titre: 'Effacer toutes les données',
    message: 'Ingrédients, recettes, semaine en cours, semaines types et historique seront définitivement supprimés.',
    labelOk: 'Tout effacer', danger: true,
  });
  if (!ok) return;
  const ok2 = await confirmer({
    titre: 'Confirmer',
    message: 'Dernière confirmation : cette action est irréversible. Avez-vous exporté vos données ?',
    labelOk: 'Oui, tout effacer', danger: true,
  });
  if (!ok2) return;
  D = donneesVides();
  await Store.reset(D);
  etat.editionRecette = null; etat.editeurDom = null;
  allerA('semaine');
  toast('Toutes les données ont été effacées.');
}

/* ——— DÉMARRAGE ——————————————————————————————————————————————————————————— */

function signalerModeDegrade() {
  const b = $('#bandeau-degrade');
  if (!b.hidden) return;
  b.hidden = false;
  b.textContent = '';
  b.appendChild(document.createTextNode('Sauvegarde impossible dans ce navigateur — pense à exporter tes données avant de fermer. '));
  b.appendChild(el('button', {
    type: 'button', class: 'btn mini', style: 'margin-left:.4rem', text: 'Exporter maintenant',
    onclick: exporterDonnees,
  }));
}

async function demarrer() {
  Store.surPanne(function () { signalerModeDegrade(); });

  let chargees = null;
  try { chargees = await Store.load(); }
  catch (e) { chargees = null; }

  if (chargees) {
    D = chargees;
  } else {
    // Premier lancement (ou stockage illisible) : jeu de données de démarrage.
    D = donneesExemple();
    await Store.save(D);
    await Store.flush();
  }
  if (Store.modeMemoire()) signalerModeDegrade();

  appliquerTheme();
  $$('#tabbar button').forEach(function (b) {
    b.addEventListener('click', function () { allerA(b.dataset.tab); });
  });

  // Hauteur réelle de la barre de titre, pour que l'en-tête de la liste se cale
  // juste dessous au lieu de disparaître derrière.
  const mesurerEntete = function () {
    const h = $('.topbar').offsetHeight;
    document.documentElement.style.setProperty('--h-topbar', h + 'px');
  };
  mesurerEntete();
  window.addEventListener('resize', mesurerEntete);
  window.addEventListener('orientationchange', mesurerEntete);

  // La liste de suggestions d'unités est utilisée par plusieurs formulaires.
  const dl = el('datalist', { id: 'dl-unites-piece' });
  UNITES_PIECE_SUGGEREES.forEach(function (u) { dl.appendChild(el('option', { value: u })); });
  document.body.appendChild(dl);

  allerA('semaine');

  // On force l'écriture en attente avant que l'onglet ne disparaisse.
  const vider = function () { Store.flush(); };
  window.addEventListener('pagehide', vider);
  window.addEventListener('beforeunload', vider);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') vider();
  });

  // À l'impression, on déplie les rayons repliés puis on rétablit l'affichage.
  let repliesAvantImpression = [];
  window.addEventListener('beforeprint', function () {
    repliesAvantImpression = $$('details.rayon').filter(function (d) { return !d.open; });
    repliesAvantImpression.forEach(function (d) { d.open = true; });
  });
  window.addEventListener('afterprint', function () {
    repliesAvantImpression.forEach(function (d) { d.open = false; });
    repliesAvantImpression = [];
  });

  // Le thème « auto » suit le système en direct.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const surChangement = function () { if (D && D.reglages.theme === 'auto') appliquerTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', surChangement);
    else if (mq.addListener) mq.addListener(surChangement);
  }
}

demarrer();
