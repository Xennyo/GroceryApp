/* --- Normalisation défensive : toute racine chargée passe par ici --- */
function normaliserRacine(d) {
  const base = donneesVides();
  if (!d || typeof d !== 'object') return base;
  const out = base;
  out.schemaVersion = SCHEMA_VERSION;

  out.ingredients = (Array.isArray(d.ingredients) ? d.ingredients : []).map(function (i) {
    const famille = (i && ['masse', 'volume', 'piece'].indexOf(i.famille) >= 0) ? i.famille : 'masse';
    const prix = (i && i.prix && typeof i.prix === 'object') ? i.prix : {};
    return {
      id: (i && i.id) || genererId('ing', (i && i.nom) || 'ingredient'),
      nom: String((i && i.nom) || 'Sans nom'),
      aliases: Array.isArray(i && i.aliases) ? i.aliases.map(String) : [],
      rayon: (i && RAYON_LIBELLE[i.rayon]) ? i.rayon : 'autre',
      famille: famille,
      unitePiece: famille === 'piece' ? (i.unitePiece || 'pièce') : null,
      prix: {
        valeur: (typeof prix.valeur === 'number' && isFinite(prix.valeur)) ? prix.valeur : null,
        par: PAR_PRIX_PAR_FAMILLE[famille],
      },
      placard: !!(i && i.placard),
    };
  });
  const idsIng = new Set(out.ingredients.map(function (i) { return i.id; }));

  out.recettes = (Array.isArray(d.recettes) ? d.recettes : []).map(function (r) {
    return {
      id: (r && r.id) || genererId('rec', (r && r.nom) || 'recette'),
      nom: String((r && r.nom) || 'Sans nom'),
      tags: Array.isArray(r && r.tags) ? r.tags.map(String) : [],
      tempsPreparationMin: (typeof (r && r.tempsPreparationMin) === 'number') ? r.tempsPreparationMin : null,
      temperature: (r && TEMPERATURE_LIBELLE[r.temperature]) ? r.temperature : null,
      // Vide = de toute l'année. C'est le cas le plus fréquent, et le défaut.
      saisons: Array.isArray(r && r.saisons) ? r.saisons.filter(function (x) { return SAISON_LIBELLE[x]; }) : [],
      portionsDefaut: (typeof (r && r.portionsDefaut) === 'number' && r.portionsDefaut > 0) ? r.portionsDefaut : 4,
      derniereUtilisation: (r && r.derniereUtilisation) || null,
      notes: String((r && r.notes) || ''),
      lignes: (Array.isArray(r && r.lignes) ? r.lignes : [])
        .filter(function (l) { return l && idsIng.has(l.ingredientId); })
        .map(function (l) {
          return {
            ingredientId: l.ingredientId,
            quantite: (typeof l.quantite === 'number' && isFinite(l.quantite)) ? l.quantite : 0,
            unite: String(l.unite || ''),
            fixe: !!l.fixe,
          };
        }),
    };
  });
  const idsRec = new Set(out.recettes.map(function (r) { return r.id; }));

  const s = (d.semaine && typeof d.semaine === 'object') ? d.semaine : {};
  out.semaine = {
    libelle: String(s.libelle || libelleSemaineCourante()),
    periode: periodeValide(s.periode),
    selection: nettoyerSelection(s.selection, idsRec),
    coches: (s.coches && typeof s.coches === 'object') ? Object.assign({}, s.coches) : {},
    ajoutsManuels: (Array.isArray(s.ajoutsManuels) ? s.ajoutsManuels : []).map(function (a, n) {
      return {
        id: (a && a.id) || ('man_' + suffixeCourt() + n),
        nom: String((a && a.nom) || ''),
        rayon: (a && RAYON_LIBELLE[a.rayon]) ? a.rayon : 'autre',
        quantite: (a && typeof a.quantite === 'number') ? a.quantite : null,
        unite: (a && a.unite) ? String(a.unite) : null,
      };
    }).filter(function (a) { return a.nom.trim() !== ''; }),
    dateModification: String(s.dateModification || new Date().toISOString()),
  };

  out.historique = (Array.isArray(d.historique) ? d.historique : []).map(function (h) {
    return {
      date: String((h && h.date) || aujourdHuiISO()),
      libelle: (h && h.libelle) ? String(h.libelle) : null,
      selection: nettoyerSelection(h && h.selection, idsRec),
      coutEstime: (typeof (h && h.coutEstime) === 'number') ? h.coutEstime : 0,
    };
  });

  out.semainesTypes = (Array.isArray(d.semainesTypes) ? d.semainesTypes : []).map(function (t) {
    return {
      id: (t && t.id) || genererId('st', (t && t.nom) || 'type'),
      nom: String((t && t.nom) || 'Semaine type'),
      selection: nettoyerSelection(t && t.selection, idsRec),
    };
  });

  const g = (d.reglages && typeof d.reglages === 'object') ? d.reglages : {};
  let ordre = Array.isArray(g.ordreRayons) ? g.ordreRayons.filter(function (r) { return RAYON_LIBELLE[r]; }) : [];
  ordre = ordre.concat(RAYONS_IDS.filter(function (r) { return ordre.indexOf(r) < 0; }));
  out.reglages = {
    ordreRayons: ordre,
    afficherPrix: g.afficherPrix !== false,
    theme: ['auto', 'clair', 'sombre'].indexOf(g.theme) >= 0 ? g.theme : 'auto',
    portionsBase: (typeof g.portionsBase === 'number' && g.portionsBase > 0) ? Math.min(99, Math.round(g.portionsBase)) : 4,
    serveurSync: (typeof g.serveurSync === 'string') ? g.serveurSync.replace(/\/+$/, '') : '',
  };
  return out;
}

/**
 * Entrées de planning. Une même recette peut revenir plusieurs fois — lundi et
 * jeudi — donc chaque entrée porte son propre identifiant, et non celui de la
 * recette. `date` à null signifie « dans la période, sans jour précis ».
 */
function nettoyerSelection(sel, idsRec) {
  const vus = new Set();
  return (Array.isArray(sel) ? sel : []).filter(function (s) {
    return s && s.recetteId && (!idsRec || idsRec.has(s.recetteId));
  }).map(function (s, n) {
    let id = s.id ? String(s.id) : ('pl_' + suffixeCourt() + n);
    while (vus.has(id)) id = 'pl_' + suffixeCourt() + Math.random().toString(36).slice(2, 5);
    vus.add(id);
    const date = (typeof s.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date)) ? s.date : null;
    return {
      id: id,
      recetteId: s.recetteId,
      portions: (typeof s.portions === 'number' && s.portions > 0) ? Math.min(99, Math.round(s.portions)) : 4,
      date: date,
    };
  });
}

function periodeValide(p) {
  const d = p && typeof p.debut === 'string' && dateDepuisISO(p.debut);
  const f = p && typeof p.fin === 'string' && dateDepuisISO(p.fin);
  if (!d || !f || p.fin < p.debut) return periodeSemaineCourante();
  return { debut: p.debut, fin: p.fin };
}

/**
 * Version 1 → 2 : la semaine devient une période datée, et chaque recette
 * retenue devient une entrée de planning à part entière, avec son identifiant
 * et éventuellement un jour. Les données existantes deviennent des entrées
 * sans jour dans la semaine en cours — rien n'est perdu, rien ne bouge.
 */
function migrer1vers2(d) {
  const s = (d.semaine && typeof d.semaine === 'object') ? d.semaine : {};
  s.periode = periodeSemaineCourante();
  s.selection = (Array.isArray(s.selection) ? s.selection : []).map(function (e, n) {
    return { id: 'pl_' + suffixeCourt() + n, recetteId: e.recetteId, portions: e.portions, date: null };
  });
  d.semaine = s;
  (Array.isArray(d.recettes) ? d.recettes : []).forEach(function (r) {
    if (!Array.isArray(r.saisons)) r.saisons = [];
  });
  return d;
}

// Prévue dès la V1 même si elle ne fait rien : contrôle de schemaVersion au chargement.
function migrate(donnees) {
  if (!donnees || typeof donnees !== 'object') throw new Error('Données illisibles');
  let d = donnees;
  let v = (typeof d.schemaVersion === 'number') ? d.schemaVersion : 1;
  while (v < SCHEMA_VERSION) {
    if (v === 1) d = migrer1vers2(d);
    v += 1;
  }
  if (v > SCHEMA_VERSION) throw new Error('Fichier créé par une version plus récente de l\'application (schéma ' + v + ').');
  d.schemaVersion = SCHEMA_VERSION;
  return normaliserRacine(d);
}

/* ——— STOCKAGE ————————————————————————————————————————————————————————————
   Point critique de l'architecture. C'est le SEUL endroit du fichier qui
   touche au stockage du navigateur. Toute l'interface est asynchrone : la V2
   pourra remplacer l'implémentation par une base synchronisée sans qu'une
   seule ligne d'appelant ne change.
   ------------------------------------------------------------------------- */
const Store = (function () {
  const CLE_LOCALE = 'listeCourses.v1';          // document hors espace (V1, inchangé)
  const CLE_REGISTRE = 'listeCourses.espaces';   // liste des espaces connus de cet appareil
  const PREFIXE_ESPACE = 'listeCourses.espace.'; // cache local d'un espace synchronisé
  const DEBOUNCE_MS = 400;
  const SONDAGE_MS = 5000;

  let racine = null;          // objet racine en mémoire (source de vérité de la session)
  let minuteur = null;        // écriture différée
  let modeMemoire = false;    // true si l'écriture est impossible dans ce navigateur
  let auxPannes = null;
  let auxChangements = null;  // l'interface reçoit la racine mise à jour à distance
  let auxEtat = null;         // l'interface reçoit l'état de la synchronisation

  // État de synchronisation de l'espace courant.
  let espaceCourant = null;   // { id, cle, nom, serveur }
  let version = 0;            // dernière version connue du serveur
  let base = null;            // document tel que le serveur l'a, à notre connaissance
  let enAttente = [];         // opérations locales pas encore acceptées
  let etat = 'local';         // local | synchronise | envoi | horsligne | erreur
  let sondage = null;
  let echangeEnCours = false;
  const auteur = Math.random().toString(36).slice(2, 8);

  /* --- Accès brut au stockage du navigateur. Seul endroit du fichier. --- */
  function lireBrut(cle) {
    try { return localStorage.getItem(cle); }
    catch (e) { modeMemoire = true; if (auxPannes) auxPannes(e); return null; }
  }
  function ecrireBrut(cle, texte) {
    try { localStorage.setItem(cle, texte); return true; }
    catch (e) { modeMemoire = true; if (auxPannes) auxPannes(e); return false; }
  }
  function effacerBrut(cle) {
    try { localStorage.removeItem(cle); }
    catch (e) { modeMemoire = true; if (auxPannes) auxPannes(e); }
  }

  const copie = function (o) { return o === null || o === undefined ? o : JSON.parse(JSON.stringify(o)); };

  /* --- Registre des espaces (local à l'appareil, jamais synchronisé) --- */
  function lireRegistre() {
    try {
      const t = lireBrut(CLE_REGISTRE);
      const r = t ? JSON.parse(t) : null;
      if (!r || !Array.isArray(r.espaces)) return { courant: null, espaces: [] };
      return { courant: r.courant || null, espaces: r.espaces };
    } catch (e) { return { courant: null, espaces: [] }; }
  }
  function ecrireRegistre(r) { ecrireBrut(CLE_REGISTRE, JSON.stringify(r)); }

  function cleEspace(id) { return PREFIXE_ESPACE + id; }

  function signalerEtat(e) {
    if (e === etat) return;
    etat = e;
    if (auxEtat) auxEtat(etat, espaceCourant);
  }

  /* --- Écriture locale --- */
  function ecrireMaintenant() {
    if (minuteur) { clearTimeout(minuteur); minuteur = null; }
    if (racine === null) return;
    try {
      if (espaceCourant) {
        ecrireBrut(cleEspace(espaceCourant.id), JSON.stringify({
          document: racine, version: version, base: base, enAttente: enAttente,
        }));
      } else {
        ecrireBrut(CLE_LOCALE, JSON.stringify(racine));
      }
    } catch (e) { if (auxPannes) auxPannes(e); }
  }
  function programmerEcriture() {
    if (minuteur) clearTimeout(minuteur);
    minuteur = setTimeout(ecrireMaintenant, DEBOUNCE_MS);
  }

  /* --- Fabrication des opérations à partir des modifications locales --- */
  function noterModifications() {
    if (!espaceCourant || base === null) return;
    const ops = differencesEnOperations(base, racine);
    if (!ops.length) return;
    enAttente = enAttente.concat(ops);
    base = copie(racine);   // la base suit le local ; le serveur les recevra
  }

  /* --- Dialogue avec le serveur --- */
  function urlEspace(suffixe) {
    const s = String(espaceCourant.serveur).replace(/\/+$/, '');
    return s + '/api/espaces/' + espaceCourant.id + (suffixe || '');
  }
  function entetes() {
    return { 'Authorization': 'Bearer ' + espaceCourant.cle, 'Content-Type': 'application/json' };
  }

  async function echanger(forcerComplet) {
    if (!espaceCourant || echangeEnCours) return;
    echangeEnCours = true;
    try {
      // La position d'où l'on relit est celle d'AVANT l'envoi. Repartir de la
      // version renvoyée par le serveur ferait sauter tout ce que les autres
      // ont écrit entre-temps : celui qui pousse en dernier ne verrait jamais
      // le travail de l'autre. Relire ses propres opérations est sans effet,
      // elles sont idempotentes.
      const versionAvant = version;

      // 1. Pousser ce qui attend, pour que le serveur en tienne compte avant
      //    de nous répondre.
      if (enAttente.length) {
        signalerEtat('envoi');
        const aEnvoyer = enAttente.slice();
        const rep = await fetch(urlEspace('/operations'), {
          method: 'POST', headers: entetes(),
          body: JSON.stringify({ operations: aEnvoyer, auteur: auteur }),
        });
        if (!rep.ok) throw new Error('envoi refusé (' + rep.status + ')');
        await rep.json();
        enAttente = enAttente.slice(aEnvoyer.length);
      }

      // 2. Récupérer tout ce qui s'est écrit depuis notre position d'origine.
      const rep2 = await fetch(urlEspace('?depuis=' + (forcerComplet ? 0 : versionAvant)), { headers: entetes() });
      if (!rep2.ok) throw new Error('lecture refusée (' + rep2.status + ')');
      const r2 = await rep2.json();
      if (r2.nom && espaceCourant.nom !== r2.nom) {
        espaceCourant.nom = r2.nom;
        const reg = lireRegistre();
        const e = reg.espaces.find(function (x) { return x.id === espaceCourant.id; });
        if (e) { e.nom = r2.nom; ecrireRegistre(reg); }
      }

      let change = false;
      if (r2.document) {
        base = r2.document;
        version = r2.version;
        change = true;
      } else if (r2.operations && r2.operations.length) {
        r2.operations.forEach(function (entree) { appliquerOperations(base, entree.operations); });
        version = r2.version;
        change = true;
      }

      if (change) {
        // Le local est rebâti : ce que dit le serveur, plus ce qui n'est pas
        // encore parti. Sans ce rejeu, une saisie en cours serait écrasée.
        racine = normaliserRacine(appliquerOperations(copie(base), enAttente));
        ecrireMaintenant();
        if (auxChangements) auxChangements(racine);
      } else {
        ecrireMaintenant();
      }
      signalerEtat(enAttente.length ? 'envoi' : 'synchronise');
    } catch (e) {
      signalerEtat(navigator.onLine === false ? 'horsligne' : 'erreur');
    } finally {
      echangeEnCours = false;
    }
  }

  function demarrerSondage() {
    arreterSondage();
    if (!espaceCourant) return;
    sondage = setInterval(function () {
      if (document.visibilityState === 'visible') echanger(false);
    }, SONDAGE_MS);
  }
  function arreterSondage() { if (sondage) { clearInterval(sondage); sondage = null; } }

  async function ouvrirEspace(e) {
    espaceCourant = e;
    const t = lireBrut(cleEspace(e.id));
    let cache = null;
    try { cache = t ? JSON.parse(t) : null; } catch (err) { cache = null; }
    if (cache && cache.document) {
      racine = migrate(cache.document);
      base = cache.base || copie(racine);
      version = cache.version || 0;
      enAttente = Array.isArray(cache.enAttente) ? cache.enAttente : [];
    } else {
      racine = null; base = null; version = 0; enAttente = [];
    }
    signalerEtat('envoi');
    await echanger(racine === null);
    if (racine === null && base) racine = normaliserRacine(copie(base));
    demarrerSondage();
    return racine;
  }

  return {
    /** → l'objet racine complet, ou null si rien n'a encore été stocké. */
    async load() {
      const reg = lireRegistre();
      if (reg.courant) {
        const e = reg.espaces.find(function (x) { return x.id === reg.courant; });
        if (e) return await ouvrirEspace(e);
      }
      espaceCourant = null;
      arreterSondage();
      signalerEtat('local');
      const texte = lireBrut(CLE_LOCALE);
      if (texte === null || texte === '') return null;
      let brut;
      try { brut = JSON.parse(texte); }
      catch (e) { if (auxPannes) auxPannes(e); return null; }
      try { racine = migrate(brut); }
      catch (e) { if (auxPannes) auxPannes(e); return null; }
      return racine;
    },

    /** Remplace l'objet racine. L'écriture est différée (400 ms). */
    async save(donnees) {
      racine = donnees;
      noterModifications();
      programmerEcriture();
      if (espaceCourant) echanger(false);
      return racine;
    },

    /** Écriture ciblée : patch('semaine.coches.ing_riz', true). */
    async patch(chemin, valeur) {
      if (racine === null) return null;
      const parts = String(chemin).split('.');
      let noeud = racine;
      for (let i = 0; i < parts.length - 1; i++) {
        if (noeud[parts[i]] === undefined || noeud[parts[i]] === null) noeud[parts[i]] = {};
        noeud = noeud[parts[i]];
      }
      if (valeur === undefined) delete noeud[parts[parts.length - 1]];
      else noeud[parts[parts.length - 1]] = valeur;
      if (espaceCourant && base !== null) {
        enAttente.push(valeur === undefined ? { c: parts, d: true } : { c: parts, v: valeur });
        appliquerOperations(base, [valeur === undefined ? { c: parts, d: true } : { c: parts, v: valeur }]);
      }
      programmerEcriture();
      if (espaceCourant) echanger(false);
      return racine;
    },

    /** → chaîne JSON lisible. */
    async export() { return JSON.stringify(racine, null, 2); },

    /** Valide, migre si besoin, remplace. Écrit immédiatement. */
    async import(json) {
      let brut;
      if (typeof json === 'string') {
        try { brut = JSON.parse(json); }
        catch (e) { throw new Error('Fichier illisible : ce n\'est pas du JSON valide.'); }
      } else { brut = json; }
      if (!brut || typeof brut !== 'object' || !Array.isArray(brut.ingredients) || !Array.isArray(brut.recettes)) {
        throw new Error('Fichier inattendu : il ne contient ni « ingredients » ni « recettes ».');
      }
      racine = migrate(brut);
      noterModifications();
      ecrireMaintenant();
      if (espaceCourant) echanger(false);
      return racine;
    },

    /** Force l'écriture différée en attente (fermeture d'onglet, export…). */
    async flush() { ecrireMaintenant(); },

    /** Efface tout le contenu stocké et repart de zéro. */
    async reset(donnees) {
      racine = donnees || null;
      if (racine === null) {
        if (espaceCourant) effacerBrut(cleEspace(espaceCourant.id));
        else effacerBrut(CLE_LOCALE);
        return null;
      }
      noterModifications();
      ecrireMaintenant();
      if (espaceCourant) echanger(false);
      return racine;
    },

    /* --- Espaces partagés --- */

    /** Registre local : les espaces connus de cet appareil et celui affiché. */
    async espaces() {
      const reg = lireRegistre();
      return {
        courant: reg.courant,
        etat: etat,
        enAttente: enAttente.length,
        espaces: reg.espaces.map(function (e) { return { id: e.id, nom: e.nom, serveur: e.serveur }; }),
      };
    },

    /** Publie le document courant dans un nouvel espace et bascule dessus. */
    async creerEspace(nom, serveur, document) {
      const s = String(serveur).replace(/\/+$/, '');
      const rep = await fetch(s + '/api/espaces', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nom: nom || 'Mon espace', document: document || racine }),
      });
      if (!rep.ok) throw new Error('Le serveur a refusé la création (' + rep.status + ').');
      const r = await rep.json();
      const e = { id: r.id, cle: r.cle, nom: r.nom, serveur: s };
      const reg = lireRegistre();
      reg.espaces.push(e);
      reg.courant = e.id;
      ecrireRegistre(reg);
      espaceCourant = e;
      racine = document || racine;
      base = copie(racine);
      version = r.version || 1;
      enAttente = [];
      ecrireMaintenant();
      demarrerSondage();
      signalerEtat('synchronise');
      return { id: e.id, nom: e.nom, lien: this.lienPartage(e) };
    },

    /** Rejoint un espace existant à partir d'un lien de partage. */
    async rejoindreEspace(lien) {
      const infos = Store.lireLienPartage(lien);
      if (!infos) throw new Error('Lien de partage illisible.');
      const rep = await fetch(infos.serveur + '/api/espaces/' + infos.id, {
        headers: { 'Authorization': 'Bearer ' + infos.cle },
      });
      if (rep.status === 401) throw new Error('Clé refusée : ce lien n\'ouvre pas cet espace.');
      if (!rep.ok) throw new Error('Espace introuvable sur ce serveur.');
      const r = await rep.json();
      const e = { id: infos.id, cle: infos.cle, nom: r.nom || 'Espace partagé', serveur: infos.serveur };
      const reg = lireRegistre();
      if (!reg.espaces.some(function (x) { return x.id === e.id; })) reg.espaces.push(e);
      reg.courant = e.id;
      ecrireRegistre(reg);
      effacerBrut(cleEspace(e.id));
      return await ouvrirEspace(e);
    },

    /** Bascule sur un autre espace, ou sur les données locales si id est null. */
    async changerEspace(id) {
      ecrireMaintenant();
      const reg = lireRegistre();
      reg.courant = id || null;
      ecrireRegistre(reg);
      arreterSondage();
      version = 0; base = null; enAttente = []; racine = null;
      return await this.load();
    },

    /** Retire un espace de cet appareil. Le contenu reste sur le serveur. */
    async quitterEspace(id) {
      const reg = lireRegistre();
      reg.espaces = reg.espaces.filter(function (e) { return e.id !== id; });
      if (reg.courant === id) reg.courant = null;
      ecrireRegistre(reg);
      effacerBrut(cleEspace(id));
      if (espaceCourant && espaceCourant.id === id) {
        espaceCourant = null; arreterSondage();
        version = 0; base = null; enAttente = []; racine = null;
        signalerEtat('local');
        return await this.load();
      }
      return racine;
    },

    /** Lien à transmettre pour rejoindre un espace. La clé y est incluse. */
    lienPartage(espace) {
      const e = espace || espaceCourant;
      if (!e) return null;
      const socle = (typeof location !== 'undefined' && location.href)
        ? location.href.split('#')[0] : '';
      return socle + '#espace=' + encodeURIComponent(e.id) + '&cle=' + encodeURIComponent(e.cle) +
        '&serveur=' + encodeURIComponent(e.serveur);
    },

    /** Lit un lien de partage. → { id, cle, serveur } ou null. */
    lireLienPartage(lien) {
      const texte = String(lien || '');
      const frag = texte.indexOf('#') >= 0 ? texte.slice(texte.indexOf('#') + 1) : texte;
      const p = new URLSearchParams(frag);
      const id = p.get('espace'), cle = p.get('cle'), serveur = p.get('serveur');
      if (!id || !cle || !serveur) return null;
      return { id: id, cle: cle, serveur: String(serveur).replace(/\/+$/, '') };
    },

    /** Force un aller-retour avec le serveur. */
    async synchroniser() { await echanger(false); return etat; },

    /** true si ce navigateur refuse d'écrire (navigation privée, quota, stockage bloqué). */
    modeMemoire() { return modeMemoire; },

    /** Branche l'interface sur les pannes de stockage. */
    surPanne(cb) { auxPannes = cb; },
    /** L'interface reçoit la racine quand elle change à distance. */
    surChangement(cb) { auxChangements = cb; },
    /** L'interface reçoit l'état de la synchronisation. */
    surEtat(cb) { auxEtat = cb; },
  };
})();

/* ——— CALCULS ————————————————————————————————————————————————————————————
   Fonctions pures : elles ne lisent que leurs arguments et ne touchent ni au
   DOM ni au stockage. Elles sont donc testables isolément.
   ------------------------------------------------------------------------- */

/** Unités proposées à la saisie pour un ingrédient. Les familles sont étanches. */
function unitesDe(ingredient) {
  if (!ingredient) return [];
  if (ingredient.famille === 'piece') return [ingredient.unitePiece || 'pièce'];
  return UNITES[ingredient.famille].map(function (x) { return x.u; });
}

/** Facteur de conversion d'une unité vers l'unité de base de sa famille. */
function facteurUnite(famille, unite) {
  if (famille === 'piece') return 1;
  const table = UNITES[famille] || [];
  for (let i = 0; i < table.length; i++) if (table[i].u === unite) return table[i].f;
  return null;   // unité étrangère à la famille
}

/** Quantité saisie → quantité en unité de base (g, ml ou pièce). */
function versBase(quantite, unite, famille) {
  const f = facteurUnite(famille, unite);
  return (typeof quantite === 'number' && isFinite(quantite)) ? quantite * (f === null ? 1 : f) : 0;
}

/** Prix ramené à l'unité de base : €/g, €/ml ou €/pièce. null si prix inconnu. */
function prixParUniteBase(ingredient) {
  if (!ingredient || !ingredient.prix) return null;
  const v = ingredient.prix.valeur;
  if (typeof v !== 'number' || !isFinite(v)) return null;
  const par = ingredient.prix.par || PAR_PRIX_PAR_FAMILLE[ingredient.famille];
  if (par === 'kg' || par === 'L') return v / 1000;
  if (par === 'piece') return v;
  return null;
}

/* --- Formatage --- */
function formatNombre(n, maxDec) {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  const d = (maxDec === undefined) ? 2 : maxDec;
  let s = n.toFixed(d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s.replace('.', ',');
}
/** Lit un nombre saisi à la française : « 1,5 » → 1.5. Inverse de formatNombre. */
function parseNombre(txt) {
  if (txt === null || txt === undefined) return null;
  const s = String(txt).trim().replace(',', '.').replace(/\s/g, '');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}

function formatEuroFixe(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  return n.toFixed(2).replace('.', ',') + ' €';
}
// Le « h » français ne se laisse pas deviner : « d'huile » mais « de haricots ».
// Faute de dictionnaire, on liste les h muets qu'on croise en cuisine et on
// considère tous les autres comme aspirés.
const H_MUET = ['huile', 'herbe', 'huitre', 'hysope', 'haché', 'hache'];
/** Seule l'initiale passe en minuscule : « Herbes de Provence » garde sa majuscule. */
function minusculeInitiale(nom) {
  const n = String(nom || '');
  return n.charAt(0).toLowerCase() + n.slice(1);
}
/** Élision devant une voyelle : « de tomates », mais « d'œufs ». */
function elision(nom) {
  const n = String(nom || '');
  const norm = normaliserNom(n);
  if (/^h/i.test(norm)) {
    return H_MUET.some(function (m) { return norm.indexOf(normaliserNom(m)) === 0; }) ? "d'" + n : 'de ' + n;
  }
  return /^[aeiouyàâäéèêëiïîoôöuùûüœ]/i.test(n) ? "d'" + n : 'de ' + n;
}
/** Accord au pluriel des unités « pièce » : 3 gousses, 1 gousse, 0,5 gousse. */
function pluriel(mot, n) {
  const m = String(mot || 'pièce');
  if (!(n > 1)) return m;
  if (/[sxz]$/i.test(m)) return m;
  return m + 's';
}
/** Quantité en unité de base → texte affiché. La conversion n'a lieu qu'ici. */
function formatQuantiteBase(base, ingredient) {
  if (!ingredient) return formatNombre(base);
  if (ingredient.famille === 'masse') {
    return base >= 1000 ? formatNombre(base / 1000, 2) + ' kg' : formatNombre(base, 2) + ' g';
  }
  if (ingredient.famille === 'volume') {
    return base >= 1000 ? formatNombre(base / 1000, 2) + ' L' : formatNombre(base, 2) + ' ml';
  }
  return formatNombre(base, 2) + ' ' + pluriel(ingredient.unitePiece || 'pièce', base);
}

/* --- Rapprochement de noms (§4.3) --- */
function normaliserNom(txt) {
  return String(txt || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
/** Singulier approximatif : « tomates cerises » → « tomate cerise ». */
function singulierApprox(txt) {
  return normaliserNom(txt).split(' ').map(function (m) {
    if (m.length > 3 && /(?:aux|eaux)$/.test(m)) return m.replace(/(?:aux|eaux)$/, function (s) { return s === 'aux' ? 'al' : 'eau'; });
    if (m.length > 3 && /s$/.test(m)) return m.slice(0, -1);
    return m;
  }).join(' ');
}
function distanceLev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prec = new Array(n + 1);
  for (let j = 0; j <= n; j++) prec[j] = j;
  for (let i = 1; i <= m; i++) {
    let cour = [i];
    for (let j = 1; j <= n; j++) {
      cour[j] = Math.min(prec[j] + 1, cour[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prec = cour;
  }
  return prec[n];
}
/** Score de ressemblance entre 0 et 1 sur deux noms d'ingrédients. */
function ressemblance(a, b) {
  const na = singulierApprox(a), nb = singulierApprox(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  if (na.indexOf(nb) === 0 || nb.indexOf(na) === 0) return 0.9;
  if (na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0) return 0.8;
  const d = distanceLev(na, nb);
  const max = Math.max(na.length, nb.length);
  let score = Math.max(0, 1 - d / max);
  // Premier mot identique (« tomate concassee » / « tomate cerise ») : on pose la
  // question. Une proposition de fusion inutile coûte un clic, un doublon
  // silencieux pollue le référentiel pour toujours.
  const ta = na.split(' ')[0], tb = nb.split(' ')[0];
  if (ta === tb && ta.length >= 4) score = Math.max(score, 0.8);
  return score;
}
/** Ingrédients du référentiel ressemblant au nom saisi, du plus proche au moins proche. */
/* --- Lecture d'une liste d'ingrédients collée -----------------------------
   Une recette se copie plus vite qu'elle ne se retape. On lit « 200 g de riz »,
   « 1 c. à soupe d'huile », « 3 gousses d'ail », et on rend ce que
   l'application manipule : une quantité, une unité qu'elle connaît, un nom.
   Rien n'est deviné en silence : ce qui n'est pas compris ressort tel quel et
   passe par l'écran de confirmation avant d'être écrit.
   ------------------------------------------------------------------------- */

const FRACTIONS = { '½': 0.5, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 0.25, '¾': 0.75, '⅕': 0.2, '⅛': 0.125 };

// Les écritures rencontrées dans la vraie vie → l'unité de l'application.
// La comparaison se fait sur le nom normalisé : « c. à soupe » devient
// « c a soupe », d'où l'absence d'accents et de points à droite.
const UNITES_ECRITURES = [
  ['g',          ['g', 'gr', 'gramme', 'grammes']],
  ['kg',         ['kg', 'kilo', 'kilos', 'kilogramme', 'kilogrammes']],
  ['ml',         ['ml', 'millilitre', 'millilitres']],
  ['cl',         ['cl', 'centilitre', 'centilitres']],
  ['dl',         ['dl', 'decilitre', 'decilitres']],
  ['L',          ['l', 'litre', 'litres']],
  ['c. à soupe', ['c a soupe', 'c as', 'cas', 'cs', 'cuillere a soupe', 'cuilleres a soupe',
                  'cuiller a soupe', 'cuil a soupe', 'cuil soupe', 'cuillere a soupe rase']],
  ['c. à café',  ['c a cafe', 'c ac', 'cac', 'cc', 'cuillere a cafe', 'cuilleres a cafe',
                  'cuiller a cafe', 'cuil a cafe', 'cuil cafe']],
];
const FAMILLE_DE_UNITE = (function () {
  const m = {};
  UNITES.masse.forEach(function (x) { m[x.u] = 'masse'; });
  UNITES.volume.forEach(function (x) { m[x.u] = 'volume'; });
  UNITES_PIECE_SUGGEREES.forEach(function (u) { m[u] = 'piece'; });
  return m;
})();

/** Unité de l'application correspondant à une écriture libre, ou ''. */
function uniteEcrite(mots) {
  const q = normaliserNom(mots);
  if (!q) return '';
  for (let i = 0; i < UNITES_ECRITURES.length; i++) {
    if (UNITES_ECRITURES[i][1].indexOf(q) >= 0) return UNITES_ECRITURES[i][0];
  }
  // Unités « pièce » : le pluriel est la forme la plus courante à l'écrit.
  const sing = singulierApprox(q);
  for (let i = 0; i < UNITES_PIECE_SUGGEREES.length; i++) {
    const u = UNITES_PIECE_SUGGEREES[i];
    if (sing === singulierApprox(u)) return u;
  }
  return '';
}

/** « 1,5 », « 1/2 », « 1 1/2 », « ½ » → nombre. Rend null si ce n'en est pas un. */
function valeurQuantite(txt) {
  const t = String(txt || '').trim().replace(',', '.');
  if (FRACTIONS[t] !== undefined) return FRACTIONS[t];
  const mixte = t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (mixte) return Number(mixte[3]) ? Number(mixte[1]) + Number(mixte[2]) / Number(mixte[3]) : null;
  const frac = t.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (frac) return Number(frac[2]) ? Number(frac[1]) / Number(frac[2]) : null;
  const n = Number(t);
  return isFinite(n) && t !== '' ? n : null;
}

/**
 * Une ligne collée → { quantite, unite, famille, nom } ; ou { portions } pour
 * un « Pour 4 personnes » ; ou { titre } pour un intertitre du genre
 * « Pour la sauce : » ; ou null si la ligne est vide.
 */
function analyserLigneIngredient(texte) {
  const brut = String(texte || '').replace(/\s+/g, ' ').trim().replace(/^[-–—•*·]+\s*/, '').trim();
  if (!brut) return null;

  const pers = brut.match(/^pour\s+(\d{1,2})\s*(?:personnes?|parts?|portions?|pers\.?)\b/i);
  if (pers) return { portions: parseInt(pers[1], 10) };

  let reste = brut;
  let quantite = null;
  const q = reste.match(/^(\d+\s+\d+\s*\/\s*\d+|\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?|[½⅓⅔¼¾⅕⅛])\s*/);
  if (q) { quantite = valeurQuantite(q[1]); reste = reste.slice(q[0].length); }

  // L'unité peut tenir en plusieurs mots (« c. à soupe ») : on essaie du plus
  // long au plus court, sans quoi « c » serait pris pour une unité à lui seul.
  let unite = '';
  const mots = reste.split(' ').filter(Boolean);
  for (let n = Math.min(4, mots.length); n >= 1; n--) {
    const u = uniteEcrite(mots.slice(0, n).join(' '));
    if (u) { unite = u; mots.splice(0, n); break; }
  }
  reste = mots.join(' ');

  // « de riz », « d'ail », « de la crème » : le liant n'appartient pas au nom.
  reste = reste.replace(/^(?:de\s+la\s+|de\s+l['’]\s*|d['’]\s*|de\s+|du\s+|des\s+)/i, '').trim();
  if (!reste) return quantite === null && !unite ? null : { quantite: quantite, unite: unite, famille: FAMILLE_DE_UNITE[unite] || 'piece', nom: '' };

  // « Pour la sauce : » et consorts ne sont pas des ingrédients.
  if (quantite === null && !unite && /[:：]\s*$/.test(brut)) return { titre: brut };

  return {
    quantite: quantite,
    unite: unite,
    famille: FAMILLE_DE_UNITE[unite] || 'piece',
    nom: reste.charAt(0).toUpperCase() + reste.slice(1),
  };
}

/**
 * Un bloc collé → { portions, lignes:[…], ignores:[…] }.
 * Quand le texte est à puces — le cas d'un site de cuisine, ou d'une recette
 * partagée par l'application — seules les lignes à puce sont des ingrédients :
 * le titre et les étapes n'en sont pas. Ce qui est écarté est dit, pas jeté.
 */
function analyserCollage(texte) {
  const sortie = { portions: null, lignes: [], ignores: [] };
  const brutes = String(texte || '').split(/[\r\n;]+/);
  const puces = brutes.filter(function (l) { return /^\s*[-–—•*·]\s+/.test(l); });
  const retenues = puces.length >= 2 ? puces : brutes;
  brutes.forEach(function (l) {
    const a = analyserLigneIngredient(l);
    if (!a) return;
    if (a.portions) { sortie.portions = a.portions; return; }
    if (a.titre || retenues.indexOf(l) < 0) {
      const t = String(l).trim();
      if (t) sortie.ignores.push(t.length > 60 ? t.slice(0, 57) + '…' : t);
      return;
    }
    sortie.lignes.push(a);
  });
  return sortie;
}

/**
 * Rapproche une ligne lue du référentiel : même nom exact, sinon la
 * ressemblance la plus forte. Rend { ingredient, exact } ou null.
 */
function rapprocherIngredient(ingredients, nom) {
  const q = normaliserNom(nom);
  if (!q) return null;
  for (let i = 0; i < ingredients.length; i++) {
    const ing = ingredients[i];
    if (normaliserNom(ing.nom) === q) return { ingredient: ing, exact: true };
    for (let a = 0; a < ing.aliases.length; a++) {
      if (normaliserNom(ing.aliases[a]) === q) return { ingredient: ing, exact: true };
    }
  }
  const proches = trouverSimilaires(ingredients, nom, 0.82);
  return proches.length ? { ingredient: proches[0].ingredient, exact: false } : null;
}

function trouverSimilaires(ingredients, nom, seuil) {
  const s = (seuil === undefined) ? 0.78 : seuil;
  const res = [];
  for (let i = 0; i < ingredients.length; i++) {
    const ing = ingredients[i];
    let score = ressemblance(nom, ing.nom);
    for (let a = 0; a < ing.aliases.length; a++) {
      score = Math.max(score, ressemblance(nom, ing.aliases[a]));
    }
    if (score >= s) res.push({ ingredient: ing, score: score });
  }
  res.sort(function (x, y) { return y.score - x.score; });
  return res;
}

/* --- Agrégation de la semaine (§4.2) --- */

function indexIngredients(donnees) {
  const map = new Map();
  for (let i = 0; i < donnees.ingredients.length; i++) map.set(donnees.ingredients[i].id, donnees.ingredients[i]);
  return map;
}
function indexRecettes(donnees) {
  const map = new Map();
  for (let i = 0; i < donnees.recettes.length; i++) map.set(donnees.recettes[i].id, donnees.recettes[i]);
  return map;
}

/**
 * Agrège une sélection de recettes en lignes de liste.
 * Chaque ligne conserve sa provenance recette par recette.
 * → { lignes:[{ingredient, base, cout, provenance:[{recetteId,nom,base}]}] }
 */
function agregerSelection(donnees, selection) {
  const parIng = indexIngredients(donnees);
  const parRec = indexRecettes(donnees);
  const cumul = new Map();

  for (let s = 0; s < selection.length; s++) {
    const sel = selection[s];
    const rec = parRec.get(sel.recetteId);
    if (!rec) continue;
    const portions = (typeof sel.portions === 'number' && sel.portions > 0) ? sel.portions : 1;
    for (let l = 0; l < rec.lignes.length; l++) {
      const ligne = rec.lignes[l];
      const ing = parIng.get(ligne.ingredientId);
      if (!ing) continue;
      const base = versBase(ligne.quantite, ligne.unite, ing.famille) * (ligne.fixe ? 1 : portions);
      if (!(base > 0)) continue;
      let entree = cumul.get(ing.id);
      if (!entree) {
        entree = { ingredient: ing, base: 0, provenance: [] };
        cumul.set(ing.id, entree);
      }
      entree.base += base;
      const dejaVu = entree.provenance.find(function (p) { return p.recetteId === rec.id; });
      if (dejaVu) dejaVu.base += base;
      else entree.provenance.push({ recetteId: rec.id, nom: rec.nom, base: base });
    }
  }

  const lignes = Array.from(cumul.values());
  for (let i = 0; i < lignes.length; i++) {
    const pu = prixParUniteBase(lignes[i].ingredient);
    lignes[i].cout = (pu === null) ? null : lignes[i].base * pu;
  }
  lignes.sort(function (a, b) { return a.ingredient.nom.localeCompare(b.ingredient.nom, 'fr'); });
  return { lignes: lignes };
}

/** Coût total d'une sélection (hors produits de placard, prix manquants ignorés). */
function coutSelection(donnees, selection) {
  const agr = agregerSelection(donnees, selection);
  let total = 0, sansPrix = 0;
  for (let i = 0; i < agr.lignes.length; i++) {
    const l = agr.lignes[i];
    if (l.ingredient.placard) continue;
    if (l.cout === null) sansPrix += 1; else total += l.cout;
  }
  return { total: total, sansPrix: sansPrix };
}

/** Coût d'une recette pour un nombre de portions donné, et coût par portion. */
function coutRecette(donnees, recette, portions) {
  const p = (typeof portions === 'number' && portions > 0) ? portions : (recette.portionsDefaut || 4);
  const c = coutSelection(donnees, [{ recetteId: recette.id, portions: p }]);
  return { total: c.total, parPortion: c.total / p, sansPrix: c.sansPrix, portions: p };
}

/**
 * Construit le modèle de vue de la liste de courses : lignes agrégées,
 * articles manuels, regroupement par rayon dans l'ordre de l'utilisateur,
 * section placard à part, et tous les totaux.
 */
function construireListe(donnees) {
  const agr = agregerSelection(donnees, selectionActive(donnees));
  const coches = donnees.semaine.coches || {};
  const articles = [];   // hors placard
  const placard = [];

  for (let i = 0; i < agr.lignes.length; i++) {
    const l = agr.lignes[i];
    const art = {
      cle: l.ingredient.id,
      type: 'ingredient',
      nom: l.ingredient.nom,
      rayon: l.ingredient.rayon || 'autre',
      ingredient: l.ingredient,
      base: l.base,
      texteQuantite: formatQuantiteBase(l.base, l.ingredient),
      cout: l.cout,
      provenance: l.provenance,
      coche: !!coches[l.ingredient.id],
    };
    if (l.ingredient.placard) placard.push(art); else articles.push(art);
  }

  const manuels = donnees.semaine.ajoutsManuels || [];
  for (let i = 0; i < manuels.length; i++) {
    const m = manuels[i];
    articles.push({
      cle: m.id,
      type: 'manuel',
      nom: m.nom,
      rayon: m.rayon || 'autre',
      ingredient: null,
      base: null,
      texteQuantite: (typeof m.quantite === 'number' && m.quantite) ? (formatNombre(m.quantite, 2) + (m.unite ? ' ' + m.unite : '')) : '',
      cout: null,
      provenance: null,
      coche: !!coches[m.id],
      manuel: m,
    });
  }

  // Totaux
  let totalTous = 0, totalRestant = 0, sansPrixTous = 0, sansPrixRestant = 0, nbCoches = 0;
  for (let i = 0; i < articles.length; i++) {
    const a = articles[i];
    if (a.coche) nbCoches += 1;
    if (a.cout === null) {
      if (a.type === 'ingredient') { sansPrixTous += 1; if (!a.coche) sansPrixRestant += 1; }
    } else {
      totalTous += a.cout;
      if (!a.coche) totalRestant += a.cout;
    }
  }

  // Regroupement par rayon, dans l'ordre choisi par l'utilisateur.
  const ordre = donnees.reglages.ordreRayons;
  const parRayon = new Map();
  for (let i = 0; i < articles.length; i++) {
    const a = articles[i];
    const r = RAYON_LIBELLE[a.rayon] ? a.rayon : 'autre';
    if (!parRayon.has(r)) parRayon.set(r, []);
    parRayon.get(r).push(a);
  }
  const groupes = [];
  const rayonsTries = ordre.filter(function (r) { return parRayon.has(r); })
    .concat(Array.from(parRayon.keys()).filter(function (r) { return ordre.indexOf(r) < 0; }));
  for (let i = 0; i < rayonsTries.length; i++) {
    const r = rayonsTries[i];
    const liste = parRayon.get(r);
    // Non cochés d'abord (alphabétique), cochés repoussés en bas du rayon.
    liste.sort(function (a, b) {
      if (a.coche !== b.coche) return a.coche ? 1 : -1;
      return a.nom.localeCompare(b.nom, 'fr');
    });
    const nbCoche = liste.filter(function (a) { return a.coche; }).length;
    groupes.push({
      rayon: r,
      libelle: RAYON_LIBELLE[r] || 'Autre',
      articles: liste,
      nbCoches: nbCoche,
      tousCoches: liste.length > 0 && nbCoche === liste.length,
    });
  }

  placard.sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

  return {
    groupes: groupes,
    articles: articles,
    placard: placard,
    totaux: {
      nbArticles: articles.length,
      nbCoches: nbCoches,
      totalTous: totalTous,
      totalRestant: totalRestant,
      sansPrixTous: sansPrixTous,
      sansPrixRestant: sansPrixRestant,
    },
  };
}

/* --- Recherche et filtres du catalogue de recettes (§5.1) --- */

/**
 * Ingrédients d'une recette dont le nom ou un alias correspond à la recherche.
 * C'est ce qui permet de partir de ce qu'on a dans le frigo : « courgette »
 * remonte les recettes qui en contiennent, pas seulement celles qui le disent
 * dans leur titre.
 * → [nom d'ingrédient], vide si aucune correspondance.
 */
function ingredientsCorrespondants(recette, texte, parIngredient) {
  const q = normaliserNom(texte);
  if (!q) return [];
  const trouves = [];
  for (let i = 0; i < recette.lignes.length; i++) {
    const ing = parIngredient.get(recette.lignes[i].ingredientId);
    if (!ing) continue;
    if (trouves.indexOf(ing.nom) >= 0) continue;
    const cible = normaliserNom(ing.nom);
    const viaAlias = ing.aliases.some(function (a) { return normaliserNom(a).indexOf(q) >= 0; });
    if (cible.indexOf(q) >= 0 || viaAlias) trouves.push(ing.nom);
  }
  return trouves;
}

/**
 * Filtre le catalogue de recettes. Fonction pure : elle ne lit que ses arguments.
 * criteres = { texte, tag, tempsMax, temperature }
 *   tempsMax    : minutes, 0 = pas de limite
 *   temperature : '' | 'chaud' | 'froid'
 *   saison      : '' | 'printemps' | 'ete' | 'automne' | 'hiver'
 * → [{ recette, ingredientsTrouves:[] }] — ingredientsTrouves n'est rempli que
 *   lorsque c'est un ingrédient, et non le nom ou un tag, qui a fait mouche.
 */
function filtrerRecettes(donnees, criteres) {
  const c = criteres || {};
  const q = normaliserNom(c.texte);
  const parIngredient = indexIngredients(donnees);
  const resultat = [];

  for (let i = 0; i < donnees.recettes.length; i++) {
    const r = donnees.recettes[i];

    if (c.tag && r.tags.indexOf(c.tag) < 0) continue;

    if (c.tempsMax) {
      // Une recette sans temps renseigné n'est pas écartée par un filtre de temps :
      // l'absence d'information n'est pas une information.
      if (typeof r.tempsPreparationMin === 'number' && r.tempsPreparationMin > c.tempsMax) continue;
    }

    // Contrairement au temps, une recette non classée est écartée : sinon le
    // filtre ne filtre rien. La vue signale combien de recettes sont masquées
    // pour cette raison, afin qu'on sache qu'il reste des fiches à renseigner.
    if (c.temperature && r.temperature !== c.temperature) continue;

    // Une recette qui ne déclare aucune saison passe toujours : elle est de
    // toute l'année, ce n'est pas une information manquante.
    if (c.saison && !estDeSaison(r, c.saison)) continue;

    let ingredientsTrouves = [];
    if (q) {
      const parNom = normaliserNom(r.nom).indexOf(q) >= 0;
      const parTag = r.tags.some(function (t) { return normaliserNom(t).indexOf(q) >= 0; });
      ingredientsTrouves = ingredientsCorrespondants(r, c.texte, parIngredient);
      if (!parNom && !parTag && !ingredientsTrouves.length) continue;
      if (parNom || parTag) ingredientsTrouves = [];
    }
    resultat.push({ recette: r, ingredientsTrouves: ingredientsTrouves });
  }
  return resultat;
}

/** Ingrédients qu'aucune recette n'utilise. Fonction pure. */
function ingredientsInutilises(donnees) {
  const utilises = new Set();
  donnees.recettes.forEach(function (r) {
    r.lignes.forEach(function (l) { utilises.add(l.ingredientId); });
  });
  return donnees.ingredients.filter(function (i) { return !utilises.has(i.id); });
}

/**
 * Entrées de planning couvertes par la période d'achat : celles datées dans la
 * période, et celles sans jour précis. Planifier loin ne fait donc rien acheter
 * d'avance — c'est la période qui décide, pas le planning.
 */
function selectionActive(donnees) {
  const p = donnees.semaine.periode;
  return donnees.semaine.selection.filter(function (e) {
    // Absence de jour sous toutes ses formes : null, undefined, chaîne vide.
    return !e.date || dansLaPeriode(e.date, p);
  });
}

/** Entrées planifiées un jour donné. */
function selectionDuJour(donnees, iso) {
  return donnees.semaine.selection.filter(function (e) { return e.date === iso; });
}

/**
 * Replace un plan enregistré dans une autre période. Les dates d'une semaine
 * type ou d'une semaine archivée sont celles du jour où on les a faites :
 * telles quelles, les repas tombent hors de la période d'achat et sortent de
 * la liste sans rien dire. On conserve donc le jour de la semaine et les écarts
 * entre repas ; ce qui déborde revient sans jour, et reste donc dans la liste.
 */
function rebaserSelection(sel, periode) {
  const copies = (sel || []).map(function (s) { return Object.assign({}, s); });
  const datees = copies.map(function (s) { return s.date; })
    .filter(function (d) { return d && dateDepuisISO(d); }).sort();
  const debut = dateDepuisISO(periode.debut);
  const origine = datees.length ? dateDepuisISO(datees[0]) : null;
  // Sans point de départ exploitable il n'y a rien à replacer, mais une date
  // illisible ne doit pas survivre au passage.
  if (!debut || !origine) {
    return copies.map(function (s) { if (!s.date || !dateDepuisISO(s.date)) s.date = null; return s; });
  }
  // Le premier repas daté retombe sur le même jour de la semaine, au plus tôt.
  const ancre = ajouterJours(debut, ((origine.getDay() - debut.getDay()) + 7) % 7);
  return copies.map(function (s) {
    if (!s.date) { s.date = null; return s; }
    const d = dateDepuisISO(s.date);
    if (!d) { s.date = null; return s; }
    const neuf = isoDuJour(ajouterJours(ancre, Math.round((d - origine) / 86400000)));
    s.date = dansLaPeriode(neuf, periode) ? neuf : null;
    return s;
  });
}

/**
 * Rayons frais présents dans la liste. Sert à prévenir quand la période
 * dépasse la semaine : ce n'est pas le planning qui périme, c'est l'achat.
 */
function rayonsFraisDeLaListe(donnees) {
  const parIng = indexIngredients(donnees);
  const trouves = new Set();
  agregerSelection(donnees, selectionActive(donnees)).lignes.forEach(function (l) {
    const ing = parIng.get(l.ingredient.id) || l.ingredient;
    if (!ing.placard && RAYONS_FRAIS.indexOf(ing.rayon) >= 0) trouves.add(ing.rayon);
  });
  return Array.from(trouves);
}

/** Une recette est de saison si elle ne déclare rien, ou si elle déclare celle-ci. */
function estDeSaison(recette, saison) {
  return !recette.saisons.length || recette.saisons.indexOf(saison) >= 0;
}

/**
 * Cases à cocher débarrassées de celles qui ne correspondent plus à un article
 * de la liste. Sans ça, retirer une recette puis la remettre ferait réapparaître
 * ses ingrédients déjà cochés — et on ne les achèterait pas.
 */
function cochesNettoyees(donnees) {
  const valides = new Set();
  agregerSelection(donnees, selectionActive(donnees)).lignes.forEach(function (l) {
    valides.add(l.ingredient.id);
  });
  (donnees.semaine.ajoutsManuels || []).forEach(function (m) { valides.add(m.id); });
  const propres = {};
  const coches = donnees.semaine.coches || {};
  Object.keys(coches).forEach(function (cle) {
    if (coches[cle] && valides.has(cle)) propres[cle] = true;
  });
  return propres;
}

/**
 * Lit une quantité saisie librement : « 6 » → 6, « 2 kg » → 2 kg,
 * « 1,5 L » → 1,5 L, « du café » → rien. Sert aux articles ajoutés à la main,
 * dont le rayon et le nom suffisent souvent mais pas toujours.
 */
function analyserQuantiteLibre(texte) {
  const t = String(texte || '').trim();
  if (!t) return { quantite: null, unite: null };
  const m = t.match(/^(-?[\d]+(?:[.,][\d]+)?)\s*(.*)$/);
  if (!m) return { quantite: null, unite: t };
  const n = parseNombre(m[1]);
  const reste = m[2].trim();
  return { quantite: n, unite: reste || null };
}

/**
 * Recettes que le filtre chaud/froid écarte uniquement parce qu'elles ne sont
 * pas classées — elles satisfont tous les autres critères.
 */
function recettesNonClassees(donnees, criteres) {
  const c = criteres || {};
  if (!c.temperature) return [];
  const sansTemperature = Object.assign({}, c, { temperature: '' });
  return filtrerRecettes(donnees, sansTemperature)
    .filter(function (x) { return !x.recette.temperature; })
    .map(function (x) { return x.recette; });
}

/**
 * Ordonne le catalogue. Les recettes sans prix connu finissent toujours en
 * dernier : les classer à zéro les ferait passer pour les moins chères.
 */
function trierRecettes(donnees, resultats, tri, portionsBase) {
  const cout = new Map();
  const coutDe = function (r) {
    if (!cout.has(r.id)) {
      // Sur la même base que le prix affiché sur la carte, sinon l'ordre
      // contredirait les prix qu'on a sous les yeux. Une base commune rend
      // aussi la comparaison honnête entre recettes.
      const c = coutRecette(donnees, r, portionsBase || 4);
      cout.set(r.id, c.total > 0 ? c.parPortion : null);
    }
    return cout.get(r.id);
  };
  const parNom = function (a, b) { return a.recette.nom.localeCompare(b.recette.nom, 'fr'); };
  const liste = resultats.slice();
  if (tri === 'prix' || tri === 'prix-desc') {
    const sens = tri === 'prix' ? 1 : -1;
    liste.sort(function (a, b) {
      const x = coutDe(a.recette), y = coutDe(b.recette);
      if (x === null && y === null) return parNom(a, b);
      if (x === null) return 1;
      if (y === null) return -1;
      if (x !== y) return (x - y) * sens;
      return parNom(a, b);
    });
  } else {
    liste.sort(parNom);
  }
  return liste;
}

/** Jours écoulés depuis une date ISO (aaaa-mm-jj). null si absente. */
function joursDepuis(dateISO) {
  if (!dateISO) return null;
  const d = new Date(dateISO + (dateISO.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d.getTime())) return null;
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  return Math.round((auj - d) / 86400000);
}
function texteFraicheur(dateISO) {
  const j = joursDepuis(dateISO);
  if (j === null || j < 0 || j > 14) return null;
  if (j === 0) return "faite aujourd'hui";
  if (j === 1) return 'faite hier';
  return 'faite il y a ' + j + ' jours';
}
function formatDateCourte(dateISO) {
  if (!dateISO) return '';
  const d = new Date(dateISO + (dateISO.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d.getTime())) return dateISO;
  return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
}

/** Texte de total tenant compte des prix manquants (§4.4). */
function texteTotal(total, sansPrix) {
  const base = formatEuroFixe(total);
  if (!sansPrix) return base;
  return '≥ ' + base + ' (' + sansPrix + ' ingrédient' + (sansPrix > 1 ? 's' : '') + ' sans prix)';
}

/* ——— SYNCHRONISATION : DIFFÉRENCES ET FUSION —————————————————————————————
   Deux personnes modifient le même espace, parfois hors ligne. Plutôt que
   d'envoyer le document entier — où le dernier arrivé écrase tout le travail
   de l'autre — on envoie des opérations ciblées : « tel chemin vaut telle
   valeur ». Deux modifications sur des chemins différents se fusionnent sans
   se marcher dessus ; sur le même chemin, la plus récente gagne.

   Fonctions pures : elles ne lisent que leurs arguments.
   ------------------------------------------------------------------------- */

// Tableaux dont les entrées ont une identité : on les compare entrée par
// entrée, pas position par position. Ajouter une recette pendant que l'autre
// en ajoute une autre doit conserver les deux.
const COLLECTIONS_CLEF = {
  'ingredients': 'id',
  'recettes': 'id',
  'semainesTypes': 'id',
  'semaine.selection': 'id',
  'semaine.ajoutsManuels': 'id',
};

// Valeurs traitées d'un bloc : les découper apporterait de la complexité sans
// gain de fusion réel. Les « * » remplacent une clé d'entrée quelconque.
const VALEURS_OPAQUES = [
  'historique',
  'reglages.ordreRayons',
  'recettes.*.tags',
  'recettes.*.lignes',
  'recettes.*.saisons',
  'semainesTypes.*.selection',
  'ingredients.*.aliases',
  'ingredients.*.prix',
];

function motifChemin(chemin) { return chemin.join('.'); }

function estOpaque(chemin) {
  const m = motifChemin(chemin);
  for (let i = 0; i < VALEURS_OPAQUES.length; i++) {
    const motif = VALEURS_OPAQUES[i];
    if (motif === m) return true;
    if (motif.indexOf('*') >= 0) {
      const rx = new RegExp('^' + motif.split('.').map(function (seg) {
        return seg === '*' ? '[^.]+' : seg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }).join('\\.') + '$');
      if (rx.test(m)) return true;
    }
  }
  return false;
}

function clefCollection(chemin) {
  return COLLECTIONS_CLEF[motifChemin(chemin)] || null;
}

function memeValeur(a, b) {
  return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
}
function estObjetSimple(x) {
  return x !== null && typeof x === 'object' && !Array.isArray(x);
}

/**
 * Compare deux documents et en tire la liste des opérations qui font passer
 * de l'un à l'autre.
 * → [{ c: [chemin], v: valeur }] pour une écriture, { c, d: true } pour une
 *   suppression.
 */
function differencesEnOperations(avant, apres, chemin) {
  const base = chemin || [];
  const ops = [];

  if (estOpaque(base)) {
    if (!memeValeur(avant, apres)) ops.push({ c: base, v: apres === undefined ? null : apres });
    return ops;
  }

  const clef = clefCollection(base);
  if (clef && Array.isArray(avant) && Array.isArray(apres)) {
    const indexAvant = new Map(avant.map(function (e) { return [e[clef], e]; }));
    const indexApres = new Map(apres.map(function (e) { return [e[clef], e]; }));
    indexAvant.forEach(function (e, k) {
      if (!indexApres.has(k)) ops.push({ c: base.concat(String(k)), d: true });
    });
    indexApres.forEach(function (e, k) {
      const ancien = indexAvant.get(k);
      if (ancien === undefined) { ops.push({ c: base.concat(String(k)), v: e }); return; }
      Array.prototype.push.apply(ops, differencesEnOperations(ancien, e, base.concat(String(k))));
    });
    // L'ordre du tableau compte pour l'affichage : on le note à part.
    const ordreAvant = avant.map(function (e) { return String(e[clef]); }).join('\u0000');
    const ordreApres = apres.map(function (e) { return String(e[clef]); }).join('\u0000');
    if (ordreAvant !== ordreApres) {
      ops.push({ c: base.concat('__ordre'), v: apres.map(function (e) { return String(e[clef]); }) });
    }
    return ops;
  }

  if (estObjetSimple(avant) && estObjetSimple(apres)) {
    const clefs = new Set(Object.keys(avant).concat(Object.keys(apres)));
    clefs.forEach(function (k) {
      if (!(k in apres)) { ops.push({ c: base.concat(k), d: true }); return; }
      if (!(k in avant)) { ops.push({ c: base.concat(k), v: apres[k] }); return; }
      Array.prototype.push.apply(ops, differencesEnOperations(avant[k], apres[k], base.concat(k)));
    });
    return ops;
  }

  if (!memeValeur(avant, apres)) ops.push({ c: base, v: apres === undefined ? null : apres });
  return ops;
}

/** Applique une opération à un document. Modifie le document en place. */
function appliquerOperation(doc, op) {
  const chemin = op.c;
  if (!chemin.length) return doc;

  let noeud = doc;
  for (let i = 0; i < chemin.length - 1; i++) {
    const seg = chemin[i];
    const clef = clefCollection(chemin.slice(0, i + 1));
    if (clef && Array.isArray(noeud[seg])) {
      // Le segment suivant est une clé d'entrée, pas un indice.
      const suivant = chemin[i + 1];
      let entree = noeud[seg].find(function (e) { return String(e[clef]) === String(suivant); });
      if (!entree) {
        if (i + 2 === chemin.length && op.d) return doc;   // suppression d'un absent
        if (i + 2 === chemin.length) { noeud[seg].push(op.v); return doc; }
        entree = {}; entree[clef] = suivant; noeud[seg].push(entree);
      }
      if (i + 2 === chemin.length) {
        if (op.d) {
          noeud[seg] = noeud[seg].filter(function (e) { return String(e[clef]) !== String(suivant); });
        } else {
          const idx = noeud[seg].indexOf(entree);
          noeud[seg][idx] = op.v;
        }
        return doc;
      }
      noeud = entree;
      i += 1;   // le segment de clé est consommé
      continue;
    }
    if (noeud[seg] === undefined || noeud[seg] === null) noeud[seg] = {};
    noeud = noeud[seg];
  }

  const dernier = chemin[chemin.length - 1];

  // Réordonnancement d'une collection identifiée.
  if (dernier === '__ordre' && Array.isArray(noeud[chemin[chemin.length - 2]])) {
    return doc;   // traité au niveau du parent, plus bas
  }
  if (op.d) delete noeud[dernier];
  else noeud[dernier] = op.v;
  return doc;
}

/** Applique une suite d'opérations, dans l'ordre reçu. */
function appliquerOperations(doc, operations) {
  const ordres = [];
  (operations || []).forEach(function (op) {
    if (op.c[op.c.length - 1] === '__ordre') { ordres.push(op); return; }
    appliquerOperation(doc, op);
  });
  // Les réordonnancements se font en dernier, une fois les entrées en place.
  ordres.forEach(function (op) {
    const cheminTableau = op.c.slice(0, -1);
    const clef = clefCollection(cheminTableau);
    if (!clef) return;
    let noeud = doc;
    for (let i = 0; i < cheminTableau.length - 1; i++) noeud = noeud[cheminTableau[i]];
    const nom = cheminTableau[cheminTableau.length - 1];
    if (!Array.isArray(noeud[nom])) return;
    const parClef = new Map(noeud[nom].map(function (e) { return [String(e[clef]), e]; }));
    const ordonne = [];
    (op.v || []).forEach(function (k) { if (parClef.has(k)) { ordonne.push(parClef.get(k)); parClef.delete(k); } });
    parClef.forEach(function (e) { ordonne.push(e); });   // entrées arrivées depuis
    noeud[nom] = ordonne;
  });
  return doc;
}

/* ——— OUTILS UI ——————————————————————————————————————————————————————————
   Aucune boîte de dialogue native : toasts, bandeau d'annulation et modales
   sont des composants intégrés, non bloquants.
   ------------------------------------------------------------------------- */

const $ = function (sel, racine) { return (racine || document).querySelector(sel); };
const $$ = function (sel, racine) { return Array.prototype.slice.call((racine || document).querySelectorAll(sel)); };

function esc(txt) {
  return String(txt === null || txt === undefined ? '' : txt)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function el(tag, attrs, enfants) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, '');
      else if (attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
  }
  (enfants || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

/* --- Toasts et bandeau d'annulation (5 s) --- */
function toast(message, options) {
  const opt = options || {};
  const zone = $('#zone-toasts');
  const boite = el('div', { class: 'toast', role: 'status' }, [el('span', { text: message })]);
  let minuteur = null;
  const fermer = function () { if (minuteur) clearTimeout(minuteur); if (boite.parentNode) boite.remove(); };
  if (opt.actionLabel && opt.onAction) {
    boite.appendChild(el('button', {
      type: 'button',
      text: opt.actionLabel,
      onclick: function () { fermer(); opt.onAction(); },
    }));
  }
  zone.appendChild(boite);
  minuteur = setTimeout(fermer, opt.duree || 4000);
  return fermer;
}
/** Suppression annulable pendant 5 secondes. */
function supprimerAvecAnnulation(libelle, restaurer) {
  toast(libelle + ' — supprimé', { duree: 5000, actionLabel: 'Annuler', onAction: restaurer });
}

/* --- Modale --- */
let modaleOuverte = null;
function fermerModale() {
  if (!modaleOuverte) return;
  const m = modaleOuverte;
  modaleOuverte = null;
  m.fond.remove();
  document.removeEventListener('keydown', m.onKey, true);
  if (m.focusPrecedent && m.focusPrecedent.focus) { try { m.focusPrecedent.focus(); } catch (e) {} }
}
/**
 * ouvrirModale({ titre, corps:[Node], actions:[{label,variant,onClick,fermer}] })
 * onClick reçoit une fonction « fermer ». Retourne l'élément .modal.
 */
function ouvrirModale(cfg) {
  fermerModale();
  const focusPrecedent = document.activeElement;
  const boite = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': cfg.titre || 'Fenêtre' });
  if (cfg.titre) boite.appendChild(el('h2', { text: cfg.titre }));
  (cfg.corps || []).forEach(function (c) { boite.appendChild(c); });
  const actions = el('div', { class: 'actions' });
  (cfg.actions || []).filter(Boolean).forEach(function (a) {
    actions.appendChild(el('button', {
      type: 'button', class: 'btn ' + (a.variant || ''), text: a.label,
      onclick: function () { a.onClick ? a.onClick(fermerModale) : fermerModale(); },
    }));
  });
  if ((cfg.actions || []).filter(Boolean).length) boite.appendChild(actions);
  const fond = el('div', { class: 'fond-modal' }, [boite]);
  fond.addEventListener('mousedown', function (ev) { if (ev.target === fond && cfg.fermetureExterieure !== false) fermerModale(); });
  // Tant que la fenêtre est ouverte, la tabulation tourne en boucle dedans.
  // Sans ça, le curseur passe derrière le voile gris et on peut déclencher,
  // sans le voir, un bouton de l'écran du dessous.
  function focalisables() {
    return $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', boite)
      .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
  }
  const onKey = function (ev) {
    if (ev.key === 'Escape') { ev.stopPropagation(); fermerModale(); if (cfg.onAnnule) cfg.onAnnule(); return; }
    if (ev.key !== 'Tab') return;
    const liste = focalisables();
    if (!liste.length) { ev.preventDefault(); return; }
    const premier = liste[0], dernier = liste[liste.length - 1];
    const dedans = boite.contains(document.activeElement);
    if (ev.shiftKey && (!dedans || document.activeElement === premier)) { ev.preventDefault(); dernier.focus(); }
    else if (!ev.shiftKey && (!dedans || document.activeElement === dernier)) { ev.preventDefault(); premier.focus(); }
  };
  document.addEventListener('keydown', onKey, true);
  $('#racine-modale').appendChild(fond);
  modaleOuverte = { fond: fond, onKey: onKey, focusPrecedent: focusPrecedent };
  const premier = boite.querySelector('input,select,textarea,button');
  if (premier) setTimeout(function () { try { premier.focus(); } catch (e) {} }, 0);
  return boite;
}
/** Confirmation non bloquante → Promise<boolean>. */
function confirmer(cfg) {
  return new Promise(function (resolve) {
    let repondu = false;
    const finir = function (v) { if (!repondu) { repondu = true; resolve(v); } };
    ouvrirModale({
      titre: cfg.titre,
      corps: (cfg.corps || [el('p', { text: cfg.message || '' })]),
      onAnnule: function () { finir(false); },
      actions: [
        { label: cfg.labelAnnuler || 'Annuler', onClick: function (f) { finir(false); f(); } },
        { label: cfg.labelOk || 'Confirmer', variant: cfg.danger ? 'danger' : 'principal', onClick: function (f) { finir(true); f(); } },
      ],
    });
  });
}

/* --- Autocomplétion (ingrédients, tags) --- */
/**
 * attacherAutocompletion(input, {
 *   items: () => [{ cle, libelle, secondaire }],
 *   surChoix: (item) => {},
 *   surCreation: (texte) => {},        // optionnel : entrée « Créer … »
 *   libelleCreation: (texte) => '…',
 * })
 */
function attacherAutocompletion(input, cfg) {
  const boite = input.parentNode;
  boite.classList.add('ac-boite');
  const liste = el('div', { class: 'ac-liste', hidden: true, role: 'listbox' });
  boite.appendChild(liste);
  let courants = [];
  let actif = -1;

  function fermer() { liste.hidden = true; actif = -1; }
  function normal(s) { return normaliserNom(s); }

  // Au-dessus de ce score, la suggestion est assez sûre pour être présélectionnée
  // et validée d'un simple Entrée. En dessous, c'est une piste, pas une réponse.
  const SCORE_SUR = 55;

  function calculer(txt) {
    const q = normal(txt);
    const tous = cfg.items() || [];
    if (!q) return { items: tous.slice(0, 30), meilleur: -1 };
    const notes = tous.map(function (it) {
      const cible = normal(it.libelle);
      const alias = (it.alias || []).map(normal);
      let score = -1;
      if (cible === q) score = 100;
      else if (cible.indexOf(q) === 0) score = 80;
      else if (alias.some(function (a) { return a === q; })) score = 70;
      else if (cible.indexOf(q) > 0) score = 60;
      else if (alias.some(function (a) { return a.indexOf(q) === 0; })) score = 55;
      else if (alias.some(function (a) { return a.indexOf(q) >= 0; })) score = 45;
      else if (ressemblance(txt, it.libelle) >= 0.7) score = 30;
      return { it: it, score: score };
    }).filter(function (x) { return x.score >= 0; })
      .sort(function (a, b) { return b.score - a.score || a.it.libelle.localeCompare(b.it.libelle, 'fr'); });
    return {
      items: notes.slice(0, 30).map(function (x) { return x.it; }),
      meilleur: notes.length ? notes[0].score : -1,
    };
  }

  function afficher() {
    const txt = input.value;
    const calcul = calculer(txt);
    courants = calcul.items;
    liste.innerHTML = '';
    courants.forEach(function (it, i) {
      const ligne = el('div', { class: 'ac-item', role: 'option', 'data-i': i }, [
        el('span', { text: it.libelle }),
        it.secondaire ? el('span', { class: 'sec', text: it.secondaire }) : null,
      ]);
      ligne.addEventListener('mousedown', function (ev) { ev.preventDefault(); choisir(i); });
      liste.appendChild(ligne);
    });
    const peutCreer = !!(cfg.surCreation && txt.trim() &&
      !courants.some(function (it) { return normal(it.libelle) === normal(txt); }));
    if (peutCreer) {
      const ligne = el('div', { class: 'ac-item creer', 'data-creer': '1' }, [
        el('span', { text: (cfg.libelleCreation ? cfg.libelleCreation(txt.trim()) : '＋ Créer « ' + txt.trim() + ' »') }),
      ]);
      ligne.addEventListener('mousedown', function (ev) { ev.preventDefault(); creer(); });
      liste.appendChild(ligne);
    }
    const n = liste.children.length;
    liste.hidden = n === 0;
    // Présélection : la première suggestion seulement si elle est sûre, sinon
    // l'entrée « Créer », pour qu'un Entrée ne choisisse jamais un ingrédient
    // approchant à la place de celui qu'on est en train de saisir.
    if (!txt.trim()) actif = -1;
    else if (courants.length && calcul.meilleur >= SCORE_SUR) actif = 0;
    else if (peutCreer) actif = n - 1;
    else actif = courants.length ? 0 : -1;
    marquer();
  }
  function marquer() {
    $$('.ac-item', liste).forEach(function (n, i) { n.classList.toggle('actif', i === actif); });
    if (actif >= 0 && liste.children[actif]) {
      const n = liste.children[actif];
      if (n.offsetTop < liste.scrollTop) liste.scrollTop = n.offsetTop;
      else if (n.offsetTop + n.offsetHeight > liste.scrollTop + liste.clientHeight) {
        liste.scrollTop = n.offsetTop + n.offsetHeight - liste.clientHeight;
      }
    }
  }
  function choisir(i) {
    const it = courants[i];
    if (!it) return;
    fermer();
    cfg.surChoix(it);
  }
  function creer() {
    const txt = input.value.trim();
    fermer();
    if (txt && cfg.surCreation) cfg.surCreation(txt);
  }
  function validerActif() {
    if (liste.hidden || actif < 0) return false;
    const n = liste.children[actif];
    if (!n) return false;
    if (n.dataset.creer) { creer(); return true; }
    choisir(Number(n.dataset.i)); return true;
  }

  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', afficher);
  input.addEventListener('focus', afficher);
  input.addEventListener('blur', function () { setTimeout(fermer, 120); });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (liste.hidden) afficher(); else { actif = Math.min(actif + 1, liste.children.length - 1); marquer(); } }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); actif = Math.max(actif - 1, 0); marquer(); }
    else if (ev.key === 'Escape') { if (!liste.hidden) { ev.stopPropagation(); fermer(); } }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (!validerActif() && cfg.surEntreeVide) cfg.surEntreeVide(input.value.trim());
    }
  });
  return { fermer: fermer, rafraichir: afficher };
}

/* ——— INGRÉDIENTS : création, rapprochement, fusion (§4.3) ——————————————— */

/**
 * Ouvre le formulaire de création d'ingrédient.
 * Vérifie d'abord la ressemblance avec le référentiel et propose la fusion.
 * → callback(ingredient) une fois créé (ou l'ingrédient existant si fusion).
 */
function creerIngredient(nomSaisi, callback, options) {
  const opts = options || {};
  const similaires = trouverSimilaires(D.ingredients, nomSaisi);
  if (similaires.length && !opts.sauterRapprochement) {
    proposerFusion(nomSaisi, similaires, callback);
    return;
  }
  formulaireIngredient(nomSaisi, callback);
}

function proposerFusion(nomSaisi, similaires, callback) {
  const meilleur = similaires[0].ingredient;
  const corps = [
    el('p', { html: '« <strong>' + esc(nomSaisi) + '</strong> » ressemble à « <strong>' + esc(meilleur.nom) + '</strong> ». Même ingrédient ?' }),
    el('p', { class: 'pt doux', text: 'Fusionner ajoute « ' + nomSaisi + ' » comme alias de « ' + meilleur.nom + ' » : les deux noms désigneront le même ingrédient.' }),
  ];
  if (similaires.length > 1) {
    const autres = el('div', {}, [el('p', { class: 'tpt doux', text: 'Autres ressemblances :' })]);
    const ul = el('ul', { class: 'pt doux' });
    similaires.slice(1, 4).forEach(function (s) {
      const li = el('li');
      li.appendChild(el('button', {
        type: 'button', class: 'btn mini', text: 'Fusionner avec « ' + s.ingredient.nom + ' »',
        onclick: function () { fermerModale(); appliquerAlias(s.ingredient, nomSaisi, callback); },
      }));
      ul.appendChild(li);
    });
    autres.appendChild(ul);
    corps.push(autres);
  }
  ouvrirModale({
    titre: 'Ingrédient déjà connu ?',
    corps: corps,
    actions: [
      { label: 'Créer quand même', onClick: function (f) { f(); formulaireIngredient(nomSaisi, callback); } },
      { label: 'Fusionner avec « ' + meilleur.nom + ' »', variant: 'principal',
        onClick: function (f) { f(); appliquerAlias(meilleur, nomSaisi, callback); } },
    ],
  });
}

async function appliquerAlias(ingredient, alias, callback) {
  const norm = normaliserNom(alias);
  const dejaConnu = normaliserNom(ingredient.nom) === norm ||
    ingredient.aliases.some(function (a) { return normaliserNom(a) === norm; });
  if (!dejaConnu) ingredient.aliases.push(alias);
  await sauvegarder();
  toast('« ' + alias +' » rattaché à « ' + ingredient.nom + ' »');
  if (callback) callback(ingredient);
}

/** Formulaire de création / édition d'un ingrédient (rayon, famille, unité, prix). */
function formulaireIngredient(nomInitial, callback, ingredientExistant) {
  const edition = !!ingredientExistant;
  const src = ingredientExistant || {
    nom: nomInitial || '', rayon: 'autre', famille: 'masse', unitePiece: 'pièce',
    prix: { valeur: null, par: 'kg' }, placard: false, aliases: [],
  };

  const champNom = el('input', { type: 'text', value: src.nom, placeholder: 'Tomates concassées' });
  const champRayon = el('select');
  RAYONS.forEach(function (r) { champRayon.appendChild(el('option', { value: r[0], text: r[1], selected: src.rayon === r[0] })); });
  const champFamille = el('select');
  FAMILLES.forEach(function (f) { champFamille.appendChild(el('option', { value: f[0], text: f[1], selected: src.famille === f[0] })); });

  const champUnitePiece = el('input', { type: 'text', value: src.unitePiece || 'pièce', list: 'dl-unites-piece', placeholder: 'pièce' });
  const blocUnitePiece = el('label', { class: 'champ' }, [
    el('span', { text: 'Unité de la pièce' }),
    champUnitePiece,
  ]);
  const champPrix = el('input', { type: 'text', inputmode: 'decimal', value: (src.prix && typeof src.prix.valeur === 'number') ? formatNombre(src.prix.valeur, 2) : '', placeholder: 'ex. 2,40' });
  const suffixePrix = el('span', { class: 'puce', text: PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[src.famille]] });
  const champPlacard = el('input', { type: 'checkbox', checked: !!src.placard });

  function majFamille() {
    const fam = champFamille.value;
    blocUnitePiece.hidden = fam !== 'piece';
    suffixePrix.textContent = PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[fam]];
  }
  champFamille.addEventListener('change', majFamille);
  majFamille();

  const corps = [
    el('label', { class: 'champ' }, [el('span', { text: 'Nom' }), champNom]),
    el('div', { class: 'ligne-champs' }, [
      el('label', { class: 'champ' }, [el('span', { text: 'Rayon' }), champRayon]),
      el('label', { class: 'champ' }, [el('span', { text: 'Famille d\'unités' }), champFamille]),
    ]),
    blocUnitePiece,
    el('label', { class: 'champ' }, [
      el('span', { text: 'Prix de référence (facultatif)' }),
      el('div', { class: 'ligne-champs' }, [champPrix, el('div', { class: 'zone-fixe' }, [suffixePrix])]),
    ]),
    el('label', { class: 'inline-case' }, [champPlacard, el('span', { text: 'Produit de fond de placard (sel, huile, épices…)' })]),
  ];

  ouvrirModale({
    titre: edition ? 'Modifier l\'ingrédient' : 'Nouvel ingrédient',
    corps: corps,
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: edition ? 'Enregistrer' : 'Créer', variant: 'principal',
        onClick: async function (f) {
          const nom = champNom.value.trim();
          if (!nom) { champNom.focus(); toast('Un nom est nécessaire.'); return; }
          const fam = champFamille.value;
          const cible = ingredientExistant || { id: genererId('ing', nom), aliases: [] };
          cible.nom = nom;
          cible.rayon = champRayon.value;
          cible.famille = fam;
          cible.unitePiece = fam === 'piece' ? (champUnitePiece.value.trim() || 'pièce') : null;
          cible.prix = { valeur: parseNombre(champPrix.value), par: PAR_PRIX_PAR_FAMILLE[fam] };
          cible.placard = champPlacard.checked;
          if (!edition) D.ingredients.push(cible);
          else corrigerUnitesRecettes(cible);
          await sauvegarder();
          f();
          if (callback) callback(cible);
          else { toast('Ingrédient enregistré.'); rendre(); }
        },
      },
    ],
  });
}

/** Après un changement de famille, réaligne les unités des lignes de recettes. */
function corrigerUnitesRecettes(ingredient) {
  const valides = unitesDe(ingredient);
  D.recettes.forEach(function (r) {
    r.lignes.forEach(function (l) {
      if (l.ingredientId === ingredient.id && valides.indexOf(l.unite) < 0) l.unite = valides[0];
    });
  });
}

/** Fusion manuelle : source devient un alias de cible, les recettes sont mises à jour. */
async function fusionnerIngredients(sourceId, cibleId) {
  const source = ingredientParId(sourceId);
  const cible = ingredientParId(cibleId);
  if (!source || !cible || source.id === cible.id) return;
  const noms = [source.nom].concat(source.aliases);
  noms.forEach(function (n) {
    const norm = normaliserNom(n);
    if (normaliserNom(cible.nom) !== norm && !cible.aliases.some(function (a) { return normaliserNom(a) === norm; })) {
      cible.aliases.push(n);
    }
  });
  const unitesCible = unitesDe(cible);
  D.recettes.forEach(function (r) {
    const fusionnees = [];
    r.lignes.forEach(function (l) {
      if (l.ingredientId !== source.id) { fusionnees.push(l); return; }
      l.ingredientId = cible.id;
      if (unitesCible.indexOf(l.unite) < 0) l.unite = unitesCible[0];
      fusionnees.push(l);
    });
    // Deux lignes du même ingrédient dans une recette : on additionne en unité de base.
    const parIng = new Map();
    const resultat = [];
    fusionnees.forEach(function (l) {
      const cle = l.ingredientId + '|' + l.fixe;
      if (!parIng.has(cle)) { parIng.set(cle, l); resultat.push(l); return; }
      const ref = parIng.get(cle);
      const baseRef = versBase(ref.quantite, ref.unite, cible.famille);
      const baseAdd = versBase(l.quantite, l.unite, cible.famille);
      const f = facteurUnite(cible.famille, ref.unite) || 1;
      ref.quantite = (baseRef + baseAdd) / f;
    });
    r.lignes = resultat;
  });
  if (D.semaine.coches[source.id]) { D.semaine.coches[cible.id] = true; delete D.semaine.coches[source.id]; }
  D.ingredients = D.ingredients.filter(function (i) { return i.id !== source.id; });
  await sauvegarder();
  toast('« ' + source.nom + ' » fusionné dans « ' + cible.nom + ' ».');
  rendre();
}
