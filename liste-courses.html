/** Entrées de planning d'une recette, dans la période d'achat en cours. */
function entreesDe(recetteId) {
  return selectionActive(D).filter(function (s) { return s.recetteId === recetteId; });
}
function selectionDe(recetteId) {
  return entreesDe(recetteId)[0] || null;
}
function nouvelleEntree(recetteId, portions, date) {
  return {
    id: 'pl_' + slug(recetteId).slice(0, 12) + '_' + suffixeCourt(),
    recetteId: recetteId,
    portions: portions,
    date: date || null,
  };
}
async function ajouterASemaine(recette, date) {
  // Le nombre de portions de base sert de valeur de départ : on le règle une
  // fois en haut de l'écran au lieu de le ressaisir recette par recette.
  const portions = D.reglages.portionsBase || 4;
  if (date === undefined && entreesDe(recette.id).length) return;   // depuis une carte : une fois suffit
  D.semaine.selection.push(nouvelleEntree(recette.id, portions, date || null));
  recette.portionsDefaut = portions;
  await sauvegarder();
  rendre();
}
async function retirerDeSemaine(recetteId) {
  const cibles = new Set(entreesDe(recetteId).map(function (e) { return e.id; }));
  D.semaine.selection = D.semaine.selection.filter(function (s) { return !cibles.has(s.id); });
  await sauvegarder();
  rendre();
}
async function retirerEntree(entreeId) {
  D.semaine.selection = D.semaine.selection.filter(function (s) { return s.id !== entreeId; });
  await sauvegarder();
  rendre();
}
async function changerPortions(recetteId, delta) {
  const entrees = entreesDe(recetteId);
  if (!entrees.length) return;
  entrees.forEach(function (e) { e.portions = Math.max(1, Math.min(99, e.portions + delta)); });
  const rec = recetteParId(recetteId);
  if (rec) rec.portionsDefaut = entrees[0].portions;   // mémorisé pour les prochaines fois
  await sauvegarder();
  rendre();
}
async function changerPortionsEntree(entreeId, delta) {
  const e = D.semaine.selection.find(function (x) { return x.id === entreeId; });
  if (!e) return;
  e.portions = Math.max(1, Math.min(99, e.portions + delta));
  await sauvegarder();
  rendre();
}
/**
 * Place un repas à une date, ou l'en retire si on retouche le jour déjà actif.
 * C'est la même entrée qui bouge : dater un plat déjà retenu ne doit jamais en
 * créer un second, sans quoi la liste de courses le compte deux fois.
 */
async function daterEntree(entreeId, iso) {
  const e = D.semaine.selection.find(function (x) { return x.id === entreeId; });
  if (!e) return;
  e.date = (e.date === iso) ? null : (iso || null);
  await sauvegarder();
  rendre();
}
/**
 * Rangée des jours de la période pour un repas : un appui le place, un second
 * appui sur le même jour le remet sans date. Choisir le jour là où on choisit
 * la recette évite d'ouvrir le calendrier pour le geste le plus courant.
 */
function rangeeJours(entreeId) {
  const rangee = el('div', { class: 'rangee-jours', role: 'group', 'aria-label': 'Jour du repas' });
  function peindre() {
    rangee.innerHTML = '';
    const e = D.semaine.selection.find(function (x) { return x.id === entreeId; });
    if (!e) return;
    const jours = joursDeLaPeriode(D.semaine.periode);
    const avecNumero = jours.length > 7;   // au-delà de la semaine, l'initiale ne suffit plus
    jours.forEach(function (iso) {
      const j = dateDepuisISO(iso);
      if (!j) return;
      const i = (j.getDay() + 6) % 7;
      const actif = e.date === iso;
      const b = el('button', {
        type: 'button', class: 'puce-jour', 'aria-pressed': String(actif),
        'aria-label': (actif ? 'Retirer du ' : 'Placer le ') + JOURS_LONGS[i] + ' ' + j.getDate() + ' ' + MOIS[j.getMonth()],
      }, [
        el('span', { class: 'l', text: JOURS_COURTS[i].charAt(0).toUpperCase() }),
        avecNumero ? el('span', { class: 'n', text: String(j.getDate()) }) : null,
      ]);
      b.addEventListener('click', async function () { await daterEntree(entreeId, iso); peindre(); });
      rangee.appendChild(b);
    });
  }
  peindre();
  return rangee;
}
/** Change la période couverte par la liste de courses. */
async function definirPeriode(periode) {
  D.semaine.periode = periodeValide(periode);
  D.semaine.libelle = libelleDePeriode(D.semaine.periode);
  await sauvegarder();
  rendre();
}

    grille.innerHTML = '';

    if (!D.recettes.length) {
      remplirFiltres(0);
      grille.appendChild(el('div', { class: 'rien' }, [
        el('p', { text: 'Aucune recette pour l\'instant.' }),
        el('button', { type: 'button', class: 'btn principal', text: 'Créer ma première recette', onclick: function () { allerA('recettes'); ouvrirEditeurRecette(null); } }),

      return;

    const criteres = {
      texte: etat.rechercheRecettes,
      tag: etat.tagFiltre,
      tempsMax: etat.filtreTempsMax,
      temperature: etat.filtreTemperature,
      saison: etat.filtreSaison,
    };
    // Les recettes retenues restent en tête, quel que soit le tri demandé.
    const trouvees = trierRecettes(D, filtrerRecettes(D, criteres), etat.triRecettes, D.reglages.portionsBase)
      .sort(function (a, b) {
        const sa = selectionDe(a.recette.id) ? 0 : 1, sb = selectionDe(b.recette.id) ? 0 : 1;
        return sa - sb;
      });
    remplirFiltres(trouvees.length);

    const nonClassees = recettesNonClassees(D, criteres);
    if (nonClassees.length) {
      grille.appendChild(el('div', { class: 'carte plate tpt doux', style: 'margin-bottom:.2rem' }, [
        el('span', { text: nonClassees.length + ' recette' + (nonClassees.length > 1 ? 's ne sont pas classées' : ' n\'est pas classée') +

          nonClassees.slice(0, 4).map(function (r) { return r.nom; }).join(', ') + (nonClassees.length > 4 ? '…' : '') + '.' }),

      // Les faits sur une ligne de texte discret ; les puces sont réservées aux
      // signaux, qui doivent sauter aux yeux.

      if (r.temperature) faits.push(TEMPERATURE_LIBELLE[r.temperature]);
      if (r.saisons.length && r.saisons.length < 4) {
        faits.push(r.saisons.map(function (x) { return SAISON_LIBELLE[x].toLowerCase(); }).join('/'));
      }
      if (r.tags.length) faits.push(r.tags.join(', '));
      if (afficherPrix() && c.total > 0) faits.push(formatEuroFixe(c.parPortion) + ' / portion');
      const meta = el('div', { class: 'meta' }, [
        faits.length ? el('span', { class: 'faits', text: faits.join(' · ') }) : null,
      ]);
      if (fraicheur) meta.appendChild(el('span', { class: 'puce alerte', text: fraicheur }));
      // Une même recette peut être planifiée plusieurs fois dans la période.
      const entrees = entreesDe(r.id);
      if (entrees.length > 1) {
        const jours = entrees.filter(function (e) { return e.date; }).length;
        meta.appendChild(el('span', { class: 'puce accent',
          text: entrees.length + ' repas' + (jours ? ' · ' + jours + ' daté' + (jours > 1 ? 's' : '') : '') }));

              'aria-label': 'Retirer tous les repas de ' + r.nom, onclick: function () { retirerDeSemaine(r.id); } }),

              el('span', { class: 'valeur', text: String(sel.portions) }),
              el('button', { type: 'button', text: '+', 'aria-label': 'Plus de portions pour ' + r.nom, onclick: function () { changerPortions(r.id, 1); } }),
            ]),

      grille.appendChild(el('div', { class: 'carte carte-recette' + (sel ? ' selectionnee' : '') }, [
        el('div', { class: 'entete-carte' }, [el('div', { class: 'infos' }, [nom]), action]),

        // peut les distinguer, et le bouton « Planning » y mène.
        (sel && entrees.length === 1) ? rangeeJours(sel.id) : null,
      ]));

  function remplirRecap() {
    recap.innerHTML = '';
    const sel = selectionActive(D);

    if (!sel.length) {
      recap.appendChild(el('p', { class: 'doux', style: 'margin:.3rem 0', text: 'Ma semaine est vide — ajoutez des recettes avec « + ».' }));
      return;
    }

    const totalPortions = sel.reduce(function (a, s) { return a + s.portions; }, 0);
    const c = coutSelection(D, sel);

    // Une ligne suffit à savoir où on en est ; le détail se déplie à la demande,
    // et « Générer la liste » reste atteignable dans les deux états.
    // On compte des repas, pas des recettes : la même peut revenir deux fois
    // dans la période.
    const distinctes = new Set(sel.map(function (e) { return e.recetteId; })).size;
    const resume = el('span', { class: 'resume' }, [
      el('span', { text: sel.length + ' repas' + (distinctes !== sel.length ? ' (' + distinctes + ' recettes)' : '') +

    if (afficherPrix()) {
      resume.appendChild(el('span', { text: ' · ' }));

    sel.slice().sort(function (a, b) { return String(a.date || '9').localeCompare(String(b.date || '9')); })
      .forEach(function (s) {

        if (!r) return;
        let quand = '';
        if (s.date) {
          const j = dateDepuisISO(s.date);

    }

    const bascule = el('button', {
      type: 'button', class: 'bascule', 'aria-expanded': String(!!etat.recapOuvert), 'aria-controls': 'detail-semaine',
    }, [resume, el('span', { class: 'chevron', 'aria-hidden': 'true', text: '⌃' })]);
    bascule.addEventListener('click', function () {
      etat.recapOuvert = !etat.recapOuvert;
      detail.hidden = !etat.recapOuvert;

    });

    recap.appendChild(el('div', { class: 'ligne-resume' }, [
      bascule,
      el('button', {
        type: 'button', class: 'btn principal actions-recap', text: 'Générer la liste',
        onclick: function () { allerA('liste'); },
      }),
    ]));
    recap.appendChild(detail);
  }

  remplirCartes();
  remplirRecap();
}

/**
 * Fiche de lecture rapide, sans quitter la composition de la semaine :
 * ce qu'il faut acheter pour le nombre de portions retenu, et les notes.
 */
function apercuRecette(recette) {
  const sel = selectionDe(recette.id);
  const portions = sel ? sel.portions : D.reglages.portionsBase;
  const corps = el('div', { class: 'apercu-fiche' });

  const meta = el('div', { class: 'barre-actions', style: 'margin-bottom:.5rem' });
  if (recette.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: recette.tempsPreparationMin + ' min' }));
  if (recette.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[recette.temperature] }));
  recette.tags.forEach(function (t) { meta.appendChild(el('span', { class: 'puce', text: t })); });
  const c = coutRecette(D, recette, portions);
  if (afficherPrix() && c.total > 0) {
    meta.appendChild(el('span', { class: 'puce accent', text: (c.sansPrix ? '≥ ' : '') + formatEuroFixe(c.parPortion) + ' / portion' }));
  }
  const fraicheur = texteFraicheur(recette.derniereUtilisation);
  if (fraicheur) meta.appendChild(el('span', { class: 'puce alerte', text: fraicheur }));
  else if (!recette.derniereUtilisation) meta.appendChild(el('span', { class: 'puce', text: 'jamais faite' }));
  corps.appendChild(meta);

  // Le jour se règle depuis la fiche aussi : on y arrive souvent avant de
  // savoir quand on cuisinera le plat.
  if (sel && entreesDe(recette.id).length === 1) {
    corps.appendChild(el('div', { class: 'tpt doux', style: 'margin:.1rem 0 0', text: 'Jour' }));
    corps.appendChild(rangeeJours(sel.id));
  }

  corps.appendChild(el('h3', { style: 'margin:.2rem 0 0', text: 'Pour ' + portions + ' portion' + (portions > 1 ? 's' : '') }));
  const agr = agregerSelection(D, [{ recetteId: recette.id, portions: portions }]);
  if (!agr.lignes.length) {
    corps.appendChild(el('p', { class: 'pt doux', text: 'Aucun ingrédient renseigné.' }));
  } else {
    const ordreSaisie = recette.lignes.map(function (l) { return l.ingredientId; });
    const ul = el('ul');
    agr.lignes.slice().sort(function (a, b) {
      return ordreSaisie.indexOf(a.ingredient.id) - ordreSaisie.indexOf(b.ingredient.id);
    }).forEach(function (l) {
      const fixe = recette.lignes.some(function (x) { return x.ingredientId === l.ingredient.id && x.fixe; });
      ul.appendChild(el('li', {
        text: formatQuantiteBase(l.base, l.ingredient) + ' ' + elision(minusculeInitiale(l.ingredient.nom)) + (fixe ? ' (fixe)' : ''),
      }));
    });
    corps.appendChild(ul);
  }
  if (recette.notes && recette.notes.trim()) {
    corps.appendChild(el('div', { class: 'notes', text: recette.notes }));
  }

  const actions = [
    { label: 'Fermer', onClick: function (f) { f(); } },
    { label: 'Modifier', onClick: function (f) { f(); allerA('recettes'); ouvrirEditeurRecette(recette); } },
  ];
  actions.push(sel
    ? { label: 'Retirer de la semaine', onClick: function (f) { f(); retirerDeSemaine(recette.id); } }
    : { label: 'Ajouter à la semaine', variant: 'principal', onClick: function (f) { f(); ajouterASemaine(recette); } });

  ouvrirModale({ titre: recette.nom, corps: [corps], actions: actions });
}

/**
 * Règle le nombre de portions de base. Il pré-remplit chaque ajout, et
 * s'applique aussi aux recettes déjà retenues — « ce soir on est six » ne doit
 * pas se ressaisir recette par recette. Annulable.
 */
async function changerPortionsBase(delta) {
  const avant = D.reglages.portionsBase;
  const apres = Math.max(1, Math.min(99, avant + delta));
  if (apres === avant) return;
  const selAvant = JSON.parse(JSON.stringify(D.semaine.selection));
  const defautsAvant = D.recettes.map(function (r) { return { id: r.id, p: r.portionsDefaut }; });

  D.reglages.portionsBase = apres;
  selectionActive(D).forEach(function (s) {
    s.portions = apres;
    const r = recetteParId(s.recetteId);
    if (r) r.portionsDefaut = apres;
  });
  await sauvegarder();
  rendre();
  if (selAvant.length) {
    toast('Semaine passée à ' + apres + ' portions', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.reglages.portionsBase = avant;
        D.semaine.selection = selAvant;
        defautsAvant.forEach(function (x) { const r = recetteParId(x.id); if (r) r.portionsDefaut = x.p; });
        await sauvegarder();
        rendre();
      },
    });
  }
}

function evolutionCout(coutActuel) {
  const h = D.historique.filter(function (x) { return typeof x.coutEstime === 'number' && x.coutEstime > 0; });
  if (!h.length) return null;
  const precedent = h[0];
  const delta = coutActuel - precedent.coutEstime;
  const signe = delta >= 0 ? '+' : '−';
  return 'Semaine précédente (' + formatDateCourte(precedent.date) + ') : ' + formatEuroFixe(precedent.coutEstime) +
    ' · ' + signe + ' ' + formatEuroFixe(Math.abs(delta));
}

async function viderSemaine() {
  if (!D.semaine.selection.length && !D.semaine.ajoutsManuels.length) { toast('La semaine est déjà vide.'); return; }
  const ok = await confirmer({
    titre: 'Vider la semaine',
    message: 'La sélection en cours est archivée dans l\'historique, puis remise à zéro. Les recettes retenues sont marquées comme faites aujourd\'hui.',
    labelOk: 'Archiver et vider',
  });
  if (!ok) return;
  const ancienne = {
    selection: D.semaine.selection.slice(),
    coches: Object.assign({}, D.semaine.coches),
    ajoutsManuels: D.semaine.ajoutsManuels.slice(),
    libelle: D.semaine.libelle,
  };
  const ancienHistorique = D.historique.slice();
  const ancienneUtilisation = D.recettes.map(function (r) { return { id: r.id, d: r.derniereUtilisation }; });

  if (D.semaine.selection.length) {
    const c = coutSelection(D, selectionActive(D));
    D.historique.unshift({
      date: aujourdHuiISO(), libelle: D.semaine.libelle,
      selection: D.semaine.selection.slice(), coutEstime: c.total,
    });
    D.historique = D.historique.slice(0, 60);
    const auj = aujourdHuiISO();
    D.semaine.selection.forEach(function (s) {
      const r = recetteParId(s.recetteId);
      if (r) r.derniereUtilisation = auj;
    });
  }
  D.semaine.selection = [];
  D.semaine.coches = {};
  D.semaine.ajoutsManuels = [];
  D.semaine.libelle = libelleSemaineCourante();
  await sauvegarder();
  rendre();
  toast('Semaine archivée et vidée', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = ancienne.selection;
      D.semaine.coches = ancienne.coches;
      D.semaine.ajoutsManuels = ancienne.ajoutsManuels;
      D.semaine.libelle = ancienne.libelle;
      D.historique = ancienHistorique;
      ancienneUtilisation.forEach(function (x) { const r = recetteParId(x.id); if (r) r.derniereUtilisation = x.d; });
      await sauvegarder();
      rendre();
    },
  });
}

/** Applique une semaine type : en complément de la sélection, ou à sa place. */
async function appliquerSemaineType(type, mode) {
  const idsConnus = new Set(D.recettes.map(function (r) { return r.id; }));
  const voulue = rebaserSelection(nettoyerSelection(type.selection, idsConnus), D.semaine.periode);

  if (mode === 'remplacer') {
    const avant = D.semaine.selection.slice();
    const cochesAvant = Object.assign({}, D.semaine.coches);
    D.semaine.selection = voulue;
    D.semaine.coches = {};
    await sauvegarder();
    rendre();
    toast('« ' + type.nom +' » a remplacé la sélection', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.semaine.selection = avant; D.semaine.coches = cochesAvant;
        await sauvegarder(); rendre();
      },
    });
    return;
  }

  // Ajout : les recettes déjà retenues gardent le nombre de portions choisi.
  const ajoutees = [];
  let deja = 0;
  voulue.forEach(function (s) {
    if (selectionDe(s.recetteId)) { deja += 1; return; }
    const entree = nouvelleEntree(s.recetteId, s.portions, s.date);
    D.semaine.selection.push(entree);
    ajoutees.push(entree.id);
  });
  if (!ajoutees.length) {
    toast(deja ? 'Ces recettes sont déjà dans la semaine.' : 'Cette semaine type est vide.');
    return;
  }
  await sauvegarder();
  rendre();
  const message = ajoutees.length + (ajoutees.length > 1 ? ' recettes ajoutées' : ' recette ajoutée') +
    (deja ? ' · ' + deja + ' déjà présente' + (deja > 1 ? 's' : '') : '');
  toast(message, {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = D.semaine.selection.filter(function (s) { return ajoutees.indexOf(s.id) < 0; });
      await sauvegarder(); rendre();
    },
  });
}

async function reprendreSemaineDerniere() {
  const derniere = D.historique[0];
  if (!derniere || !derniere.selection.length) { toast('Aucune semaine dans l\'historique.'); return; }
  const ok = await confirmer({
    titre: 'Reprendre la semaine dernière',
    message: 'Reprendre la sélection du ' + formatDateCourte(derniere.date) + ' ? La sélection actuelle sera remplacée.',
    labelOk: 'Reprendre',
  });
  if (!ok) return;
  D.semaine.selection = rebaserSelection(
    nettoyerSelection(derniere.selection, new Set(D.recettes.map(function (r) { return r.id; }))),
    D.semaine.periode);
  D.semaine.coches = {};
  await sauvegarder();
  rendre();
  toast('Sélection reprise.');
}

async function effacerDonneesExemple() {
  const ok = await confirmer({
    titre: 'Effacer les données d\'exemple',
    message: 'Les 3 recettes d\'exemple et les ingrédients qui ne servent qu\'à elles seront supprimés. Vos propres recettes et ingrédients sont conservés.',
    labelOk: 'Effacer', danger: true,
  });
  if (!ok) return;
  const avant = JSON.parse(JSON.stringify(D));
  const idsExemple = new Set(IDS_EXEMPLE_RECETTES);
  D.recettes = D.recettes.filter(function (r) { return !idsExemple.has(r.id); });
  D.semaine.selection = D.semaine.selection.filter(function (s) { return !idsExemple.has(s.recetteId); });
  D.semainesTypes.forEach(function (t) { t.selection = t.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  D.historique.forEach(function (h) { h.selection = h.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  // On ne supprime que les ingrédients d'exemple devenus inutilisés.
  const utilises = new Set();
  D.recettes.forEach(function (r) { r.lignes.forEach(function (l) { utilises.add(l.ingredientId); }); });
  const idsIngExemple = new Set(donneesExemple().ingredients.map(function (i) { return i.id; }));
  D.ingredients = D.ingredients.filter(function (i) { return !idsIngExemple.has(i.id) || utilises.has(i.id); });
  await sauvegarder();
  rendre();
  toast('Données d\'exemple effacées', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () { D = normaliserRacine(avant); await Store.save(D); rendre(); },
  });
}

/* --- 5.2 Liste de courses — l'écran utilisé debout, à une main --- */

async function basculerCoche(cle, valeur) {
  // Écriture ciblée : l'état des cases est sauvegardé immédiatement.
  if (valeur) await Store.patch('semaine.coches.' + cle, true);
  else await Store.patch('semaine.coches.' + cle, undefined);
  D.semaine.dateModification = new Date().toISOString();
  await Store.flush();
}

function vueListe() {
  const v = $('#vue-liste');
  const scroll = window.scrollY;
  v.innerHTML = '';
  const modele = construireListe(D);
  const t = modele.totaux;

  // En-tête collant
  const entete = el('div', { class: 'entete-liste' });
  entete.appendChild(el('span', { text: t.nbCoches + ' / ' + t.nbArticles + ' article' + (t.nbArticles > 1 ? 's' : '') }));
  entete.appendChild(el('button', {
    type: 'button', class: 'puce puce-bouton', text: '🗓 ' + libelleDePeriode(D.semaine.periode),
    title: 'Changer la période couverte par la liste',
    onclick: function () { ouvrirCalendrier(); },
  }));
  if (afficherPrix()) {
    entete.appendChild(el('span', { class: 'doux', text: '·' }));
    entete.appendChild(el('span', { class: 'reste', text: texteTotal(t.totalRestant, t.sansPrixRestant) + ' restants' }));
  }
  v.appendChild(entete);

  if (!modele.articles.length && !modele.placard.length) {
    v.appendChild(el('div', { class: 'rien' }, [
      el('p', { text: 'La liste est vide.' }),
      el('p', { class: 'pt', text: 'Choisissez des recettes dans l\'onglet Semaine, ou ajoutez un article à la main ci-dessous.' }),
    ]));
  }

  // Rayons
  modele.groupes.forEach(function (g) {
    const cleOuvert = g.rayon;
    // Pliage automatique d'un rayon entièrement coché ; l'utilisateur peut rouvrir.
    if (etat.rayonsToutCoches[cleOuvert] !== g.tousCoches) {
      etat.rayonsToutCoches[cleOuvert] = g.tousCoches;
      delete etat.rayonsOuverts[cleOuvert];
    }
    const ouvert = (cleOuvert in etat.rayonsOuverts) ? etat.rayonsOuverts[cleOuvert] : !g.tousCoches;

    const bloc = el('details', { class: 'rayon', open: ouvert });
    bloc.addEventListener('toggle', function () { etat.rayonsOuverts[cleOuvert] = bloc.open; });
    const resume = el('summary', {}, [
      el('span', { text: g.libelle }),
      el('span', { class: 'compte', text: g.nbCoches + '/' + g.articles.length }),
    ]);
    bloc.appendChild(resume);

    g.articles.forEach(function (a) { bloc.appendChild(ligneArticle(a)); });
    v.appendChild(bloc);
  });

  // Ingrédients sans rayon → invitation à les classer
  const aClasser = modele.articles.concat(modele.placard)
    .filter(function (a) { return a.type === 'ingredient' && a.rayon === 'autre'; });
  if (aClasser.length) {
    v.appendChild(el('div', { class: 'carte plate pt doux' }, [
      el('span', { text: aClasser.length + ' ingrédient' + (aClasser.length > 1 ? 's sont' : ' est') + ' encore dans « Autre ». ' }),
      el('button', { type: 'button', class: 'btn mini', text: 'Les classer',
        onclick: function () { etat.refOuvert = true; allerAuxReglages('reglages'); } }),
    ]));
  }

  // Section placard, repliée, hors total
  if (modele.placard.length) {
    const bloc = el('details', { class: 'rayon', open: etat.placardOuvert });
    bloc.addEventListener('toggle', function () { etat.placardOuvert = bloc.open; });
    bloc.appendChild(el('summary', {}, [
      el('span', { text: 'À vérifier au placard' }),
      el('span', { class: 'compte', text: modele.placard.length + ' produit' + (modele.placard.length > 1 ? 's' : '') }),
    ]));
    modele.placard.forEach(function (a) { bloc.appendChild(ligneArticle(a)); });
    v.appendChild(bloc);
  }

  // Ajout manuel en un champ
  const champManuel = el('input', { type: 'text', placeholder: 'Ajouter un article (papier toilette, café…)', enterkeyhint: 'done', 'aria-label': 'Nom de l\'article' });
  const champQteManuel = el('input', { type: 'text', placeholder: 'qté', inputmode: 'decimal', enterkeyhint: 'done', 'aria-label': 'Quantité (facultative), par exemple 6 ou 2 kg', style: 'flex:0 1 96px' });
  const selectRayonManuel = el('select', { 'aria-label': 'Rayon de l\'article', style: 'flex:0 1 170px' });
  D.reglages.ordreRayons.forEach(function (r) {
    selectRayonManuel.appendChild(el('option', { value: r, text: RAYON_LIBELLE[r], selected: r === 'autre' }));
  });
  const ajouter = async function () {
    const nom = champManuel.value.trim();
    if (!nom) return;
    const q = analyserQuantiteLibre(champQteManuel.value);
    D.semaine.ajoutsManuels.push({
      id: 'man_' + slug(nom) + '_' + suffixeCourt(), nom: nom, rayon: selectRayonManuel.value,
      quantite: q.quantite, unite: q.unite,
    });
    champManuel.value = '';
    champQteManuel.value = '';
    await sauvegarder();
    vueListe();
    const c = $('#vue-liste .ajout-manuel input');
    if (c) c.focus();
  };
  const surEntree = function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); ajouter(); } };
  champManuel.addEventListener('keydown', surEntree);
  champQteManuel.addEventListener('keydown', surEntree);
  v.appendChild(el('div', { class: 'carte' }, [
    el('div', { class: 'ajout-manuel' }, [
      champManuel, champQteManuel, selectRayonManuel,
      el('button', { type: 'button', class: 'btn principal', text: 'Ajouter', onclick: ajouter }),
    ]),
  ]));

  // Actions
  const actions = el('div', { class: 'barre-actions' });
  if (navigator.share) {
    actions.appendChild(el('button', { type: 'button', class: 'btn principal', text: '↗ Partager la liste', onclick: partagerListe }));
  }
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Copier la liste', onclick: copierListe }));
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Imprimer', onclick: function () { window.print(); } }));
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Réinitialiser les cases', onclick: reinitialiserCases }));
  if ('wakeLock' in navigator) {
    const caseEcran = el('input', { type: 'checkbox', checked: etat.ecranAllume });
    caseEcran.addEventListener('change', function () { basculerWakeLock(caseEcran.checked); });
    actions.appendChild(el('label', { class: 'inline-case', style: 'padding:0 .5rem' }, [caseEcran, el('span', { class: 'pt', text: 'Garder l\'écran allumé' })]));
  }
  v.appendChild(el('div', { class: 'carte plate' }, [actions]));

  // Acheter loin, c'est jeter : on le dit là où l'achat se décide.
  if (nbJoursPeriode(D.semaine.periode) > 7) {
    const frais = rayonsFraisDeLaListe(D);
    if (frais.length) {
      v.appendChild(el('div', { class: 'avert', style: 'margin-bottom:.6rem', text:
        'Cette liste couvre ' + nbJoursPeriode(D.semaine.periode) + ' jours. ' +
        frais.map(function (r) { return RAYON_LIBELLE[r].toLowerCase(); }).join(', ') +
        ' ne se gardent pas si longtemps — mieux vaut les acheter au fur et à mesure.' }));
    }
  }
  if (afficherPrix()) {
    v.appendChild(el('p', { class: 'tpt doux', text:
      'Total de la liste : ' + texteTotal(t.totalTous, t.sansPrixTous) +
      ' · les produits de placard et les articles ajoutés à la main ne sont pas comptés.' }));
  }

  window.scrollTo(0, scroll);
}

function ligneArticle(a) {
  const ligne = el('div', { class: 'article' + (a.coche ? ' coche' : '') });

  const caseCoche = el('input', { type: 'checkbox', checked: a.coche, 'aria-label': 'Cocher ' + a.nom });
  const zoneCase = el('label', { class: 'case' }, [caseCoche]);
  caseCoche.addEventListener('change', async function () {
    await basculerCoche(a.cle, caseCoche.checked);
    vueListe();
  });

  const corps = el('button', { type: 'button', class: 'corps', 'aria-expanded': String(etat.provenanceOuverte === a.cle) }, [
    el('span', { class: 'nom', text: a.nom }),
    a.texteQuantite ? el('span', { class: 'qte', text: a.texteQuantite }) : null,
  ]);
  if (afficherPrix() && a.type === 'ingredient' && !a.ingredient.placard) {
    corps.appendChild(el('span', { class: 'prix', text: a.cout === null ? '—' : formatEuroFixe(a.cout) }));
  }
  corps.addEventListener('click', function () {
    etat.provenanceOuverte = (etat.provenanceOuverte === a.cle) ? null : a.cle;
    vueListe();
  });

  ligne.appendChild(zoneCase);
  ligne.appendChild(corps);

  if (etat.provenanceOuverte === a.cle) {

        ul.appendChild(el('li', { text: p.nom + ' : ' + formatQuantiteBase(p.base, a.ingredient) }));
      });

        el('span', { class: 'puce', text: RAYON_LIBELLE[a.rayon] }),
      ]);
      if (afficherPrix()) {
        const pu = a.ingredient.prix && typeof a.ingredient.prix.valeur === 'number'
          ? formatNombre(a.ingredient.prix.valeur, 2) + ' ' + PAR_PRIX_LIBELLE[a.ingredient.prix.par]
          : 'prix inconnu';
        bas.appendChild(el('button', {
          type: 'button', class: 'puce puce-bouton', text: '✎ ' + pu,
          onclick: function () { editionPrixRapide(a.ingredient, vueListe); },
        }));

    const enveloppe = el('div');
    enveloppe.appendChild(ligne);

  }
  return ligne;
}

/* --- Partager une recette --------------------------------------------------
   Une recette voyage seule : son texte, lisible tel quel, et un lien qui la
   réinstalle chez celui qui le reçoit. Le lien porte la recette entière —
   ses ingrédients avec leur rayon et leur famille d'unités — sinon elle
   arriverait sans quantités exploitables.
   ------------------------------------------------------------------------- */

function versBase64Url(txt) {
  const octets = new TextEncoder().encode(txt);
  let brut = '';
  for (let i = 0; i < octets.length; i++) brut += String.fromCharCode(octets[i]);
  return btoa(brut).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function depuisBase64Url(txt) {
  const b64 = String(txt || '').replace(/-/g, '+').replace(/_/g, '/');
  const brut = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const octets = new Uint8Array(brut.length);
  for (let i = 0; i < brut.length; i++) octets[i] = brut.charCodeAt(i);
  return new TextDecoder().decode(octets);
}

/** Recette + ses ingrédients, sous forme compacte (les clés sont courtes : ça
 *  passe dans un lien qu'on envoie par message). */
function recetteEnColis(donnees, recette) {
  const parId = indexIngredients(donnees);
  return {
    v: 1,
    n: recette.nom,
    t: recette.tempsPreparationMin || null,
    p: recette.portionsDefaut || 4,
    g: recette.tags.slice(),
    s: recette.saisons.slice(),
    c: recette.temperature || null,
    o: recette.notes || '',
    i: recette.lignes.map(function (l) {
      const ing = parId.get(l.ingredientId);
      if (!ing) return null;
      return [ing.nom, ing.rayon, ing.famille, ing.unitePiece || '', l.quantite, l.unite, l.fixe ? 1 : 0];
    }).filter(Boolean),
  };
}

function lienDeRecette(donnees, recette) {
  const socle = (typeof location !== 'undefined' && location.href) ? location.href.split('#')[0] : '';
  return socle + '#recette=' + versBase64Url(JSON.stringify(recetteEnColis(donnees, recette)));
}

/** Lit un lien de recette. → colis ou null. Un lien abîmé ne doit rien casser. */
function lireLienRecette(lien) {
  const texte = String(lien || '');
  const frag = texte.indexOf('#') >= 0 ? texte.slice(texte.indexOf('#') + 1) : texte;
  const val = new URLSearchParams(frag).get('recette');
  if (!val) return null;
  try {
    const colis = JSON.parse(depuisBase64Url(val));
    if (!colis || typeof colis.n !== 'string' || !Array.isArray(colis.i)) return null;
    return colis;
  } catch (e) { return null; }
}

/** Version lisible, envoyée à côté du lien — et relisible par le collage. */
function recetteEnTexte(donnees, recette) {
  const parId = indexIngredients(donnees);
  const p = recette.portionsDefaut || 4;
  const lignes = [recette.nom, 'Pour ' + p + ' personnes'];
  recette.lignes.forEach(function (l) {
    const ing = parId.get(l.ingredientId);
    if (!ing || typeof l.quantite !== 'number') return;
    // Même écriture que partout ailleurs dans l'application — et relisible par
    // « Coller une liste » à l'arrivée.
    const base = versBase(l.quantite * p, l.unite, ing.famille);
    lignes.push('- ' + formatQuantiteBase(base, ing) + ' ' + elision(minusculeInitiale(ing.nom)));
  });
  if (recette.notes && recette.notes.trim()) { lignes.push(''); lignes.push(recette.notes.trim()); }
  return lignes.join('\n');
}

async function partagerRecette(recette) {
  const texte = recetteEnTexte(D, recette);
  const lien = lienDeRecette(D, recette);
  const fait = await partagerTexte(recette.nom, texte + '\n\n' + lien);
  if (fait) return;
  let copie = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(texte + '\n\n' + lien);
      copie = true;
    }
  } catch (e) { copie = false; }
  if (copie) { toast('Recette copiée, lien compris.'); return; }
  const champ = el('textarea', { rows: '8' });
  champ.value = texte + '\n\n' + lien;
  ouvrirModale({
    titre: 'Partager « ' + recette.nom + ' »',
    corps: [el('label', { class: 'champ' }, [champ])],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { champ.select(); }, 0);
}

/** Installe une recette reçue. Les ingrédients connus sont réutilisés. */
async function importerColisRecette(colis) {
  const nom = String(colis.n || '').trim() || 'Recette partagée';
  const lignes = [];
  let creees = 0;
  (colis.i || []).forEach(function (c) {
    if (!Array.isArray(c) || !c[0]) return;
    const nomIng = String(c[0]);
    const m = rapprocherIngredient(D.ingredients, nomIng);
    let ing = m ? m.ingredient : null;
    if (!ing) {
      const famille = ['masse', 'volume', 'piece'].indexOf(c[2]) >= 0 ? c[2] : 'masse';
      ing = {
        id: genererId('ing', nomIng), nom: nomIng, aliases: [],
        rayon: RAYON_LIBELLE[c[1]] ? c[1] : 'autre',
        famille: famille,
        unitePiece: famille === 'piece' ? (c[3] || 'pièce') : null,
        prix: { valeur: null, par: PAR_PRIX_PAR_FAMILLE[famille] },
        placard: false,
      };
      D.ingredients.push(ing);
      creees += 1;
    }
    // L'ingrédient d'ici a ses propres unités : on ne convertit jamais entre
    // familles, donc une unité étrangère cède la place à la sienne.
    const permises = unitesDe(ing);
    lignes.push({
      ingredientId: ing.id,
      quantite: typeof c[4] === 'number' ? c[4] : null,
      unite: permises.indexOf(c[5]) >= 0 ? c[5] : (permises[0] || ''),
      fixe: c[6] === 1,
    });
  });

  const recette = {
    id: genererId('rec', nom),
    nom: D.recettes.some(function (r) { return normaliserNom(r.nom) === normaliserNom(nom); }) ? nom + ' (reçue)' : nom,
    tags: Array.isArray(colis.g) ? colis.g.map(String) : [],
    tempsPreparationMin: typeof colis.t === 'number' ? colis.t : null,
    temperature: (colis.c === 'chaud' || colis.c === 'froid') ? colis.c : null,
    saisons: Array.isArray(colis.s) ? colis.s.filter(function (x) { return SAISON_LIBELLE[x]; }) : [],
    portionsDefaut: (typeof colis.p === 'number' && colis.p > 0) ? Math.min(99, Math.round(colis.p)) : 4,
    derniereUtilisation: null,
    notes: String(colis.o || ''),
    lignes: lignes,
  };
  D.recettes.push(recette);
  await sauvegarder();
  allerA('recettes');
  toast('« ' + recette.nom + ' » ajoutée' + (creees ? ' · ' + creees + ' ingrédient' + (creees > 1 ? 's créés' : ' créé') : '') + '.');
}

/** Propose l'import après avoir montré ce que le lien contient. */
async function proposerImportRecette(colis) {
  const corps = el('div');
  corps.appendChild(el('p', { class: 'pt doux', style: 'margin:.1rem 0 .4rem',
    text: 'Pour ' + (colis.p || 4) + ' personnes' + (colis.t ? ' · ' + colis.t + ' min' : '') }));
  const ul = el('ul');
  (colis.i || []).forEach(function (c) {
    if (!Array.isArray(c) || !c[0]) return;
    // On formate comme l'application le fait partout : « g » ne prend pas de
    // « s », et au-delà du kilo on change d'unité.
    const modele = { famille: ['masse', 'volume', 'piece'].indexOf(c[2]) >= 0 ? c[2] : 'masse', unitePiece: c[3] || 'pièce' };
    const q = typeof c[4] === 'number'
      ? formatQuantiteBase(versBase(c[4] * (colis.p || 4), c[5], modele.famille), modele) + ' '
      : '';
    ul.appendChild(el('li', { text: q + elision(minusculeInitiale(String(c[0]))) }));
  });
  corps.appendChild(ul);
  const ok = await confirmer({
    titre: colis.n || 'Recette partagée',
    corps: [corps],
    labelAnnuler: 'Non merci',
    labelOk: 'Ajouter à mes recettes',
  });
  if (ok) await importerColisRecette(colis);
  return ok;
}

/**
 * Partage par le menu du téléphone quand il existe, copie sinon.
 * → true si le partage natif a pris la main.
 */
async function partagerTexte(titre, texte) {
  if (navigator.share) {
    try {
      await navigator.share({ title: titre, text: texte });
      return true;
    } catch (e) {
      // Menu refermé sans choisir : ce n'est pas une erreur, on n'insiste pas.
      if (e && e.name === 'AbortError') return true;
    }
  }
  return false;
}

async function partagerListe() {
  const fait = await partagerTexte('Liste de courses', listeEnTexte());
  if (!fait) copierListe();
}

async function copierListe() {
  const texte = listeEnTexte();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(texte);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = texte;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }
  if (ok) { toast('Liste copiée.'); return; }
  const zone = el('textarea', { rows: '12', readonly: true });
  zone.value = texte;
  ouvrirModale({
    titre: 'Copier la liste',
    corps: [el('p', { class: 'pt doux', text: 'La copie automatique a échoué. Sélectionnez le texte ci-dessous et copiez-le.' }), zone],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { zone.focus(); zone.select(); }, 50);
}

/* --- Garder l'écran allumé (silencieusement ignoré si indisponible) --- */
let verrouEcran = null;
async function basculerWakeLock(actif) {
  etat.ecranAllume = actif;
  try {
    if (actif) {
      if (!('wakeLock' in navigator)) return;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', function () { verrouEcran = null; });
    } else if (verrouEcran) {
      await verrouEcran.release();
      verrouEcran = null;
    }
  } catch (e) {
    etat.ecranAllume = false;
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.ecranAllume && !verrouEcran) basculerWakeLock(true);
});

function vueRecettes() {
  const v = $('#vue-recettes');

    if (etat.editeurDom && etat.editeurDom.isConnected) { majApercuRecette(); return; }
    v.innerHTML = '';
    v.appendChild(construireEditeurRecette());
    return;
  }
  etat.editeurDom = null;
  v.innerHTML = '';

  const champRecherche = el('input', { type: 'search', placeholder: 'Rechercher une recette…', enterkeyhint: 'search', 'aria-label': 'Rechercher une recette' });
  const grille = el('div', { class: 'grille-recettes' });
  champRecherche.addEventListener('input', remplir);
  v.appendChild(el('div', { class: 'recherche' }, [
    champRecherche,
    el('button', { type: 'button', class: 'btn principal', text: '＋ Nouvelle recette', onclick: function () { ouvrirEditeurRecette(null); } }),
  ]));
  v.appendChild(grille);

  function remplir() {
    grille.innerHTML = '';
    const q = normaliserNom(champRecherche.value);

      return normaliserNom(r.nom).indexOf(q) >= 0 || r.tags.some(function (t) { return normaliserNom(t).indexOf(q) >= 0; });
    }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

    if (!recettes.length) {
      grille.appendChild(el('div', { class: 'rien', text: D.recettes.length ? 'Aucune recette ne correspond.' : 'Aucune recette. Créez la première.' }));
      return;
    }
    recettes.forEach(function (r) {
      const c = coutRecette(D, r, r.portionsDefaut);
      const meta = el('div', { class: 'meta' });
      if (r.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: r.tempsPreparationMin + ' min' }));
      if (r.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[r.temperature] }));
      meta.appendChild(el('span', { class: 'puce', text: r.lignes.length + ' ingrédient' + (r.lignes.length > 1 ? 's' : '') }));
      r.tags.forEach(function (t) { meta.appendChild(el('span', { class: 'puce', text: t })); });
      if (afficherPrix()) {
        meta.appendChild(el('span', { class: 'puce accent', text: (c.total > 0 ? formatEuroFixe(c.parPortion) : '—') + ' / portion' + (c.sansPrix ? ' ≥' : '') }));
      }
      const carte = el('div', { class: 'carte carte-recette' }, [
        el('div', { class: 'infos' }, [el('div', { class: 'nom', text: r.nom }), meta]),
        el('div', { style: 'display:flex;flex-direction:column;gap:.25rem' }, [
          el('button', { type: 'button', class: 'btn mini', text: 'Modifier', onclick: function () { ouvrirEditeurRecette(r); } }),
          el('button', { type: 'button', class: 'btn mini', text: 'Dupliquer', onclick: function () { dupliquerRecette(r); } }),
          el('button', { type: 'button', class: 'btn mini', text: '↗ Partager', onclick: function () { partagerRecette(r); } }),
          el('button', { type: 'button', class: 'btn mini danger', text: 'Supprimer', onclick: function () { supprimerRecette(r); } }),
        ]),
      ]);
      grille.appendChild(carte);
    });
  }
  remplir();
}

function ouvrirEditeurRecette(recette) {
  const copie = recette
    ? JSON.parse(JSON.stringify(recette))
    : { id: null, nom: '', tags: [], tempsPreparationMin: null, temperature: null, saisons: [],
        portionsDefaut: 4, derniereUtilisation: null, notes: '', lignes: [] };
  if (!Array.isArray(copie.saisons)) copie.saisons = [];
  if (!copie.lignes.length) copie.lignes.push(ligneVide());
  etat.editionRecette = { travail: copie, idOriginal: recette ? recette.id : null };
  etat.editeurDom = null;
  allerA('recettes');
}
function ligneVide() { return { ingredientId: null, quantite: null, unite: '', fixe: false }; }

function fermerEditeurRecette() {
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
}

function construireEditeurRecette() {
  const ed = etat.editionRecette;
  const r = ed.travail;
  const racine = el('div');
  etat.editeurDom = racine;

  // En-tête : titre, coût par portion, actions
  const enteteCout = el('span', { class: 'puce accent', text: '' });
  racine.appendChild(el('div', { class: 'barre-actions', style: 'justify-content:space-between;align-items:center;margin-bottom:.6rem' }, [
    el('h2', { style: 'margin:0', text: ed.idOriginal ? 'Modifier la recette' : 'Nouvelle recette' }),
    enteteCout,
  ]));

  // Le piège n°1 de ce type d'application : le rappel reste visible en
  // permanence, et il dit la base réellement utilisée à la saisie.
  const rappel = el('div', { class: 'rappel' });
  racine.appendChild(rappel);
  function majRappel() {
    const b = etat.baseSaisie;
    rappel.textContent = (b === 1)
      ? '⚠︎ Quantités pour 1 portion'
      : '⚠︎ Quantités saisies pour ' + b + ' portions — enregistrées ramenées à 1 portion';
  }

  // Le formulaire à gauche, l'aperçu à droite sur grand écran ; dessous sur mobile.
  const colonneForm = el('div', { class: 'col-form' });
  const colonneApercu = el('div', { class: 'col-apercu' });
  racine.appendChild(el('div', { class: 'editeur' }, [colonneForm, colonneApercu]));

  const champNom = el('input', { type: 'text', value: r.nom, placeholder: 'Chili sin carne' });
  champNom.addEventListener('input', function () { r.nom = champNom.value; majApercuRecette(); });
  const champTemps = el('input', { type: 'text', inputmode: 'numeric', value: r.tempsPreparationMin || '', placeholder: 'ex. 35' });
  champTemps.addEventListener('input', function () { r.tempsPreparationMin = parseNombre(champTemps.value); });
  const champTemperature = el('select');
  champTemperature.appendChild(el('option', { value: '', text: '— non précisé —', selected: !r.temperature }));
  TEMPERATURES.forEach(function (t) {
    champTemperature.appendChild(el('option', { value: t[0], text: t[1], selected: r.temperature === t[0] }));
  });
  champTemperature.addEventListener('change', function () { r.temperature = champTemperature.value || null; });
  // Aucune saison cochée = de toute l'année. C'est le cas courant, donc le défaut.
  const zoneSaisons = el('div', { class: 'filtres', style: 'margin:0' });
  SAISONS.forEach(function (sa) {
    const b = el('button', { type: 'button', class: 'puce-filtre', text: sa[1],
      'aria-pressed': String(r.saisons.indexOf(sa[0]) >= 0) });
    b.addEventListener('click', function () {
      const i = r.saisons.indexOf(sa[0]);
      if (i >= 0) r.saisons.splice(i, 1); else r.saisons.push(sa[0]);
      b.setAttribute('aria-pressed', String(r.saisons.indexOf(sa[0]) >= 0));
      noteSaisons.textContent = r.saisons.length ? '' : 'Aucune saison cochée : de toute l\'année.';
    });
    zoneSaisons.appendChild(b);
  });
  const noteSaisons = el('span', { class: 'tpt doux',
    text: r.saisons.length ? '' : 'Aucune saison cochée : de toute l\'année.' });

  const champPortions = el('input', { type: 'text', inputmode: 'numeric', value: r.portionsDefaut, placeholder: '4' });
  champPortions.addEventListener('input', function () {
    const n = parseNombre(champPortions.value);
    r.portionsDefaut = (n && n > 0) ? Math.min(99, Math.round(n)) : 4;
    majApercuRecette();
  });

  colonneForm.appendChild(el('div', { class: 'carte' }, [
    el('label', { class: 'champ' }, [el('span', { text: 'Nom de la recette' }), champNom]),
    el('div', { class: 'ligne-champs' }, [
      el('label', { class: 'champ' }, [el('span', { text: 'Temps de préparation (min)' }), champTemps]),
      el('label', { class: 'champ' }, [el('span', { text: 'Plat servi' }), champTemperature]),
      el('label', { class: 'champ' }, [el('span', { text: 'Portions par défaut' }), champPortions]),
    ]),
    el('div', { class: 'champ' }, [
      el('span', { style: 'display:block;font-size:.82rem;font-weight:600;color:var(--texte-doux);margin-bottom:.2rem', text: 'Saisons' }),
      zoneSaisons, noteSaisons,
    ]),
    construireChampTags(r),
  ]));

  // Lignes d'ingrédients
  const conteneurLignes = el('div', { class: 'lignes-ing', id: 'lignes-ing' });
  const titreIngredients = el('h3');
  // Une recette de livre donne « 400 g pour 4 personnes ». Plutôt que de faire
  // diviser l'utilisateur ligne par ligne, on saisit tel quel et l'app divise.
  const champBase = el('input', {
    type: 'text', inputmode: 'numeric', value: etat.baseSaisie, id: 'base-saisie',
    style: 'width:76px;flex:0 0 auto', 'aria-label': 'Nombre de portions de la recette saisie',
  });
  champBase.addEventListener('change', function () {
    const n = parseNombre(champBase.value);
    etat.baseSaisie = (n && n > 0) ? Math.min(99, Math.round(n)) : 1;
    champBase.value = etat.baseSaisie;
    majRappel(); majTitreIngredients(); rendreLignes();
  });
  function majTitreIngredients() {
    titreIngredients.textContent = (etat.baseSaisie === 1)
      ? 'Ingrédients — quantités pour 1 portion'
      : 'Ingrédients — quantités telles qu\'écrites sur la recette';
  }
  colonneForm.appendChild(el('div', { class: 'carte' }, [
    titreIngredients,
    el('div', { class: 'barre-portions', style: 'margin-bottom:.5rem' }, [
      el('label', { class: 'libelle', for: 'base-saisie', text: 'Je saisis les quantités pour' }),
      champBase,
      el('span', { style: 'flex:0 1 auto;font-weight:650;font-size:.95rem', text: 'portion(s)' }),
    ]),
    conteneurLignes,
    el('div', { class: 'barre-actions', style: 'margin-top:.5rem' }, [
      el('button', { type: 'button', class: 'btn', text: '＋ Ajouter une ligne', onclick: function () { r.lignes.push(ligneVide()); rendreLignes({ index: r.lignes.length - 1, champ: 'ing' }); } }),
      el('button', { type: 'button', class: 'btn', text: '⎘ Coller une liste', onclick: collerIngredients }),
    ]),
  ]));

  // Notes
  const champNotes = el('textarea', { placeholder: 'Étapes, astuces, source…' });
  champNotes.value = r.notes || '';
  champNotes.addEventListener('input', function () { r.notes = champNotes.value; });
  colonneForm.appendChild(el('div', { class: 'carte' }, [
    el('label', { class: 'champ' }, [el('span', { text: 'Notes' }), champNotes]),
  ]));

  // Aperçu en direct : vérifier d'un coup d'œil que la saisie par portion est cohérente.
  const apercu = el('div', { class: 'carte apercu', id: 'apercu-recette' });
  colonneApercu.appendChild(apercu);

  // Actions
  const actions = el('div', { class: 'barre-actions' }, [
    el('button', { type: 'button', class: 'btn principal', text: 'Enregistrer', onclick: enregistrerRecette }),
    el('button', { type: 'button', class: 'btn', text: 'Annuler', onclick: fermerEditeurRecette }),
  ]);
  if (ed.idOriginal) {
    actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Dupliquer', onclick: function () { const o = recetteParId(ed.idOriginal); if (o) dupliquerRecette(o); } }));
    actions.appendChild(el('button', { type: 'button', class: 'btn danger', text: 'Supprimer', onclick: function () { const o = recetteParId(ed.idOriginal); if (o) supprimerRecette(o, true); } }));
  }
  colonneForm.appendChild(el('div', { class: 'carte plate' }, [actions]));

  racine._enteteCout = enteteCout;
  racine._apercu = apercu;
  racine._lignes = conteneurLignes;

  majRappel();
  majTitreIngredients();
  rendreLignes();
  majApercuRecette();
  setTimeout(function () { if (!r.nom) champNom.focus(); }, 0);
  return racine;
}

function construireChampTags(r) {
  const zone = el('div', { class: 'barre-actions', style: 'margin-bottom:.4rem' });
  const champ = el('input', { type: 'text', placeholder: 'Ajouter un tag (végétarien, rapide…)', enterkeyhint: 'done' });
  const boite = el('div', { style: 'position:relative;flex:1 1 200px' }, [champ]);

  function redessiner() {
    zone.innerHTML = '';
    r.tags.forEach(function (t, i) {
      zone.appendChild(el('span', { class: 'puce accent' }, [
        el('span', { text: t }),
        el('button', {
          type: 'button', style: 'background:none;border:0;color:inherit;cursor:pointer;font:inherit;padding:0 0 0 .2rem;min-height:0',
          text: '×', 'aria-label': 'Retirer le tag ' + t,
          onclick: function () { r.tags.splice(i, 1); redessiner(); },
        }),
      ]));
    });
    if (!r.tags.length) zone.appendChild(el('span', { class: 'tpt doux', text: 'Aucun tag' }));
  }
  function ajouterTag(txt) {
    const t = String(txt || '').trim();
    if (t && r.tags.indexOf(t) < 0) r.tags.push(t);
    champ.value = '';
    redessiner();
  }
  attacherAutocompletion(champ, {
    items: function () {
      return tousLesTags().filter(function (t) { return r.tags.indexOf(t) < 0; })
        .map(function (t) { return { cle: t, libelle: t }; });
    },
    surChoix: function (it) { ajouterTag(it.libelle); },
    surCreation: function (txt) { ajouterTag(txt); },
    libelleCreation: function (txt) { return '＋ Ajouter le tag « ' + txt + ' »'; },
    surEntreeVide: function (txt) { ajouterTag(txt); },
  });
  redessiner();
  return el('div', { class: 'champ' }, [
    el('span', { style: 'display:block;font-size:.82rem;font-weight:600;color:var(--texte-doux);margin-bottom:.2rem', text: 'Tags' }),
    zone, boite,
  ]);
}

function rendreLignes(focusCible) {
  const ed = etat.editionRecette;
  if (!ed || !etat.editeurDom) return;
  const r = ed.travail;
  const conteneur = etat.editeurDom._lignes;
  conteneur.innerHTML = '';

  r.lignes.forEach(function (ligne, index) {
    const ing = ligne.ingredientId ? ingredientParId(ligne.ingredientId) : null;

    const champIng = el('input', { type: 'text', value: ing ? ing.nom : '', placeholder: 'Ingrédient…', enterkeyhint: 'next', 'aria-label': 'Ingrédient' });
    const boiteIng = el('div', { style: 'position:relative;min-width:0' }, [champIng]);
    attacherAutocompletion(champIng, {
      items: function () {
        return D.ingredients.map(function (i) {
          return { cle: i.id, libelle: i.nom, alias: i.aliases, secondaire: RAYON_LIBELLE[i.rayon] };
        });
      },
      surChoix: function (it) { affecterIngredient(index, it.cle); },
      surCreation: function (txt) {
        creerIngredient(txt, function (nouvel) { affecterIngredient(index, nouvel.id); });
      },
      libelleCreation: function (txt) { return '＋ Créer l\'ingrédient « ' + txt + ' »'; },
    });
    champIng.addEventListener('blur', function () {
      // Un texte libre qui ne correspond à rien ne crée jamais d'ingrédient silencieusement.
      setTimeout(function () {
        const cour = ligne.ingredientId ? ingredientParId(ligne.ingredientId) : null;
        if (champIng.isConnected) champIng.value = cour ? cour.nom : champIng.value;
      }, 150);
    });

    const base = etat.baseSaisie;
    const champQte = el('input', {
      type: 'text', inputmode: 'decimal', enterkeyhint: 'next',
      'aria-label': base === 1 ? 'Quantité pour 1 portion' : ('Quantité pour ' + base + ' portions'),
      value: (typeof ligne.quantite === 'number' && ligne.quantite !== null) ? formatNombre(ligne.quantite * base, 3) : '',
      placeholder: 'qté',
    });
    champQte.addEventListener('input', function () {
      const saisi = parseNombre(champQte.value);
      // Le modèle reste toujours en « pour 1 portion » : la base de saisie
      // n'est qu'une lentille, elle ne change rien à ce qui est enregistré.
      ligne.quantite = (saisi === null) ? null : saisi / base;
      majApercuRecette();
    });
    champQte.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (index === r.lignes.length - 1) {
        r.lignes.push(ligneVide());
        rendreLignes({ index: r.lignes.length - 1, champ: 'ing' });
      } else {
        rendreLignes({ index: index + 1, champ: 'ing' });
      }
    });

    // L'unité est strictement limitée à la famille de l'ingrédient : les familles sont étanches.
    const champUnite = el('select', { 'aria-label': 'Unité' });
    const unites = unitesDe(ing);
    if (!unites.length) champUnite.appendChild(el('option', { value: '', text: '—' }));
    unites.forEach(function (u) { champUnite.appendChild(el('option', { value: u, text: u, selected: ligne.unite === u })); });
    if (unites.length && unites.indexOf(ligne.unite) < 0) { ligne.unite = unites[0]; champUnite.value = unites[0]; }
    champUnite.disabled = !ing;
    champUnite.addEventListener('change', function () { ligne.unite = champUnite.value; majApercuRecette(); });

    const caseFixe = el('input', { type: 'checkbox', checked: !!ligne.fixe, 'aria-label': 'Quantité fixe' });
    caseFixe.addEventListener('change', function () { ligne.fixe = caseFixe.checked; majApercuRecette(); });

    const bloc = el('div', { class: 'ligne-ing' }, [
      boiteIng,
      champQte,
      champUnite,
      el('label', { class: 'inline-case zone-fixe', title: 'Ne se multiplie pas avec les portions' }, [caseFixe, el('span', { class: 'tpt', text: 'fixe' })]),
      el('div', { class: 'zone-fixe', style: 'gap:.1rem' }, [
        el('button', {
          type: 'button', class: 'btn mini fantome', text: '↑', 'aria-label': 'Monter la ligne',
          disabled: index === 0,
          onclick: function () { deplacerLigne(index, index - 1); },
        }),
        el('button', {
          type: 'button', class: 'btn mini fantome', text: '↓', 'aria-label': 'Descendre la ligne',
          disabled: index === r.lignes.length - 1,
          onclick: function () { deplacerLigne(index, index + 1); },
        }),
        el('button', {
          type: 'button', class: 'btn mini fantome', text: '✕', 'aria-label': 'Supprimer la ligne',
          onclick: function () {
            r.lignes.splice(index, 1);
            if (!r.lignes.length) r.lignes.push(ligneVide());
            rendreLignes();
            majApercuRecette();
          },
        }),
      ]),
    ]);
    conteneur.appendChild(bloc);
    bloc._champIng = champIng;
    bloc._champQte = champQte;
  });

  if (focusCible) {
    const bloc = conteneur.children[focusCible.index];
    if (bloc) {
      const cible = focusCible.champ === 'qte' ? bloc._champQte : bloc._champIng;
      if (cible) setTimeout(function () { cible.focus(); cible.select && cible.select(); }, 0);
    }
  }
  majApercuRecette();
}

/** Remonte ou descend une ligne d'ingrédient dans l'ordre de la recette. */
function deplacerLigne(de, vers) {
  const ed = etat.editionRecette;
  if (!ed) return;
  const lignes = ed.travail.lignes;
  if (vers < 0 || vers >= lignes.length) return;
  const [ligne] = lignes.splice(de, 1);
  lignes.splice(vers, 0, ligne);
  rendreLignes();
  majApercuRecette();
}

/* --- Coller une liste d'ingrédients ---------------------------------------
   Deux temps : on colle, puis on relit ce qui a été compris. Rien n'est écrit
   avant la relecture — un analyseur qui se trompe en silence coûte plus cher
   que la saisie qu'il fait gagner.
   ------------------------------------------------------------------------- */

/** Ingrédient neuf déduit d'une ligne collée. Rayon « autre » : à classer. */
function ingredientDeCollage(a) {
  const famille = a.famille || 'piece';
  return {
    id: genererId('ing', a.nom),
    nom: a.nom,
    aliases: [],
    rayon: 'autre',
    famille: famille,
    unitePiece: famille === 'piece' ? (a.unite || 'pièce') : null,
    prix: { valeur: null, par: PAR_PRIX_PAR_FAMILLE[famille] },
    placard: false,
  };
}

function collerIngredients() {
  const zone = el('textarea', {
    rows: '8', 'aria-label': 'Liste d\'ingrédients à coller',
    placeholder: '200 g de riz\n2 oignons\n1 c. à soupe d\'huile d\'olive\n3 gousses d\'ail',
  });
  const boite = ouvrirModale({
    titre: 'Coller des ingrédients',
    corps: [el('label', { class: 'champ' }, [zone])],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Analyser', variant: 'principal',
        onClick: function (f) {
          const lu = analyserCollage(zone.value);
          if (!lu.lignes.length) { toast('Aucun ingrédient reconnu dans ce texte.'); return; }
          f();
          relireCollage(lu);
        },
      },
    ],
  });
  setTimeout(function () { zone.focus(); }, 0);
  return boite;
}

/** Écran de relecture : chaque ligne comprise, corrigeable, avant écriture. */
function relireCollage(lu) {
  const base = etat.baseSaisie;
  const rangs = lu.lignes.map(function (a) {
    const m = rapprocherIngredient(D.ingredients, a.nom);
    return { a: a, ing: m ? m.ingredient : null, exact: !!(m && m.exact), garder: true };
  });

  const corps = el('div', { class: 'relecture' });
  if (lu.portions && lu.portions !== base) {
    const casePortions = el('input', { type: 'checkbox', checked: true });
    corps.appendChild(el('label', { class: 'inline-case' }, [
      casePortions,
      el('span', { text: 'Quantités données pour ' + lu.portions + ' personnes' }),
    ]));
    corps._portions = function () { return casePortions.checked ? lu.portions : null; };
  }

  rangs.forEach(function (rg) {
    const champNom = el('input', { type: 'text', value: rg.a.nom, 'aria-label': 'Nom de l\'ingrédient' });
    const champQte = el('input', { type: 'text', inputmode: 'decimal', style: 'width:70px;flex:0 0 auto',
      value: rg.a.quantite === null ? '' : formatNombre(rg.a.quantite, 3), 'aria-label': 'Quantité' });
    const champUnite = el('input', { type: 'text', style: 'width:88px;flex:0 0 auto',
      value: rg.a.unite, placeholder: '—', 'aria-label': 'Unité' });
    const caseGarder = el('input', { type: 'checkbox', checked: true, 'aria-label': 'Retenir cette ligne' });
    // Un rapprochement approché se propose, il ne s'impose pas : « Riz basmati »
    // ressemble à « Riz » sans être le même ingrédient, et seul celui qui saisit
    // sait lequel des deux il veut. Un appui sur l'étiquette bascule.
    const etiquette = el('button', { type: 'button', class: 'puce' });
    rg.lier = true;

    function majEtiquette() {
      const m = rapprocherIngredient(D.ingredients, champNom.value);
      rg.ing = m ? m.ingredient : null;
      rg.exact = !!(m && m.exact);
      etiquette.disabled = rg.exact || !rg.ing;
      if (rg.exact) {
        etiquette.className = 'puce';
        etiquette.textContent = 'connu';
        etiquette.title = 'Déjà dans votre référentiel.';
      } else if (rg.ing && rg.lier) {
        etiquette.className = 'puce puce-bouton alerte';
        etiquette.textContent = '≈ ' + rg.ing.nom;
        etiquette.title = 'Rattaché à « ' + rg.ing.nom + ' ». Touchez pour créer un ingrédient à part.';
      } else if (rg.ing) {
        etiquette.className = 'puce puce-bouton accent';
        etiquette.textContent = 'nouveau';
        etiquette.title = 'Créé à part. Touchez pour le rattacher à « ' + rg.ing.nom + ' ».';
      } else {
        etiquette.className = 'puce accent';
        etiquette.textContent = 'nouveau';
        etiquette.title = 'Aucun ingrédient de ce nom : il sera créé.';
      }
    }
    etiquette.addEventListener('click', function () { rg.lier = !rg.lier; majEtiquette(); });
    champNom.addEventListener('input', function () { rg.lier = true; majEtiquette(); });
    caseGarder.addEventListener('change', function () { rg.garder = caseGarder.checked; ligne.classList.toggle('ecarte', !rg.garder); });
    majEtiquette();

    rg.lire = function () {
      return {
        garder: caseGarder.checked,
        nom: champNom.value.trim(),
        quantite: parseNombre(champQte.value),
        unite: champUnite.value.trim(),
        famille: rg.a.famille,
        ing: (rg.exact || rg.lier) ? rg.ing : null,
      };
    };

    const ligne = el('div', { class: 'rang-relecture' }, [
      el('label', { class: 'case' }, [caseGarder]),
      el('div', { class: 'champs' }, [
        el('div', { class: 'haut' }, [champNom, etiquette]),
        el('div', { class: 'bas' }, [champQte, champUnite]),
      ]),
    ]);
    corps.appendChild(ligne);
  });

  if (lu.ignores.length) {
    const apercu = lu.ignores.slice(0, 3).join(' · ') +
      (lu.ignores.length > 3 ? ' · +' + (lu.ignores.length - 3) : '');
    corps.appendChild(el('p', { class: 'tpt doux', style: 'margin:.4rem 0 0', text: 'Ignoré : ' + apercu }));
  }

  ouvrirModale({
    titre: rangs.length + (rangs.length > 1 ? ' lignes lues' : ' ligne lue'),
    corps: [corps],
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: 'Ajouter', variant: 'principal',
        onClick: async function (f) {
          f();
          await appliquerCollage(rangs, corps._portions ? corps._portions() : null);
        },
      },
    ],
  });
}

/** Écrit les lignes retenues dans la recette en cours d'édition. */
async function appliquerCollage(rangs, portionsCollage) {
  const ed = etat.editionRecette;
  if (!ed) return;
  const r = ed.travail;
  // Les quantités collées valent pour le nombre de personnes de la recette
  // source ; le modèle, lui, ne connaît que « pour 1 portion ».
  const base = portionsCollage || etat.baseSaisie;
  if (portionsCollage) { etat.baseSaisie = portionsCollage; }

  let ajoutees = 0, creees = 0, ajustees = 0;
  const idsAvant = new Set(D.ingredients.map(function (i) { return i.id; }));
  const lignesAvant = r.lignes.slice();

  rangs.forEach(function (rg) {
    const v = rg.lire();
    if (!v.garder || !v.nom) return;
    // C'est le choix affiché dans l'écran de relecture qui fait foi : ce qu'on
    // y a vu est ce qui s'écrit.
    let ing = v.ing;
    if (!ing) {
      ing = ingredientDeCollage({ nom: v.nom, unite: v.unite, famille: v.famille });
      D.ingredients.push(ing);
      creees += 1;
    }
    // On ne convertit jamais entre familles : une unité étrangère à
    // l'ingrédient retenu est remplacée par la sienne, et on le signale.
    const permises = unitesDe(ing);
    let unite = permises.indexOf(v.unite) >= 0 ? v.unite : permises[0] || '';
    if (v.unite && unite !== v.unite) ajustees += 1;
    r.lignes.push({
      ingredientId: ing.id,
      quantite: (typeof v.quantite === 'number' && v.quantite > 0) ? v.quantite / base : null,
      unite: unite,
      fixe: false,
    });
    ajoutees += 1;
  });

  // Les lignes vides du départ n'ont plus de raison d'être.
  r.lignes = r.lignes.filter(function (l) { return l.ingredientId || l.quantite; });
  if (!r.lignes.length) r.lignes.push(ligneVide());

  if (creees) await sauvegarder();
  rendre();
  if (!ajoutees) { toast('Aucune ligne retenue.'); return; }
  const detail = [ajoutees + (ajoutees > 1 ? ' lignes ajoutées' : ' ligne ajoutée')];
  if (creees) detail.push(creees + (creees > 1 ? ' ingrédients créés' : ' ingrédient créé'));
  if (ajustees) detail.push(ajustees + ' unité' + (ajustees > 1 ? 's' : '') + ' ajustée' + (ajustees > 1 ? 's' : ''));
  toast(detail.join(' · '), {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      r.lignes = lignesAvant.length ? lignesAvant : [ligneVide()];
      D.ingredients = D.ingredients.filter(function (i) { return idsAvant.has(i.id); });
      await sauvegarder();
      rendre();
    },
  });
}

function affecterIngredient(index, ingredientId) {
  const ed = etat.editionRecette;
  if (!ed) return;
  const ligne = ed.travail.lignes[index];
  if (!ligne) return;
  const ing = ingredientParId(ingredientId);
  ligne.ingredientId = ingredientId;
  const unites = unitesDe(ing);
  if (unites.indexOf(ligne.unite) < 0) ligne.unite = unites[0] || '';
  rendreLignes({ index: index, champ: 'qte' });
}

function majApercuRecette() {
  const ed = etat.editionRecette;
  if (!ed || !etat.editeurDom) return;
  const r = ed.travail;
  const apercu = etat.editeurDom._apercu;
  const portions = r.portionsDefaut || 4;
  apercu.innerHTML = '';
  apercu.appendChild(el('h3', { style: 'margin:0', text: 'Pour ' + portions + ' portions' }));

  const lignesValides = r.lignes.filter(function (l) { return l.ingredientId && l.quantite; });
  if (!lignesValides.length) {
    apercu.appendChild(el('p', { class: 'pt', text: 'Renseignez des ingrédients pour voir l\'aperçu.' }));
    etat.editeurDom._enteteCout.textContent = '';
    return;
  }
  const faux = { id: r.id || 'apercu', nom: r.nom, lignes: lignesValides, portionsDefaut: portions };
  const donneesApercu = { ingredients: D.ingredients, recettes: [faux], reglages: D.reglages };
  const agr = agregerSelection(donneesApercu, [{ recetteId: faux.id, portions: portions }]);
  // On garde l'ordre de saisie : l'aperçu se relit ligne à ligne face au formulaire.
  const ordreSaisie = [];
  lignesValides.forEach(function (x) { if (ordreSaisie.indexOf(x.ingredientId) < 0) ordreSaisie.push(x.ingredientId); });
  const ul = el('ul');
  agr.lignes.slice().sort(function (a, b) {
    return ordreSaisie.indexOf(a.ingredient.id) - ordreSaisie.indexOf(b.ingredient.id);
  }).forEach(function (l) {
    ul.appendChild(el('li', {
      text: formatQuantiteBase(l.base, l.ingredient) + ' ' + elision(minusculeInitiale(l.ingredient.nom)) +
        (lignesValides.find(function (x) { return x.ingredientId === l.ingredient.id && x.fixe; }) ? ' (fixe)' : ''),
    }));
  });
  apercu.appendChild(ul);

  if (afficherPrix()) {
    const c = coutRecette(donneesApercu, faux, portions);
    etat.editeurDom._enteteCout.textContent = (c.sansPrix ? '≥ ' : '') + formatEuroFixe(c.parPortion) + ' / portion';
    apercu.appendChild(el('p', { class: 'tpt', text:
      'Coût estimé : ' + texteTotal(c.total, c.sansPrix) + ' pour ' + portions + ' portions' +
      ' (produits de placard exclus).' }));
    // Les prix manquants sont modifiables ici même, sans quitter la recette.
    const sansPrix = agr.lignes.filter(function (l) {
      return !l.ingredient.placard && prixParUniteBase(l.ingredient) === null;
    });
    if (sansPrix.length) {
      const barre = el('div', { class: 'barre-actions', style: 'margin-top:.3rem' }, [
        el('span', { class: 'tpt', text: 'Sans prix :' }),
      ]);
      sansPrix.forEach(function (l) {
        barre.appendChild(el('button', {
          type: 'button', class: 'puce puce-bouton', text: '✎ ' + l.ingredient.nom,
          onclick: function () { editionPrixRapide(l.ingredient, majApercuRecette); },
        }));
      });
      apercu.appendChild(barre);
    }
  }
}

async function enregistrerRecette() {
  const ed = etat.editionRecette;
  const r = ed.travail;
  const nom = (r.nom || '').trim();
  if (!nom) { toast('Donnez un nom à la recette.'); return; }
  const lignes = r.lignes.filter(function (l) { return l.ingredientId && typeof l.quantite === 'number' && l.quantite > 0; });
  if (!lignes.length) {
    const ok = await confirmer({ titre: 'Recette sans ingrédient', message: 'Aucune ligne complète (ingrédient + quantité). Enregistrer quand même ?', labelOk: 'Enregistrer' });
    if (!ok) return;
  }
  const cible = ed.idOriginal ? recetteParId(ed.idOriginal) : null;
  const enregistree = {
    id: cible ? cible.id : genererId('rec', nom),
    nom: nom,
    tags: r.tags.slice(),
    tempsPreparationMin: r.tempsPreparationMin,
    temperature: r.temperature || null,
    saisons: r.saisons.slice(),
    portionsDefaut: r.portionsDefaut || 4,
    derniereUtilisation: cible ? cible.derniereUtilisation : null,
    notes: r.notes || '',
    lignes: lignes.map(function (l) { return { ingredientId: l.ingredientId, quantite: l.quantite, unite: l.unite, fixe: !!l.fixe }; }),
  };
  if (cible) Object.assign(cible, enregistree);
  else D.recettes.push(enregistree);
  await sauvegarder();
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
  toast('Recette « ' + nom + ' » enregistrée.');
}

async function dupliquerRecette(recette) {
  const copie = JSON.parse(JSON.stringify(recette));
  copie.id = genererId('rec', recette.nom + ' copie');
  copie.nom = recette.nom + ' (copie)';
  copie.derniereUtilisation = null;
  D.recettes.push(copie);
  await sauvegarder();
  etat.editionRecette = null;
  etat.editeurDom = null;
  rendre();
  toast('Recette dupliquée.');
}

async function supprimerRecette(recette, depuisEditeur) {
  const ok = await confirmer({
    titre: 'Supprimer la recette',
    message: 'Supprimer « ' + recette.nom + ' » ? Elle sera aussi retirée de la semaine en cours et des semaines types.',
    labelOk: 'Supprimer', danger: true,
  });
  if (!ok) return;
  const index = D.recettes.indexOf(recette);
  const selAvant = D.semaine.selection.slice();
  const typesAvant = JSON.parse(JSON.stringify(D.semainesTypes));
  D.recettes.splice(index, 1);
  D.semaine.selection = D.semaine.selection.filter(function (s) { return s.recetteId !== recette.id; });
  D.semainesTypes.forEach(function (t) { t.selection = t.selection.filter(function (s) { return s.recetteId !== recette.id; }); });
  await sauvegarder();
  if (depuisEditeur) { etat.editionRecette = null; etat.editeurDom = null; }
  rendre();
  supprimerAvecAnnulation('Recette « ' + recette.nom + ' »', async function () {
    D.recettes.splice(index, 0, recette);
    D.semaine.selection = selAvant;
    D.semainesTypes = typesAvant;
    await sauvegarder();
    rendre();
  });
}

   Quatre entrées suffisent ; les empiler toutes sur un écran de téléphone
   obligeait à faire défiler pour atteindre la moindre d'entre elles.
   ------------------------------------------------------------------------- */

const SOUS_VUES_PLUS = [
  { cle: 'reglages', icone: '⚙️', titre: 'Réglages & référentiel',
    resume: function () { return D.ingredients.length + ' ingrédients'; } },
  { cle: 'sync', icone: '🔗', titre: 'Partage & synchronisation',
    resume: function () { return infosEspaces.courant ? infosEspaces.courant.nom : 'Cet appareil seulement'; } },
  { cle: 'historique', icone: '🗄️', titre: 'Historique des semaines',
