/** Icône du jeu, en SVG. La taille se règle en CSS par la classe. */
function icone(nom, classe) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  n.setAttribute('class', 'ic' + (classe ? ' ' + classe : ''));
  n.setAttribute('viewBox', '0 0 24 24');
  n.setAttribute('aria-hidden', 'true');
  n.innerHTML = ICONES[nom] || '';
  return n;
}

function el(tag, attrs, enfants) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, '');
      else if (attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
  }
  (enfants || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

/* --- Toasts et bandeau d'annulation (5 s) --- */
function toast(message, options) {
  const opt = options || {};
  const zone = $('#zone-toasts');
  const boite = el('div', { class: 'toast', role: 'status' }, [el('span', { text: message })]);
  let minuteur = null;
  const fermer = function () { if (minuteur) clearTimeout(minuteur); if (boite.parentNode) boite.remove(); };
  if (opt.actionLabel && opt.onAction) {
    boite.appendChild(el('button', {
      type: 'button',
      text: opt.actionLabel,
      onclick: function () { fermer(); opt.onAction(); },
    }));
  }
  zone.appendChild(boite);
  minuteur = setTimeout(fermer, opt.duree || 4000);
  return fermer;
}
/** Suppression annulable pendant 5 secondes. */
function supprimerAvecAnnulation(libelle, restaurer) {
  toast(libelle + ' — supprimé', { duree: 5000, actionLabel: 'Annuler', onAction: restaurer });
}

/* --- Modale --- */
let modaleOuverte = null;
function fermerModale() {
  if (!modaleOuverte) return;
  const m = modaleOuverte;
  modaleOuverte = null;
  m.fond.remove();
  document.removeEventListener('keydown', m.onKey, true);
  if (m.focusPrecedent && m.focusPrecedent.focus) { try { m.focusPrecedent.focus(); } catch (e) {} }
}
/**
 * ouvrirModale({ titre, corps:[Node], actions:[{label,variant,onClick,fermer}] })
 * onClick reçoit une fonction « fermer ». Retourne l'élément .modal.
 */
function ouvrirModale(cfg) {
  fermerModale();
  const focusPrecedent = document.activeElement;
  const boite = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': cfg.titre || 'Fenêtre' });
  if (cfg.titre) boite.appendChild(el('h2', { text: cfg.titre }));
  // On filtre comme le fait el() et comme le font déjà les actions : un corps
  // se construit souvent avec des « condition ? noeud : null ».
  (cfg.corps || []).filter(Boolean).forEach(function (c) { boite.appendChild(c); });
  const actions = el('div', { class: 'actions' });
  (cfg.actions || []).filter(Boolean).forEach(function (a) {
    actions.appendChild(el('button', {
      type: 'button', class: 'btn ' + (a.variant || ''), text: a.label,
      onclick: function () { a.onClick ? a.onClick(fermerModale) : fermerModale(); },
    }));
  });
  if ((cfg.actions || []).filter(Boolean).length) boite.appendChild(actions);
  const fond = el('div', { class: 'fond-modal' }, [boite]);
  fond.addEventListener('mousedown', function (ev) { if (ev.target === fond && cfg.fermetureExterieure !== false) fermerModale(); });
  // Tant que la fenêtre est ouverte, la tabulation tourne en boucle dedans.
  // Sans ça, le curseur passe derrière le voile gris et on peut déclencher,
  // sans le voir, un bouton de l'écran du dessous.
  function focalisables() {
    return $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', boite)
      .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
  }
  const onKey = function (ev) {
    if (ev.key === 'Escape') { ev.stopPropagation(); fermerModale(); if (cfg.onAnnule) cfg.onAnnule(); return; }
    if (ev.key !== 'Tab') return;
    const liste = focalisables();
    if (!liste.length) { ev.preventDefault(); return; }
    const premier = liste[0], dernier = liste[liste.length - 1];
    const dedans = boite.contains(document.activeElement);
    if (ev.shiftKey && (!dedans || document.activeElement === premier)) { ev.preventDefault(); dernier.focus(); }
    else if (!ev.shiftKey && (!dedans || document.activeElement === dernier)) { ev.preventDefault(); premier.focus(); }
  };
  document.addEventListener('keydown', onKey, true);
  $('#racine-modale').appendChild(fond);
  modaleOuverte = { fond: fond, onKey: onKey, focusPrecedent: focusPrecedent };
  const premier = boite.querySelector('input,select,textarea,button');
  if (premier) setTimeout(function () { try { premier.focus(); } catch (e) {} }, 0);
  return boite;
}
/** Confirmation non bloquante → Promise<boolean>. */
function confirmer(cfg) {
  return new Promise(function (resolve) {
    let repondu = false;
    const finir = function (v) { if (!repondu) { repondu = true; resolve(v); } };
    ouvrirModale({
      titre: cfg.titre,
      corps: (cfg.corps || [el('p', { text: cfg.message || '' })]),
      onAnnule: function () { finir(false); },
      actions: [
        { label: cfg.labelAnnuler || 'Annuler', onClick: function (f) { finir(false); f(); } },
        { label: cfg.labelOk || 'Confirmer', variant: cfg.danger ? 'danger' : 'principal', onClick: function (f) { finir(true); f(); } },
      ],
    });
  });
}

/* --- Autocomplétion (ingrédients, tags) --- */
/**
 * attacherAutocompletion(input, {
 *   items: () => [{ cle, libelle, secondaire }],
 *   surChoix: (item) => {},
 *   surCreation: (texte) => {},        // optionnel : entrée « Créer … »
 *   libelleCreation: (texte) => '…',
 * })
 */
function attacherAutocompletion(input, cfg) {
  const boite = input.parentNode;
  boite.classList.add('ac-boite');
  const liste = el('div', { class: 'ac-liste', hidden: true, role: 'listbox' });
  boite.appendChild(liste);
  let courants = [];
  let actif = -1;

  function fermer() { liste.hidden = true; actif = -1; }
  function normal(s) { return normaliserNom(s); }

  // Au-dessus de ce score, la suggestion est assez sûre pour être présélectionnée
  // et validée d'un simple Entrée. En dessous, c'est une piste, pas une réponse.
  const SCORE_SUR = 55;

  function calculer(txt) {
    const q = normal(txt);
    const tous = cfg.items() || [];
    if (!q) return { items: tous.slice(0, 30), meilleur: -1 };
    const notes = tous.map(function (it) {
      const cible = normal(it.libelle);
      const alias = (it.alias || []).map(normal);
      let score = -1;
      if (cible === q) score = 100;
      else if (cible.indexOf(q) === 0) score = 80;
      else if (alias.some(function (a) { return a === q; })) score = 70;
      else if (cible.indexOf(q) > 0) score = 60;
      else if (alias.some(function (a) { return a.indexOf(q) === 0; })) score = 55;
      else if (alias.some(function (a) { return a.indexOf(q) >= 0; })) score = 45;
      else if (ressemblance(txt, it.libelle) >= 0.7) score = 30;
      return { it: it, score: score };
    }).filter(function (x) { return x.score >= 0; })
      .sort(function (a, b) { return b.score - a.score || a.it.libelle.localeCompare(b.it.libelle, 'fr'); });
    return {
      items: notes.slice(0, 30).map(function (x) { return x.it; }),
      meilleur: notes.length ? notes[0].score : -1,
    };
  }

  function afficher() {
    const txt = input.value;
    const calcul = calculer(txt);
    courants = calcul.items;
    liste.innerHTML = '';
    courants.forEach(function (it, i) {
      const ligne = el('div', { class: 'ac-item', role: 'option', 'data-i': i }, [
        el('span', { text: it.libelle }),
        it.secondaire ? el('span', { class: 'sec', text: it.secondaire }) : null,
      ]);
      ligne.addEventListener('mousedown', function (ev) { ev.preventDefault(); choisir(i); });
      liste.appendChild(ligne);
    });
    const peutCreer = !!(cfg.surCreation && txt.trim() &&
      !courants.some(function (it) { return normal(it.libelle) === normal(txt); }));
    if (peutCreer) {
      const ligne = el('div', { class: 'ac-item creer', 'data-creer': '1' }, [
        el('span', { text: (cfg.libelleCreation ? cfg.libelleCreation(txt.trim()) : '+ Créer « ' + txt.trim() + ' »') }),
      ]);
      ligne.addEventListener('mousedown', function (ev) { ev.preventDefault(); creer(); });
      liste.appendChild(ligne);
    }
    const n = liste.children.length;
    liste.hidden = n === 0;
    // Présélection : la première suggestion seulement si elle est sûre, sinon
    // l'entrée « Créer », pour qu'un Entrée ne choisisse jamais un ingrédient
    // approchant à la place de celui qu'on est en train de saisir.
    if (!txt.trim()) actif = -1;
    else if (courants.length && calcul.meilleur >= SCORE_SUR) actif = 0;
    else if (peutCreer) actif = n - 1;
    else actif = courants.length ? 0 : -1;
    marquer();
  }
  function marquer() {
    $$('.ac-item', liste).forEach(function (n, i) { n.classList.toggle('actif', i === actif); });
    if (actif >= 0 && liste.children[actif]) {
      const n = liste.children[actif];
      if (n.offsetTop < liste.scrollTop) liste.scrollTop = n.offsetTop;
      else if (n.offsetTop + n.offsetHeight > liste.scrollTop + liste.clientHeight) {
        liste.scrollTop = n.offsetTop + n.offsetHeight - liste.clientHeight;
      }
    }
  }
  function choisir(i) {
    const it = courants[i];
    if (!it) return;
    fermer();
    cfg.surChoix(it);
  }
  function creer() {
    const txt = input.value.trim();
    fermer();
    if (txt && cfg.surCreation) cfg.surCreation(txt);
  }
  function validerActif() {
    if (liste.hidden || actif < 0) return false;
    const n = liste.children[actif];
    if (!n) return false;
    if (n.dataset.creer) { creer(); return true; }
    choisir(Number(n.dataset.i)); return true;
  }

  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', afficher);
  input.addEventListener('focus', afficher);
  input.addEventListener('blur', function () { setTimeout(fermer, 120); });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (liste.hidden) afficher(); else { actif = Math.min(actif + 1, liste.children.length - 1); marquer(); } }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); actif = Math.max(actif - 1, 0); marquer(); }
    else if (ev.key === 'Escape') { if (!liste.hidden) { ev.stopPropagation(); fermer(); } }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (!validerActif() && cfg.surEntreeVide) cfg.surEntreeVide(input.value.trim());
    }
  });
  return { fermer: fermer, rafraichir: afficher };
}

/* --- Abonnement : tenir le plan déposé à jour -----------------------------
   Un calendrier abonné relit l'adresse tout seul et remplace son contenu :
   c'est ce qui fait suivre les suppressions. Encore faut-il que l'adresse dise
   la vérité — on y redépose donc le plan dès qu'il change.
   ------------------------------------------------------------------------- */
let empreinteCalendrierPublie = null;
let minuteurCalendrier = null;
function publierCalendrierSiBesoin() {
  if (!D || !D.reglages.abonnementCalendrier) return;
  // Sans jour, aucun repas ne part : ce n'est pas une raison de vider
  // l'abonnement, mais c'est bien ce que le plan dit, donc on le dépose.
  const plan = planEnIcs(D, { exportes: {} });
  // L'horodatage change à chaque génération : on compare le reste.
  const empreinte = plan.texte.replace(/DTSTAMP:[^\r\n]*/g, '');
  if (empreinte === empreinteCalendrierPublie) return;
  empreinteCalendrierPublie = empreinte;
  clearTimeout(minuteurCalendrier);
  minuteurCalendrier = setTimeout(function () { Store.publierCalendrier(plan.texte); }, 1200);
}

async function sauvegarder() {
  // Point de passage unique : on en profite pour ne jamais laisser traîner de
  // case cochée sur un article qui a quitté la liste.
  D.semaine.coches = cochesNettoyees(D);
  D.semaine.dateModification = new Date().toISOString();
  await Store.save(D);
  publierCalendrierSiBesoin();
}

  document.documentElement.setAttribute('data-police', pol);

function ingredientParId(id) {
  for (let i = 0; i < D.ingredients.length; i++) if (D.ingredients[i].id === id) return D.ingredients[i];
  return null;
}
function recetteParId(id) {
  for (let i = 0; i < D.recettes.length; i++) if (D.recettes[i].id === id) return D.recettes[i];

}
function tousLesTags() {
  const s = new Set();
  D.recettes.forEach(function (r) { r.tags.forEach(function (t) { s.add(t); }); });

  if (!D) return;
  const court = window.innerWidth < 640;
  $('#libelle-periode').textContent = court
    ? libelleDePeriodeCourt(D.semaine.periode)
    : libelleDePeriode(D.semaine.periode);
  $('#bouton-calendrier').setAttribute('aria-label',
    'Planifier — liste de courses pour ' + libelleDePeriode(D.semaine.periode));
}

/* ——— INGRÉDIENTS : création, rapprochement, fusion (§4.3) ——————————————— */

/**
 * Ouvre le formulaire de création d'ingrédient.
 * Vérifie d'abord la ressemblance avec le référentiel et propose la fusion.
 * → callback(ingredient) une fois créé (ou l'ingrédient existant si fusion).
 */
function creerIngredient(nomSaisi, callback, options) {
  const opts = options || {};
  const similaires = trouverSimilaires(D.ingredients, nomSaisi);
  if (similaires.length && !opts.sauterRapprochement) {
    proposerFusion(nomSaisi, similaires, callback);
    return;
  }
  formulaireIngredient(nomSaisi, callback);
}

function proposerFusion(nomSaisi, similaires, callback) {
  const meilleur = similaires[0].ingredient;
  const corps = [
    el('p', { html: '« <strong>' + esc(nomSaisi) + '</strong> » ressemble à « <strong>' + esc(meilleur.nom) + '</strong> ». Même ingrédient ?' }),
    el('p', { class: 'pt doux', text: 'Fusionner ajoute « ' + nomSaisi + ' » comme alias de « ' + meilleur.nom + ' » : les deux noms désigneront le même ingrédient.' }),
  ];
  if (similaires.length > 1) {
    const autres = el('div', {}, [el('p', { class: 'tpt doux', text: 'Autres ressemblances :' })]);
    const ul = el('ul', { class: 'pt doux' });
    similaires.slice(1, 4).forEach(function (s) {
      const li = el('li');
      li.appendChild(el('button', {
        type: 'button', class: 'btn mini', text: 'Fusionner avec « ' + s.ingredient.nom + ' »',
        onclick: function () { fermerModale(); appliquerAlias(s.ingredient, nomSaisi, callback); },
      }));
      ul.appendChild(li);
    });
    autres.appendChild(ul);
    corps.push(autres);
  }
  ouvrirModale({
    titre: 'Ingrédient déjà connu ?',
    corps: corps,
    actions: [
      { label: 'Créer quand même', onClick: function (f) { f(); formulaireIngredient(nomSaisi, callback); } },
      { label: 'Fusionner avec « ' + meilleur.nom + ' »', variant: 'principal',
        onClick: function (f) { f(); appliquerAlias(meilleur, nomSaisi, callback); } },
    ],
  });
}

async function appliquerAlias(ingredient, alias, callback) {
  const norm = normaliserNom(alias);
  const dejaConnu = normaliserNom(ingredient.nom) === norm ||
    ingredient.aliases.some(function (a) { return normaliserNom(a) === norm; });
  if (!dejaConnu) ingredient.aliases.push(alias);
  await sauvegarder();
  toast('« ' + alias +' » rattaché à « ' + ingredient.nom + ' »');
  if (callback) callback(ingredient);
}

/** Formulaire de création / édition d'un ingrédient (rayon, famille, unité, prix). */
function formulaireIngredient(nomInitial, callback, ingredientExistant) {
  const edition = !!ingredientExistant;
  const src = ingredientExistant || {
    nom: nomInitial || '', rayon: 'autre', famille: 'masse', unitePiece: 'pièce',
    prix: { valeur: null, par: 'kg' }, placard: false, aliases: [],
  };

  const champNom = el('input', { type: 'text', value: src.nom, placeholder: 'Tomates concassées' });
  const champRayon = el('select');
  RAYONS.forEach(function (r) { champRayon.appendChild(el('option', { value: r[0], text: r[1], selected: src.rayon === r[0] })); });
  const champFamille = el('select');
  FAMILLES.forEach(function (f) { champFamille.appendChild(el('option', { value: f[0], text: f[1], selected: src.famille === f[0] })); });

  const champUnitePiece = el('input', { type: 'text', value: src.unitePiece || 'pièce', list: 'dl-unites-piece', placeholder: 'pièce' });
  const blocUnitePiece = el('label', { class: 'champ' }, [
    el('span', { text: 'Unité de la pièce' }),
    champUnitePiece,
  ]);
  const champPrix = el('input', { type: 'text', inputmode: 'decimal', value: (src.prix && typeof src.prix.valeur === 'number') ? formatNombre(src.prix.valeur, 2) : '', placeholder: 'ex. 2,40' });
  const suffixePrix = el('span', { class: 'puce', text: PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[src.famille]] });
  const champPlacard = el('input', { type: 'checkbox', checked: !!src.placard });

  function majFamille() {
    const fam = champFamille.value;
    blocUnitePiece.hidden = fam !== 'piece';
    suffixePrix.textContent = PAR_PRIX_LIBELLE[PAR_PRIX_PAR_FAMILLE[fam]];
  }
  champFamille.addEventListener('change', majFamille);
  majFamille();

  const corps = [
    el('label', { class: 'champ' }, [el('span', { text: 'Nom' }), champNom]),
    el('div', { class: 'ligne-champs' }, [
      el('label', { class: 'champ' }, [el('span', { text: 'Rayon' }), champRayon]),
      el('label', { class: 'champ' }, [el('span', { text: 'Famille d\'unités' }), champFamille]),
    ]),
    blocUnitePiece,
    el('label', { class: 'champ' }, [
      el('span', { text: 'Prix de référence (facultatif)' }),
      el('div', { class: 'ligne-champs' }, [champPrix, el('div', { class: 'zone-fixe' }, [suffixePrix])]),
    ]),
    el('label', { class: 'inline-case' }, [champPlacard, el('span', { text: 'Produit de fond de placard (sel, huile, épices…)' })]),
  ];

  ouvrirModale({
    titre: edition ? 'Modifier l\'ingrédient' : 'Nouvel ingrédient',
    corps: corps,
    actions: [
      { label: 'Annuler', onClick: function (f) { f(); } },
      {
        label: edition ? 'Enregistrer' : 'Créer', variant: 'principal',
        onClick: async function (f) {
          const nom = champNom.value.trim();
          if (!nom) { champNom.focus(); toast('Un nom est nécessaire.'); return; }
          const fam = champFamille.value;
          const cible = ingredientExistant || { id: genererId('ing', nom), aliases: [] };
          cible.nom = nom;
          cible.rayon = champRayon.value;
          cible.famille = fam;
          cible.unitePiece = fam === 'piece' ? (champUnitePiece.value.trim() || 'pièce') : null;
          cible.prix = { valeur: parseNombre(champPrix.value), par: PAR_PRIX_PAR_FAMILLE[fam] };
          cible.placard = champPlacard.checked;
          if (!edition) D.ingredients.push(cible);
          else corrigerUnitesRecettes(cible);
          await sauvegarder();
          f();
          if (callback) callback(cible);
          else { toast('Ingrédient enregistré.'); rendre(); }
        },
      },
    ],
  });
}

/** Après un changement de famille, réaligne les unités des lignes de recettes. */
function corrigerUnitesRecettes(ingredient) {
  const valides = unitesDe(ingredient);
  D.recettes.forEach(function (r) {
    r.lignes.forEach(function (l) {
      if (l.ingredientId === ingredient.id && valides.indexOf(l.unite) < 0) l.unite = valides[0];
    });
  });
}

/** Fusion manuelle : source devient un alias de cible, les recettes sont mises à jour. */
async function fusionnerIngredients(sourceId, cibleId) {
  const source = ingredientParId(sourceId);
  const cible = ingredientParId(cibleId);
  if (!source || !cible || source.id === cible.id) return;
  const noms = [source.nom].concat(source.aliases);
  noms.forEach(function (n) {
    const norm = normaliserNom(n);
    if (normaliserNom(cible.nom) !== norm && !cible.aliases.some(function (a) { return normaliserNom(a) === norm; })) {
      cible.aliases.push(n);
    }
  });
  const unitesCible = unitesDe(cible);
  D.recettes.forEach(function (r) {
    const fusionnees = [];
    r.lignes.forEach(function (l) {
      if (l.ingredientId !== source.id) { fusionnees.push(l); return; }
      l.ingredientId = cible.id;
      if (unitesCible.indexOf(l.unite) < 0) l.unite = unitesCible[0];
      fusionnees.push(l);
    });
    // Deux lignes du même ingrédient dans une recette : on additionne en unité de base.
    const parIng = new Map();
    const resultat = [];
    fusionnees.forEach(function (l) {
      const cle = l.ingredientId + '|' + l.fixe;
      if (!parIng.has(cle)) { parIng.set(cle, l); resultat.push(l); return; }
      const ref = parIng.get(cle);
      const baseRef = versBase(ref.quantite, ref.unite, cible.famille);
      const baseAdd = versBase(l.quantite, l.unite, cible.famille);
      const f = facteurUnite(cible.famille, ref.unite) || 1;
      ref.quantite = (baseRef + baseAdd) / f;
    });
    r.lignes = resultat;
  });
  if (D.semaine.coches[source.id]) { D.semaine.coches[cible.id] = true; delete D.semaine.coches[source.id]; }
  D.ingredients = D.ingredients.filter(function (i) { return i.id !== source.id; });
  await sauvegarder();
  toast('« ' + source.nom + ' » fusionné dans « ' + cible.nom + ' ».');
  rendre();
}

/* --- 5.1 Semaine (écran d'accueil) --- */

/** Entrées de planning d'une recette, dans la période d'achat en cours. */
function entreesDe(recetteId) {
  return selectionActive(D).filter(function (s) { return s.recetteId === recetteId; });
}
function selectionDe(recetteId) {
  return entreesDe(recetteId)[0] || null;
}
function nouvelleEntree(recetteId, portions, date) {
  return {
    id: 'pl_' + slug(recetteId).slice(0, 12) + '_' + suffixeCourt(),
    recetteId: recetteId,
    portions: portions,
    date: date || null,
  };
}
async function ajouterASemaine(recette, date) {
  // Le nombre de portions de base sert de valeur de départ : on le règle une
  // fois en haut de l'écran au lieu de le ressaisir recette par recette.
  const portions = D.reglages.portionsBase || 4;
  if (date === undefined && entreesDe(recette.id).length) return;   // depuis une carte : une fois suffit
  D.semaine.selection.push(nouvelleEntree(recette.id, portions, date || null));
  recette.portionsDefaut = portions;
  await sauvegarder();
  rendre();
}
async function retirerDeSemaine(recetteId) {
  const cibles = new Set(entreesDe(recetteId).map(function (e) { return e.id; }));
  D.semaine.selection = D.semaine.selection.filter(function (s) { return !cibles.has(s.id); });
  await sauvegarder();
  rendre();
}
async function retirerEntree(entreeId) {
  D.semaine.selection = D.semaine.selection.filter(function (s) { return s.id !== entreeId; });
  await sauvegarder();
  rendre();
}
async function changerPortions(recetteId, delta) {
  const entrees = entreesDe(recetteId);
  if (!entrees.length) return;
  entrees.forEach(function (e) { e.portions = Math.max(1, Math.min(99, e.portions + delta)); });
  const rec = recetteParId(recetteId);
  if (rec) rec.portionsDefaut = entrees[0].portions;   // mémorisé pour les prochaines fois
  await sauvegarder();
  rendre();
}
async function changerPortionsEntree(entreeId, delta) {
  const e = D.semaine.selection.find(function (x) { return x.id === entreeId; });
  if (!e) return;
  e.portions = Math.max(1, Math.min(99, e.portions + delta));
  await sauvegarder();
  rendre();
}
/**
 * Place un repas à une date, ou l'en retire si on retouche le jour déjà actif.
 * C'est la même entrée qui bouge : dater un plat déjà retenu ne doit jamais en
 * créer un second, sans quoi la liste de courses le compte deux fois.
 */
async function daterEntree(entreeId, iso) {
  const e = D.semaine.selection.find(function (x) { return x.id === entreeId; });
  if (!e) return;
  e.date = (e.date === iso) ? null : (iso || null);
  await sauvegarder();
  rendre();
}
/**
 * Rangée des jours de la période pour un repas : un appui le place, un second
 * appui sur le même jour le remet sans date. Choisir le jour là où on choisit
 * la recette évite d'ouvrir le calendrier pour le geste le plus courant.
 */
/**
 * Ajoute ou retire un repas de cette recette à cette date. Une même recette
 * peut tenir plusieurs jours de la période : chaque jour est un repas.
 * Éteindre le dernier jour ne sort pas la recette de la semaine — elle
 * redevient un repas sans jour, et « ✕ » reste le seul moyen de la retirer.
 */
async function basculerJour(recetteId, iso) {
  const entrees = entreesDe(recetteId);
  const dessus = entrees.find(function (e) { return e.date === iso; });
  if (dessus) {
    if (entrees.length === 1) dessus.date = null;
    else D.semaine.selection = D.semaine.selection.filter(function (s) { return s.id !== dessus.id; });
  } else {
    // Un repas déjà retenu sans jour se place ici plutôt que d'en créer un
    // second : sinon la liste compterait le plat deux fois.
    const orphelin = entrees.find(function (e) { return !e.date; });
    if (orphelin) orphelin.date = iso;
    else {
      const portions = entrees.length ? entrees[0].portions : (D.reglages.portionsBase || 4);
      D.semaine.selection.push(nouvelleEntree(recetteId, portions, iso));
    }
  }
  await sauvegarder();
  rendre();
}

function rangeeJours(recetteId) {
  const rangee = el('div', { class: 'rangee-jours', role: 'group', 'aria-label': 'Jours où ce plat est prévu' });
  function peindre() {
    rangee.innerHTML = '';
    const dates = new Set(entreesDe(recetteId).map(function (e) { return e.date; }).filter(Boolean));
    const jours = joursDeLaPeriode(D.semaine.periode);
    const avecNumero = jours.length > 7;   // au-delà de la semaine, l'initiale ne suffit plus
    jours.forEach(function (iso) {
      const j = dateDepuisISO(iso);
      if (!j) return;
      const i = (j.getDay() + 6) % 7;
      const actif = dates.has(iso);
      const quand = JOURS_LONGS[i] + ' ' + j.getDate() + ' ' + MOIS[j.getMonth()];
      const b = el('button', {
        type: 'button', class: 'puce-jour', 'aria-pressed': String(actif),
        'aria-label': (actif ? 'Retirer le repas du ' : 'Ajouter un repas le ') + quand,
      }, [
        el('span', { class: 'l', text: JOURS_COURTS[i].charAt(0).toUpperCase() }),
        avecNumero ? el('span', { class: 'n', text: String(j.getDate()) }) : null,
      ]);
      b.addEventListener('click', async function () { await basculerJour(recetteId, iso); peindre(); });
      rangee.appendChild(b);
    });
  }
  peindre();
  return rangee;
}

      });
      // Retirer cinq filtres un par un serait pire que le panneau qu'on remplace :
      // il faut pouvoir tout lever d'un geste. Toujours présent dès qu'un filtre
      // s'applique — le faire apparaître au deuxième rendrait le geste incertain.
      zoneActifs.appendChild(el('button', {
          type: 'button', class: 'btn mini fantome', text: 'Tout afficher',
          onclick: function () {
            etat.filtreTempsMax = 0; etat.filtreTemperature = ''; etat.filtreSaison = '';
            etat.tagFiltre = ''; etat.rechercheRecettes = '';
            champRecherche.value = ''; selectTag.value = '';
            remplirCartes();
          },
      }));
      zoneActifs.appendChild(el('span', { class: 'tpt doux', style: 'margin-left:.2rem',
        text: nbTrouvees + ' sur ' + D.recettes.length }));
    }
  }

  function remplirCartes() {
    grille.innerHTML = '';

    if (!D.recettes.length) {
      remplirFiltres(0);
      grille.appendChild(etatVide('livre', 'Aucune recette pour l\'instant.',
        el('button', { type: 'button', class: 'btn principal', text: 'Créer ma première recette',
          onclick: function () { allerA('recettes'); ouvrirEditeurRecette(null); } })));
      return;
    }

    const criteres = {
      texte: etat.rechercheRecettes,
      tag: etat.tagFiltre,
      tempsMax: etat.filtreTempsMax,
      temperature: etat.filtreTemperature,
      saison: etat.filtreSaison,
    };
    // Les recettes retenues restent en tête, quel que soit le tri demandé.
    const trouvees = trierRecettes(D, filtrerRecettes(D, criteres), etat.triRecettes, D.reglages.portionsBase)
      .sort(function (a, b) {
        const sa = selectionDe(a.recette.id) ? 0 : 1, sb = selectionDe(b.recette.id) ? 0 : 1;
        return sa - sb;
      });
    remplirFiltres(trouvees.length);

    const nonClassees = recettesNonClassees(D, criteres);
    if (nonClassees.length) {
      grille.appendChild(el('div', { class: 'carte plate tpt doux', style: 'margin-bottom:.2rem' }, [
        el('span', { text: nonClassees.length + ' recette' + (nonClassees.length > 1 ? 's ne sont pas classées' : ' n\'est pas classée') +
          ' chaud / froid et n\'apparaî' + (nonClassees.length > 1 ? 'ssent' : 't') + ' donc pas : ' +
          nonClassees.slice(0, 4).map(function (r) { return r.nom; }).join(', ') + (nonClassees.length > 4 ? '…' : '') + '.' }),
      ]));
    }
    if (!trouvees.length) {
      grille.appendChild(etatVide('loupe', 'Aucune recette ne correspond.'));
      return;
    }

    trouvees.forEach(function (t) {
      const r = t.recette;
      const sel = selectionDe(r.id);
      const c = coutRecette(D, r, sel ? sel.portions : D.reglages.portionsBase);

      // Les faits sur une ligne de texte discret ; les puces sont réservées aux
      // signaux, qui doivent sauter aux yeux.
      const faits = [];
      if (r.tempsPreparationMin) faits.push(r.tempsPreparationMin + ' min');
      if (r.temperature) faits.push(TEMPERATURE_LIBELLE[r.temperature]);
      if (r.saisons.length && r.saisons.length < 4) {
        faits.push(r.saisons.map(function (x) { return SAISON_LIBELLE[x].toLowerCase(); }).join('/'));
      }
      if (r.tags.length) faits.push(r.tags.join(', '));
      if (afficherPrix() && c.total > 0) faits.push(formatEuroFixe(c.parPortion) + ' / portion');
      const meta = el('div', { class: 'meta' }, [
        faits.length ? el('span', { class: 'faits', text: faits.join(' · ') }) : null,
      ]);
      // Une même recette peut être planifiée plusieurs fois dans la période.
      const entrees = entreesDe(r.id);
      if (entrees.length > 1) {
        const jours = entrees.filter(function (e) { return e.date; }).length;
        meta.appendChild(el('span', { class: 'puce accent',
          text: entrees.length + ' repas' + (jours ? ' · ' + jours + ' daté' + (jours > 1 ? 's' : '') : '') }));
      }
      // On dit pourquoi la recette ressort quand c'est un ingrédient qui a fait mouche.
      if (t.ingredientsTrouves.length) {
        meta.appendChild(el('span', { class: 'puce accent', text: 'contient : ' + t.ingredientsTrouves.join(', ') }));
      }

      const nom = el('button', { type: 'button', class: 'nom' }, [
        el('span', { text: r.nom }),
        el('span', { class: 'loupe', 'aria-hidden': 'true', text: '›' }),
      ]);
      nom.setAttribute('aria-label', 'Voir la fiche de ' + r.nom);
      nom.addEventListener('click', function () { apercuRecette(r); });

      // Le nombre de portions se règle d'un seul geste tant que tous les repas
      // en ont autant. Dès qu'ils divergent — c'est possible depuis le
      // calendrier — un seul compteur mentirait, et « Planning » y renvoie.
      const memesPortions = entrees.every(function (e) { return e.portions === entrees[0].portions; });
      const action = (sel && !memesPortions)
        ? el('div', { class: 'actions-carte' }, [
            el('button', { type: 'button', class: 'btn mini', text: 'Planning',
              title: 'Ces repas n\'ont pas le même nombre de portions : ajustez-les dans le calendrier',
              onclick: function () { ouvrirCalendrier(entrees.find(function (e) { return e.date; }) ? entrees.find(function (e) { return e.date; }).date : null); } }),
            el('button', { type: 'button', class: 'btn mini fantome retirer', text: '✕',
              'aria-label': 'Retirer tous les repas de ' + r.nom, onclick: function () { retirerDeSemaine(r.id); } }),
          ])
        : sel
        ? el('div', { class: 'actions-carte' }, [
            el('div', { class: 'stepper compact' }, [
              el('button', { type: 'button', text: '−', 'aria-label': 'Moins de portions pour ' + r.nom, onclick: function () { changerPortions(r.id, -1); } }),
              el('span', { class: 'valeur', text: String(sel.portions) }),
              el('button', { type: 'button', text: '+', 'aria-label': 'Plus de portions pour ' + r.nom, onclick: function () { changerPortions(r.id, 1); } }),
            ]),
            el('button', { type: 'button', class: 'btn mini fantome retirer', text: '✕',
              'aria-label': 'Retirer ' + r.nom + ' de la semaine', title: 'Retirer de la semaine',
              onclick: function () { retirerDeSemaine(r.id); } }),
          ])
        : el('button', { type: 'button', class: 'btn principal ajouter', text: '+', 'aria-label': 'Ajouter ' + r.nom + ' à la semaine', onclick: function () { ajouterASemaine(r); } });

      grille.appendChild(el('div', { class: 'carte carte-recette' + (sel ? ' selectionnee' : '') }, [
        el('div', { class: 'entete-carte' }, [el('div', { class: 'infos' }, [nom]), action]),
        meta,
        // Un appui par jour : la même recette peut tenir plusieurs jours.
        sel ? rangeeJours(r.id) : null,
      ]));
    });
  }

  function remplirRecap() {
    recap.innerHTML = '';
    const sel = selectionActive(D);

    if (!sel.length) {
      recap.appendChild(el('p', { class: 'doux', style: 'margin:.3rem 0', text: 'Ma semaine est vide.' }));
      return;
    }

    const totalPortions = sel.reduce(function (a, s) { return a + s.portions; }, 0);
    const c = coutSelection(D, sel);

    // Une ligne suffit à savoir où on en est ; le détail se déplie à la demande,
    // et « Générer la liste » reste atteignable dans les deux états.
    // On compte des repas, pas des recettes : la même peut revenir deux fois
    // dans la période.
    const distinctes = new Set(sel.map(function (e) { return e.recetteId; })).size;
    // Court, sinon la ligne se tronque et c'est le prix qui saute. Le détail
    // des portions se déplie juste dessous.
    const resume = el('span', { class: 'resume' }, [
      el('span', { text: sel.length + ' repas' }),
    ]);
    if (afficherPrix()) {
      resume.appendChild(el('span', { text: ' · ' }));
      resume.appendChild(el('span', { class: 'cout', text: texteTotal(c.total, c.sansPrix) }));
    }

    const detail = el('div', { class: 'detail', id: 'detail-semaine', hidden: !etat.recapOuvert });
    detail.appendChild(el('p', { class: 'tpt doux', style: 'margin:0',
      text: totalPortions + ' portions' + (distinctes !== sel.length ? ' · ' + distinctes + ' recettes distinctes' : '') }));
    const ul = el('ul');
    sel.slice().sort(function (a, b) { return String(a.date || '9').localeCompare(String(b.date || '9')); })
      .forEach(function (s) {
        const r = recetteParId(s.recetteId);
        if (!r) return;
        let quand = '';
        if (s.date) {
          const j = dateDepuisISO(s.date);
          if (j) quand = JOURS_LONGS[(j.getDay() + 6) % 7] + ' ' + j.getDate() + ' — ';
        }
        ul.appendChild(el('li', { text: quand + r.nom + ' — ' + s.portions + ' portions' }));
      });
    detail.appendChild(ul);
    if (afficherPrix()) {
      const evo = evolutionCout(c.total);
      if (evo) detail.appendChild(el('p', { class: 'tpt doux', style: 'margin:0', text: evo }));
    }

    const bascule = el('button', {
      type: 'button', class: 'bascule', 'aria-expanded': String(!!etat.recapOuvert), 'aria-controls': 'detail-semaine',
    }, [resume, el('span', { class: 'chevron', 'aria-hidden': 'true', text: '⌃' })]);
    bascule.addEventListener('click', function () {
      etat.recapOuvert = !etat.recapOuvert;
      detail.hidden = !etat.recapOuvert;
      bascule.setAttribute('aria-expanded', String(etat.recapOuvert));
    });

    recap.appendChild(el('div', { class: 'ligne-resume' }, [
      bascule,
      el('button', {
        type: 'button', class: 'btn principal actions-recap', text: 'Générer la liste',
        onclick: function () { allerA('liste'); },
      }),
    ]));
    recap.appendChild(detail);
  }

  remplirCartes();
  remplirRecap();
}

/**
 * Fiche de lecture rapide, sans quitter la composition de la semaine :
 * ce qu'il faut acheter pour le nombre de portions retenu, et les notes.
 */
function apercuRecette(recette) {
  const sel = selectionDe(recette.id);
  const portions = sel ? sel.portions : D.reglages.portionsBase;
  const corps = el('div', { class: 'apercu-fiche' });

  const meta = el('div', { class: 'barre-actions', style: 'margin-bottom:.5rem' });
  if (recette.tempsPreparationMin) meta.appendChild(el('span', { class: 'puce', text: recette.tempsPreparationMin + ' min' }));
  if (recette.temperature) meta.appendChild(el('span', { class: 'puce', text: TEMPERATURE_LIBELLE[recette.temperature] }));
  recette.tags.forEach(function (t) { meta.appendChild(el('span', { class: 'puce', text: t })); });
  const c = coutRecette(D, recette, portions);
  if (afficherPrix() && c.total > 0) {
    meta.appendChild(el('span', { class: 'puce accent', text: (c.sansPrix ? '≥ ' : '') + formatEuroFixe(c.parPortion) + ' / portion' }));
  }
  corps.appendChild(meta);

  // Le jour se règle depuis la fiche aussi : on y arrive souvent avant de
  // savoir quand on cuisinera le plat.
  if (sel) {
    corps.appendChild(el('div', { class: 'tpt doux', style: 'margin:.1rem 0 0', text: 'Jours' }));
    corps.appendChild(rangeeJours(recette.id));
  }

  corps.appendChild(el('h3', { style: 'margin:.2rem 0 0', text: 'Pour ' + portions + ' portion' + (portions > 1 ? 's' : '') }));
  const agr = agregerSelection(D, [{ recetteId: recette.id, portions: portions }]);
  if (!agr.lignes.length) {
    corps.appendChild(el('p', { class: 'pt doux', text: 'Aucun ingrédient renseigné.' }));
  } else {
    const ordreSaisie = recette.lignes.map(function (l) { return l.ingredientId; });
    const ul = el('ul');
    agr.lignes.slice().sort(function (a, b) {
      return ordreSaisie.indexOf(a.ingredient.id) - ordreSaisie.indexOf(b.ingredient.id);
    }).forEach(function (l) {
      const fixe = recette.lignes.some(function (x) { return x.ingredientId === l.ingredient.id && x.fixe; });
      ul.appendChild(el('li', {
        text: formatQuantiteBase(l.base, l.ingredient) + ' ' + elision(minusculeInitiale(l.ingredient.nom)) + (fixe ? ' (fixe)' : ''),
      }));
    });
    corps.appendChild(ul);
  }
  if (recette.notes && recette.notes.trim()) {
    corps.appendChild(el('div', { class: 'notes', text: recette.notes }));
  }

  const actions = [
    { label: 'Fermer', onClick: function (f) { f(); } },
    { label: 'Modifier', onClick: function (f) { f(); allerA('recettes'); ouvrirEditeurRecette(recette); } },
  ];
  actions.push(sel
    ? { label: 'Retirer de la semaine', onClick: function (f) { f(); retirerDeSemaine(recette.id); } }
    : { label: 'Ajouter à la semaine', variant: 'principal', onClick: function (f) { f(); ajouterASemaine(recette); } });

  ouvrirModale({ titre: recette.nom, corps: [corps], actions: actions });
}

/**
 * Règle le nombre de portions de base. Il pré-remplit chaque ajout, et
 * s'applique aussi aux recettes déjà retenues — « ce soir on est six » ne doit
 * pas se ressaisir recette par recette. Annulable.
 */
async function changerPortionsBase(delta) {
  const avant = D.reglages.portionsBase;
  const apres = Math.max(1, Math.min(99, avant + delta));
  if (apres === avant) return;
  const selAvant = JSON.parse(JSON.stringify(D.semaine.selection));
  const defautsAvant = D.recettes.map(function (r) { return { id: r.id, p: r.portionsDefaut }; });

  D.reglages.portionsBase = apres;
  selectionActive(D).forEach(function (s) {
    s.portions = apres;
    const r = recetteParId(s.recetteId);
    if (r) r.portionsDefaut = apres;
  });
  await sauvegarder();
  rendre();
  if (selAvant.length) {
    toast('Semaine passée à ' + apres + ' portions', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.reglages.portionsBase = avant;
        D.semaine.selection = selAvant;
        defautsAvant.forEach(function (x) { const r = recetteParId(x.id); if (r) r.portionsDefaut = x.p; });
        await sauvegarder();
        rendre();
      },
    });
  }
}

function evolutionCout(coutActuel) {
  const h = D.historique.filter(function (x) { return typeof x.coutEstime === 'number' && x.coutEstime > 0; });
  if (!h.length) return null;
  const precedent = h[0];
  const delta = coutActuel - precedent.coutEstime;
  const signe = delta >= 0 ? '+' : '−';
  return 'Semaine précédente (' + formatDateCourte(precedent.date) + ') : ' + formatEuroFixe(precedent.coutEstime) +
    ' · ' + signe + ' ' + formatEuroFixe(Math.abs(delta));
}

async function viderSemaine() {
  if (!D.semaine.selection.length && !D.semaine.ajoutsManuels.length) { toast('La semaine est déjà vide.'); return; }
  const ok = await confirmer({
    titre: 'Vider la semaine',
    message: 'La sélection en cours est archivée dans l\'historique, puis remise à zéro. Les recettes retenues sont marquées comme faites aujourd\'hui.',
    labelOk: 'Archiver et vider',
  });
  if (!ok) return;
  const ancienne = {
    selection: D.semaine.selection.slice(),
    coches: Object.assign({}, D.semaine.coches),
    ajoutsManuels: D.semaine.ajoutsManuels.slice(),
    libelle: D.semaine.libelle,
  };
  const ancienHistorique = D.historique.slice();
  const ancienneUtilisation = D.recettes.map(function (r) { return { id: r.id, d: r.derniereUtilisation }; });

  if (D.semaine.selection.length) {
    const c = coutSelection(D, selectionActive(D));
    D.historique.unshift({
      date: aujourdHuiISO(), libelle: D.semaine.libelle,
      selection: D.semaine.selection.slice(), coutEstime: c.total,
    });
    D.historique = D.historique.slice(0, 60);
    const auj = aujourdHuiISO();
    D.semaine.selection.forEach(function (s) {
      const r = recetteParId(s.recetteId);
      if (r) r.derniereUtilisation = auj;
    });
  }
  D.semaine.selection = [];
  D.semaine.coches = {};
  D.semaine.ajoutsManuels = [];
  D.semaine.libelle = libelleSemaineCourante();
  await sauvegarder();
  rendre();
  toast('Semaine archivée et vidée', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = ancienne.selection;
      D.semaine.coches = ancienne.coches;
      D.semaine.ajoutsManuels = ancienne.ajoutsManuels;
      D.semaine.libelle = ancienne.libelle;
      D.historique = ancienHistorique;
      ancienneUtilisation.forEach(function (x) { const r = recetteParId(x.id); if (r) r.derniereUtilisation = x.d; });
      await sauvegarder();
      rendre();
    },
  });
}

      {

        onClick: async function (f) {

          D.semainesTypes.push({ id: genererId('st', nom), nom: nom, selection: D.semaine.selection.slice() });
          await sauvegarder();

function chargerSemaineType() {
  if (!D.semainesTypes.length) { toast('Aucune semaine type enregistrée.'); return; }
  const corps = [el('p', { class: 'pt doux', text: 'La sélection actuelle sera remplacée.' })];

    const noms = t.selection.map(function (s) { const r = recetteParId(s.recetteId); return r ? r.nom : null; }).filter(Boolean);
    liste.appendChild(el('div', { class: 'carte plate', style: 'margin:0' }, [
      el('div', { class: 'gras', text: t.nom }),
      el('div', { class: 'tpt doux', text: noms.join(' · ') || 'Vide' }),
      el('div', { class: 'barre-actions', style: 'margin-top:.4rem' }, [
        el('button', {
          type: 'button', class: 'btn mini principal', text: 'Ajouter',
          title: 'Ajoute ces recettes à la semaine en cours',
          onclick: function () { fermerModale(); appliquerSemaineType(t, 'ajouter'); },
        }),
        el('button', {
          type: 'button', class: 'btn mini', text: 'Remplacer',
          title: 'Remplace la sélection en cours par cette semaine type',
          onclick: function () { fermerModale(); appliquerSemaineType(t, 'remplacer'); },
        }),

            });

          },
        }),
      ]),
    ]));

/** Applique une semaine type : en complément de la sélection, ou à sa place. */
async function appliquerSemaineType(type, mode) {
  const idsConnus = new Set(D.recettes.map(function (r) { return r.id; }));
  const voulue = rebaserSelection(nettoyerSelection(type.selection, idsConnus), D.semaine.periode);

  if (mode === 'remplacer') {
    const avant = D.semaine.selection.slice();
    const cochesAvant = Object.assign({}, D.semaine.coches);
    D.semaine.selection = voulue;
    D.semaine.coches = {};
    await sauvegarder();
    rendre();
    toast('« ' + type.nom +' » a remplacé la sélection', {
      duree: 5000, actionLabel: 'Annuler',
      onAction: async function () {
        D.semaine.selection = avant; D.semaine.coches = cochesAvant;
        await sauvegarder(); rendre();
      },
    });
    return;
  }

  // Ajout : les recettes déjà retenues gardent le nombre de portions choisi.
  const ajoutees = [];
  let deja = 0;
  voulue.forEach(function (s) {
    if (selectionDe(s.recetteId)) { deja += 1; return; }
    const entree = nouvelleEntree(s.recetteId, s.portions, s.date);
    D.semaine.selection.push(entree);
    ajoutees.push(entree.id);
  });
  if (!ajoutees.length) {
    toast(deja ? 'Ces recettes sont déjà dans la semaine.' : 'Cette semaine type est vide.');
    return;
  }
  await sauvegarder();
  rendre();
  const message = ajoutees.length + (ajoutees.length > 1 ? ' recettes ajoutées' : ' recette ajoutée') +
    (deja ? ' · ' + deja + ' déjà présente' + (deja > 1 ? 's' : '') : '');
  toast(message, {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () {
      D.semaine.selection = D.semaine.selection.filter(function (s) { return ajoutees.indexOf(s.id) < 0; });
      await sauvegarder(); rendre();
    },
  });
}

async function reprendreSemaineDerniere() {
  const derniere = D.historique[0];
  if (!derniere || !derniere.selection.length) { toast('Aucune semaine dans l\'historique.'); return; }
  const ok = await confirmer({
    titre: 'Reprendre la semaine dernière',
    message: 'Reprendre la sélection du ' + formatDateCourte(derniere.date) + ' ? La sélection actuelle sera remplacée.',
    labelOk: 'Reprendre',
  });
  if (!ok) return;
  D.semaine.selection = rebaserSelection(
    nettoyerSelection(derniere.selection, new Set(D.recettes.map(function (r) { return r.id; }))),
    D.semaine.periode);
  D.semaine.coches = {};
  await sauvegarder();
  rendre();
  toast('Sélection reprise.');
}

async function effacerDonneesExemple() {
  const ok = await confirmer({
    titre: 'Effacer les données d\'exemple',
    message: 'Les 3 recettes d\'exemple et les ingrédients qui ne servent qu\'à elles seront supprimés. Vos propres recettes et ingrédients sont conservés.',
    labelOk: 'Effacer', danger: true,
  });
  if (!ok) return;
  const avant = JSON.parse(JSON.stringify(D));
  const idsExemple = new Set(IDS_EXEMPLE_RECETTES);
  D.recettes = D.recettes.filter(function (r) { return !idsExemple.has(r.id); });
  D.semaine.selection = D.semaine.selection.filter(function (s) { return !idsExemple.has(s.recetteId); });
  D.semainesTypes.forEach(function (t) { t.selection = t.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  D.historique.forEach(function (h) { h.selection = h.selection.filter(function (s) { return !idsExemple.has(s.recetteId); }); });
  // On ne supprime que les ingrédients d'exemple devenus inutilisés.
  const utilises = new Set();
  D.recettes.forEach(function (r) { r.lignes.forEach(function (l) { utilises.add(l.ingredientId); }); });
  const idsIngExemple = new Set(donneesExemple().ingredients.map(function (i) { return i.id; }));
  D.ingredients = D.ingredients.filter(function (i) { return !idsIngExemple.has(i.id) || utilises.has(i.id); });
  await sauvegarder();
  rendre();
  toast('Données d\'exemple effacées', {
    duree: 5000, actionLabel: 'Annuler',
    onAction: async function () { D = normaliserRacine(avant); await Store.save(D); rendre(); },
  });
}

/* --- 5.2 Liste de courses — l'écran utilisé debout, à une main --- */

async function basculerCoche(cle, valeur) {
  // Écriture ciblée : l'état des cases est sauvegardé immédiatement.
  if (valeur) await Store.patch('semaine.coches.' + cle, true);
  else await Store.patch('semaine.coches.' + cle, undefined);
  D.semaine.dateModification = new Date().toISOString();
  await Store.flush();
}

function vueListe() {
  const v = $('#vue-liste');
  const scroll = window.scrollY;
  v.innerHTML = '';
  const modele = construireListe(D);
  const t = modele.totaux;

  // En-tête collant
  // La période est déjà dans la barre de titre, et cliquable : la répéter ici
  // faisait passer l'en-tête sur deux lignes pour rien.
  const entete = el('div', { class: 'entete-liste' });
  entete.appendChild(el('span', { class: 'compte',
    text: t.nbCoches + ' / ' + t.nbArticles + ' article' + (t.nbArticles > 1 ? 's' : '') }));
  if (afficherPrix()) {
    entete.appendChild(el('span', { class: 'reste', text: texteTotal(t.totalRestant, t.sansPrixRestant) + ' restants' }));
  }
  v.appendChild(entete);

  if (!modele.articles.length && !modele.placard.length) {
    v.appendChild(etatVide('panier', 'La liste est vide.'));
  }

  // Rayons
  modele.groupes.forEach(function (g) {
    const cleOuvert = g.rayon;
    // Pliage automatique d'un rayon entièrement coché ; l'utilisateur peut rouvrir.
    if (etat.rayonsToutCoches[cleOuvert] !== g.tousCoches) {
      etat.rayonsToutCoches[cleOuvert] = g.tousCoches;
      delete etat.rayonsOuverts[cleOuvert];
    }
    const ouvert = (cleOuvert in etat.rayonsOuverts) ? etat.rayonsOuverts[cleOuvert] : !g.tousCoches;

    const bloc = el('details', { class: 'rayon', open: ouvert });
    bloc.style.setProperty('--teinte', RAYON_TEINTE[g.rayon] !== undefined ? RAYON_TEINTE[g.rayon] : 0);
    if (g.rayon === 'autre') bloc.classList.add('sans-teinte');
    bloc.addEventListener('toggle', function () { etat.rayonsOuverts[cleOuvert] = bloc.open; });
    const resume = el('summary', {}, [
      el('span', { class: 'pastille-rayon', 'aria-hidden': 'true' }),
      el('span', { text: g.libelle }),
      el('span', { class: 'compte', text: g.nbCoches + '/' + g.articles.length }),
    ]);
    bloc.appendChild(resume);

    g.articles.forEach(function (a) { bloc.appendChild(ligneArticle(a)); });
    v.appendChild(bloc);
  });

  // Ingrédients sans rayon → invitation à les classer
  const aClasser = modele.articles.concat(modele.placard)
    .filter(function (a) { return a.type === 'ingredient' && a.rayon === 'autre'; });
  if (aClasser.length) {
    v.appendChild(el('div', { class: 'carte plate pt doux' }, [
      el('span', { text: aClasser.length + ' ingrédient' + (aClasser.length > 1 ? 's sont' : ' est') + ' encore dans « Autre ». ' }),
      el('button', { type: 'button', class: 'btn mini', text: 'Les classer',
        onclick: function () { etat.refOuvert = true; allerAuxReglages('reglages'); } }),
    ]));
  }

  // Section placard, repliée, hors total
  if (modele.placard.length) {
    // Le placard n'est pas un rayon du magasin : pastille neutre, pour que les
    // en-têtes restent alignés sans lui inventer une couleur.
    const bloc = el('details', { class: 'rayon sans-teinte', open: etat.placardOuvert });
    bloc.addEventListener('toggle', function () { etat.placardOuvert = bloc.open; });
    bloc.appendChild(el('summary', {}, [
      el('span', { class: 'pastille-rayon', 'aria-hidden': 'true' }),
      el('span', { text: 'À vérifier au placard' }),
      el('span', { class: 'compte', text: modele.placard.length + ' produit' + (modele.placard.length > 1 ? 's' : '') }),
    ]));
    modele.placard.forEach(function (a) { bloc.appendChild(ligneArticle(a)); });
    v.appendChild(bloc);
  }

  // Ajout manuel en un champ
  const champManuel = el('input', { type: 'text', placeholder: 'Ajouter un article (papier toilette, café…)', enterkeyhint: 'done', 'aria-label': 'Nom de l\'article' });
  const champQteManuel = el('input', { type: 'text', placeholder: 'qté', inputmode: 'decimal', enterkeyhint: 'done', 'aria-label': 'Quantité (facultative), par exemple 6 ou 2 kg', style: 'flex:0 1 96px' });
  const selectRayonManuel = el('select', { 'aria-label': 'Rayon de l\'article', style: 'flex:0 1 170px' });
  D.reglages.ordreRayons.forEach(function (r) {
    selectRayonManuel.appendChild(el('option', { value: r, text: RAYON_LIBELLE[r], selected: r === 'autre' }));
  });
  const ajouter = async function () {
    const nom = champManuel.value.trim();
    if (!nom) return;
    const q = analyserQuantiteLibre(champQteManuel.value);
    D.semaine.ajoutsManuels.push({
      id: 'man_' + slug(nom) + '_' + suffixeCourt(), nom: nom, rayon: selectRayonManuel.value,
      quantite: q.quantite, unite: q.unite,
    });
    champManuel.value = '';
    champQteManuel.value = '';
    await sauvegarder();
    vueListe();
    const c = $('#vue-liste .ajout-manuel input');
    if (c) c.focus();
  };
  const surEntree = function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); ajouter(); } };
  champManuel.addEventListener('keydown', surEntree);
  champQteManuel.addEventListener('keydown', surEntree);
  v.appendChild(el('div', { class: 'carte' }, [
    el('div', { class: 'ajout-manuel' }, [
      champManuel, champQteManuel, selectRayonManuel,
      el('button', { type: 'button', class: 'btn principal', text: 'Ajouter', onclick: ajouter }),
    ]),
  ]));

  // Actions
  const actions = el('div', { class: 'barre-actions' });
  if (navigator.share) {
    actions.appendChild(el('button', { type: 'button', class: 'btn principal', text: 'Partager la liste', onclick: partagerListe }));
  }
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Copier la liste', onclick: copierListe }));
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Imprimer', onclick: function () { window.print(); } }));
  actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Réinitialiser les cases', onclick: reinitialiserCases }));
  if ('wakeLock' in navigator) {
    const caseEcran = el('input', { type: 'checkbox', checked: etat.ecranAllume });
    caseEcran.addEventListener('change', function () { basculerWakeLock(caseEcran.checked); });
    actions.appendChild(el('label', { class: 'inline-case', style: 'padding:0 .5rem' }, [caseEcran, el('span', { class: 'pt', text: 'Garder l\'écran allumé' })]));
  }
  v.appendChild(el('div', { class: 'carte plate' }, [actions]));

  // Acheter loin, c'est jeter : on le dit là où l'achat se décide.
  if (nbJoursPeriode(D.semaine.periode) > 7) {
    const frais = rayonsFraisDeLaListe(D);
    if (frais.length) {
      v.appendChild(el('div', { class: 'avert', style: 'margin-bottom:.6rem', text:
        'Cette liste couvre ' + nbJoursPeriode(D.semaine.periode) + ' jours. ' +
        frais.map(function (r) { return RAYON_LIBELLE[r].toLowerCase(); }).join(', ') +
        ' ne se gardent pas si longtemps — mieux vaut les acheter au fur et à mesure.' }));
    }
  }
  if (afficherPrix()) {
    v.appendChild(el('p', { class: 'tpt doux', text:
      'Total : ' + texteTotal(t.totalTous, t.sansPrixTous) +
      ' · hors placard et ajouts manuels' }));
  }

  window.scrollTo(0, scroll);
}

function ligneArticle(a) {
  const ligne = el('div', { class: 'article' + (a.coche ? ' coche' : '') });

  const caseCoche = el('input', { type: 'checkbox', checked: a.coche, 'aria-label': 'Cocher ' + a.nom });
  const zoneCase = el('label', { class: 'case' }, [caseCoche]);
  caseCoche.addEventListener('change', async function () {
    await basculerCoche(a.cle, caseCoche.checked);
    vueListe();
  });

  const corps = el('button', { type: 'button', class: 'corps', 'aria-expanded': String(etat.provenanceOuverte === a.cle) }, [
    el('span', { class: 'nom', text: a.nom }),
    a.texteQuantite ? el('span', { class: 'qte', text: a.texteQuantite }) : null,
  ]);
  if (afficherPrix() && a.type === 'ingredient' && !a.ingredient.placard) {
    corps.appendChild(el('span', { class: 'prix', text: a.cout === null ? '—' : formatEuroFixe(a.cout) }));
  }
  corps.addEventListener('click', function () {
    etat.provenanceOuverte = (etat.provenanceOuverte === a.cle) ? null : a.cle;
    vueListe();
  });

  ligne.appendChild(zoneCase);
  ligne.appendChild(corps);

  if (etat.provenanceOuverte === a.cle) {
    const detail = el('div', { class: 'detail-provenance' });
    if (a.type === 'manuel') {
      detail.appendChild(el('div', { text: 'Article ajouté à la main — rayon : ' + RAYON_LIBELLE[a.rayon] + '.' }));
      detail.appendChild(el('div', { class: 'barre-actions', style: 'margin-top:.4rem' }, [
        el('button', { type: 'button', class: 'btn mini', text: 'Modifier', onclick: function () { modifierArticleManuel(a.manuel); } }),
        el('button', { type: 'button', class: 'btn mini danger', text: 'Supprimer', onclick: function () { supprimerArticleManuel(a.cle); } }),
      ]));
    } else {
      const entete = el('div', { class: 'gras', text: a.texteQuantite + ' — ' + a.provenance.map(function (p) {
        return p.nom + ' (' + formatQuantiteBase(p.base, a.ingredient) + ')';
      }).join(' + ') });
      detail.appendChild(entete);
      const ul = el('ul');
      a.provenance.forEach(function (p) {
        ul.appendChild(el('li', { text: p.nom + ' : ' + formatQuantiteBase(p.base, a.ingredient) }));
      });
      detail.appendChild(ul);
      const bas = el('div', { class: 'barre-actions', style: 'margin-top:.4rem;align-items:center' }, [
        el('span', { class: 'puce', text: RAYON_LIBELLE[a.rayon] }),
      ]);
      if (afficherPrix()) {
        const pu = a.ingredient.prix && typeof a.ingredient.prix.valeur === 'number'
          ? formatNombre(a.ingredient.prix.valeur, 2) + ' ' + PAR_PRIX_LIBELLE[a.ingredient.prix.par]
          : 'prix inconnu';
        bas.appendChild(el('button', {
          type: 'button', class: 'puce puce-bouton', text: '✎ ' + pu,
          onclick: function () { editionPrixRapide(a.ingredient, vueListe); },
        }));
      }
      bas.appendChild(el('button', {
        type: 'button', class: 'puce puce-bouton', text: '✎ Fiche ingrédient',
        onclick: function () { formulaireIngredient(null, function () { rendre(); }, a.ingredient); },
      }));

    }
    const enveloppe = el('div');
    enveloppe.appendChild(ligne);
    enveloppe.appendChild(detail);
    enveloppe.className = '';
    return enveloppe;
  }
  return ligne;
}

    titre: 'Modifier l\'article',

        el('label', { class: 'champ' }, [el('span', { text: 'Quantité' }), champQte]),

      ]),
      el('label', { class: 'champ' }, [el('span', { text: 'Rayon' }), champRayon]),
    ],

async function supprimerArticleManuel(cle) {
  const idx = D.semaine.ajoutsManuels.findIndex(function (m) { return m.id === cle; });
  if (idx < 0) return;
  const copie = D.semaine.ajoutsManuels[idx];
  D.semaine.ajoutsManuels.splice(idx, 1);
  await sauvegarder();
  vueListe();
  supprimerAvecAnnulation(copie.nom, async function () {
    D.semaine.ajoutsManuels.splice(idx, 0, copie);
    await sauvegarder(); vueListe();

/** Liste au format texte, prête à coller. */
function listeEnTexte() {
  const modele = construireListe(D);
  const lignes = ['Liste de courses — ' + libelleDePeriode(D.semaine.periode), ''];
  modele.groupes.forEach(function (g) {
    lignes.push(g.libelle.toUpperCase());
    g.articles.forEach(function (a) {
      lignes.push((a.coche ? '[x] ' : '- ') + a.nom + (a.texteQuantite ? ' — ' + a.texteQuantite : ''));
    });
    lignes.push('');
  });
  if (modele.placard.length) {
    lignes.push('À VÉRIFIER AU PLACARD');
    modele.placard.forEach(function (a) { lignes.push('- ' + a.nom + (a.texteQuantite ? ' — ' + a.texteQuantite : '')); });
    lignes.push('');
  }
  if (afficherPrix()) {
    lignes.push('Total estimé : ' + texteTotal(modele.totaux.totalTous, modele.totaux.sansPrixTous));
  }
  return lignes.join('\n');
}

/**
 * Remet le plan au calendrier du téléphone.
 *
 * Aucune API web ne permet d'écrire dans le calendrier : ni sur iOS ni sur
 * Android, seule une application native le peut. On passe donc par un fichier
 * iCalendar téléchargé — pas par le menu de partage, où Calendrier ne figure
 * pas, et pas par une adresse à ouvrir : le navigateur n'a pas de visionneuse
 * pour « text/calendar » et n'affiche qu'une page blanche. Un téléchargement,
 * lui, arrive dans Fichiers, et l'ouvrir propose « Ajouter tous à Calendrier ».
 */
async function ajouterAuCalendrier() {
  const plan = planEnIcs(D, {});
  if (!plan.nb && !plan.retires) {
    toast('Aucun repas daté dans la période — donnez-leur un jour d\'abord.');
    return;
  }
  const nomFichier = 'repas-' + D.semaine.periode.debut + '.ics';
  const url = URL.createObjectURL(new Blob([plan.texte], { type: 'text/calendar;charset=utf-8' }));

  const resume = plan.nb + ' repas' +
    (D.reglages.rappelMinutes ? ' · rappel ' + libelleRappel(D.reglages.rappelMinutes) : '');

  const lien = el('a', {
    href: url, download: nomFichier, class: 'btn principal', style: 'text-decoration:none',
  }, [icone('calendrier'), el('span', { text: 'Ajouter au calendrier' })]);
  // Mémorisé au moment où le fichier part : réexporter mettra les événements à
  // jour au lieu de les dupliquer. Fermer sans rien prendre ne mémorise rien.
  lien.addEventListener('click', async function () {
    fermerModale();
    D.reglages.calendrierExporte = plan.exportes;
    await sauvegarder();
  });

  ouvrirModale({
    titre: 'Ajouter au calendrier',
    corps: [
      el('p', { class: 'pt doux', style: 'margin:0 0 .2rem', text: resume }),
      el('p', { class: 'tpt doux', style: 'margin:0 0 .6rem',
        text: 'Touchez ensuite le fichier téléchargé : votre calendrier proposera de tout ajouter.' }),
      // Un fichier importé ne peut qu'ajouter et remplacer. Supprimer, non :
      // aucun calendrier n'obéit à une annulation venue d'un simple import.
      plan.retires ? el('p', { class: 'tpt', style: 'margin:0 0 .6rem;color:var(--danger)',
        text: plan.retires + ' repas retiré' + (plan.retires > 1 ? 's' : '') + ' de la semaine depuis le dernier envoi — ' +
          'à supprimer à la main dans votre calendrier, un import ne sait pas le faire.' }) : null,
      el('div', { class: 'menu-actions' }, [lien]),
    ],
    actions: [{ label: 'Fermer', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
}

/** « 1 heure », « 30 minutes »… pour dire le rappel dans une phrase. */
function libelleRappel(minutes) {
  const m = Number(minutes) || 0;
  if (!m) return 'aucun';
  if (m < 60) return m + ' minutes';
  const h = m / 60;
  return (Number.isInteger(h) ? h : h.toFixed(1).replace('.', ',')) + (h > 1 ? ' heures' : ' heure');
}

/* --- Partager une recette --------------------------------------------------
   Une recette voyage seule : son texte, lisible tel quel, et un lien qui la
   réinstalle chez celui qui le reçoit. Le lien porte la recette entière —
   ses ingrédients avec leur rayon et leur famille d'unités — sinon elle
   arriverait sans quantités exploitables.
   ------------------------------------------------------------------------- */

function versBase64Url(txt) {
  const octets = new TextEncoder().encode(txt);
  let brut = '';
  for (let i = 0; i < octets.length; i++) brut += String.fromCharCode(octets[i]);
  return btoa(brut).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function depuisBase64Url(txt) {
  const b64 = String(txt || '').replace(/-/g, '+').replace(/_/g, '/');
  const brut = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const octets = new Uint8Array(brut.length);
  for (let i = 0; i < brut.length; i++) octets[i] = brut.charCodeAt(i);
  return new TextDecoder().decode(octets);
}

/** Recette + ses ingrédients, sous forme compacte (les clés sont courtes : ça
 *  passe dans un lien qu'on envoie par message). */
function recetteEnColis(donnees, recette) {
  const parId = indexIngredients(donnees);
  return {
    v: 1,
    n: recette.nom,
    t: recette.tempsPreparationMin || null,
    p: recette.portionsDefaut || 4,
    g: recette.tags.slice(),
    s: recette.saisons.slice(),
    c: recette.temperature || null,
    o: recette.notes || '',
    i: recette.lignes.map(function (l) {
      const ing = parId.get(l.ingredientId);
      if (!ing) return null;
      return [ing.nom, ing.rayon, ing.famille, ing.unitePiece || '', l.quantite, l.unite, l.fixe ? 1 : 0];
    }).filter(Boolean),
  };
}

function lienDeRecette(donnees, recette) {
  const socle = (typeof location !== 'undefined' && location.href) ? location.href.split('#')[0] : '';
  return socle + '#recette=' + versBase64Url(JSON.stringify(recetteEnColis(donnees, recette)));
}

/** Lit un lien de recette. → colis ou null. Un lien abîmé ne doit rien casser. */
function lireLienRecette(lien) {
  const texte = String(lien || '');
  const frag = texte.indexOf('#') >= 0 ? texte.slice(texte.indexOf('#') + 1) : texte;
  const val = new URLSearchParams(frag).get('recette');
  if (!val) return null;
  try {
    const colis = JSON.parse(depuisBase64Url(val));
    if (!colis || typeof colis.n !== 'string' || !Array.isArray(colis.i)) return null;
    return colis;
  } catch (e) { return null; }
}

/** Version lisible, envoyée à côté du lien — et relisible par le collage. */
function recetteEnTexte(donnees, recette) {
  const parId = indexIngredients(donnees);
  const p = recette.portionsDefaut || 4;
  const lignes = [recette.nom, 'Pour ' + p + ' personnes'];
  recette.lignes.forEach(function (l) {
    const ing = parId.get(l.ingredientId);
    if (!ing || typeof l.quantite !== 'number') return;
    // Même écriture que partout ailleurs dans l'application — et relisible par
    // « Coller une liste » à l'arrivée.
    const base = versBase(l.quantite * p, l.unite, ing.famille);
    lignes.push('- ' + formatQuantiteBase(base, ing) + ' ' + elision(minusculeInitiale(ing.nom)));
  });
  if (recette.notes && recette.notes.trim()) { lignes.push(''); lignes.push(recette.notes.trim()); }
  return lignes.join('\n');
}

async function partagerRecette(recette) {
  const texte = recetteEnTexte(D, recette);
  const lien = lienDeRecette(D, recette);
  const fait = await partagerTexte(recette.nom, texte + '\n\n' + lien);
  if (fait) return;
  let copie = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(texte + '\n\n' + lien);
      copie = true;
    }
  } catch (e) { copie = false; }
  if (copie) { toast('Recette copiée, lien compris.'); return; }
  const champ = el('textarea', { rows: '8' });
  champ.value = texte + '\n\n' + lien;
  ouvrirModale({
    titre: 'Partager « ' + recette.nom + ' »',
    corps: [el('label', { class: 'champ' }, [champ])],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { champ.select(); }, 0);
}

/** Installe une recette reçue. Les ingrédients connus sont réutilisés. */
async function importerColisRecette(colis) {
  const nom = String(colis.n || '').trim() || 'Recette partagée';
  const lignes = [];
  let creees = 0;
  (colis.i || []).forEach(function (c) {
    if (!Array.isArray(c) || !c[0]) return;
    const nomIng = String(c[0]);
    const m = rapprocherIngredient(D.ingredients, nomIng);
    let ing = m ? m.ingredient : null;
    if (!ing) {
      const famille = ['masse', 'volume', 'piece'].indexOf(c[2]) >= 0 ? c[2] : 'masse';
      ing = {
        id: genererId('ing', nomIng), nom: nomIng, aliases: [],
        rayon: RAYON_LIBELLE[c[1]] ? c[1] : 'autre',
        famille: famille,
        unitePiece: famille === 'piece' ? (c[3] || 'pièce') : null,
        prix: { valeur: null, par: PAR_PRIX_PAR_FAMILLE[famille] },
        placard: false,
      };
      D.ingredients.push(ing);
      creees += 1;
    }
    // L'ingrédient d'ici a ses propres unités : on ne convertit jamais entre
    // familles, donc une unité étrangère cède la place à la sienne.
    const permises = unitesDe(ing);
    lignes.push({
      ingredientId: ing.id,
      quantite: typeof c[4] === 'number' ? c[4] : null,
      unite: permises.indexOf(c[5]) >= 0 ? c[5] : (permises[0] || ''),
      fixe: c[6] === 1,
    });
  });

  const recette = {
    id: genererId('rec', nom),
    nom: D.recettes.some(function (r) { return normaliserNom(r.nom) === normaliserNom(nom); }) ? nom + ' (reçue)' : nom,
    tags: Array.isArray(colis.g) ? colis.g.map(String) : [],
    tempsPreparationMin: typeof colis.t === 'number' ? colis.t : null,
    temperature: (colis.c === 'chaud' || colis.c === 'froid') ? colis.c : null,
    saisons: Array.isArray(colis.s) ? colis.s.filter(function (x) { return SAISON_LIBELLE[x]; }) : [],
    portionsDefaut: (typeof colis.p === 'number' && colis.p > 0) ? Math.min(99, Math.round(colis.p)) : 4,
    derniereUtilisation: null,
    notes: String(colis.o || ''),
    lignes: lignes,
  };
  D.recettes.push(recette);
  await sauvegarder();
  allerA('recettes');
  toast('« ' + recette.nom + ' » ajoutée' + (creees ? ' · ' + creees + ' ingrédient' + (creees > 1 ? 's créés' : ' créé') : '') + '.');
}

/** Propose l'import après avoir montré ce que le lien contient. */
async function proposerImportRecette(colis) {
  const corps = el('div');
  corps.appendChild(el('p', { class: 'pt doux', style: 'margin:.1rem 0 .4rem',
    text: 'Pour ' + (colis.p || 4) + ' personnes' + (colis.t ? ' · ' + colis.t + ' min' : '') }));
  const ul = el('ul');
  (colis.i || []).forEach(function (c) {
    if (!Array.isArray(c) || !c[0]) return;
    // On formate comme l'application le fait partout : « g » ne prend pas de
    // « s », et au-delà du kilo on change d'unité.
    const modele = { famille: ['masse', 'volume', 'piece'].indexOf(c[2]) >= 0 ? c[2] : 'masse', unitePiece: c[3] || 'pièce' };
    const q = typeof c[4] === 'number'
      ? formatQuantiteBase(versBase(c[4] * (colis.p || 4), c[5], modele.famille), modele) + ' '
      : '';
    ul.appendChild(el('li', { text: q + elision(minusculeInitiale(String(c[0]))) }));
  });
  corps.appendChild(ul);
  const ok = await confirmer({
    titre: colis.n || 'Recette partagée',
    corps: [corps],
    labelAnnuler: 'Non merci',
    labelOk: 'Ajouter à mes recettes',
  });
  if (ok) await importerColisRecette(colis);
  return ok;
}

/**
 * Partage par le menu du téléphone quand il existe, copie sinon.
 * → true si le partage natif a pris la main.
 */
async function partagerTexte(titre, texte) {
  if (navigator.share) {
    try {
      await navigator.share({ title: titre, text: texte });
      return true;
    } catch (e) {
      // Menu refermé sans choisir : ce n'est pas une erreur, on n'insiste pas.
      if (e && e.name === 'AbortError') return true;
    }
  }
  return false;
}

async function partagerListe() {
  const fait = await partagerTexte('Liste de courses', listeEnTexte());
  if (!fait) copierListe();
}

async function copierListe() {
  const texte = listeEnTexte();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(texte);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = texte;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }
  if (ok) { toast('Liste copiée.'); return; }
  const zone = el('textarea', { rows: '12', readonly: true });
  zone.value = texte;
  ouvrirModale({
    titre: 'Copier la liste',
    corps: [el('p', { class: 'pt doux', text: 'La copie automatique a échoué. Sélectionnez le texte ci-dessous et copiez-le.' }), zone],
    actions: [{ label: 'Fermer', variant: 'principal', onClick: function (f) { f(); } }],
  });
  setTimeout(function () { zone.focus(); zone.select(); }, 50);
}

/* --- Garder l'écran allumé (silencieusement ignoré si indisponible) --- */
let verrouEcran = null;
async function basculerWakeLock(actif) {
  etat.ecranAllume = actif;
  try {
    if (actif) {
      if (!('wakeLock' in navigator)) return;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', function () { verrouEcran = null; });
    } else if (verrouEcran) {
      await verrouEcran.release();
      verrouEcran = null;
    }
  } catch (e) {
    etat.ecranAllume = false;
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.ecranAllume && !verrouEcran) basculerWakeLock(true);
});

function vueRecettes() {
  const v = $('#vue-recettes');
  if (etat.editionRecette) {
    if (etat.editeurDom && etat.editeurDom.isConnected) { majApercuRecette(); return; }
    v.innerHTML = '';
    v.appendChild(construireEditeurRecette());
    return;
  }
  etat.editeurDom = null;
  v.innerHTML = '';

  const champRecherche = el('input', { type: 'search', placeholder: 'Rechercher une recette…', enterkeyhint: 'search', 'aria-label': 'Rechercher une recette' });
  const grille = el('div', { class: 'grille-recettes' });
  champRecherche.addEventListener('input', remplir);
  v.appendChild(el('div', { class: 'recherche' }, [
    champRecherche,
    el('button', { type: 'button', class: 'btn principal', text: '+ Nouvelle recette', onclick: function () { ouvrirEditeurRecette(null); } }),
  ]));
  v.appendChild(grille);

  function remplir() {
    grille.innerHTML = '';
    const q = normaliserNom(champRecherche.value);
    const recettes = D.recettes.filter(function (r) {
      if (!q) return true;
      return normaliserNom(r.nom).indexOf(q) >= 0 || r.tags.some(function (t) { return normaliserNom(t).indexOf(q) >= 0; });
    }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

    if (!recettes.length) {
      grille.appendChild(D.recettes.length
        ? etatVide('loupe', 'Aucune recette ne correspond.')
        : etatVide('livre', 'Aucune recette pour l\'instant.',
            el('button', { type: 'button', class: 'btn principal', text: 'Créer ma première recette',
              onclick: function () { ouvrirEditeurRecette(null); } })));
      return;
    }
    recettes.forEach(function (r) {
      // Six puces sur deux rangées se lisent moins bien qu'une ligne de texte :
      // ce sont des faits, pas des signaux.
      const c = coutRecette(D, r, r.portionsDefaut);
      const faits = [];
      if (r.tempsPreparationMin) faits.push(r.tempsPreparationMin + ' min');
      if (r.temperature) faits.push(TEMPERATURE_LIBELLE[r.temperature]);
      faits.push(r.lignes.length + ' ingrédient' + (r.lignes.length > 1 ? 's' : ''));
      if (r.tags.length) faits.push(r.tags.join(', '));
      if (afficherPrix()) {
        faits.push((c.total > 0 ? formatEuroFixe(c.parPortion) : '—') + ' / portion' + (c.sansPrix ? ' ≥' : ''));
      }
      const meta = el('div', { class: 'meta' }, [el('span', { text: faits.join(' · ') })]);
      // Quatre boutons pleine largeur par recette faisaient des cartes de 480 px
      // où « Supprimer », en rouge, était l'élément le plus visible de l'écran.
      // La carte redevient une ligne : on la touche pour modifier, le reste
      // passe par un menu.
      const ouvrir = el('button', { type: 'button', class: 'ligne-recette' }, [
        el('div', { class: 'infos' }, [el('div', { class: 'nom', text: r.nom }), meta]),
      ]);
      ouvrir.setAttribute('aria-label', 'Modifier ' + r.nom);
      ouvrir.addEventListener('click', function () { ouvrirEditeurRecette(r); });
      const menu = el('button', { type: 'button', class: 'btn fantome menu-recette',
        'aria-label': 'Actions pour ' + r.nom }, [icone('points')]);
      menu.addEventListener('click', function () { menuRecette(r); });
      grille.appendChild(el('div', { class: 'carte carte-recette' }, [ouvrir, menu]));
    });
  }
  remplir();
}

function ouvrirEditeurRecette(recette) {
  const copie = recette

    : { id: null, nom: '', tags: [], tempsPreparationMin: null, temperature: null, saisons: [],
        portionsDefaut: 4, derniereUtilisation: null, notes: '', lignes: [] };
  if (!Array.isArray(copie.saisons)) copie.saisons = [];
  if (!copie.lignes.length) copie.lignes.push(ligneVide());

function construireChampTags(r) {

    zone.innerHTML = '';

        el('span', { text: t }),
        el('button', {
