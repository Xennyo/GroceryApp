/* =========================================================================
   ——— THÈME ———  Palette : un accent unique + des gris. Clair et sombre
   sont définis explicitement. Par défaut on suit prefers-color-scheme ;
   l'attribut data-theme sur <html> force l'un ou l'autre.
   ========================================================================= */
:root{
  color-scheme: light;
  --bg:#f5f4f1;
  --bg-alt:#edebe6;
  --surface:#ffffff;
  --surface-2:#f7f6f3;
  --border:#e8e5df;
  --border-fort:#c8c2b8;
  --texte:#17150f;
  --texte-doux:#645e54;
  --accent:#0a6b4c;
  --accent-doux:#e2f1ea;
  --accent-texte:#ffffff;
  --danger:#a4231c;
  --danger-doux:#fbeceb;
  --ombre:0 1px 1px rgba(28,24,16,.04), 0 2px 6px rgba(28,24,16,.05);
  --ombre-haute:0 -1px 3px rgba(16,20,26,.05), 0 -6px 24px rgba(16,20,26,.07);
  --r:14px;
  --r-petit:9px;
  --tap:44px;

  /* Échelle typographique. Cinq tailles, trois graisses : au-delà, plus rien
     ne ressort. Le contenu porte le gras, jamais l'habillage. */
  --t-micro:.75rem;      /* 12 px — compteurs, légendes */
  --t-petit:.8125rem;    /* 13 px — métadonnées */
  --t-base:.9375rem;     /* 15 px — texte courant */
  --t-fort:1.0625rem;    /* 17 px — noms, titres de carte */
  --t-titre:1.25rem;     /* 20 px — titres d'écran */
  --g-normal:400;
  --g-moyen:600;
  --g-fort:700;

  /* Rythme d'espacement : quatre valeurs, pas douze. */
  --e1:.25rem; --e2:.5rem; --e3:.75rem; --e4:1rem; --e6:1.5rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="clair"]){
    color-scheme: dark;
    --bg:#100f0d;
    --bg-alt:#1a1815;
    --surface:#1c1a17;
    --surface-2:#232019;
    --border:#2d2a25;
    --border-fort:#565049;
    --texte:#f2efe9;
    --texte-doux:#a49c90;
    --accent:#5cd6a0;
    --accent-doux:#132f28;
    --accent-texte:#07160f;
    --danger:#ff9a91;
    --danger-doux:#391d1a;
    --ombre:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35);
    --ombre-haute:0 -1px 3px rgba(0,0,0,.4), 0 -6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="sombre"]{
  color-scheme: dark;
  --bg:#100f0d;
  --bg-alt:#1a1815;
  --surface:#1c1a17;
  --surface-2:#232019;
  --border:#2d2a25;
  --border-fort:#565049;
  --texte:#f2efe9;
  --texte-doux:#a49c90;
  --accent:#5cd6a0;
  --accent-doux:#132f28;
  --accent-texte:#07160f;
  --danger:#ff9a91;
  --danger-doux:#391d1a;
  --ombre:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35);
  --ombre-haute:0 -1px 3px rgba(0,0,0,.4), 0 -6px 24px rgba(0,0,0,.5);
}

/* ——— BASE ——— */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
/* Deux appuis rapides sur un téléphone font zoomer : c'est une gêne constante
   dans une liste où l'on coche vite. « manipulation » supprime ce geste — et
   lui seul : le pincement pour agrandir reste, il ne faut jamais l'enlever. */
html{ touch-action:manipulation; }
body{
  background:var(--bg);
  color:var(--texte);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--t-base);
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ line-height:1.3; margin:0 0 var(--e2); font-weight:var(--g-fort);
  letter-spacing:-.01em; }
h1{ font-size:var(--t-titre); }
h2{ font-size:var(--t-fort); }
h3{ font-size:var(--t-base); }
p{ margin:var(--e1) 0; font-size:var(--t-base); }
a{ color:var(--accent); }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ——— STRUCTURE ——— */
#app{ min-height:100dvh; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:.5rem .75rem; padding-top:calc(.5rem + env(safe-area-inset-top));
  display:flex; align-items:center; gap:.5rem; min-height:44px;
}
.topbar .titre{ font-weight:var(--g-fort); font-size:var(--t-fort); margin:0; flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.01em; }
/* Sur mobile, la barre du bas nomme déjà l'onglet actif : le titre y ferait
   double emploi et écrase les deux boutons. On le retire de l'affichage sans
   le retirer du document, pour les lecteurs d'écran. */

.bouton-espace{
  flex:0 1 auto; min-width:0; display:inline-flex; align-items:center; gap:.35rem;
  background:var(--bg-alt); border:1px solid var(--border); border-radius:999px;
  padding:.2rem .6rem; min-height:36px; cursor:pointer; font:inherit; font-size:.82rem;
  font-weight:var(--g-moyen); color:var(--texte); max-width:52%;
}
.bouton-espace:hover{ border-color:var(--border-fort); }
.bouton-espace .nom-espace{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pastille{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--texte-doux); }
.pastille.synchronise{ background:var(--accent); }
.pastille.envoi{ background:#c98a00; }
.pastille.horsligne,.pastille.erreur,.pastille.introuvable{ background:var(--danger); }
/* Sections repliables des réglages : le référentiel et l'ordre des rayons
   prennent beaucoup de place pour un usage rare. */
details.section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  margin-bottom:.6rem; box-shadow:var(--ombre); overflow:hidden; }
details.section > summary{
  cursor:pointer; list-style:none; padding:.7rem .75rem; min-height:48px;
  display:flex; align-items:center; gap:.5rem; font-weight:var(--g-moyen); font-size:1.05rem;
}
details.section > summary::-webkit-details-marker{ display:none; }
details.section > summary::before{ content:"▸"; color:var(--texte-doux); transition:transform 120ms ease; }
details.section[open] > summary::before{ transform:rotate(90deg); }
details.section > summary .compte{ margin-left:auto; font-size:.8rem; font-weight:var(--g-moyen); color:var(--texte-doux); }
details.section .contenu{ padding:0 .75rem .75rem; }
.calendrier .periode-achat{ background:var(--surface-2); border-radius:var(--r); padding:.5rem .6rem; }
.calendrier .periode-ligne{ display:flex; align-items:center; gap:.4rem; }
.calendrier .periode-nom{ flex:1 1 auto; text-align:center; font-weight:var(--g-moyen); font-size:1rem; }
.grille-mois{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.grille-mois .entete-jour{ text-align:center; font-size:.7rem; font-weight:var(--g-fort); color:var(--texte-doux);
  text-transform:uppercase; letter-spacing:.03em; padding:.2rem 0; }
.case-jour{
  position:relative; min-height:46px; border:1px solid var(--border); border-radius:8px;
  background:var(--surface); color:var(--texte); font:inherit; cursor:pointer; padding:.2rem 0 .1rem;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:1px;
  transition:background-color 120ms ease, border-color 120ms ease;
}
.case-jour:hover{ border-color:var(--border-fort); }
.case-jour .num{ font-size:.85rem; font-weight:var(--g-moyen); line-height:1.1; }
.case-jour .points{ font-size:.7rem; color:var(--accent); line-height:1; letter-spacing:1px; }
.case-jour.hors-mois{ opacity:.42; }
.case-jour.dans-periode{ background:var(--accent-doux); border-color:transparent; }
.case-jour.aujourdhui .num{ text-decoration:underline; text-underline-offset:2px; }
.case-jour.ouvert{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.jour-ouvert{ margin-top:.5rem; }
/* La navigation de période prend l'espace laissé libre, pour que le libellé
   s'affiche en entier plutôt que d'être tronqué à côté d'un vide. */
.nav-periode{ display:flex; align-items:center; gap:.15rem; min-width:0; flex:1 1 auto; }
/* La règle du navigateur pour [hidden] ne fait pas le poids face à un
   display:flex d'auteur : il faut la redire ici, sans quoi masquer la
   navigation de période depuis le script reste sans effet. */
.nav-periode[hidden]{ display:none; }
.nav-periode .fleche{
  flex:0 0 auto; width:32px; height:36px; padding:0; border:0; background:none;
  color:var(--texte-doux); font:inherit; font-size:1.2rem; line-height:1; cursor:pointer;
  border-radius:8px;
}
.nav-periode .fleche:hover{ background:var(--bg-alt); color:var(--texte); }
.bouton-calendrier{
  flex:1 1 auto; justify-content:center; display:inline-flex; align-items:center; gap:.3rem;
  background:var(--bg-alt); border:1px solid var(--border); border-radius:999px;
  padding:.2rem .6rem; min-height:36px; cursor:pointer; font:inherit; font-size:.82rem;
  font-weight:var(--g-moyen); color:var(--texte); max-width:58%;
}
.bouton-calendrier:hover{ border-color:var(--border-fort); }
.bouton-calendrier .periode{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ligne-espace{ display:flex; align-items:center; gap:.5rem; padding:.4rem 0; border-top:1px solid var(--border); }
.ligne-espace:first-child{ border-top:0; }
.ligne-espace .nom{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.ligne-espace .actuel{ font-weight:var(--g-fort); color:var(--accent); }
main{
  flex:1; width:100%; max-width:960px; margin:0 auto;
  padding:.75rem .75rem calc(84px + env(safe-area-inset-bottom));
}
.vue{ display:none; }
.vue.actif{ display:block; }

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1; min-height:56px; border:0; background:none; color:var(--texte-doux);
  font:inherit; font-size:var(--t-micro); font-weight:var(--g-moyen); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:var(--e1); transition:color 120ms ease;
}
/* Les icônes sont dessinées au trait et prennent la couleur du texte : un jeu
   cohérent, là où les émojis système imposaient leurs couleurs et leur style. */
.ic{ width:22px; height:22px; flex:0 0 auto; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tabbar button[aria-current="page"]{ color:var(--accent); }
.tabbar button[aria-current="page"] .ic{ stroke-width:2; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="clair"]) .pastille-rayon{ background:hsl(var(--teinte, 0) 46% 60%); }
}
:root[data-theme="sombre"] .pastille-rayon{ background:hsl(var(--teinte, 0) 46% 60%); }

@media (min-width:900px){
  #app{ flex-direction:row; }
  .tabbar{
    position:sticky; top:0; bottom:auto; height:100dvh; width:210px; flex:0 0 210px;
    flex-direction:column; border-top:0; border-right:1px solid var(--border);
    padding:.75rem .5rem; gap:.25rem; align-items:stretch;
  }
  .tabbar button{ flex:0 0 auto; min-height:46px; flex-direction:row; justify-content:flex-start;
    gap:var(--e3); font-size:var(--t-base); padding:0 var(--e3); border-radius:var(--r-petit); }
  .tabbar button[aria-current="page"]{ background:var(--accent-doux); }
  .colonne-principale{ flex:1; min-width:0; display:flex; flex-direction:column; }
  main{ padding-bottom:2rem; }
  .topbar{ padding-top:.5rem; }
}

/* ——— COMPOSANTS ——— */
.carte{
  background:var(--surface); border-radius:var(--r);
  padding:var(--e3); margin-bottom:var(--e2); box-shadow:var(--ombre);
}
.carte.plate{ box-shadow:none; background:var(--surface-2); }
.section-titre{ font-size:var(--t-micro); text-transform:uppercase; letter-spacing:.07em;
  color:var(--texte-doux); font-weight:var(--g-moyen); margin:var(--e4) 0 var(--e2); }
.doux{ color:var(--texte-doux); }
.pt{ font-size:var(--t-petit); }
.tpt{ font-size:var(--t-micro); }
.gras{ font-weight:var(--g-moyen); }
.rien{ color:var(--texte-doux); padding:var(--e6) var(--e2); text-align:center; font-size:var(--t-base); }
.etat-vide{ display:flex; flex-direction:column; align-items:center; gap:var(--e2); }
.etat-vide p{ margin:0; }
.ic-vide{ width:46px; height:46px; stroke-width:1.25; color:var(--border-fort); }

.btn{
  font:inherit; font-size:var(--t-base); font-weight:var(--g-moyen); cursor:pointer;
  background:var(--surface-2); color:var(--texte);
  border:1px solid var(--border); border-radius:var(--r-petit);
  padding:var(--e2) var(--e3); min-height:var(--tap);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--e1);
  transition:background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
}
.btn:hover{ background:var(--bg-alt); border-color:var(--border-fort); }
.btn:active{ opacity:.75; transform:scale(.97); }
.btn{ will-change:transform; }
.article .corps:active,.ligne-recette:active{ background:var(--surface-2); }
.puce-jour:active,.puce-filtre:active{ transform:scale(.94); }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  .btn:active,.puce-jour:active,.puce-filtre:active{ transform:none; }
}
.btn.principal{ background:var(--accent); color:var(--accent-texte); border-color:var(--accent); }
.btn.principal:hover{ filter:brightness(1.08); border-color:var(--accent); }
/* Une action destructrice se signale par sa couleur de texte, pas par un
   aplat rouge : sinon c'est elle qu'on voit en premier sur l'écran. */
.btn.danger{ color:var(--danger); border-color:transparent; background:transparent; }
.btn.danger:hover{ background:var(--danger-doux); border-color:var(--danger-doux); }
.btn.mini{ min-height:34px; padding:var(--e1) var(--e2); font-size:var(--t-petit); border-radius:7px; }
.btn.fantome{ background:transparent; border-color:transparent; }
.btn.fantome:hover{ background:var(--bg-alt); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.barre-actions{ display:flex; flex-wrap:wrap; gap:var(--e2); }

input,select,textarea{
  font:inherit; font-size:16px; color:var(--texte); background:var(--surface);
  border:1px solid var(--border-fort); border-radius:var(--r-petit); padding:var(--e2);
  min-height:var(--tap); width:100%; max-width:100%;
  transition:border-color 120ms ease, box-shadow 120ms ease;
}
input:focus,select:focus,textarea:focus{ border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px var(--accent-doux); }
textarea{ min-height:80px; resize:vertical; line-height:1.5; }
label.champ{ display:block; margin-bottom:var(--e3); }
label.champ > span{ display:block; font-size:var(--t-petit); font-weight:var(--g-moyen);
  color:var(--texte-doux); margin-bottom:var(--e1); }
.ligne-champs{ display:flex; gap:.5rem; flex-wrap:wrap; }
.ligne-champs > *{ flex:1 1 140px; min-width:0; }
.inline-case{ display:inline-flex; align-items:center; gap:.4rem; min-height:var(--tap); cursor:pointer; }
.inline-case input[type="checkbox"]{ width:22px; height:22px; min-height:0; flex:0 0 auto; accent-color:var(--accent); }

.puce{
  display:inline-flex; align-items:center; gap:var(--e1);
  background:var(--bg-alt); border:1px solid transparent; color:var(--texte-doux);
  border-radius:999px; padding:.15rem .55rem; font-size:var(--t-micro);
  font-weight:var(--g-moyen); white-space:nowrap;
}
.puce.accent{ background:var(--accent-doux); border-color:transparent; color:var(--accent); }
.puce.alerte{ background:var(--danger-doux); border-color:transparent; color:var(--danger); }
.puce-bouton{ cursor:pointer; }
.puce-bouton:hover{ border-color:var(--border-fort); }

.recherche{ display:flex; gap:var(--e2); align-items:center; margin-bottom:var(--e3); flex-wrap:wrap; }
.recherche input[type="search"]{ flex:1 1 180px; }
.recherche input,.recherche select{ min-height:40px; }

/* ——— SEMAINE ——— */
.grille-recettes{ display:grid; gap:.6rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:640px){ .grille-recettes{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.carte-recette{ display:block; }
.carte-recette .entete-carte{ display:flex; align-items:center; gap:.5rem; }
.carte-recette .infos{ flex:1 1 auto; min-width:0; }
/* Un cadre vert complet enferme la carte ; un liseré à gauche dit la même
   chose sans la boxer, et laisse l'ombre faire son travail. */
.carte-recette.selectionnee{
  box-shadow:inset 3px 0 0 var(--accent), var(--ombre);
  background:linear-gradient(90deg, var(--accent-doux) 0, transparent 120px), var(--surface);
}
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--border);
  border-radius:999px; overflow:hidden; background:var(--surface-2); }
.stepper button{ border:0; background:none; color:var(--texte-doux); font:inherit; font-size:1.1rem;
  font-weight:var(--g-moyen); width:38px; height:38px; cursor:pointer; line-height:1; }
.stepper button:hover{ background:var(--bg-alt); color:var(--texte); }
.stepper .valeur{ min-width:56px; text-align:center; font-size:var(--t-petit);
  font-weight:var(--g-moyen); padding:0 var(--e1); }
/* Le récapitulatif est une barre d'action, pas une carte : il s'ancre en bas,
   annonce l'état d'un trait, et laisse le bouton être la seule chose colorée. */
.recap{ position:sticky; bottom:calc(68px + env(safe-area-inset-bottom)); z-index:20;
  padding:var(--e2) var(--e3); box-shadow:var(--ombre-haute); }
.recap .ligne-resume{ display:flex; align-items:center; gap:var(--e2); }
.recap .bascule{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:var(--e1);
  background:none; border:0; padding:0; min-height:40px; cursor:pointer;
  font:inherit; font-size:var(--t-petit); color:var(--texte-doux); text-align:left; }
.recap .resume{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.recap .resume .cout{ color:var(--texte); font-weight:var(--g-moyen); }
.recap .chevron{ flex:0 0 auto; color:var(--texte-doux); transition:transform 120ms ease; }
.recap .bascule[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
.recap .actions-recap{ flex:0 0 auto; min-height:40px; margin:0; white-space:nowrap; }
.recap .detail[hidden]{ display:none; }
.recap .detail{ border-top:1px solid var(--border); margin-top:var(--e2); padding-top:var(--e2); }
.recap .detail ul{ margin:var(--e1) 0 var(--e2); padding-left:1.1rem; font-size:var(--t-petit); }
/* Une recette déjà retenue doit se faire discrète, pas prendre plus de place. */
.carte-recette{ padding:.55rem .6rem; }
.carte-recette .meta{ font-size:.8rem; color:var(--texte-doux); display:flex; flex-wrap:wrap;
  gap:.3rem; align-items:center; margin-top:.1rem; }
.carte-recette .faits{ overflow-wrap:anywhere; }
.carte-recette .actions-carte{ display:flex; align-items:center; gap:.15rem; flex:0 0 auto; }
.carte-recette .retirer{ width:32px; height:32px; min-height:0; padding:0; border-radius:8px;
  font-size:1rem; line-height:1; color:var(--texte-doux); }
.carte-recette .retirer:hover{ color:var(--danger); }
.carte-recette .ajouter{ min-height:36px; width:46px; padding:0; }
/* Choisir le jour d'un repas sans ouvrir le calendrier. Au-delà de sept jours
   la rangée défile plutôt que de rétrécir les cibles tactiles. */
.rangee-jours{ display:flex; gap:.2rem; margin-top:.3rem; min-width:0; overflow-x:auto; padding-bottom:2px; }
.puce-jour{
  flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; font:inherit; line-height:1.05; padding:.1rem .25rem;
  background:var(--surface); border:1px solid var(--border-fort); color:var(--texte-doux);
  border-radius:8px; min-width:34px; min-height:32px;
  transition:background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.puce-jour .l{ font-size:.78rem; font-weight:var(--g-fort); }
.puce-jour .n{ font-size:.62rem; }
.puce-jour:hover{ background:var(--bg-alt); color:var(--texte); }
.puce-jour[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-texte); }
.stepper.compact button{ width:34px; height:34px; font-size:1rem; }
.stepper.compact .valeur{ min-width:26px; font-size:var(--t-petit); }
/* La barre du haut ne mérite pas une carte : c'est un réglage, pas du contenu. */
.barre-portions{
  display:flex; align-items:center; gap:var(--e2); flex-wrap:wrap;
  padding:0 var(--e1); margin-bottom:var(--e3);
}
.barre-portions .libelle{ font-weight:var(--g-normal); font-size:var(--t-base);
  color:var(--texte-doux); flex:1 1 120px; min-width:0; }
.filtres{ display:flex; flex-wrap:wrap; gap:var(--e1); align-items:center; margin-bottom:var(--e3); }
.filtres.defilante{ flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; padding-bottom:2px;
  margin-left:calc(-1 * var(--e3)); margin-right:calc(-1 * var(--e3));
  padding-left:var(--e3); padding-right:var(--e3);
  scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.filtres.defilante::-webkit-scrollbar{ display:none; }
.filtres.defilante > *{ flex:0 0 auto; }
.filtres.actifs{ margin-bottom:var(--e3); }
.filtres.actifs:empty{ display:none; }
.panneau-filtres{ margin-bottom:var(--e3); }
.panneau-filtres[hidden]{ display:none; }
.bouton-filtres{ flex:0 0 auto; gap:var(--e2); }
.bouton-filtres.actif{ border-color:var(--accent); color:var(--accent); }
.bouton-filtres .compteur{ display:inline-flex; align-items:center; justify-content:center;
  min-width:19px; height:19px; padding:0 5px; border-radius:999px;
  background:var(--accent); color:var(--accent-texte); font-size:var(--t-micro); font-weight:var(--g-fort); }
.bouton-filtres .compteur[hidden]{ display:none; }
.puce-filtre.retirable{ background:var(--accent-doux); border-color:transparent; color:var(--accent); }
.puce-filtre.retirable .croix{ font-size:.7em; opacity:.75; }
.puce-filtre{
  display:inline-flex; align-items:center; gap:var(--e1); cursor:pointer; font:inherit;
  background:var(--surface); border:1px solid var(--border); color:var(--texte-doux);
  border-radius:999px; padding:var(--e1) var(--e3); font-size:var(--t-petit); font-weight:var(--g-moyen);
  min-height:34px; white-space:nowrap;
  transition:background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.puce-filtre:hover{ background:var(--bg-alt); }
.puce-filtre[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-texte); }
.filtres .separateur{ width:1px; align-self:stretch; background:var(--border); margin:.2rem .15rem; }
/* Le nom d'une recette ouvre sa fiche : il faut que ça se voie, et au clavier aussi. */
.carte-recette .nom{
  font-weight:var(--g-moyen); overflow-wrap:anywhere; text-align:left; font:inherit; font-weight:var(--g-moyen);
  background:none; border:0; padding:0; color:var(--texte); cursor:pointer;
  display:inline-flex; align-items:baseline; gap:.35rem;
}
.carte-recette .nom:hover{ color:var(--accent); text-decoration:underline; }
.carte-recette .nom .loupe{ font-size:.8em; color:var(--texte-doux); }
.apercu-fiche ul{ margin:.3rem 0 .6rem; padding-left:1.15rem; }
.apercu-fiche .notes{ white-space:pre-wrap; background:var(--surface-2); border-radius:8px; padding:.5rem .6rem; font-size:.92rem; }
@media (min-width:900px){ .recap{ bottom:.75rem; } }

/* ——— RELECTURE D'UN COLLAGE ——— */
.relecture{ display:flex; flex-direction:column; gap:.4rem; }
.rang-relecture{ display:flex; align-items:flex-start; gap:.5rem;
  border-top:1px solid var(--border); padding-top:.4rem; }
.rang-relecture:first-of-type{ border-top:0; padding-top:0; }
.rang-relecture.ecarte{ opacity:.45; }
.rang-relecture .champs{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.25rem; }
.rang-relecture .haut{ display:flex; align-items:center; gap:.35rem; min-width:0; }
.rang-relecture .haut input{ flex:1 1 auto; min-width:0; }
.rang-relecture .haut .puce{ flex:0 0 auto; }
.rang-relecture .bas{ display:flex; gap:.35rem; }

/* La police de livre ne touche que ce qu'on lit — noms et titres. Les chiffres,
   les prix et les compteurs restent en sans : un serif les aligne mal en
   colonne. Réglable, parce que c'est une affaire de goût. */
:root[data-police="livre"] :is(h1,h2,h3,.topbar .titre,.entete-liste .compte,
  .carte-recette .nom,.ligne-recette .nom,.article .nom,.rien p){
  font-family:'Liste Serif',Charter,Georgia,serif;
  font-weight:700;
  letter-spacing:0;
}

/* ——— PLUS (tableau de bord) ——— */
.grille-hub{ display:grid; gap:.5rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:640px){ .grille-hub{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.tuile-hub{
  display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; cursor:pointer;
  font:inherit; color:var(--texte); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); padding:.85rem .8rem; min-height:66px;
  transition:border-color 120ms ease, background-color 120ms ease;
}
.tuile-hub:hover{ border-color:var(--accent); background:var(--bg-alt); }
.tuile-hub .ic-tuile{ width:24px; height:24px; color:var(--texte-doux); }
.tuile-hub:hover .ic-tuile{ color:var(--accent); }
.tuile-hub .txt{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.1rem; }
.tuile-hub .titre{ font-weight:var(--g-moyen); }
.tuile-hub .resume{ font-size:.82rem; color:var(--texte-doux); overflow-wrap:anywhere; }
.tuile-hub .chev{ flex:0 0 auto; color:var(--texte-doux); font-size:1.2rem; }
.retour-hub{ margin-bottom:.6rem; }

/* ——— LISTE ——— */
.entete-liste{
  position:sticky; z-index:25; top:var(--h-topbar, 0px);
  background:var(--surface); border-radius:var(--r);
  padding:var(--e2) var(--e3); margin:0 0 var(--e2); box-shadow:var(--ombre);
  font-size:var(--t-petit); color:var(--texte-doux);
  display:flex; flex-wrap:wrap; gap:var(--e1) var(--e2); align-items:center;
}
@media (min-width:900px){ .entete-liste{ top:calc(var(--h-topbar, 0px) + .25rem); } }
.entete-liste .compte{ font-size:var(--t-fort); font-weight:var(--g-moyen); color:var(--texte);
  letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.entete-liste .reste{ color:var(--texte); font-weight:var(--g-moyen); margin-left:auto; }
.rayon{ background:var(--surface); border-radius:var(--r); margin-bottom:var(--e2);
  overflow:hidden; box-shadow:var(--ombre); }
.rayon > summary{
  cursor:pointer; list-style:none; padding:var(--e2) var(--e3); font-weight:var(--g-moyen);
  font-size:var(--t-micro); text-transform:uppercase; letter-spacing:.07em; color:var(--texte-doux);
  display:flex; align-items:center; gap:var(--e2); min-height:40px;
}
.rayon > summary::-webkit-details-marker{ display:none; }
.rayon > summary .compte{ margin-left:auto; letter-spacing:0; text-transform:none; font-size:var(--t-petit);
  font-variant-numeric:tabular-nums; }
.rayon > summary::before{ content:""; flex:0 0 auto; width:7px; height:7px; display:inline-block;
  border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor;
  transform:rotate(-45deg); transition:transform 140ms ease; margin-left:2px; }
.rayon[open] > summary::before{ transform:rotate(45deg); }
/* Une pastille par rayon : en magasin on cherche le rayon avant l'article, et
   une couleur se repère plus vite qu'un mot. Seule la teinte change d'un rayon
   à l'autre ; saturation et clarté sont fixées ici, une paire par thème, pour
   que les douze restent lisibles et se ressemblent en famille. */
.pastille-rayon{
  flex:0 0 auto; width:9px; height:9px; border-radius:50%;
  background:hsl(var(--teinte, 0) 52% 42%);
}
.rayon.sans-teinte .pastille-rayon{ background:var(--border-fort); }
/* Dans un magasin on cherche le NOM du produit : c'est lui qui porte le gras,
   la quantité se lit une fois qu'on l'a trouvé. */
.article{ display:flex; align-items:center; gap:0; position:relative; }
/* Un filet qui court sous la case à cocher coupe la colonne ; il commence donc
   là où commence le texte, comme dans une liste imprimée. */
.article + .article::before{
  content:''; position:absolute; left:52px; right:0; top:0; height:1px; background:var(--border);
}
.article:first-of-type{ box-shadow:inset 0 1px 0 var(--border); }
.article .case{
  flex:0 0 auto; width:52px; min-height:52px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:none; border:0; padding:0;
}
.article .case input[type="checkbox"]{
  appearance:none; -webkit-appearance:none; margin:0;
  width:25px; height:25px; min-height:0; flex:0 0 auto; cursor:pointer;
  border:2px solid var(--border-fort); border-radius:50%; background:var(--surface);
  display:grid; place-content:center;
  transition:background-color 140ms ease, border-color 140ms ease;
}
.article .case input[type="checkbox"]::after{
  content:''; width:11px; height:6px;
  border-left:2.2px solid var(--accent-texte); border-bottom:2.2px solid var(--accent-texte);
  transform:rotate(-45deg) scale(.4); opacity:0; margin-top:-3px;
  transition:opacity 110ms ease, transform 180ms cubic-bezier(.2,.9,.3,1.5);
}
.article .case input[type="checkbox"]:checked{ background:var(--accent); border-color:var(--accent); }
.article .case input[type="checkbox"]:checked::after{ opacity:1; transform:rotate(-45deg) scale(1); }
.article .case:hover input[type="checkbox"]:not(:checked){ border-color:var(--accent); }
.article .corps{
  flex:1; min-width:0; text-align:left; background:none; border:0; color:inherit; font:inherit;
  padding:var(--e2) var(--e3) var(--e2) 0; cursor:pointer;
  display:flex; gap:var(--e2); align-items:baseline; flex-wrap:wrap;
}
.article .nom{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere;
  font-size:var(--t-fort); font-weight:var(--g-moyen); letter-spacing:-.01em; }
.article .qte{ font-size:var(--t-base); color:var(--texte-doux); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.article .prix{ color:var(--texte-doux); font-size:var(--t-micro); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.article.coche{ background:var(--surface-2); }
.article.coche .nom,.article.coche .qte{ text-decoration:line-through; color:var(--texte-doux); font-weight:var(--g-normal); }
.detail-provenance{ padding:0 var(--e3) var(--e3) 52px; font-size:var(--t-petit); color:var(--texte-doux); border-top:0; background:var(--surface-2); }
.detail-provenance ul{ margin:.2rem 0 0; padding-left:1.1rem; }
.ajout-manuel{ display:flex; gap:.4rem; flex-wrap:wrap; }
.ajout-manuel input{ flex:1 1 160px; }

/* ——— RECETTES ——— */
.lignes-ing{ display:flex; flex-direction:column; gap:var(--e2); }
.ligne-ing{
  display:grid; gap:var(--e1) var(--e2); align-items:center;
  grid-template-columns:78px minmax(0,1fr) auto;
  grid-template-areas:"ing ing sup" "qte unite outils";
  border-radius:var(--r-petit); padding:var(--e2); background:var(--surface-2);
}
.ligne-ing .ing{ grid-area:ing; }
.ligne-ing .qte{ grid-area:qte; }
.ligne-ing .unite{ grid-area:unite; }
.ligne-ing .sup{ grid-area:sup; width:34px; min-height:34px; padding:0; color:var(--texte-doux); }
.ligne-ing .sup:hover{ color:var(--danger); }
.ligne-ing .outils{ grid-area:outils; display:flex; align-items:center; gap:2px; }
.ligne-ing .qte,.ligne-ing .unite{ min-height:38px; }
.ligne-ing .outils .btn.mini{ width:30px; min-height:34px; padding:0; }
.ligne-ing .inline-case{ min-height:34px; gap:var(--e1); }
.ligne-ing .inline-case input[type="checkbox"]{ width:18px; height:18px; }
@media (min-width:640px){
  .ligne-ing{ grid-template-columns:minmax(0,1fr) 92px 110px auto auto;
    grid-template-areas:"ing qte unite outils sup"; }
}
.ligne-ing .zone-fixe{ display:flex; align-items:center; }
.editeur{ display:grid; gap:0 .6rem; grid-template-columns:1fr; align-items:start; }
@media (min-width:1000px){
  .editeur{ grid-template-columns:minmax(0,1fr) 290px; }
  .col-apercu{ position:sticky; top:calc(var(--h-topbar, 0px) + .5rem); }
}
.apercu{ background:var(--accent-doux); border-color:transparent; }
.apercu ul{ margin:.3rem 0 0; padding-left:1.15rem; }
.avert{ background:var(--danger-doux); color:var(--danger); border:1px solid transparent;
  border-radius:8px; padding:.5rem .65rem; font-size:.88rem; font-weight:var(--g-moyen); }
.rappel{ background:var(--accent-doux); color:var(--accent); border-radius:8px;
  padding:.5rem .65rem; font-size:.9rem; font-weight:var(--g-fort); margin-bottom:.6rem; }

/* Une recette de la bibliothèque tient sur une ligne : nom, métadonnées,
   et un menu. Le reste vivait en quatre boutons empilés. */
.carte-recette:has(.ligne-recette){ display:flex; align-items:flex-start; gap:var(--e2);
  padding:var(--e3) var(--e2) var(--e3) var(--e3); }
.ligne-recette{ flex:1 1 auto; min-width:0; display:block; text-align:left; cursor:pointer;
  background:none; border:0; padding:var(--e1) 0; font:inherit; color:var(--texte); }
.ligne-recette .nom{ font-size:var(--t-fort); font-weight:var(--g-moyen); letter-spacing:-.01em;
  overflow-wrap:anywhere; }
.ligne-recette .meta{ font-size:var(--t-petit); color:var(--texte-doux); margin-top:2px;
  overflow-wrap:anywhere; }
.ligne-recette:hover .nom{ color:var(--accent); }
.menu-recette{ flex:0 0 auto; width:40px; min-height:40px; padding:0; color:var(--texte-doux); }
.menu-recette:hover{ color:var(--texte); }
.menu-actions{ display:flex; flex-direction:column; gap:var(--e2); }
.menu-actions .btn{ justify-content:flex-start; gap:var(--e3); padding:var(--e2) var(--e3); }
.menu-actions .ic{ width:19px; height:19px; color:var(--texte-doux); }
.menu-actions .btn.danger .ic{ color:var(--danger); }

/* ——— AUTOCOMPLÉTION ——— */
.ac-boite{ position:relative; }
.ac-liste{
  position:absolute; z-index:60; left:0; right:0; top:calc(100% + 2px);
  background:var(--surface); border:1px solid var(--border-fort); border-radius:8px;
  box-shadow:var(--ombre); max-height:240px; overflow:auto; padding:.2rem;
}
.ac-liste[hidden]{ display:none; }
.ac-item{ padding:.5rem .55rem; border-radius:6px; cursor:pointer; font-size:.95rem; min-height:40px;
  display:flex; align-items:center; gap:.4rem; }
.ac-item .sec{ margin-left:auto; font-size:.75rem; color:var(--texte-doux); }
.ac-item.actif{ background:var(--accent-doux); color:var(--accent); }
.ac-item.creer{ font-weight:var(--g-moyen); }

/* ——— TABLEAUX (référentiel) ——— */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); }
table.ref{ border-collapse:collapse; width:100%; min-width:1040px; table-layout:fixed; font-size:.9rem; }
table.ref th,table.ref td{ border-bottom:1px solid var(--border); padding:.3rem .4rem; text-align:left; vertical-align:middle; }
table.ref th{ background:var(--surface-2); position:sticky; top:0; z-index:1; font-size:.78rem;
  text-transform:uppercase; letter-spacing:.04em; color:var(--texte-doux); cursor:pointer; white-space:nowrap; }
table.ref input,table.ref select{ min-height:36px; padding:.2rem .35rem; font-size:.88rem; min-width:0; }
/* Largeurs explicites : sans elles, prix et famille se retrouvent tronqués. */
table.ref th:nth-child(1),table.ref td:nth-child(1){ width:180px; }
table.ref th:nth-child(2),table.ref td:nth-child(2){ width:152px; }
table.ref th:nth-child(3),table.ref td:nth-child(3){ width:104px; }
table.ref th:nth-child(4),table.ref td:nth-child(4){ width:106px; }
table.ref th:nth-child(5),table.ref td:nth-child(5){ width:126px; }
table.ref th:nth-child(6),table.ref td:nth-child(6){ width:72px; text-align:center; }
table.ref th:nth-child(7),table.ref td:nth-child(7){ width:180px; }
table.ref .cellule-prix{ display:flex; align-items:center; gap:.25rem; }
table.ref .cellule-prix input{ flex:1 1 auto; }
table.ref .cellule-prix span{ flex:0 0 auto; font-size:.7rem; }
table.ref input[type="checkbox"]{ width:22px; height:22px; min-height:0; accent-color:var(--accent); }

.liste-ordre{ list-style:none; margin:0; padding:0; }
.liste-ordre li{
  display:flex; align-items:center; gap:.5rem; background:var(--surface);
  border:1px solid var(--border); border-radius:8px; padding:.3rem .5rem; margin-bottom:.3rem;
  min-height:var(--tap);
}
.liste-ordre li.survol{ border-color:var(--accent); background:var(--accent-doux); }
.liste-ordre li.drag{ opacity:.5; }
.liste-ordre .poignee{ cursor:grab; color:var(--texte-doux); font-size:1.1rem; touch-action:none; user-select:none; }
.liste-ordre .nom{ flex:1; min-width:0; }

/* ——— MODALES, BANDEAUX, TOASTS ——— */
.fond-modal{
  position:fixed; inset:0; z-index:100; background:rgba(8,10,14,.5);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
}
@media (min-width:640px){ .fond-modal{ align-items:center; padding:1rem; } }
.modal{
  background:var(--surface); color:var(--texte); width:100%; max-width:540px;
  border-radius:14px 14px 0 0; padding:1rem; max-height:92dvh; overflow:auto;
  box-shadow:0 -4px 30px rgba(0,0,0,.3); border:1px solid var(--border);
  padding-bottom:calc(1rem + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .modal{ border-radius:14px; padding-bottom:1rem; } }
.modal h2{ margin-top:0; }
.modal .actions{ display:flex; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; margin-top:1rem; }
.modal .actions .btn{ flex:1 1 auto; }
@media (min-width:640px){ .modal .actions .btn{ flex:0 0 auto; } }

#zone-toasts{
  position:fixed; z-index:110; left:.5rem; right:.5rem; bottom:calc(72px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.4rem; align-items:center; pointer-events:none;
}
@media (min-width:900px){ #zone-toasts{ bottom:1rem; left:auto; right:1rem; align-items:flex-end; } }
.toast{
  pointer-events:auto; background:var(--texte); color:var(--bg);
  border-radius:var(--r); padding:.6rem .8rem; font-size:.92rem; font-weight:var(--g-moyen);
  box-shadow:var(--ombre); display:flex; align-items:center; gap:.75rem; max-width:520px; width:100%;
}
.toast button{
  background:none; border:1px solid currentColor; color:inherit; font:inherit; font-weight:var(--g-fort);
  border-radius:8px; padding:.25rem .6rem; cursor:pointer; min-height:36px; white-space:nowrap;
}
#bandeau-degrade{
  background:var(--danger-doux); color:var(--danger); border-bottom:1px solid var(--danger);
  padding:.5rem .75rem; font-size:.88rem; font-weight:var(--g-moyen);
}
#bandeau-degrade[hidden]{ display:none; }
.bandeau-exemple{
  background:var(--accent-doux); color:var(--accent);
  border-radius:var(--r-petit); padding:var(--e2) var(--e3); margin-bottom:var(--e2);
  display:flex; gap:var(--e2); align-items:center;
  font-size:var(--t-petit); font-weight:var(--g-moyen);
}
.bandeau-exemple span{ flex:1 1 auto; min-width:0; }
.bandeau-exemple .btn{ flex:0 0 auto; min-height:30px; width:30px; padding:0;
  background:transparent; border-color:transparent; color:inherit; font-size:1rem; }
.bandeau-exemple .btn:hover{ background:rgba(0,0,0,.06); }

/* ——— BARRE DE TITRE : AJUSTEMENTS RESPONSIVES ———
   Placés après les composants qu'ils ajustent : à spécificité égale, c'est
   la dernière règle qui l'emporte. */
@media (max-width:899px){
  /* La barre du bas nomme déjà l'onglet actif : le titre y ferait double
     emploi et écraserait les boutons. Retiré de l'affichage, pas du document. */
  .topbar .titre{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; flex:0 0 0;
  }
  .topbar{ justify-content:space-between; }
  .bouton-espace{ max-width:40%; }
  /* Sans espace partagé, « Cet appareil » est l'état par défaut : la pastille
     suffit, et la place revient au libellé de période. */
  .bouton-espace.sans-espace .nom-espace{
    position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);
  }
  .bouton-espace.sans-espace{ padding:.2rem .5rem; }
}
@media (min-width:900px){
  /* Le titre peut s'étirer, la période non : elle doit rester lisible. */
  .nav-periode{ flex:0 0 auto; }
  .bouton-calendrier{ flex:0 0 auto; max-width:none; }
}

/* ——— IMPRESSION ——— */
@media print{
  body{ background:#fff; color:#000; }
  .topbar,.tabbar,#zone-toasts,.ajout-manuel,.barre-actions,#bandeau-degrade{ display:none !important; }
  main{ padding:0; max-width:none; }
  .vue{ display:none !important; }
  .vue.actif{ display:block !important; }
  .rayon{ break-inside:avoid; border:1px solid #999; }
  .rayon > summary{ background:#eee; color:#000; }
  .article{ font-size:12pt; border-top:1px solid #ccc; }
  .article.coche .nom,.article.coche .qte{ color:#666; }
  .detail-provenance{ display:none; }
}

/* ——— ÉCRAN DE LANCEMENT ———————————————————————————————————————————————————
   Il est écrit dans le corps du document, pas fabriqué par le script : il doit
   être peint dès la première image, sinon il arrive après ce qu'il est censé
   couvrir. Le thème choisi dans les réglages n'est pas encore lu à cet
   instant — seule la préférence du système est connue, et c'est elle qui
   décide de la version sombre.
   ------------------------------------------------------------------------- */
#ecran-lancement{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(#0d7d59, #064e37);
  color:#ffffff;
  transition:opacity .2s ease-out;   /* égale à LANCEMENT_FONDU_MS */
}
#ecran-lancement.efface{ opacity:0; pointer-events:none; }
#ecran-lancement svg{ width:min(34vw,132px); height:auto;
  animation:lancement-entree .18s cubic-bezier(.2,.7,.3,1) both; }
@keyframes lancement-entree{ from{ transform:scale(.9); opacity:0 } to{ transform:none; opacity:1 } }
@media (prefers-color-scheme: dark){
  /* Plein écran la nuit : le même vert, assombri, et la marque un ton en dessous
     du blanc pur. */
  #ecran-lancement{ background:linear-gradient(#0b4b37, #05291e); color:#dff3e9; }
}
@media (prefers-reduced-motion: reduce){
  #ecran-lancement{ transition:none; }
  #ecran-lancement svg{ animation:none; }
}
</style>
</head>
<body>
<!-- Peint avant tout le reste, effacé par le script une fois l'application
     dessinée. Le dessin est celui de l'icône, sans son cadre. -->
<div id="ecran-lancement" aria-hidden="true">
  <svg viewBox="96 98 320 320" width="132" height="132" aria-hidden="true" focusable="false">
    <defs>
      <mask id="masque-lancement">
        <!-- Blanc = le panier plein ; noir = les lignes de la liste, en réserve. -->
        <rect x="96" y="98" width="320" height="320" fill="#000"/>
        <path d="M132 196 h248 a20 20 0 0 1 20 22 l-24 150 a52 52 0 0 1 -51 44 h-138
                 a52 52 0 0 1 -51 -44 l-24 -150 a20 20 0 0 1 20 -22 z" fill="#fff"/>
        <g fill="#000">
          <rect x="180" y="250" width="152" height="26" rx="13"/>
          <rect x="180" y="304" width="118" height="26" rx="13"/>
          <rect x="180" y="358" width="80"  height="26" rx="13"/>
        </g>
      </mask>
    </defs>
    <path d="M188 186 a68 68 0 0 1 136 0" fill="none" stroke="currentColor"
          stroke-width="28" stroke-linecap="round"/>
    <rect x="96" y="98" width="320" height="320" fill="currentColor" mask="url(#masque-lancement)"/>
  </svg>
</div>
<div id="app">
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <button type="button" data-tab="semaine" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
    <button type="button" data-tab="liste"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Liste</button>
    <button type="button" data-tab="recettes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/><path d="M9 8h6"/></svg>Recettes</button>
    <button type="button" data-tab="plus"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Plus</button>
  </nav>
  <div class="colonne-principale">
    <div id="bandeau-degrade" hidden role="status"></div>
    <header class="topbar">

<script>
"use strict";
/* =========================================================================
   Liste de courses — application autonome, un seul fichier, zéro dépendance.
   Sections : MODÈLE · STOCKAGE · CALCULS · OUTILS UI · VUES · DÉMARRAGE
   ========================================================================= */

/* ——— MODÈLE ——————————————————————————————————————————————————————————— */

const SCHEMA_VERSION = 2;

const RAYONS = [
  ['fruits_legumes', 'Fruits & légumes'],
  ['boucherie',      'Boucherie / Volaille'],
  ['poissonnerie',   'Poissonnerie'],
  ['cremerie',       'Crèmerie & œufs'],
  ['charcuterie',    'Charcuterie / Traiteur'],
  ['epicerie_salee', 'Épicerie salée'],
  ['epicerie_sucree','Épicerie sucrée'],
  ['pain',           'Pain & viennoiserie'],
  ['surgeles',       'Surgelés'],
  ['boissons',       'Boissons'],
  ['hygiene',        'Hygiène & entretien'],
  ['autre',          'Autre'],
];
const RAYON_LIBELLE = Object.fromEntries(RAYONS);
// Une teinte par rayon. Seule la teinte change ; saturation et clarté sont
// fixées en CSS, une paire pour le thème clair et une pour le sombre — c'est
// ce qui garantit que les douze restent lisibles et se ressemblent en famille.
const RAYON_TEINTE = {
  fruits_legumes: 128, boucherie: 355, poissonnerie: 202, cremerie: 45,
  charcuterie: 18, epicerie_salee: 32, epicerie_sucree: 320, pain: 38,
  surgeles: 190, boissons: 172, hygiene: 268, autre: 0,
};
const RAYONS_IDS = RAYONS.map(function (r) { return r[0]; });
const ORDRE_RAYONS_DEFAUT = RAYONS_IDS.slice();

// Unités acceptées par famille, avec leur facteur vers l'unité de base.
// masse → base : le gramme. volume → base : le millilitre. piece → base : la pièce.
const UNITES = {
  masse:  [ { u: 'g',  f: 1 }, { u: 'kg', f: 1000 } ],
  volume: [ { u: 'ml', f: 1 }, { u: 'cl', f: 10 }, { u: 'dl', f: 100 }, { u: 'L', f: 1000 },
            { u: 'c. à soupe', f: 15 }, { u: 'c. à café', f: 5 } ],
  piece:  [],   // une seule unité, portée par l'ingrédient (unitePiece)
};
const FAMILLES = [
  ['masse',  'Masse (g, kg)'],
  ['volume', 'Volume (ml, cl, dl, L, cuillères)'],
  ['piece',  'Pièce (pièce, gousse, botte…)'],
];
const FAMILLE_COURT = { masse: 'masse', volume: 'volume', piece: 'pièce' };
// Saisons météorologiques : elles collent au calendrier des marchés mieux que
// les saisons astronomiques, et tombent sur des mois entiers.
const SAISONS = [['printemps', 'Printemps'], ['ete', 'Été'], ['automne', 'Automne'], ['hiver', 'Hiver']];
const SAISON_LIBELLE = Object.fromEntries(SAISONS);
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS_COURTS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const JOURS_LONGS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
// Rayons dont le contenu ne se garde pas : ils motivent l'avertissement quand
// la période d'achat dépasse la semaine.
const RAYONS_FRAIS = ['fruits_legumes', 'boucherie', 'poissonnerie', 'cremerie', 'charcuterie'];
// Un plat se sert chaud ou froid. Ça ne se déduit d'aucune autre donnée, et
// c'est la question qu'on se pose vraiment au moment de composer la semaine.
const TEMPERATURES = [['chaud', 'Chaud'], ['froid', 'Froid']];
const TEMPERATURE_LIBELLE = Object.fromEntries(TEMPERATURES);
const UNITES_PIECE_SUGGEREES = ['pièce', 'gousse', 'botte', 'tranche', 'pincée', 'brin', 'feuille', 'sachet', 'boîte', 'tige'];
const PAR_PRIX_PAR_FAMILLE = { masse: 'kg', volume: 'L', piece: 'piece' };
const PAR_PRIX_LIBELLE = { kg: '€/kg', L: '€/L', piece: '€/pièce' };

/** Saison d'une date. → 'printemps' | 'ete' | 'automne' | 'hiver' */
function saisonDe(date) {
  const m = (date || new Date()).getMonth();
  if (m >= 2 && m <= 4) return 'printemps';
  if (m >= 5 && m <= 7) return 'ete';
  if (m >= 8 && m <= 10) return 'automne';
  return 'hiver';
}

/* --- Dates : tout est manipulé en 'aaaa-mm-jj', jamais en horodatage. --- */
function isoDuJour(date) {
  const p = function (n) { return String(n).padStart(2, '0'); };
  return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
}
function dateDepuisISO(iso) {
  const d = new Date(String(iso) + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function ajouterJours(date, n) {
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + n);
  return d;
}
/** Lundi de la semaine contenant cette date. La semaine française commence lundi. */
function lundiDe(date) {
  const d = new Date(date.getTime());
  d.setHours(0, 0, 0, 0);
  return ajouterJours(d, -((d.getDay() + 6) % 7));
}
function periodeSemaineCourante() {
  const l = lundiDe(new Date());
  return { debut: isoDuJour(l), fin: isoDuJour(ajouterJours(l, 6)) };
}
/** Toutes les dates d'une période, bornes comprises. */
function joursDeLaPeriode(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f || f < d) return [];
  const sortie = [];
  for (let c = d; c <= f && sortie.length < 400; c = ajouterJours(c, 1)) sortie.push(isoDuJour(c));
  return sortie;
}
function nbJoursPeriode(periode) { return joursDeLaPeriode(periode).length; }
function dansLaPeriode(iso, periode) {
  return !!iso && iso >= periode.debut && iso <= periode.fin;
}
function libelleDePeriode(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f) return 'Période';
  const n = nbJoursPeriode(periode);
  if (n === 7 && d.getDay() === 1) return 'Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()];
  if (periode.debut === periode.fin) return d.getDate() + ' ' + MOIS[d.getMonth()];
  if (d.getMonth() === f.getMonth()) return 'Du ' + d.getDate() + ' au ' + f.getDate() + ' ' + MOIS[f.getMonth()];
  return 'Du ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' au ' + f.getDate() + ' ' + MOIS[f.getMonth()];
}

/** Version abrégée, pour la barre de titre d'un téléphone. */
function libelleDePeriodeCourt(periode) {
  const d = dateDepuisISO(periode.debut), f = dateDepuisISO(periode.fin);
  if (!d || !f) return 'Période';
  const n = nbJoursPeriode(periode);
  if (n === 7 && d.getDay() === 1) return 'Sem. du ' + d.getDate() + ' ' + MOIS_COURTS[d.getMonth()];
  if (periode.debut === periode.fin) return d.getDate() + ' ' + MOIS_COURTS[d.getMonth()];
  if (d.getMonth() === f.getMonth()) return d.getDate() + '–' + f.getDate() + ' ' + MOIS_COURTS[f.getMonth()];
  return d.getDate() + ' ' + MOIS_COURTS[d.getMonth()] + ' – ' + f.getDate() + ' ' + MOIS_COURTS[f.getMonth()];
}

function aujourdHuiISO() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function slug(txt) {
  return String(txt || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 32) || 'x';
}
function suffixeCourt() {
  return Math.random().toString(36).slice(2, 6);
}
// Identifiants stables et lisibles : préfixe + slug + suffixe aléatoire court.
function genererId(prefixe, nom) {
  return prefixe + '_' + slug(nom) + '_' + suffixeCourt();
}

function donneesVides() {
  return {
    schemaVersion: SCHEMA_VERSION,
    ingredients: [],
    recettes: [],
    semaine: {
      libelle: libelleSemaineCourante(),
      periode: periodeSemaineCourante(),
      selection: [],
      coches: {},
      ajoutsManuels: [],
      dateModification: new Date().toISOString(),
    },
    historique: [],
    semainesTypes: [],
    reglages: {
      ordreRayons: ORDRE_RAYONS_DEFAUT.slice(),
      afficherPrix: true,
      theme: 'auto',
      policeTitres: 'livre',
      portionsBase: 4,
      serveurSync: '',
      heureRepas: '19:30',
      rappelMinutes: 60,
      // Adresse d'abonnement du calendrier. Partagée avec l'espace : chaque
      // appareil peut s'abonner sans qu'on la recrée.
      abonnementCalendrier: '',
      // Ce qui est déjà parti au calendrier, et sous quelle révision : sans
      // cette mémoire, réexporter dupliquerait tout et un repas retiré de
      // l'application resterait indéfiniment dans le calendrier.
      calendrierExporte: {},
    },
  };
}

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function libelleSemaineCourante() {
  // Lundi de la semaine en cours.
  const d = new Date();
  const jour = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - jour);
  return 'Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()];
}

/* --- Jeu de données d'exemple (effaçable en un clic au premier lancement) --- */
const IDS_EXEMPLE_RECETTES = ['rec_chili', 'rec_ratatouille', 'rec_pates_pesto'];

function ing(id, nom, rayon, famille, opts) {
  opts = opts || {};
  return {
    id: id, nom: nom, aliases: opts.aliases || [], rayon: rayon, famille: famille,
    unitePiece: famille === 'piece' ? (opts.unitePiece || 'pièce') : null,
    prix: opts.prix === undefined ? { valeur: null, par: PAR_PRIX_PAR_FAMILLE[famille] } : opts.prix,
    placard: !!opts.placard,
  };
}

function donneesExemple() {
  const d = donneesVides();
  d.ingredients = [

    ing('ing_haricot_rouge', 'Haricots rouges', 'epicerie_salee', 'masse', { prix: { valeur: 3.20, par: 'kg' } }),
    ing('ing_riz', 'Riz', 'epicerie_salee', 'masse', { prix: { valeur: 2.10, par: 'kg' } }),

    ing('ing_parmesan', 'Parmesan', 'cremerie', 'masse', { prix: { valeur: 22.00, par: 'kg' } }),

    ing('ing_huile_olive', "Huile d'olive", 'epicerie_salee', 'volume', { placard: true, prix: { valeur: 8.50, par: 'L' } }),

  d.recettes = [
    {
      id: 'rec_chili', nom: 'Chili sin carne', tags: ['végétarien', 'rapide'],

      notes: "Faire revenir l'oignon et le poivron, ajouter les épices, les tomates puis les haricots. Mijoter 25 min. Servir avec le riz.",
      lignes: [
        { ingredientId: 'ing_tomate_concassee', quantite: 0.2, unite: 'kg', fixe: false },
        { ingredientId: 'ing_haricot_rouge', quantite: 90, unite: 'g', fixe: false },
        { ingredientId: 'ing_riz', quantite: 60, unite: 'g', fixe: false },
        { ingredientId: 'ing_poivron_rouge', quantite: 0.5, unite: 'pièce', fixe: false },
        { ingredientId: 'ing_oignon', quantite: 1, unite: 'pièce', fixe: true },
        { ingredientId: 'ing_cumin', quantite: 1, unite: 'pincée', fixe: true },
        { ingredientId: 'ing_huile_olive', quantite: 5, unite: 'ml', fixe: false },
      ],
    },
    {
      id: 'rec_ratatouille', nom: 'Ratatouille', tags: ['végétarien'],
      tempsPreparationMin: 50, temperature: 'chaud', saisons: [], portionsDefaut: 4, derniereUtilisation: null,
      notes: 'Couper les légumes en cubes réguliers, les cuire séparément puis les réunir 10 min.',
      lignes: [
        { ingredientId: 'ing_tomate_concassee', quantite: 150, unite: 'g', fixe: false },
        { ingredientId: 'ing_courgette', quantite: 0.5, unite: 'pièce', fixe: false },

      ],
    },
    {
      id: 'rec_pates_pesto', nom: 'Pâtes au pesto', tags: ['rapide', 'végétarien'],

      notes: 'Cuire les pâtes, détendre le pesto avec un peu d\'eau de cuisson, mélanger hors du feu.',
      lignes: [
        { ingredientId: 'ing_pates', quantite: 100, unite: 'g', fixe: false },
        { ingredientId: 'ing_pesto', quantite: 30, unite: 'g', fixe: false },

        { ingredientId: 'ing_basilic', quantite: 1, unite: 'botte', fixe: true },

      ],
    },
  ];
  // Le jeu d'exemple passe par la normalisation comme n'importe quel document :
  // un champ ajouté au modèle ne peut plus lui manquer par oubli.
